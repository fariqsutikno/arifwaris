<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Kasus dan Soal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@500;600;700&family=Host+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Gaya Logivo seperti di aplikasi (apps/web/src/gaya: token.css, beranda.css, latihan.css). Hanya tema terang (keputusan 2026-10-01).
   Dasar: riset-ux-siklus-kasus-dan-soal-2026-11-23.md. Prinsip: dua benda dua rumah, tempat menentukan mode. */
:root{color-scheme:light;--surface:#eef3e8;--raised:#fff;--sunken:#e4ece1;--outline:#c9d4c6;--divider:#dfe6dc;--ink:#14181a;--muted:#525c57;
--primary:#0e0f10;--on-primary:#fff;--soft:#dce8d8;--lime:#d3ebaa;--sun:#fde6d8;--danger:#c53a28;--dsoft:#fbe0da;--aksen:#f2682a;--aksen-soft:#fde6d8;
--fardh:#138a4b;--halaman:#b9d4c0;--krem:#f6f2e9;--kartu:rgba(255,255,255,.72);--kartu-tepi:rgba(255,255,255,.95);--focus:#f2682a;
--display:"Parkinsans",system-ui,sans-serif;--sans:"Host Grotesk",system-ui,sans-serif;--bayang:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--halaman);color:var(--ink);font:400 15px/1.5 var(--sans)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;font-weight:500;letter-spacing:-.02em}
p{margin:0}
a,.tautan{color:var(--ink);font:600 14px var(--sans);text-decoration:underline;text-underline-offset:4px;background:none;border:0;padding:0;cursor:pointer;min-height:32px}
button{font:inherit;cursor:pointer;color:inherit}
.ik{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.mock-atas{max-width:1080px;margin:0 auto;padding:16px 16px 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mock-atas b{font:600 15px var(--display)}
.mock-atas .tab{display:flex;gap:2px;background:rgba(255,255,255,.55);padding:3px;border-radius:999px}
.mock-atas .tab button{border:0;background:none;min-height:36px;padding:0 14px;border-radius:999px;font-weight:600}
.mock-atas .tab button[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.mock-atas .ket{font-size:13px;color:#24352c}

.app{max-width:1080px;margin:12px auto 40px;background:var(--krem);border-radius:28px;box-shadow:0 18px 50px rgba(20,40,30,.18);overflow:hidden}
.kepala{display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap;color:#fff;background:#0a2326}
.kepala .merek{font:600 18px var(--display);letter-spacing:-.02em}
.kepala nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.kepala nav button{border:0;background:none;padding:0 14px;border-radius:999px;font-weight:600;color:rgba(255,255,255,.75);min-height:40px}
.kepala nav button:hover{color:#fff;background:rgba(255,255,255,.08)}
.kepala nav button[aria-current=page]{background:rgba(255,255,255,.94);color:#14181a}
.isi{padding:0 0 32px;display:flex;flex-direction:column;gap:20px;min-height:560px}
.isi>*:not(.hero-gelap){margin-inline:20px}
.kecil{font-size:13.5px;color:var(--muted)}
.jalur{font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:20px}

/* hero gelap seperti Beranda/Hasil */
.hero-gelap{position:relative;isolation:isolate;overflow:hidden;color:#fff;padding:28px 20px 30px;background:linear-gradient(135deg,#0a2326,#0f3a38 55%,#0b2a2b)}
.hero-gelap::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(520px circle at 78% 60%,rgba(255,150,40,.42),transparent 70%)}
.hero-gelap h1{font-size:clamp(30px,4vw,46px);line-height:1.04;letter-spacing:-.03em}
.hero-gelap .lead{color:rgba(255,255,255,.85);margin-top:8px;max-width:46ch}
.hero-gelap .kecil{color:rgba(255,255,255,.72)}
.panel-kaca{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);color:#fff;text-align:left;width:100%;min-height:72px;transition:background .2s}
.panel-kaca:hover{background:rgba(255,255,255,.16)}
.panel-kaca .jenis{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.7)}
.panel-kaca .nama{font:500 18px/1.2 var(--display);letter-spacing:-.01em}
.panel-kaca .panah-kecil{margin-left:auto}
.panah-kecil{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);flex:none;transition:transform .25s}
.panel-kaca:hover .panah-kecil{transform:translateX(4px)}
.lencana-ikon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:#14181a}
.bg-kasus{background:var(--lime)}.bg-soal{background:var(--sun)}.bg-contoh{background:#d9c9f2}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
@media(max-width:720px){.dua{grid-template-columns:1fr}}

/* kartu krem-putih */
.kartu{background:var(--raised);border-radius:24px;padding:20px;box-shadow:var(--bayang)}
.judul-bagian{font-size:20px}
.ubin-dua{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.ubin-dua{grid-template-columns:1fr}}
.ubin{border-radius:24px;padding:20px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;background:radial-gradient(240px 180px at 100% 0%,rgba(255,255,255,.6),transparent 70%),linear-gradient(135deg,var(--a),var(--b))}
.ubin.hijau{--a:#d3ebaa;--b:#b7de80}.ubin.jingga{--a:#fde6d8;--b:#f8c7a6}
.ubin h2{font-size:22px}

.pil{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:0;font-weight:700;text-decoration:none}
.pil.terang{background:#fff;color:#0e0f10}
.pil.gelap{background:var(--primary);color:var(--on-primary)}
.aksi{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

/* daftar kasus */
.daftar{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;background:var(--raised);border-radius:24px;box-shadow:var(--bayang)}
.baris{display:flex;gap:14px;align-items:center;padding:12px 12px;border-radius:16px;flex-wrap:wrap;transition:background .2s}
.baris:hover{background:var(--surface)}
.baris .teks{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.baris .teks b{font:600 16px/1.4 var(--sans)}
.ket-simpan{font-size:13px;color:var(--muted)}
.ket-simpan.tersimpan{color:#16734b;font-weight:600}

/* status soal: satu cincin 30px, empat keadaan (memperluas .status-soal-baru di latihan.css) */
.status{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative}
.status.belum{border:2px dashed #aab8a7}
.status.putus{background:conic-gradient(var(--aksen) var(--isi,40%),transparent 0);}
.status.putus::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--aksen)}
.status.putus::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--raised);z-index:1}
.status.benar{background:var(--fardh)}
.status.lihat{background:#e9ede6;color:#4a5853;border:1.5px solid #c9d4c6}
.status .ik{width:16px;height:16px;position:relative;z-index:2}
.bab{margin:0}
.kepala-bab{display:flex;align-items:center;gap:14px;padding:16px 18px 6px}
.kepala-bab h2{flex:1;font-size:18px;font-weight:600;letter-spacing:-.01em}
.bar{width:140px;height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.daftar-soal{list-style:none;margin:0;padding:0 8px 8px;display:flex;flex-direction:column}
.baris-soal{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:16px;transition:background .2s}
.baris-soal:hover{background:var(--surface)}
.baris-soal.disarankan{background:var(--aksen-soft)}
.baris-soal .isi-soal{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.baris-soal .isi-soal b{font:600 16px/1.4 var(--sans)}
.baris-soal.selesai .isi-soal b{font-weight:500;color:var(--muted)}
.baris-soal .keterangan{font-size:13.5px;color:var(--muted)}
.ket-putus{color:#a83a08;font-weight:700}
.tingkat{font-weight:800}.tingkat-dasar{color:#16734b}.tingkat-menengah{color:#8f5600}
.tbl-baris{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--outline);background:var(--raised);font-weight:600;white-space:nowrap}
.tbl-baris:hover{border-color:var(--ink)}
.tbl-baris.utama{background:var(--primary);color:#fff;border-color:var(--primary)}
.legenda{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted)}
.legenda span{display:inline-flex;gap:8px;align-items:center}
.legenda .status{width:22px;height:22px}.legenda .status .ik{width:12px;height:12px}
.legenda .status.putus::before{inset:4px}

.label-mode{display:inline-flex;gap:6px;align-items:center;font:600 13px var(--sans);padding:5px 12px;border-radius:999px;color:#14181a}
.status-simpan{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;color:rgba(255,255,255,.78)}
.isi>.status-simpan{color:var(--muted)}
.soal-cerita{font-size:17px;color:rgba(255,255,255,.92);margin-top:10px;max-width:60ch}
.tebak{display:grid;grid-template-columns:1fr 110px;gap:10px 14px;align-items:center;max-width:480px}
.tebak label{font-weight:600}
.tebak input{min-height:46px;border:1px solid var(--outline);border-radius:12px;padding:0 12px;font:600 17px var(--sans);width:100%;background:var(--surface);text-align:center}
.tebak input:focus{background:#fff}
.tebak input.salah{border-color:var(--danger);background:var(--dsoft)}
.tebak input.cocok{border-color:var(--fardh);background:#e6f4ea}
.tabel{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tabel th,.tabel td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--divider)}
.tabel tr:last-child td{border-bottom:0}
.tabel th{font-size:13px;color:var(--muted);font-weight:600}
.tabel td.angka,.tabel th.angka{text-align:right}
.catatan{background:var(--surface);border-radius:16px;padding:12px 16px;font-size:14px}
.petunjuk{background:#fff4c2;border-radius:16px;padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start;margin-top:16px}
.petunjuk b{font-family:var(--display);font-weight:600}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0e0f10;color:#fff;padding:12px 18px;border-radius:16px;display:none;gap:16px;align-items:center;max-width:calc(100% - 32px);z-index:9;box-shadow:0 12px 30px rgba(0,0,0,.25)}
#toast .tautan{color:#fff}

/* panduan */
.panduan{max-width:760px;padding-top:20px}
.panduan h2{font-size:22px;margin-top:8px}
.panduan ol{padding-left:20px;margin:6px 0}
.tugas{background:var(--raised);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--bayang)}
.tugas textarea{width:100%;min-height:64px;border:1px solid var(--outline);border-radius:12px;padding:8px;font:inherit}
.asumsi{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--divider)}
.asumsi .pilih{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
@media(max-width:560px){.isi>*:not(.hero-gelap){margin-inline:16px}.hero-gelap{padding:22px 16px 24px}.tebak{grid-template-columns:1fr 90px}.bar{width:90px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-soal" viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></symbol>
  <symbol id="i-panah" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-kiri" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-cek" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
  <symbol id="i-awan" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3 3 0 0 0 7 18z"/></symbol>
  <symbol id="i-buku" viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></symbol>
  <symbol id="i-salin" viewBox="0 0 24 24"><path d="M8 8h11v11H8z"/><path d="M5 16V5h11"/></symbol>
  <symbol id="i-mata" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-jeda" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></symbol>
</svg>

<div class="mock-atas">
  <b>Mockup: kasus dan soal latihan</b>
  <div class="tab" role="group" aria-label="Bagian mockup">
    <button id="tab-app" aria-pressed="true">Aplikasi</button>
    <button id="tab-panduan" aria-pressed="false">Cara mencoba</button>
  </div>
  <span class="ket">Contoh saja. Tidak ada yang tersimpan. Muat ulang halaman untuk mulai dari awal.</span>
</div>

<div class="app">
  <header class="kepala">
    <span class="merek">Arif Waris</span>
    <nav aria-label="Menu utama">
      <button data-ke="beranda">Beranda</button>
      <button data-ke="lab">Lab Hitung</button>
      <button data-ke="latihan">Latihan</button>
      <button data-ke="materi">Belajar</button>
    </nav>
  </header>
  <main class="isi" id="layar" tabindex="-1"></main>
</div>
<div id="toast" role="status"><span id="toast-teks"></span><button class="tautan" id="toast-urung">Urungkan</button></div>

<script>
// Satu sumber data mockup. Angka bagian dihitung ulang di sini dan sudah dicocokkan manual ke kaidah [SYF].
const RP = n => 'Rp ' + n.toLocaleString('id-ID');
const data = {
  kasus: [
    { id: 'k1', nama: 'Almarhum Ahmad', ringkas: 'Istri, 2 anak laki-laki, 1 anak perempuan', tersimpan: true, waktu: 'Kemarin, 20.14', harta: 300000000,
      bagian: [['Istri', '1/8', 5, 37500000], ['Anak laki-laki 1', 'Ashabah', 14, 105000000], ['Anak laki-laki 2', 'Ashabah', 14, 105000000], ['Anak perempuan', 'Ashabah', 7, 52500000]], tashih: 40 },
    { id: 'k2', nama: 'Ibu Siti', ringkas: 'Suami, ibu, ayah', tersimpan: false, sisaHari: 26, waktu: '4 hari lalu', harta: 120000000,
      bagian: [['Suami', '1/2', 3, 60000000], ['Ibu', '1/3 sisa', 1, 20000000], ['Ayah', 'Ashabah', 2, 40000000]], tashih: 6, catatan: "Ibu mendapat 1/3 dari sisa setelah bagian suami (masalah 'umariyyah)." },
    { id: 'k3', nama: 'Salinan soal K-07', ringkas: 'Ibu, ayah, anak perempuan', tersimpan: false, sisaHari: 29, waktu: 'Kemarin', harta: 60000000, asal: 'Disalin dari soal K-07',
      bagian: [['Anak perempuan', '1/2', 3, 30000000], ['Ibu', '1/6', 1, 10000000], ['Ayah', '1/6 + ashabah', 2, 20000000]], tashih: 6 },
  ],
  soal: [
    { kode: 'K-03', bab: "Ashabah", judul: 'Istri bersama anak laki-laki dan anak perempuan', tingkat: 'Dasar', status: 'benar',
      cerita: 'Seorang laki-laki wafat meninggalkan istri, satu anak laki-laki, dan satu anak perempuan.',
      kunci: [['Ashlul masalah', 8], ['Tashih', 24], ['Saham istri', 3], ['Saham anak laki-laki', 14], ['Saham anak perempuan', 7]],
      bagian: [['Istri', '1/8', 3], ['Anak laki-laki', 'Ashabah', 14], ['Anak perempuan', 'Ashabah', 7]], tashih: 24 },
    { kode: 'K-07', bab: "Ashabah", judul: 'Ayah dan ibu bersama anak perempuan', tingkat: 'Dasar', status: 'lihat',
      cerita: 'Seorang perempuan wafat meninggalkan ibu, ayah, dan satu anak perempuan.',
      kunci: [['Ashlul masalah', 6], ['Saham anak perempuan', 3], ['Saham ibu', 1], ['Saham ayah', 2]],
      bagian: [['Anak perempuan', '1/2', 3], ['Ibu', '1/6', 1], ['Ayah', '1/6 + ashabah', 2]], tashih: 6 },
    { kode: 'K-12', bab: "'Aul", judul: "Suami, ibu, dua saudari sekandung", tingkat: 'Menengah', status: 'putus', isian: { 0: '6', 1: '' },
      cerita: 'Seorang perempuan wafat meninggalkan suami, ibu, dan dua saudari sekandung.',
      kunci: [['Ashlul masalah', 6], ["Setelah 'aul", 8], ['Saham suami', 3], ['Saham ibu', 1], ['Saham dua saudari (berdua)', 4]],
      bagian: [['Suami', '1/2', 3], ['Ibu', '1/6', 1], ['Saudari sekandung 1', '2/3 berdua', 2], ['Saudari sekandung 2', '2/3 berdua', 2]], tashih: 8, waktu: '2 jam lalu' },
    { kode: 'K-15', bab: "Furudh", judul: 'Anak perempuan bersama cucu perempuan', tingkat: 'Menengah', status: 'belum',
      cerita: 'Seorang perempuan wafat meninggalkan suami, satu anak perempuan, satu cucu perempuan dari anak laki-laki, dan paman sekandung.',
      kunci: [['Ashlul masalah', 12], ['Saham suami', 3], ['Saham anak perempuan', 6], ['Saham cucu perempuan', 2], ['Saham paman', 1]],
      bagian: [['Suami', '1/4', 3], ['Anak perempuan', '1/2', 6], ['Cucu perempuan', '1/6', 2], ['Paman sekandung', 'Ashabah', 1]], tashih: 12 },
  ],
  contoh: { judul: 'Contoh dari materi Ashabah', ringkas: 'Istri, ayah, anak laki-laki', harta: 240000000,
    bagian: [['Istri', '1/8', 3, 30000000], ['Ayah', '1/6', 4, 40000000], ['Anak laki-laki', 'Ashabah', 17, 170000000]], tashih: 24 },
  kasusTerakhir: 'k1',
};

const TEKS_STATUS = { belum: 'Belum dikerjakan', putus: 'Terputus', benar: 'Sudah, benar', lihat: 'Sudah, lihat jawaban' };
const AKSI_STATUS = { belum: 'Kerjakan', putus: 'Lanjutkan', benar: 'Pembahasan', lihat: 'Pembahasan' };
const ik = (nama, ukuran = 18) => `<svg class="ik" width="${ukuran}" height="${ukuran}" aria-hidden="true"><use href="#i-${nama}"/></svg>`;
const layar = document.getElementById('layar');
let posisi = { halaman: 'beranda' };
let petunjukAktif = null;

function ke(halaman, tambahan = {}) {
  posisi = { halaman, ...tambahan };
  document.querySelectorAll('.kepala nav button').forEach(b => b.setAttribute('aria-current', b.dataset.ke === rumahDari(halaman) ? 'page' : 'false'));
  layar.innerHTML = petunjuk() + ({ beranda, lab, kasus: bukaKasus, latihan, soal: bukaSoal, materi, contoh: bukaContoh })[halaman]();
  layar.focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
}
const rumahDari = h => ({ kasus: 'lab', soal: 'latihan', contoh: 'materi' })[h] ?? h;
const soalTerputus = () => data.soal.find(s => s.status === 'putus');
const cariKasus = id => data.kasus.find(k => k.id === id);
const cariSoal = kode => data.soal.find(s => s.kode === kode);
const sudahSelesai = s => s.status === 'benar' || s.status === 'lihat';
// Soal buta (judulSoal.ts): sebelum selesai hanya kode + bab; judul asli membocorkan susunan keluarga.
const judulSoal = s => sudahSelesai(s) ? s.judul : `Soal ${s.kode}`;
const terisi = s => Object.values(s.isian ?? {}).filter(Boolean).length;
const cincin = s => {
  const isi = s.status === 'putus' ? `style="--isi:${Math.round(terisi(s) / s.kunci.length * 100)}%"` : '';
  const ikon = s.status === 'benar' ? ik('cek', 16) : s.status === 'lihat' ? ik('mata', 16) : '';
  return `<span class="status ${s.status}" ${isi} role="img" aria-label="${TEKS_STATUS[s.status]}">${ikon}</span>`;
};
const keteranganStatus = s => ({
  belum: '', putus: ` · <span class="ket-putus">Terputus, ${terisi(s)} dari ${s.kunci.length} isian</span>`,
  benar: ' · Sudah, benar', lihat: ' · Sudah, lihat jawaban' })[s.status];

function beranda() {
  const k = cariKasus(data.kasusTerakhir), s = soalTerputus();
  const panel = [
    k && `<button class="panel-kaca" data-buka-kasus="${k.id}"><span class="lencana-ikon bg-kasus">${ik('kasus', 22)}</span>
      <span><span class="jenis">Lanjutkan kasus</span><br><span class="nama">${k.nama}</span><br><span class="kecil">${k.ringkas}</span></span><span class="panah-kecil">${ik('panah')}</span></button>`,
    s && `<button class="panel-kaca" data-buka-soal="${s.kode}"><span class="lencana-ikon bg-soal">${cincin(s)}</span>
      <span><span class="jenis">Lanjutkan soal</span><br><span class="nama">${judulSoal(s)} · ${s.bab}</span><br><span class="kecil">Terputus ${s.waktu} · ${terisi(s)} dari ${s.kunci.length} isian tersimpan</span></span><span class="panah-kecil">${ik('panah')}</span></button>`,
  ].filter(Boolean);
  return `<section class="hero-gelap"><h1>Assalamu'alaikum</h1><p class="lead">Lanjutkan yang terakhir kamu buka, atau mulai yang baru.</p>
      ${panel.length ? `<div class="dua">${panel.join('')}</div>` : ''}</section>
    <div class="ubin-dua">
      <div class="ubin hijau"><h2>Hitung warisan</h2><p class="kecil" style="color:#2b3a30">Isi keluarga yang ditinggalkan, lihat bagian tiap orang.</p><button class="tautan" style="align-self:flex-start" data-ke="lab">Buka Lab Hitung</button></div>
      <div class="ubin jingga"><h2>Latihan soal</h2><p class="kecil" style="color:#3d2e25">Tebak dulu, lalu cocokkan dengan jawabannya.</p><button class="tautan" style="align-self:flex-start" data-ke="latihan">Buka Latihan</button></div>
    </div>`;
}

function lab() {
  const k = cariKasus(data.kasusTerakhir);
  const urut = [...data.kasus.filter(x => x.tersimpan), ...data.kasus.filter(x => !x.tersimpan)];
  const barisKasus = x => `<li class="baris"><span class="lencana-ikon bg-kasus" style="width:36px;height:36px;border-radius:12px">${ik('kasus')}</span>
    <span class="teks"><b>${x.nama}</b><span class="kecil">${x.ringkas}${x.asal ? ' · ' + x.asal : ''}</span>
    <span class="ket-simpan ${x.tersimpan ? 'tersimpan' : ''}">${x.tersimpan ? 'Tersimpan' : 'Sementara, terhapus ' + x.sisaHari + ' hari lagi'}</span></span>
    <button class="tautan" data-buka-kasus="${x.id}">Buka</button></li>`;
  return `<section class="hero-gelap"><span class="kecil">Lab Hitung</span>
    ${k ? `<div class="aksi" style="margin-top:10px;justify-content:space-between"><div><span class="kecil">Kasus terakhir · ${k.waktu}</span><h1 style="font-size:clamp(26px,3.4vw,38px)">${k.nama}</h1><p class="kecil">${k.ringkas}</p></div>
      <button class="pil terang" data-buka-kasus="${k.id}">Lanjutkan ${ik('panah')}</button></div>` : '<h1>Mulai hitung</h1>'}</section>
    <div class="aksi"><button class="tautan" data-pesan="Mockup: membuka isian kasus baru dari nol.">Mulai kasus baru</button><button class="tautan" data-pesan="Mockup: memilih file kasus untuk diimpor.">Impor file kasus</button></div>
    <section style="display:flex;flex-direction:column;gap:10px"><div><h2 class="judul-bagian">Kasusmu</h2><p class="kecil">Hanya kasus. Soal latihan ada di halaman Latihan.</p></div>
      <ul class="daftar">${urut.map(barisKasus).join('')}</ul></section>
    <p class="kecil">Mau berlatih? <button class="tautan" data-ke="latihan">Buka soal di Latihan</button></p>`;
}

function hasilTabel(bagian, tashih, harta) {
  return `<table class="tabel"><thead><tr><th>Ahli waris</th><th>Bagian</th><th class="angka">Saham dari ${tashih}</th>${harta ? '<th class="angka">Nominal</th>' : ''}</tr></thead>
    <tbody>${bagian.map(b => `<tr><td>${b[0]}</td><td>${b[1]}</td><td class="angka">${b[2]}</td>${harta ? `<td class="angka">${RP(b[3])}</td>` : ''}</tr>`).join('')}</tbody></table>`;
}

function bukaKasus() {
  const k = cariKasus(posisi.id);
  data.kasusTerakhir = k.id;
  return `<section class="hero-gelap"><div class="jalur" style="padding:0 0 12px;color:rgba(255,255,255,.75)"><button class="tautan" style="color:#fff" data-ke="lab">${ik('kiri', 16)} Lab Hitung</button></div>
      <span class="label-mode bg-kasus">${ik('kasus', 16)} Kasus</span>
      <h1 style="margin-top:10px">${k.nama}</h1><p class="lead">${k.ringkas} · Harta ${RP(k.harta)}${k.asal ? ' · ' + k.asal : ''}</p>
      <p class="status-simpan" style="margin-top:10px">${ik('awan', 16)} ${k.tersimpan ? 'Tersimpan · ' + k.waktu : 'Tersimpan sementara di riwayat · terhapus ' + k.sisaHari + ' hari lagi'}</p></section>
    <div class="kartu">${hasilTabel(k.bagian, k.tashih, true)}</div>
    ${k.catatan ? `<p class="catatan">${k.catatan}</p>` : ''}
    <div class="aksi"><button class="tautan" data-pesan="Mockup: kembali ke isian untuk mengubah keluarga atau harta.">Ubah isian</button>
      ${k.tersimpan ? '' : `<button class="tautan" data-simpan="${k.id}">Simpan dengan nama</button>`}
      <button class="tautan" data-pesan="Mockup: membuka langkah demi langkah.">Langkah demi langkah</button></div>`;
}

function latihan() {
  const s = soalTerputus();
  const perBab = [...new Set(data.soal.map(x => x.bab))].map(bab => ({ bab, soal: data.soal.filter(x => x.bab === bab) }));
  const bar = daftar => {
    const n = daftar.length, hit = st => daftar.filter(x => x.status === st).length / n * 100;
    return `<span class="bar" aria-hidden="true"><span style="width:${hit('benar')}%;background:var(--fardh)"></span><span style="width:${hit('lihat')}%;background:#aab8a7"></span><span style="width:${hit('putus')}%;background:var(--aksen)"></span></span>`;
  };
  return `<section class="hero-gelap"><span class="kecil">Latihan</span><h1 style="margin-top:6px">Soal hitung</h1>
      <p class="lead">Judul soal terbuka setelah kamu mengerjakannya, supaya susunan keluarganya tidak bocor.</p>
      ${s ? `<div class="dua" style="grid-template-columns:1fr"><button class="panel-kaca" data-buka-soal="${s.kode}"><span class="lencana-ikon bg-soal">${cincin(s)}</span>
        <span><span class="jenis">Lanjutkan yang terputus</span><br><span class="nama">${judulSoal(s)} · ${s.bab}</span><br><span class="kecil">${terisi(s)} dari ${s.kunci.length} isian tersimpan · ${s.waktu}</span></span><span class="panah-kecil">${ik('panah')}</span></button></div>` : ''}</section>
    <div class="legenda" aria-label="Arti tanda">${['belum', 'putus', 'benar', 'lihat'].map(st => `<span>${cincin({ status: st, kunci: [1, 1], isian: { 0: 1 } })}${TEKS_STATUS[st]}</span>`).join('')}</div>
    ${perBab.map(g => `<section class="kartu bab" style="padding:0"><div class="kepala-bab"><h2>${g.bab}</h2>
        <span class="kecil">${g.soal.filter(sudahSelesai).length} dari ${g.soal.length}</span>${bar(g.soal)}</div>
      <ul class="daftar-soal">${g.soal.map(x => `<li class="baris-soal ${sudahSelesai(x) ? 'selesai' : ''} ${x.status === 'putus' ? 'disarankan' : ''}">${cincin(x)}
        <span class="isi-soal"><b>${judulSoal(x)}</b><span class="keterangan"><span class="tingkat tingkat-${x.tingkat.toLowerCase()}">${x.tingkat}</span>${keteranganStatus(x)}</span></span>
        <button class="tbl-baris ${x.status === 'putus' ? 'utama' : ''}" data-buka-soal="${x.kode}">${AKSI_STATUS[x.status]}</button></li>`).join('')}</ul></section>`).join('')}`;
}

function bukaSoal() {
  const s = cariSoal(posisi.kode);
  const kepala = (tambahan = '') => `<section class="hero-gelap"><div class="jalur" style="padding:0 0 12px"><button class="tautan" style="color:#fff" data-ke="latihan">${ik('kiri', 16)} Latihan</button></div>
    <span class="label-mode bg-soal">${ik('soal', 16)} Soal latihan · ${s.bab} · ${s.tingkat}</span>
    <h1 style="margin-top:10px">${judulSoal(s)}</h1><p class="soal-cerita">${s.cerita}</p>${tambahan}</section>`;
  if (sudahSelesai(s)) {
    return `${kepala(`<p class="status-simpan" style="margin-top:12px">${cincin(s)} ${TEKS_STATUS[s.status]} · ini pembahasannya</p>`)}
      <div class="kartu">${hasilTabel(s.bagian, s.tashih, false)}</div>
      <div class="aksi"><button class="tautan" data-ulang="${s.kode}">Kerjakan ulang</button>
        <button class="tautan" data-jadikan="${s.kode}">Jadikan kasus sendiri</button>
        <button class="tautan" data-pesan="Mockup: membuka langkah demi langkah.">Langkah demi langkah</button></div>
      <p class="kecil">Kerjakan ulang tidak menambah XP. Jadikan kasus sendiri membuat salinan di Kasusmu; soal ini tidak berubah.</p>`;
  }
  s.isian ??= {};
  return `${kepala()}
    <form class="kartu" id="form-tebak" data-kode="${s.kode}" novalidate><h2 class="judul-bagian" style="margin-bottom:14px">Tebakanmu</h2><div class="tebak">
      ${s.kunci.map((k, i) => `<label for="t${i}">${k[0]}</label><input id="t${i}" inputmode="numeric" data-i="${i}" value="${s.isian[i] ?? ''}" autocomplete="off">`).join('')}
    </div><div class="aksi" style="margin-top:18px"><button class="pil gelap" type="submit">Periksa</button>
      <button class="tautan" type="button" data-lihat="${s.kode}">Lihat jawaban</button></div></form>
    <p class="status-simpan" id="status-tebak">${ik('awan', 16)} ${s.status === 'putus' ? 'Tebakanmu tersimpan. Lanjutkan kapan saja dari Latihan.' : 'Tebakan tersimpan otomatis begitu kamu mengisi.'}</p>`;
}

function materi() {
  return `<section class="hero-gelap"><span class="kecil">Belajar · Ashabah</span><h1 style="margin-top:6px">Ashabah bin nafsi</h1>
      <p class="lead">Anak laki-laki mengambil sisa harta setelah ashhabul furudh mendapat bagiannya.</p></section>
    <div class="kartu"><p>Contoh: ${data.contoh.ringkas}.</p><p style="margin-top:10px"><button class="tautan" data-ke="contoh">Coba di kalkulator</button></p></div>`;
}

function bukaContoh() {
  const c = data.contoh;
  return `<section class="hero-gelap"><div class="jalur" style="padding:0 0 12px"><button class="tautan" style="color:#fff" data-ke="materi">${ik('kiri', 16)} Materi Ashabah</button></div>
      <span class="label-mode bg-contoh">${ik('buku', 16)} Contoh dari materi</span><h1 style="margin-top:10px">${c.ringkas}</h1>
      <p class="lead">Hanya dilihat. Tidak masuk Kasusmu.</p></section>
    <div class="kartu">${hasilTabel(c.bagian, c.tashih, true)}</div>
    <div class="aksi"><button class="tautan" data-jadikan-contoh>Jadikan kasus sendiri</button><span class="kecil">lalu ubah sesuai keluargamu</span></div>`;
}

// ── aksi ──
let urung = null;
function pesan(teks, aksiUrung) {
  const t = document.getElementById('toast');
  document.getElementById('toast-teks').textContent = teks;
  urung = aksiUrung ?? null;
  document.getElementById('toast-urung').style.display = urung ? '' : 'none';
  t.style.display = 'flex';
  clearTimeout(pesan.jeda); pesan.jeda = setTimeout(() => t.style.display = 'none', 5000);
}
document.getElementById('toast-urung').onclick = () => { urung?.(); document.getElementById('toast').style.display = 'none'; };

function salinJadiKasus(dari, asal, bagian, tashih, harta) {
  const id = 'k' + (data.kasus.length + 1) + Date.now() % 1000;
  data.kasus.push({ id, nama: 'Salinan ' + dari, ringkas: bagian.map(b => b[0]).join(', '), tersimpan: false, sisaHari: 30, waktu: 'Baru saja', harta, asal, bagian, tashih });
  ke('kasus', { id });
  pesan('Mockup: salinan dibuat di Kasusmu. Yang asli tidak berubah.', () => { data.kasus = data.kasus.filter(k => k.id !== id); data.kasusTerakhir = 'k1'; ke('lab'); });
}
const nominalDari = (bagian, tashih, harta) => bagian.map(b => [b[0], b[1], b[2], harta / tashih * b[2]]);

document.addEventListener('click', e => {
  const el = e.target.closest('button,[data-ke]');
  if (!el) return;
  const d = el.dataset;
  if (d.ke) ke(d.ke);
  else if (d.bukaKasus) ke('kasus', { id: d.bukaKasus });
  else if (d.bukaSoal) ke('soal', { kode: d.bukaSoal });
  else if (d.pesan) pesan(d.pesan);
  else if (d.simpan) { const k = cariKasus(d.simpan); k.tersimpan = true; ke('kasus', { id: k.id }); pesan('Mockup: kasus tersimpan dengan nama "' + k.nama + '".', () => { k.tersimpan = false; ke('kasus', { id: k.id }); }); }
  else if (d.ulang) { const s = cariSoal(d.ulang), lama = s.status; s.status = 'belum'; s.isian = {}; ke('soal', { kode: s.kode }); pesan('Mockup: soal dikosongkan untuk dikerjakan ulang.', () => { s.status = lama; ke('soal', { kode: s.kode }); }); }
  else if (d.lihat) { const s = cariSoal(d.lihat), lama = s.status; s.status = 'lihat'; ke('soal', { kode: s.kode }); pesan('Mockup: jawaban dibuka. XP soal ini tidak dihitung.', () => { s.status = lama; ke('soal', { kode: s.kode }); }); }
  else if (d.jadikan) { const s = cariSoal(d.jadikan), harta = 120000000; salinJadiKasus('soal ' + s.kode, 'Disalin dari soal ' + s.kode, nominalDari(s.bagian, s.tashih, harta), s.tashih, harta); }
  else if ('jadikanContoh' in d) { const c = data.contoh; salinJadiKasus('contoh materi', 'Disalin dari contoh materi Ashabah', c.bagian, c.tashih, c.harta); }
});

document.addEventListener('input', e => {
  const form = e.target.closest('#form-tebak'); if (!form) return;
  const s = cariSoal(form.dataset.kode);
  s.isian[e.target.dataset.i] = e.target.value;
  e.target.classList.remove('salah', 'cocok');
  if (s.status === 'belum') s.status = 'putus';
  s.waktu = 'baru saja';
  document.getElementById('status-tebak').innerHTML = ik('awan', 16) + ' Tebakanmu tersimpan. Lanjutkan kapan saja dari Latihan.';
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target, s = cariSoal(form.dataset.kode);
  let semuaBenar = true;
  s.kunci.forEach((k, i) => {
    const kotak = form.querySelector(`[data-i="${i}"]`);
    const cocok = Number(kotak.value) === k[1] && kotak.value !== '';
    kotak.classList.toggle('cocok', cocok); kotak.classList.toggle('salah', !cocok);
    semuaBenar &&= cocok;
  });
  if (semuaBenar) { s.status = 'benar'; s.isian = {}; ke('soal', { kode: s.kode }); pesan('Mockup: benar semua. Soal pindah ke "Sudah, benar".'); }
  else pesan('Mockup: kotak merah belum tepat. Tebakanmu tetap tersimpan.');
});

// ── panduan uji ──
const TUGAS = [
  { judul: 'Membuka kasus keluarga yang kemarin', halaman: 'beranda', langkah: ['Di Beranda, cari kasus Almarhum Ahmad.', 'Buka kasusnya.'], cek: 'Apakah kamu langsung melihat bagian tiap orang, tanpa disuruh menebak?' },
  { judul: 'Melanjutkan soal yang terputus', halaman: 'beranda', langkah: ['Dari Beranda, lanjutkan soal yang terputus.', 'Lihat apakah tebakanmu sebelumnya masih ada.', 'Isi satu kotak lagi lalu kembali ke Latihan.'], cek: 'Apakah jelas bahwa tebakanmu tidak hilang?' },
  { judul: 'Mencari soal yang belum dikerjakan', halaman: 'latihan', langkah: ['Buka Latihan.', 'Temukan soal yang belum pernah kamu kerjakan (Soal K-15) dan kerjakan.', 'Coba Periksa. (Jawaban K-15: 12, 3, 6, 2, 1)'], cek: 'Apakah status soal berubah setelah benar?' },
  { judul: 'Melihat lagi pembahasan soal lama', halaman: 'latihan', langkah: ['Di Latihan, buka soal yang sudah benar (Istri bersama anak laki-laki dan anak perempuan).', 'Baca pembahasannya.'], cek: 'Apakah kamu tidak dipaksa menebak lagi? Apakah "Kerjakan ulang" mudah ditemukan bila mau?' },
  { judul: 'Mengubah soal menjadi kasus sendiri', halaman: 'latihan', langkah: ['Buka soal Ayah dan ibu bersama anak perempuan.', 'Pilih "Jadikan kasus sendiri".', 'Kembali ke Lab Hitung dan cari salinannya.'], cek: 'Apakah jelas bahwa soal aslinya tidak berubah?' },
  { judul: 'Memakai contoh materi', halaman: 'materi', langkah: ['Buka Belajar, lalu "Coba di kalkulator".', 'Jadikan contoh itu kasus sendiri.'], cek: 'Apakah contoh tidak memenuhi Kasusmu sampai kamu memintanya?' },
];
const ASUMSI = [
  'Judul soal sebaiknya tersembunyi sampai saya mengerjakannya.',
  'Saya lebih suka Beranda menampilkan kasus dan soal di dua baris terpisah, bukan satu "terakhir dibuka".',
  'Soal latihan tidak perlu muncul di Kasusmu.',
  'Kalau keluar di tengah soal, saya ingin tebakan saya tetap ada.',
  'Soal yang sudah dikerjakan sebaiknya langsung menampilkan pembahasan.',
];
function petunjuk() {
  if (petunjukAktif === null) return '';
  const t = TUGAS[petunjukAktif];
  return `<div class="petunjuk">${ik('soal')}<span><b>Tugas ${petunjukAktif + 1}: ${t.judul}.</b> ${t.langkah.join(' ')} <button class="tautan" id="tutup-petunjuk">Tutup</button></span></div>`;
}
function panduan() {
  layar.innerHTML = `<div class="panduan" style="display:flex;flex-direction:column;gap:16px">
    <h1 style="font-size:24px">Cara mencoba mockup ini</h1>
    <p>Ini contoh tampilan, bukan aplikasi sungguhan. Tidak ada yang tersimpan; muat ulang halaman untuk mengulang. Yang ingin kami ketahui: apakah kamu selalu sampai ke tempat yang kamu maksud, kasus atau soal.</p>
    <h2>Arti tanda</h2>
    <div class="legenda"><span class="label-mode bg-kasus">${ik('kasus', 16)} Kasus</span><span class="kecil">masalah waris keluargamu, disimpan di Kasusmu (Lab Hitung)</span></div>
    <div class="legenda"><span class="label-mode bg-soal">${ik('soal', 16)} Soal latihan</span><span class="kecil">ada kunci jawabannya, tinggal di Latihan</span></div>
    <div class="legenda">${['belum', 'putus', 'benar', 'lihat'].map(st => `<span>${cincin({ status: st, kunci: [1, 1], isian: { 0: 1 } })}${TEKS_STATUS[st]}</span>`).join('')}</div>
    <p class="kecil"><b>Terputus</b> = soal sudah kamu buka dan isi sebagian, belum diperiksa.</p>
    <h2>Tugas</h2>
    ${TUGAS.map((t, i) => `<div class="tugas"><b style="font-family:var(--display)">${i + 1}. ${t.judul}</b><ol>${t.langkah.map(l => `<li>${l}</li>`).join('')}</ol>
      <p class="kecil">Yang diperhatikan: ${t.cek}</p><button class="tautan" data-mulai-tugas="${i}" style="align-self:flex-start">Mulai tugas ini</button>
      <label class="kecil" for="cat${i}">Catatanmu</label><textarea id="cat${i}" data-catatan="${i}"></textarea></div>`).join('')}
    <h2>Cocok dengan kebiasaanmu?</h2>
    ${ASUMSI.map((a, i) => `<div class="asumsi"><span>${a}</span><div class="pilih">${['Cocok', 'Tidak cocok', 'Belum yakin'].map(p => `<label><input type="radio" name="as${i}" value="${p}"> ${p}</label>`).join('')}</div></div>`).join('')}
    <p><button class="pil gelap" id="salin-catatan">Salin catatan</button></p>
    <p class="kecil">Tempel catatan yang disalin ke chat tim.</p></div>`;
}

document.getElementById('tab-app').onclick = () => bukaTab('app');
document.getElementById('tab-panduan').onclick = () => bukaTab('panduan');
function bukaTab(tab) {
  document.getElementById('tab-app').setAttribute('aria-pressed', tab === 'app');
  document.getElementById('tab-panduan').setAttribute('aria-pressed', tab === 'panduan');
  document.querySelector('.kepala nav').style.visibility = tab === 'app' ? '' : 'hidden';
  if (tab === 'panduan') panduan(); else ke(posisi.halaman, posisi);
}
const catatan = {};
document.addEventListener('input', e => { if (e.target.dataset.catatan) catatan[e.target.dataset.catatan] = e.target.value; });
document.addEventListener('click', e => {
  const mulai = e.target.closest('[data-mulai-tugas]');
  if (mulai) { petunjukAktif = Number(mulai.dataset.mulaiTugas); posisi = { halaman: TUGAS[petunjukAktif].halaman }; bukaTab('app'); }
  if (e.target.id === 'tutup-petunjuk') { petunjukAktif = null; ke(posisi.halaman, posisi); }
  if (e.target.id === 'salin-catatan') {
    const teks = ['Catatan uji mockup kasus dan soal', ...TUGAS.map((t, i) => `Tugas ${i + 1} (${t.judul}): ${catatan[i] || '-'}`),
      ...ASUMSI.map((a, i) => `${a} → ${document.querySelector(`input[name=as${i}]:checked`)?.value ?? '-'}`)].join('\n');
    navigator.clipboard?.writeText(teks).then(() => pesan('Catatan disalin.'), () => pesan('Gagal menyalin; pilih teksnya manual.'));
  }
});

ke('beranda');
</script>
</body>
</html>
