<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanvas Silsilah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&family=Parkinsans:wght@500;600&display=swap">
<style>
/* MOCKUP v4 kanvas silsilah (2026-10-16; v3 2026-10-14). Isian bergaya wawancara: satu kelompok aktif, yang selesai jadi ringkasan.
   Aturan dari audit: mulai kosong; jenis kelamin ditanya; aksi utama + status di bar bawah, tidak pernah nonaktif;
   garis bawah hanya untuk pindah; penjelasan = pola Details (▸); aksi per orang lewat menu ⋯; halaman isian hanya fakta.
   Token = apps/web/src/gaya/token.css (gaya Logivo). Angka di Hasil = contoh hitung tangan. */
:root{
  --surface:#eef3e8;--surface-sunken:#e4ece1;--outline:#c9d4c6;--divider:#dfe6dc;
  --ink:#14181a;--ink-muted:#525c57;--primary:#0e0f10;
  --pasangan:#c3d4f6;--keturunan:#b5ead0;--leluhur:#d9c9f2;--saudara:#fbd3ac;
  --aksen:#f2682a;--aksen-soft:#fde6d8;--aksen-tua:#8a3409;--krem:#f6f2e9;--halaman:#b9d4c0;
  --kartu:rgba(255,255,255,.72);--kartu-tepi:rgba(255,255,255,.95);
  --font-display:"Parkinsans",system-ui,sans-serif;--font-sans:"Host Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--halaman);color:var(--ink);font:400 15px/1.5 var(--font-sans)}
h1,h2,h3,p{margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--aksen);outline-offset:2px}
.ik{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.redup{color:var(--ink-muted)}
.kecil{font-size:13px}
.tumpuk{display:flex;flex-direction:column;gap:16px}
.deret{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* tiga peran, tiga tampilan */
.tautan{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font-size:inherit}
.aksi-teks{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 10px;margin:-6px -10px;border-radius:10px;font:600 14px var(--font-sans);cursor:pointer;color:var(--ink)}
.aksi-teks:hover{background:var(--surface)}
details.rinci>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:500 13.5px var(--font-sans);color:var(--ink-muted);padding:4px 0}
details.rinci>summary::-webkit-details-marker{display:none}
details.rinci>summary .ik{width:14px;height:14px;transition:transform .2s}
details.rinci[open]>summary .ik{transform:rotate(90deg)}
details.rinci>div{margin-top:6px;font-size:13.5px;color:var(--ink-muted);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}

.meta{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.saklar{display:inline-flex;background:rgba(255,255,255,.6);border-radius:999px;padding:3px}
.saklar button{border:0;background:none;padding:6px 12px;border-radius:999px;font:600 13px var(--font-sans);cursor:pointer}
.saklar button[aria-pressed=true]{background:var(--primary);color:#fff}
.bingkai{max-width:1240px;margin:0 auto 40px;border-radius:30px;background:var(--krem);box-shadow:0 20px 50px rgba(20,40,30,.18);position:relative}
body.hp .bingkai{max-width:390px}

.hero{color:#fff;padding:18px 28px 62px;border-radius:30px 30px 0 0;background:radial-gradient(520px 300px at 80% 40%,rgba(255,150,40,.35),transparent 70%),radial-gradient(420px 260px at 8% 0%,rgba(60,210,170,.3),transparent 70%),linear-gradient(135deg,#0a2326 0%,#0f3a38 55%,#0b2a2b 100%)}
body.hp .hero{padding:16px 16px 56px}
.nav{display:flex;align-items:center;gap:10px;font:700 18px var(--font-sans)}
.nav i{width:24px;height:24px;border-radius:50%;background:var(--aksen)}
.stepper{display:flex;gap:30px;margin-top:26px;overflow-x:auto;scrollbar-width:none}
.stepper button{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:rgba(255,255,255,.85);font:600 14px var(--font-sans);cursor:pointer;padding:0;min-height:44px}
.stepper b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12)}
.stepper button[aria-current=step] b{background:#fff;color:var(--ink);box-shadow:0 0 0 3px #0b3433,0 0 0 5px #fff}
.stepper button.kelar b{background:#fff;color:var(--ink)}
body.hp .stepper span{display:none}
body.hp .stepper button[aria-current=step] span{display:inline}
.tanya-hero{font:500 clamp(28px,4vw,44px)/1.08 var(--font-display);letter-spacing:-.03em;margin-top:18px;max-width:24ch}
body.hp .tanya-hero{font-size:27px}
.sub-hero{margin-top:10px;color:rgba(255,255,255,.88);max-width:60ch}
.lembar{position:relative;margin-top:-30px;background:var(--krem);border-radius:36px 36px 30px 30px;padding:30px 28px 0;min-height:520px}
body.hp .lembar{padding:24px 16px 0}

.kartu{background:var(--kartu);border:1px solid var(--kartu-tepi);border-radius:24px;padding:20px}
.judul-kecil{font:600 17px var(--font-sans);letter-spacing:-.01em}
.pil{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--primary);color:#fff;font:600 15px var(--font-sans);cursor:pointer;text-align:center}
.pilihan{display:grid;gap:10px}
.pilihan.dua{grid-template-columns:repeat(2,minmax(0,1fr))}
body.hp .pilihan.dua{grid-template-columns:1fr}
.opsi{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:18px;border:1.5px solid var(--outline);background:#fff;cursor:pointer;font:500 15px var(--font-sans)}
.opsi small{display:block;color:var(--ink-muted);font-weight:400;font-size:13.5px;margin-top:2px}
.opsi .titik{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--outline);flex:none;margin-top:1px}
.opsi[aria-checked=true]{border-color:var(--primary)}
.opsi[aria-checked=true] .titik{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 4px #fff}
.isian{display:flex;flex-direction:column;gap:6px}
.isian>span{font-weight:600}
.isian input{font:500 16px var(--font-sans);padding:11px 14px;border-radius:14px;border:1.5px solid var(--outline);background:#fff;min-height:46px;width:100%}
.seg{display:flex;align-self:flex-start;flex-wrap:wrap;gap:4px;max-width:100%}
.seg button{border:1.5px solid transparent;background:var(--surface);border-radius:999px;padding:6px 12px;font:500 13.5px var(--font-sans);cursor:pointer;color:var(--ink);min-height:36px;white-space:nowrap}
.seg button:hover{border-color:var(--outline)}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff;font-weight:600}
.seg.besar button{padding:9px 18px;font-size:15px;min-height:42px}

/* kanvas */
.kanvas{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
body.hp .kanvas{grid-template-columns:1fr}
@media(max-width:860px){.kanvas{grid-template-columns:1fr}}
.kol-pohon{position:sticky;top:16px}
body.hp .kol-pohon{position:static;order:-1}
@media(max-width:860px){.kol-pohon{position:static;order:-1}}

.ringkas{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:18px;background:#fff;border:1px solid var(--divider)}
.ringkas .cek{width:26px;height:26px;border-radius:50%;background:var(--keturunan);display:grid;place-items:center;flex:none}
.ringkas .cek .ik{width:15px;height:15px}
.ringkas .isi{flex:1;min-width:0}
.ringkas .isi b{display:block;font-weight:600}
.ringkas .isi span{font-size:13.5px;color:var(--ink-muted)}
.grup{background:#fff;border:1.5px solid var(--primary);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
@media(prefers-reduced-motion:no-preference){.grup.masuk{animation:muncul .35s cubic-bezier(.2,.7,.2,1)}@keyframes muncul{from{opacity:0;transform:translateY(8px)}}}
.grup .label{font:600 12.5px var(--font-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.grup h2{font:500 21px/1.25 var(--font-display);letter-spacing:-.015em}
.pengantar{font-size:14px;background:var(--surface);border-radius:14px;padding:10px 12px}
.hitung-baris{display:flex;gap:12px 22px;flex-wrap:wrap}
.hitung-baris label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.hitung{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--outline);border-radius:999px;padding:2px;align-self:flex-start}
.hitung button{width:38px;height:38px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.hitung button:hover{background:var(--surface)}
.hitung b{min-width:28px;text-align:center;font-weight:700}

.orang{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:12px;background:var(--krem);border-radius:16px;border:1.5px solid transparent}
.orang.kurang{border-color:var(--aksen)}
body.hp .orang{grid-template-columns:minmax(0,1fr) auto;padding:10px}
body.hp .orang .ava{display:none}
body.hp .seg button{padding:6px 10px}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font-sans)}
.ava.wafat{background:transparent!important;border:1.5px solid #9aa79a;color:var(--ink-muted)}
.ava.kosong,.ava.tahu{background:transparent!important;border:1.5px dashed #8d9a8a;color:var(--ink-muted)}
.kol-orang{display:flex;flex-direction:column;gap:8px;min-width:0}
.nama-isi{font:600 15px var(--font-sans);border:0;border-bottom:1.5px dashed var(--outline);background:none;padding:2px 0;width:100%;max-width:260px}
.nama-isi::placeholder{color:#5c655f;font-weight:500}
.peran{font-size:13px;color:var(--ink-muted)}
.lencana-kamu{font:600 11px var(--font-sans);background:var(--aksen-soft);color:var(--aksen-tua);border-radius:999px;padding:2px 8px;margin-left:6px}
.salah{font-size:13px;color:var(--aksen-tua);font-weight:500}
.tahun{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.tahun input{width:76px;font:500 14px var(--font-sans);padding:6px 8px;border-radius:10px;border:1.5px solid var(--outline);background:#fff}
.tombol-menu{width:38px;height:38px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.tombol-menu:hover{background:var(--surface-sunken)}
.menu{position:absolute;z-index:5;background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;min-width:220px}
.menu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font:500 14px var(--font-sans);cursor:pointer}
.menu button:hover{background:var(--surface)}
.menu small{display:block;color:var(--ink-muted);font-size:12.5px}

/* bar bawah: status + aksi utama berdampingan, menempel */
.bar-bawah{position:sticky;bottom:0;margin:28px -28px 0;padding:14px 28px;background:rgba(246,242,233,.95);backdrop-filter:blur(8px);border-top:1px solid var(--divider);border-radius:0 0 30px 30px;display:flex;align-items:center;gap:14px;z-index:4}
body.hp .bar-bawah{margin:24px -16px 0;padding:12px 16px;flex-wrap:wrap}
.bar-bawah .status{flex:1;font-size:14px;color:var(--ink-muted);min-width:0}
.bar-bawah .status b{color:var(--ink)}
body.hp .bar-bawah .status{order:-1;flex-basis:100%}
body.hp .bar-bawah .pil{flex:1}

/* pohon */
.kartu-pohon{padding:14px}
.kartu-pohon svg{display:block;width:100%;height:auto}
.kaki-pohon{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-muted);padding:6px 6px 0;align-items:center}
.kaki-pohon i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.n text{font:600 12px var(--font-sans);fill:var(--ink)}
.n .sub{font:400 10.5px var(--font-sans);fill:var(--ink-muted)}
.n.wafat rect{fill:#fff;stroke:#9aa79a}
.n.kosong rect,.n.tahu rect{fill:#fff;stroke:#7f8c7c;stroke-dasharray:4 3}
.n.pemilik rect{stroke:var(--ink);stroke-width:2;stroke-dasharray:none}
.n.sorot rect{stroke:var(--aksen);stroke-width:2.5;stroke-dasharray:none}
.garis{stroke:#9fb19b;stroke-width:1.5;fill:none}
.pohon-kosong{font-size:14px;color:var(--ink-muted);text-align:center;padding:24px 10px 8px}
.pohon-penuh{display:none!important}
body.hp .kartu-pohon:not(.penuh) .bungkus-pohon{max-height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
body.hp .pohon-penuh{display:inline-flex!important}

/* dialog */
.latar{position:fixed;inset:0;background:rgba(10,30,28,.45);display:grid;place-items:end center;padding:16px;z-index:9}
@media(min-width:700px){.latar{place-items:center}}
@media(min-width:900px){body:not(.hp) .latar{place-items:center start;padding-left:max(24px,calc((100vw - 1240px)/2 + 28px));background:linear-gradient(90deg,rgba(10,30,28,.5) 55%,rgba(10,30,28,.08))}}
.dialog{width:min(520px,100%);background:var(--krem);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog h2{font:500 24px/1.18 var(--font-display);letter-spacing:-.02em}
.tutup{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-sunken);cursor:pointer;display:grid;place-items:center;align-self:flex-end;margin-bottom:-12px}

/* periksa */
.cerita{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:0}
.cerita>*{padding:12px 0;border-top:1px solid var(--divider)}
.cerita .th{font-weight:600;color:var(--ink-muted)}
.cerita .geser{display:flex;gap:4px}
.cerita .geser button{width:34px;height:34px;border-radius:50%;border:1px solid var(--outline);background:#fff;cursor:pointer;display:grid;place-items:center}
.cerita .geser button:disabled{opacity:.3;cursor:default}
.belum{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--divider);flex-wrap:wrap}
.wa{white-space:pre-wrap;font-size:14px;background:#fff;border:1px solid var(--divider);border-radius:16px 16px 16px 4px;padding:12px 14px;max-width:440px}

/* hasil */
.baris-hasil{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--divider)}
.baris-hasil .kiri{display:flex;gap:10px;align-items:center}
.baris-hasil i{width:12px;height:12px;border-radius:4px;flex:none}
.baris-hasil .kanan{text-align:right;white-space:nowrap}
.tab-tahap{display:flex;gap:6px;flex-wrap:wrap}
.tab-tahap button{border:1.5px solid var(--outline);background:#fff;border-radius:999px;padding:7px 14px;font:600 13.5px var(--font-sans);cursor:pointer;min-height:40px}
.tab-tahap button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.isi-tahap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
body.hp .isi-tahap{grid-template-columns:1fr}
@media(max-width:860px){.isi-tahap{grid-template-columns:1fr}}
.dibagi{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);font-weight:600}
.lanjut-tahap{font:500 12px var(--font-sans);color:var(--aksen-tua);background:var(--aksen-soft);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.alir{stroke:var(--aksen);stroke-width:2.5;fill:none;stroke-dasharray:6 6}
@media(prefers-reduced-motion:no-preference){.alir{animation:alir 1.2s linear infinite}@keyframes alir{to{stroke-dashoffset:-24}}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:10;max-width:90vw}

/* ---- v4 ---- */
/* pintu: belajar atau kasus */
.pintu-masuk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:820px}
body.hp .pintu-masuk{grid-template-columns:1fr}
.kartu-pintu{display:flex;flex-direction:column;gap:10px;text-align:left;padding:22px;border-radius:24px;border:1.5px solid var(--outline);background:#fff;cursor:pointer;font:400 15px/1.5 var(--font-sans)}
.kartu-pintu:hover{border-color:var(--primary)}
.kartu-pintu .ikon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.kartu-pintu b{font:500 21px/1.2 var(--font-display);letter-spacing:-.015em}
.kartu-pintu ul{margin:0;padding-left:18px;color:var(--ink-muted);font-size:14px}

/* peta bagian (kemajuan di dalam Keluarga) */
.peta-bagian{display:flex;flex-direction:column;gap:8px}
.peta-bagian .atas{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;color:var(--ink-muted)}
.peta-bagian .atas b{color:var(--ink)}
.batang{display:flex;gap:4px}
.batang i{flex:1;height:6px;border-radius:3px;background:var(--outline)}
.batang i.selesai{background:var(--primary)}
.batang i.aktif{background:var(--aksen)}
.daftar-bagian{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.daftar-bagian button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--divider);background:#fff;border-radius:999px;padding:5px 11px;font:500 13px var(--font-sans);cursor:pointer;color:var(--ink-muted)}
.daftar-bagian button.selesai{color:var(--ink)}
.daftar-bagian button.selesai .ik{color:#1b7a4c}
.daftar-bagian button[aria-current=true]{border-color:var(--primary);color:var(--ink);font-weight:600}
.daftar-bagian button.baru{border-style:dashed}
.daftar-bagian .ik{width:14px;height:14px}

/* kaki kartu kelompok: aksi lanjut lokal */
.kaki-grup{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--divider);padding-top:14px}
.kaki-grup .pil{min-height:44px}
.keadaan-label{font:600 13px var(--font-sans)}
.pilihan-lain{display:flex;flex-wrap:wrap;gap:6px}
.pilihan-lain button{border:1.5px solid var(--outline);background:#fff;border-radius:999px;padding:6px 12px;font:500 13px var(--font-sans);cursor:pointer}
.pilihan-lain button[aria-pressed=true]{border-color:var(--primary);background:var(--primary);color:#fff}
.hapus{font-size:13px!important;color:var(--ink-muted)!important}
.kamu-pilih{display:flex;flex-direction:column;gap:6px;margin:12px 4px 0;font-size:13.5px}
.kamu-pilih select{font:500 14px var(--font-sans);padding:8px 10px;border-radius:12px;border:1.5px solid var(--outline);background:#fff;max-width:280px}
.orang.sorot-baris{border-color:var(--aksen);box-shadow:0 0 0 4px var(--aksen-soft)}

/* belajar: isian cepat */
.mayit{display:flex;flex-direction:column;gap:12px}
.mayit-judul{display:flex;align-items:center;gap:10px}
.mayit-judul .no{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font:700 13px var(--font-sans);flex:none}
.baris-hitung{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--divider)}
.baris-hitung .lbl b{display:block;font-weight:600}
.baris-hitung .lbl small{color:var(--ink-muted);font-size:12.5px}
.chip-orang{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.chip-orang button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--outline);background:#fff;border-radius:999px;padding:5px 11px;font:500 13px var(--font-sans);cursor:pointer}
.chip-orang button[aria-pressed=true]{border-color:var(--ink);background:var(--surface-sunken)}
.chip-orang button[aria-pressed=true]::after{content:"wafat sebelum dibagi";font-size:11.5px;color:var(--aksen-tua)}

/* periksa: linimasa bercerita */
.belum-baris{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--divider)}
.belum-baris .deret{justify-content:space-between}
.terjawab{color:#1b7a4c;font-weight:600;font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.linimasa{position:relative;display:flex;flex-direction:column;padding-left:34px}
.linimasa::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--outline)}
.benang{position:absolute;left:4px;top:40px;bottom:120px;width:16px;border-radius:8px;background:repeating-linear-gradient(180deg,var(--aksen-soft) 0 10px,transparent 10px 16px);opacity:.9}
.babak{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:22px;background:#fff;border:1px solid var(--divider)}
.babak::before{content:"";position:absolute;left:-29px;top:20px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.babak.kini::before{background:var(--keturunan);border-color:#1b7a4c}
.babak .kepala{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.babak .tahun-besar{font:500 30px/1 var(--font-display);letter-spacing:-.02em}
.babak .judul-babak{font:600 16px var(--font-sans);margin-top:4px}
.babak .tubuh{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:14px;align-items:center}
body.hp .babak .tubuh{grid-template-columns:1fr}
@media(max-width:700px){.babak .tubuh{grid-template-columns:1fr}}
.babak p{font-size:15px}
.mini-pohon svg{display:block;width:100%;height:auto}
.jeda{position:relative;padding:14px 0 14px 2px;font-size:13.5px;color:var(--ink-muted);display:flex;gap:8px;align-items:center}
.jeda .harta{display:inline-flex;align-items:center;gap:6px;background:var(--aksen-soft);color:var(--aksen-tua);border-radius:999px;padding:3px 10px;font-weight:600;font-size:12.5px}
.sunting-babak{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:16px;padding:12px 14px}
.sunting-babak label{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
.sunting-babak input{width:90px;font:500 14px var(--font-sans);padding:6px 8px;border-radius:10px;border:1.5px solid var(--outline);background:#fff}
.m text{font:600 10.5px var(--font-sans);fill:var(--ink)}
.m.mati rect{fill:#f1f4ee;stroke:#b7c2b4;stroke-dasharray:3 3}
.m.mati text{fill:#5f6963;text-decoration:line-through}
.m.pusat rect{fill:#fff;stroke:var(--ink);stroke-width:2}
.m.ahli rect{stroke:rgba(0,0,0,.1)}

/* ---- v5 ---- */
.langkah-bagian{display:flex;flex-wrap:wrap;gap:4px 0;margin:0;padding:0;list-style:none;font-size:13px;color:var(--ink-muted)}
.langkah-bagian li{display:inline-flex;align-items:center;gap:4px}
.langkah-bagian li+li::before{content:"›";margin:0 8px;color:#9aa49c}
.langkah-bagian li.selesai{color:var(--ink)}
.langkah-bagian li.selesai .ik{width:14px;height:14px;color:#1b7a4c}
.langkah-bagian li.aktif{color:var(--ink);font-weight:700}
.kapan{display:flex;flex-direction:column;gap:6px;padding-left:10px;border-left:2px solid var(--divider)}
.kapan .tahun{flex-direction:row;align-items:center;gap:8px}
.ubah-panel{display:flex;flex-direction:column;gap:12px}
.ubah-panel .langkah-ubah{font:600 13px var(--font-sans);color:var(--ink-muted)}
.peristiwa{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:4px 0;border-radius:14px;background:var(--surface);font-size:14px}
.form-peristiwa{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:16px;padding:14px}
.form-peristiwa select{font:500 14px var(--font-sans);padding:8px 10px;border-radius:10px;border:1.5px solid var(--outline);background:#fff;max-width:320px}
.tabel-mayit{width:100%;border-collapse:collapse;font-size:14px}
.tabel-mayit th,.tabel-mayit td{padding:8px 10px;border-top:1px solid var(--divider);text-align:left}
.tabel-mayit th{font-weight:600;color:var(--ink-muted);font-size:12.5px}
.tabel-mayit td.angka,.tabel-mayit th.angka{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>

<script>
// MOCKUP v4 (2026-10-16). Pintu: Belajar (isian cepat per ahli waris) atau Kasus (wawancara).
// Kasus: satu kelompok aktif, peta bagian di atas, aksi "lanjut" lokal di kaki kartu, bar bawah hanya untuk langkah besar.
// Keadaan orang tanpa menu tersembunyi: Masih hidup / Sudah wafat / Belum tahu / Lainnya. Pasangan selalu menempel di pohon.
// Periksa: yang belum pasti dijawab di tempat; linimasa bercerita per babak dengan pohon kecil keadaan saat itu.
const WARNA={pasangan:'var(--pasangan)',keturunan:'var(--keturunan)',leluhur:'var(--leluhur)',saudara:'var(--saudara)'};
const NAMA = id => D.orang[id] ? (D.orang[id].nama || D.orang[id].peran || 'Almarhum') : '';
const gabung = a => a.length<2 ? (a[0]||'') : `${a.slice(0,-1).join(', ')}${a.length>2?',':''} dan ${a.at(-1)}`;
const tahunAngka = s => parseInt(String(s||'').replace(/\D/g,''),10) || null;

function awal(sk, tujuan){
  return {
    sk, tujuan, pemilik:'p', pintu:null, jkDipilih:false, buka:null, tandai:null, saya:'', tetapIsi:{}, jawab:{}, tunda:[], sorot:null, dariPeriksa:false, sunting:null, urutanManual:null,
    orang:{ p:{nama:sk==='A'?'Mbah Karto':'Budi', jk:'L', status:'wafat', tahun:sk==='A'?'±1975':'2023', kel:'pemilik', peran:''} },
    grupJawab:{}, anggota:{}, dikunjungi:{},
    bel:{ hitung:{p:{}}, wafat:[], },
  };
}
let D=awal('A'), layar=0, tahap=1, grupTerakhir=null;

// =================== KASUS: kelompok (wawancara) ===================
// Mockup: syarat "perlu ditanya" ditulis tangan; di produk diputuskan engine lewat uji hipotetis.
function grupList(){
  const G=[], o=D.orang, P=D.pemilik;
  const untuk=(m, cabang)=>{
    if (!cabang || cabang==='anak') G.push({id:'pas:'+m, milik:m, jenis:'pasangan'});
    G.push(cabang==='pasangan' ? {id:'bersama:'+m, milik:m, jenis:'anakBersama'} : {id:'anak:'+m, milik:m, jenis:'anak'});
    if (!cabang || cabang==='pasangan') G.push({id:'ot:'+m, milik:m, jenis:'orangTua'});
    if (!cabang){
      const ayah=o['ayah:'+m], ibu=o['ibu:'+m];
      if (ayah?.status==='wafat' || ibu?.status==='wafat') G.push({id:'kn:'+m, milik:m, jenis:'kakekNenek'});
      const anakLk=(D.anggota['anak:'+m]||[]).some(id=>o[id].jk==='L' && (o[id].status==='hidup' || o[id].waktu==='sesudah'));
      if ((D.grupJawab['anak:'+m]?.punya!=null && !anakLk && ayah?.status==='wafat') || D.tetapIsi[m]) G.push({id:'sdr:'+m, milik:m, jenis:'saudara'});
    }
  };
  untuk(P);
  [...(D.anggota['pas:'+P]||[]).map(id=>[id,'pasangan']), ...(D.anggota['anak:'+P]||[]).map(id=>[id,'anak'])]
    .filter(([id])=>o[id]?.status==='wafat' && o[id].waktu==='sesudah').forEach(([id,c])=>untuk(id,c));
  if (antreanUrutan().length || 'urut' in D.jawab || D.tunda.includes('urut')) G.push({id:'urutan', milik:P, jenis:'urutan'});
  G.push({id:'kamu', milik:P, jenis:'kamu'});
  return G;
}
const awalCabang = g => g.milik!==D.pemilik && g.jenis!=='urutan' && g.jenis!=='kamu' && grupList().find(x=>x.milik===g.milik)?.id===g.id;
function judulGrup(g){
  const m=NAMA(g.milik);
  return {pasangan:`${D.orang[g.milik].jk==='L'?'Istri':'Suami'} ${m}`, anak:`Anak ${m}`, orangTua:`Orang tua ${m}`, kakekNenek:`Kakek dan nenek ${m}`, saudara:`Saudara ${m}`, anakBersama:`Anak ${m}`, urutan:'Urutan wafat', kamu:'Kamu (boleh dilewati)'}[g.jenis];
}
const judulPendek = g => ({pasangan:D.orang[g.milik].jk==='L'?'Istri':'Suami', anak:'Anak', orangTua:'Orang tua', kakekNenek:'Kakek-nenek', saudara:'Saudara', anakBersama:'Anak', urutan:'Urutan wafat', kamu:'Kamu'}[g.jenis]) + (g.milik!==D.pemilik&&g.jenis!=='urutan'&&g.jenis!=='kamu'?` ${NAMA(g.milik)}`:'');
function barisTetap(g){
  const m=g.milik, n=NAMA(m);
  if (g.jenis==='orangTua') return [['ayah:'+m,'L',`Ayah ${n}`],['ibu:'+m,'P',`Ibu ${n}`]];
  if (g.jenis==='kakekNenek'){ const r=[];
    if (D.orang['ayah:'+m]?.status==='wafat') r.push(['kakek:'+m,'L','Kakek (ayah dari ayah)']);
    if (D.orang['ibu:'+m]?.status==='wafat') r.push(['nenekI:'+m,'P','Nenek (ibu dari ibu)'],['nenekA:'+m,'P','Nenek (ibu dari ayah)']);
    return r; }
  return null;
}
function pastikanAnggota(g){ const t=barisTetap(g); if(!t) return;
  D.anggota[g.id]=t.map(([id,jk,peran])=>{ if(!D.orang[id]) D.orang[id]={nama:'',jk,status:null,peran,kel:'leluhur',relatif:g.milik}; return id; }); }
let urutBaru=0;
function aturJumlah(g, jk, n){
  // + menambah baris kosong; − hanya membuang baris kosong. Yang sudah diisi dihapus lewat "Hapus" di barisnya.
  const ids=D.anggota[g.id]||(D.anggota[g.id]=[]), sama=ids.filter(id=>D.orang[id].jk===jk);
  if (n>sama.length){ for(let i=sama.length;i<n;i++){ const id=`${g.id}:${jk}${++urutBaru}`;
    D.orang[id]={nama:'',jk,status:null,peran:labelBaru(g,jk,i+1),kel:g.jenis==='pasangan'?'pasangan':g.jenis==='saudara'?'saudara':'keturunan',relatif:g.milik}; ids.push(id);} return true; }
  const kosong=[...sama].reverse().find(id=>!D.orang[id].nama && D.orang[id].status==null);
  if (!kosong){ toast('Orang yang sudah diisi dihapus lewat "Hapus" di barisnya.'); return false; }
  D.anggota[g.id]=ids.filter(x=>x!==kosong); delete D.orang[kosong]; return true;
}
function labelBaru(g,jk,i){
  if (g.jenis==='pasangan') return D.orang[g.milik].jk==='L'?`Istri ${i}`:'Suami';
  return `${{anak:jk==='L'?'Anak laki-laki':'Anak perempuan', saudara:jk==='L'?'Saudara laki-laki':'Saudara perempuan'}[g.jenis]} ${i}`;
}
const barisLengkap = id => { const o=D.orang[id]; return !!o.status && (o.status!=='wafat'||!!o.waktu) && (o.status!=='lain'||(!!o.khusus&&!!o.lanjutan)); };
function grupLengkap(g){
  if (g.jenis==='urutan') return !antreanUrutan().length;
  if (g.jenis==='kamu') return !!D.sayaDijawab;
  const j=D.grupJawab[g.id]||{}, ids=D.anggota[g.id]||[];
  if (g.jenis==='anakBersama') return j.punya!=null;
  if (barisTetap(g)) return ids.length>0 && ids.every(barisLengkap);
  if (j.punya==null) return false;
  return j.punya===false || (ids.length>0 && ids.every(barisLengkap));
}
function antreanUrutan(){
  const o=D.orang, P=D.pemilik;
  const sesudah=Object.keys(o).filter(id=>id!==P && o[id].relatif===P && o[id].status==='wafat' && o[id].waktu==='sesudah');
  const tanpa=sesudah.filter(id=>!tahunAngka(o[id].tahun));
  if (sesudah.length<2 || !tanpa.length || 'urut' in D.jawab || D.tunda.includes('urut')) return [];
  const a=tanpa[0], b=sesudah.find(x=>x!==a);
  return [{a,b}];
}
function grupTerbuka(){ const G=grupList(); const g=G.find(x=>x.id===D.buka) || G.find(x=>!grupLengkap(x)); if(g){D.buka=g.id; D.dikunjungi[g.id]=true;} return g; }

// =================== hero & umum ===================
const LANGKAH=['Almarhum','Harta','Keluarga','Periksa','Hasil'];
function gambarHero(){
  const st=document.getElementById('stepper');
  st.innerHTML = layar===0 ? '' : LANGKAH.map(n=>n==='Keluarga'&&D.tujuan==='belajar'?'Ahli waris':n).map((n,i)=>`<button ${i+1===layar?'aria-current="step"':''} class="${i+1<layar?'kelar':''}" data-ke="${i+1}"><b>${i+1}</b><span>${n}</span></button>`).join('');
  st.querySelectorAll('button').forEach(b=>b.onclick=()=>ke(+b.dataset.ke));
  const n=NAMA(D.pemilik), bel=D.tujuan==='belajar';
  const H={0:['Mau menghitung apa?','Pilih sesuai kebutuhanmu. Keduanya memakai perhitungan yang sama.'],
    1:[bel?'Siapa mayit pertamanya?':'Siapa yang wafat dan meninggalkan harta?', bel?'Isi seperti di soal.':'Mulai dari yang kamu ingat. Yang belum pasti boleh dikira-kira.'],
    2:['Harta apa yang ditinggalkan?','Langkah ini tidak berubah di konsep ini.'],
    3:[bel?`Ahli waris ${n}`:`Keluarga ${n}`, bel?'Isi jumlahnya. Tandai yang wafat sebelum harta dibagi; ahli warisnya diisi di bawahnya.':'Satu bagian per kali. Bagian yang sudah selesai bisa dibuka lagi.'],
    4:['Benar begini ceritanya?','Yang belum pasti bisa dijawab langsung di sini.'],
    5:[`Pembagian harta ${n}`, D.sk==='A'?'Rumah peninggalan · Rp 1.200.000.000':'Tabungan · Rp 300.000.000']}[layar];
  document.getElementById('tanyaHero').textContent=H[0]; document.getElementById('subHero').textContent=H[1];
}
function ke(n){ layar=n; D.tandai=null; gambar(); window.scrollTo({top:0}); }
function barBawah(isi){ return `<div class="bar-bawah">${isi}</div>`; }
const tombolKembali = () => layar>0 ? '<button class="tautan" id="kembali">Kembali</button>' : '';
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=t; document.body.append(el); setTimeout(()=>el.remove(),3200); }

// =================== 0. Pintu ===================
function layarPintu(){
  return `<div class="pintu-masuk">
    <button class="kartu-pintu" data-tujuan="belajar"><span class="ikon" style="background:var(--leluhur)"><svg class="ik"><use href="#i-buku"/></svg></span>
      <b>Belajar atau latihan soal</b><span class="redup">Isi jumlah ahli waris dengan cepat, seperti di buku.</span>
      <ul><li>Cocok untuk soal kitab dan tugas</li><li>Semua data dianggap sudah pasti</li><li>Istilah fikih ditampilkan</li></ul></button>
    <button class="kartu-pintu" data-tujuan="kasus"><span class="ikon" style="background:var(--keturunan)"><svg class="ik"><use href="#i-rumah"/></svg></span>
      <b>Kasus keluarga sungguhan</b><span class="redup">Kami tanyakan satu per satu, termasuk yang belum kamu yakin.</span>
      <ul><li>Cocok untuk harta keluarga yang akan dibagi</li><li>Boleh menjawab "belum tahu"</li><li>Pertanyaan bisa dikirim ke keluarga lewat WA</li></ul></button>
  </div>`;
}
function pasangPintu(){ document.querySelectorAll('[data-tujuan]').forEach(b=>b.onclick=()=>{ D.tujuan=b.dataset.tujuan; ke(1); }); }

// =================== 1. Almarhum ===================
function layarAlmarhum(){
  const p=D.orang[D.pemilik], t=D.tandai==='awal', bel=D.tujuan==='belajar';
  const pintu=[['baru','Belum, baru saja wafat','Biasanya beberapa bulan terakhir.'],['lama','Belum, sudah bertahun-tahun','Misalnya rumah yang masih ditempati keluarga.'],['sudah','Sudah pernah dibagi','Bagiannya sudah dihitung dan diserahkan ke masing-masing.'],['tahu','Tidak tahu','Kita tanyakan keadaan tiap orang, supaya aman.']];
  const kurang=[!D.jkDipilih, !bel&&!D.pintu].filter(Boolean).length;
  return `<div class="tumpuk" style="max-width:720px">
    <section class="kartu tumpuk">
      <label class="isian"><span>${bel?'Nama atau sebutan':'Nama almarhum'}</span><input id="namaPemilik" value="${p.nama}"></label>
      <div class="isian"><span>Laki-laki atau perempuan?</span>
        <div class="seg besar" id="jkPemilik" role="radiogroup"><button aria-pressed="${D.jkDipilih&&p.jk==='L'}" data-v="L">Laki-laki</button><button aria-pressed="${D.jkDipilih&&p.jk==='P'}" data-v="P">Perempuan</button></div>
        ${t&&!D.jkDipilih?'<span class="salah">Pilih laki-laki atau perempuan.</span>':''}</div>
      ${bel?'':`<label class="isian"><span>Kira-kira tahun berapa ${p.nama} wafat? <span class="redup" style="font-weight:400">Boleh kosong.</span></span><input style="max-width:140px" value="${p.tahun}" id="tahunPemilik" placeholder="mis. 1975"></label>`}
    </section>
    ${bel?'':`<section class="kartu tumpuk"><h2 class="judul-kecil">Sejak ${p.nama} wafat, apakah hartanya sudah dibagi?</h2>
      <div class="pilihan dua" role="radiogroup" id="pintu">${pintu.map(([k,tx,x])=>`<button class="opsi" role="radio" aria-checked="${D.pintu===k}" data-k="${k}"><span class="titik"></span><span>${tx}<small>${x}</small></span></button>`).join('')}</div>
      ${t&&!D.pintu?'<span class="salah">Pilih salah satu. Sengaja tanpa jawaban bawaan supaya tidak terlewat.</span>':''}
      ${D.pintu==='sudah'?'<p class="pengantar">Kalau sudah dibagi seluruhnya, yang perlu dihitung adalah harta orang yang wafat sesudahnya. Kalau baru sebagian, kami belum bisa menghitungnya otomatis; tanyakan ke ahli faraidh.</p>':''}</section>`}

// =================== 3a. Keluarga (kasus) ===================
// pilihan khusus menyesuaikan orangnya; bila hanya satu, tampil langsung (bukan "Lainnya")

  kandungan:['Bayinya sudah lahir?',['Belum lahir','Sudah lahir']],

  hilang:'Pergi tanpa kabar; tidak diketahui masih hidup atau tidak.', lain:'Keadaan khusus; jenisnya dipilih sesudah ini.'};
function pilihanKeadaan(o){
  const k=KHUSUS(o), satu=k.length===1;

}

      ${o.status==='wafat'?`<div class="kapan">

        ${otomatis?`<span class="kecil redup">Berarti <b>${o.waktu}</b> ${rel} wafat (${tRel}).</span>`

      ${o.status==='lain'&&k.length>1?`<div class="pilihan-lain" data-khusus="${id}">${k.map(([v,t])=>`<button aria-pressed="${o.khusus===v}" data-v="${v}">${t}</button>`).join('')}</div>`:''}

  </div>`;

function bantuanKeadaan(ids){

  return `<details class="rinci"><summary><svg class="ik"><use href="#i-kanan"/></svg>Bingung memilih?</summary><div>${v.map(k=>`<span><b>${{hidup:'Masih hidup',wafat:'Sudah wafat',tahu:'Belum tahu',lain:'Lainnya',hilang:'Hilang tanpa kabar'}[k]}</b>: ${ARTI[k]}</span>`).join('')}</div></details>`;

function ringkasan(g){

    : g.jenis==='anakBersama' ? (j.punya?'Sama dengan anak-anak '+NAMA(D.pemilik):'Tidak semua')
    : (!barisTetap(g) && j.punya===false) ? 'Tidak ada' : ids.map(id=>(D.orang[id].nama||D.orang[id].peran)+ket(D.orang[id])).join(', ');
  return `<div class="ringkas"><span class="cek"><svg class="ik"><use href="#i-cek"/></svg></span>

    <button class="aksi-teks" data-ubah="${g.id}" aria-label="Ubah ${judulGrup(g)}"><svg class="ik" style="width:15px;height:15px"><use href="#i-pensil"/></svg>Ubah</button></div>`;

function berikutnyaSetelah(g){ const G=grupList(), i=G.findIndex(x=>x.id===g.id); return G.slice(i+1).find(x=>!grupLengkap(x)) || G.find(x=>!grupLengkap(x)&&x.id!==g.id); }
function grupAktif(g){
  pastikanAnggota(g);
  const m=NAMA(g.milik), j=D.grupJawab[g.id]||(D.grupJawab[g.id]={}), ids=D.anggota[g.id]||[], mjk=D.orang[g.milik].jk;
  let tanya='', isi='', pengantar='', rinci='';

  const hit=(jk,label)=>{const n=ids.filter(id=>D.orang[id].jk===jk).length; return `<label>${label}<span class="hitung"><button aria-label="kurangi ${label}" data-hitung="${g.id}|${jk}|-1"><svg class="ik"><use href="#i-min"/></svg></button><b aria-live="polite">${n}</b><button aria-label="tambah ${label}" data-hitung="${g.id}|${jk}|1"><svg class="ik"><use href="#i-plus"/></svg></button></span></label>`;};

    rinci=`<details class="rinci"><summary><svg class="ik"><use href="#i-kanan"/></svg>Sudah bercerai sebelum ${m} wafat?</summary><div>Tetap pilih "Ya", lalu di baris pasangannya pilih Lainnya › Sudah bercerai.</div></details>`; }
  if (g.jenis==='anak'||g.jenis==='saudara'){ tanya=`${m} punya ${g.jenis}? Hitung juga yang sudah wafat.`;
    isi=yaTidak('Ya','Tidak') + (j.punya?`<div class="hitung-baris">${hit('L','Laki-laki')}${hit('P','Perempuan')}</div>`:''); }
  if (g.jenis==='orangTua') tanya=`Orang tua ${m}`;
  if (g.jenis==='kakekNenek') tanya=`Karena ${D.orang['ayah:'+g.milik]?.status==='wafat'?'ayah':'ibu'} ${m} sudah wafat, kakek atau neneknya juga perlu ditanyakan.`;
  if (g.jenis==='anakBersama'){ const anakP=(D.anggota['anak:'+D.pemilik]||[]).map(NAMA); tanya=`Apakah ${anakP.join(', ')} juga anak ${m}?`;
    isi=yaTidak('Ya, semuanya','Tidak semua')+(j.punya===false?`<p class="pengantar">Di produk: centang siapa saja anak ${m}, lalu tanya apakah ${m} punya anak dari pernikahan lain.</p>`:''); }
  if (g.jenis==='urutan'){ const q=antreanUrutan()[0]||{a:'sumi',b:'budi'}, b=D.orang[q.b];
    tanya=`${NAMA(q.a)} wafat sebelum atau sesudah ${NAMA(q.b)}${b?.tahun?' ('+b.tahun+')':''}?`;
    isi=`<div class="pilihan" role="radiogroup">${[['sebelum',`Sebelum ${NAMA(q.b)}`],['sesudah',`Sesudah ${NAMA(q.b)}`],['tunda','Belum tahu','Nanti bisa ditanyakan ke keluarga dari halaman Periksa.']].map(([k,t,x])=>`<button class="opsi" role="radio" aria-checked="${k==='tunda'?D.tunda.includes('urut'):D.jawab.urut===k}" data-urut="${k}"><span class="titik"></span><span>${t}${x?`<small>${x}</small>`:''}</span></button>`).join('')}</div>`;
    rinci=`<details class="rinci"><summary><svg class="ik"><use href="#i-kanan"/></svg>Kenapa ditanya?</summary><div>Keduanya wafat sesudah ${NAMA(D.pemilik)} dan tahun wafat ${NAMA(q.a)} kosong. Urutannya menentukan apakah ${NAMA(q.b)} ikut menerima dari ${NAMA(q.a)}. Kalau tahunnya diisi, pertanyaan ini hilang.</div></details>`; }
  if (g.jenis==='kamu'){ const hidup=Object.keys(D.orang).filter(id=>D.orang[id].status==='hidup');
    tanya='Kamu ada di keluarga ini?';
    isi=`<p class="kecil redup">Supaya sebutan memakai sudut pandangmu, misalnya "kakekmu" atau "ayahmu".</p><div class="pilihan" role="radiogroup">${[...hidup.map(id=>[id,`Saya ${NAMA(id)}`,D.orang[id].peran]),['','Bukan, saya mengisi untuk orang lain','']].map(([v,t,x])=>`<button class="opsi" role="radio" aria-checked="${!!D.sayaDijawab&&D.saya===v}" data-saya="${v}"><span class="titik"></span><span>${t}${x?`<small>${x}</small>`:''}</span></button>`).join('')}</div>`; }
  rinci = bantuanKeadaan(ids) + rinci;
  if (g.jenis==='anak' && g.milik===D.pemilik && j.punya && ids.some(id=>D.orang[id].jk==='L') && !D.tetapIsi[g.milik])
    rinci+=`<details class="rinci"><summary><svg class="ik"><use href="#i-kanan"/></svg>Kenapa saudara ${m} tidak ditanyakan?</summary><div>Saudara, keponakan, paman, dan sepupu tidak mendapat bagian selama ada anak laki-laki.<button class="aksi-teks" data-tetap="${g.milik}"><svg class="ik"><use href="#i-plus"/></svg>Tetap isi kerabat lain</button></div></details>`;

    rinci+=`<details class="rinci"><summary><svg class="ik"><use href="#i-kanan"/></svg>Kenapa anak-anak ${NAMA(id)} tidak ditanyakan?</summary><div>${NAMA(id)} wafat sebelum ${m}. Anak-anaknya (cucu ${m}) tidak mendapat bagian selama ada anak laki-laki ${m} yang masih hidup saat itu.</div></details>`; });
  const nxt=berikutnyaSetelah(g);
  const kaki=`<div class="kaki-grup"><span class="kecil redup" role="status">${grupLengkap(g)?'Bagian ini sudah lengkap.':D.tandai===g.id?`<span class="salah">Masih ada yang belum diisi di bagian ini.</span>`:''}</span>
    <button class="pil" id="lanjutBagian">${nxt?`Lanjut: ${judulPendek(nxt)}`:'Selesai, lanjut ke Periksa'}</button></div>`;
  const masuk=g.id!==grupTerakhir; grupTerakhir=g.id;
  return `<section class="grup ${masuk?'masuk':''}" id="grup-aktif" aria-labelledby="judul-grup"><span class="label">${judulGrup(g)}</span>${pengantar}<h2 id="judul-grup">${tanya}</h2>${isi}${ids.map(barisOrang).join('')}${rinci}${kaki}</section>`;

// ---- pohon: pasangan selalu menempel pada orangnya ----
function simpul(id,x,y){
  const o=D.orang[id]; if(!o) return ''; const st=o.status||'kosong';
  const nm=(o.nama||o.peran).replace('Anak laki-laki','Anak lk').replace('Anak perempuan','Anak pr').replace('Saudara laki-laki','Sdr lk').replace('Saudara perempuan','Sdr pr');
  const sub= st==='wafat'?(o.tahun||(o.waktu?`${o.waktu} ${NAMA(o.relatif).split(' ').pop()}`:'wafat')):st==='tahu'?'belum tahu':st==='kosong'?'belum diisi':st==='lain'?'keadaan lain':(D.saya===id?'kamu':'hidup');
  return `<g class="n ${st==='lain'?'tahu':st} ${id===D.pemilik?'pemilik':''}" transform="translate(${x-46},${y-20})">
    <rect width="92" height="40" rx="12" fill="${st==='hidup'?(WARNA[o.kel]||'#fff'):'#fff'}" stroke="${st==='hidup'?'rgba(0,0,0,.08)':''}"/>
    <text x="46" y="17" text-anchor="middle">${nm.length>13?nm.slice(0,12)+'…':nm}</text><text class="sub" x="46" y="31" text-anchor="middle">${sub.length>15?sub.slice(0,14)+'…':sub}</text></g>`;
}
const siku=(x1,y1,x2,y2)=>`<path class="garis" d="M${x1} ${y1} V${(y1+y2)/2} H${x2} V${y2}"/>`;
function pohon(){
  const P=D.pemilik, anak=D.anggota['anak:'+P]||[], pas=D.anggota['pas:'+P]||[], sdr=D.anggota['sdr:'+P]||[], ayah='ayah:'+P, ibu='ibu:'+P;
  if (!anak.length && !pas.length && !sdr.length && !D.orang[ayah])
    return `<div class="pohon-kosong">Pohon tumbuh di sini saat kamu mengisi.<svg viewBox="0 0 200 60" style="max-width:200px;margin:12px auto 0">${simpul(P,100,30)}</svg></div>`;
  const SLOT=108, yOT=30, yP=110, yA=210, yC=300;
  const lebarAnak=id=>Math.max(1+((D.anggota['pas:'+id]||[]).length?1:0),(D.anggota['anak:'+id]||[]).length);
  // urutan baris: saudara di kiri, pemilik, lalu pasangannya tepat di kanannya (garis nikah tidak melewati orang lain)
  const barisP=[...sdr,P,...pas], totalAnak=anak.reduce((j,id)=>j+lebarAnak(id),0);
  const lebar=Math.max(420,totalAnak*SLOT+20,barisP.length*SLOT+20), tinggi=anak.some(id=>(D.anggota['anak:'+id]||[]).length)?340:anak.length?250:150;
  let s=`<svg viewBox="0 0 ${lebar} ${tinggi}" role="img" aria-label="Pohon keluarga ${NAMA(P)}">`;
  const x0=(lebar-barisP.length*SLOT)/2+SLOT/2, xP={}; barisP.forEach((id,i)=>xP[id]=x0+i*SLOT);
  if (D.orang[ayah]){ const sekandung=[...sdr,P], xt=sekandung.reduce((j,id)=>j+xP[id],0)/sekandung.length;
    s+=`<line class="garis" x1="${xt-56}" y1="${yOT}" x2="${xt+56}" y2="${yOT}"/>`; sekandung.forEach(id=>s+=siku(xt,yOT,xP[id],yP-20)); s+=simpul(ayah,xt-56,yOT)+simpul(ibu,xt+56,yOT); }
  pas.forEach((id,i)=>s+=`<line class="garis" x1="${xP[i?pas[i-1]:P]+46}" y1="${yP}" x2="${xP[id]-46}" y2="${yP}"/>`);
  barisP.forEach(id=>s+=simpul(id,xP[id],yP));
  let kursor=(lebar-totalAnak*SLOT)/2; const xA=pas.length?(xP[P]+xP[pas[0]])/2:xP[P];
  anak.forEach(id=>{ const x=kursor+SLOT/2, ps=D.anggota['pas:'+id]||[], cu=D.anggota['anak:'+id]||[];
    s+=siku(xA,yP+20,x,yA-20)+simpul(id,x,yA);
    if (ps.length) s+=`<line class="garis" x1="${x+46}" y1="${yA}" x2="${x+SLOT-46}" y2="${yA}"/>`+simpul(ps[0],x+SLOT,yA);
    const xc0=ps.length?x+SLOT/2:x; cu.forEach((c,i)=>{const xc=kursor+SLOT/2+i*SLOT; s+=siku(xc0,yA+20,xc,yC-20)+simpul(c,xc,yC);});
    kursor+=lebarAnak(id)*SLOT; });
  return s+'</svg>';
}

// urutan kematian: yang wafat sebelum pemilik, pemilik, lalu yang sesudah (tahun / jawaban urutan / atur manual)
function urutanKematian(){
  const o=D.orang, P=D.pemilik, dekat=[...(D.anggota['pas:'+P]||[]),...(D.anggota['anak:'+P]||[]),...(D.anggota['sdr:'+P]||[])];
  const sebelum=dekat.filter(id=>o[id]?.status==='wafat'&&o[id].waktu==='sebelum');
  let sesudah=dekat.filter(id=>o[id]?.status==='wafat'&&o[id].waktu==='sesudah').sort((a,b)=>(tahunAngka(o[a].tahun)||1e9)-(tahunAngka(o[b].tahun)||1e9));
  if (D.jawab.urut==='sebelum'){ const a=sesudah.find(id=>!tahunAngka(o[id].tahun)); if(a) sesudah=[a,...sesudah.filter(x=>x!==a)]; }
  if (D.urutanManual) sesudah.sort((a,b)=>D.urutanManual.indexOf(a)-D.urutanManual.indexOf(b));
  return {sebelum, sesudah, semua:[...sebelum,P,...sesudah]};
}
function hidupSaat(id, idxBabak, U){
  const o=D.orang[id]; if(!o) return null;
  if (o.status==='hidup') return 'hidup'; if (o.status==='tahu'||o.status==='lain') return 'tahu';
  if (o.status!=='wafat') return 'tahu';
  const i=U.semua.indexOf(id); if (i>=0) return i<idxBabak?'mati':i===idxBabak?'pusat':'hidup';
  return o.waktu==='sebelum'?'mati':'hidup';
}
function miniPohon(mayit, idx, U){
  // pohon kecil keadaan keluarga pada saat babak itu: yang sudah wafat dicoret, pusat = yang wafat di babak ini

  const pas=D.anggota['pas:'+mayit]||[]; const anak=D.anggota['anak:'+mayit] || (D.grupJawab['bersama:'+mayit]?.punya ? D.anggota['anak:'+D.pemilik]||[] : []);
  const kotak=(id,x,y,peran)=>{ const k=id===mayit?'pusat':hidupSaat(id,idx,U); const nm=(D.orang[id].nama||D.orang[id].peran).replace(/ (Mbah \w+|Budi)$/,'').replace('Anak laki-laki','Anak lk').replace('Anak perempuan','Anak pr'); return `<g class="m ${k==='pusat'?'pusat':k==='mati'?'mati':'ahli'}" transform="translate(${x-34},${y-12})"><rect width="68" height="24" rx="8" fill="${k==='hidup'?(WARNA[D.orang[id].kel]||'#fff'):'#fff'}" ${k==='tahu'?'stroke-dasharray="3 3" stroke="#7f8c7c"':''}/><text x="34" y="16" text-anchor="middle">${nm.length>12?nm.slice(0,11)+'…':nm}</text></g>`; };
  const W=230; let s=`<svg viewBox="0 0 ${W} 130" role="img" aria-label="Keluarga saat ${NAMA(mayit)} wafat">`;
  atas.forEach((id,i)=>{ s+=kotak(id, W/2+(i?40:-40), 16); }); if(atas.length) s+=`<path class="garis" d="M${W/2} 28 V44"/>`;
  const tengah=[mayit,...pas.slice(0,1)]; tengah.forEach((id,i)=>s+=kotak(id, W/2+(tengah.length>1?(i?40:-40):0), 56));
  const xs=anak.slice(0,3).map((_,i,a)=>W/2+(i-(a.length-1)/2)*74);
  if (anak.length){ s+=`<path class="garis" d="M${W/2} 68 V${84}"/>`; anak.slice(0,3).forEach((id,i)=>{ s+=siku(W/2,84,xs[i],102)+kotak(id,xs[i],114); }); }
  return s+'</svg>';
}
function babak(id, idx, U, sebelumnya){
  const o=D.orang[id], P=D.pemilik, nm=NAMA(id);
  const pas=(D.anggota['pas:'+id]||[]).filter(x=>hidupSaat(x,idx,U)!=='mati').map(NAMA);
  const anakAll=D.anggota['anak:'+id] || (D.grupJawab['bersama:'+id]?.punya ? D.anggota['anak:'+P]||[] : []);
  const anak=anakAll.filter(x=>hidupSaat(x,idx,U)!=='mati').map(NAMA), anakMati=anakAll.filter(x=>hidupSaat(x,idx,U)==='mati').map(NAMA);
  const ortu=['ayah:'+id,'ibu:'+id].filter(x=>D.orang[x]&&hidupSaat(x,idx,U)==='hidup').map(NAMA), ortuTahu=['ayah:'+id,'ibu:'+id].filter(x=>D.orang[x]&&hidupSaat(x,idx,U)==='tahu').map(NAMA);

  if (sn?.apa==='tahun') isiSunting=`<label>Tahun wafat ${nm} <input value="${o.tahun||''}" placeholder="kalau ingat" data-tahun-babak="${id}"></label>`;

  if (sn?.apa==='orang') isiSunting=`<span class="langkah-ubah">Bagian keluarga yang mana?</span><div class="pilihan">${grupList().filter(g=>g.milik===id&&!['urutan','kamu'].includes(g.jenis)).map(g=>`<button class="opsi" data-ke-keluarga="${g.id}"><span class="titik"></span><span>${judulGrup(g)}</span></button>`).join('')}</div>`;
  const sunting = sn ? `<div class="sunting-babak">${isiSunting}

  return `<article class="babak">
    <div class="kepala"><div><div class="tahun-besar">${o.tahun||'Tahun ?'}</div><div class="judul-babak">${nm} wafat${D.tunda.includes('urut')&&!tahunAngka(o.tahun)&&id!==P?' <span class="lanjut-tahap">urutan belum pasti</span>':''}</div></div>
      ${sn?'':`<button class="aksi-teks" data-sunting="${id}"><svg class="ik" style="width:15px;height:15px"><use href="#i-pensil"/></svg>Ubah</button>`}</div>
    <div class="tubuh"><p>${teks}</p><div class="mini-pohon">${miniPohon(id,idx,U)}</div></div>${sunting}</article>`;

function panelUbah(){

function aliranSvg(){
  const g=tahap, node=(x,y,t,a)=>`<g transform="translate(${x-38},${y-14})"><rect width="76" height="28" rx="9" fill="${a?'#fff':'#f1f4ee'}" stroke="${a?'var(--ink)':'#c9d4c6'}"/><text x="38" y="18" text-anchor="middle" style="font:600 11px var(--font-sans);fill:${a?'var(--ink)':'#5f6963'}">${t}</text></g>`, a=(d,on)=>`<path class="${on?'alir':'garis'}" d="${d}"/>`;
  return `<svg viewBox="0 0 360 196" role="img" aria-label="Aliran bagian tahap ${g}">${a('M180 34 C180 70 70 70 70 96',g===1)}${a('M180 34 C180 70 180 70 180 96',g===1)}${a('M180 34 C180 70 290 70 290 96',g===1)}${a('M108 110 L142 110',g===2)}${a('M70 96 C70 60 290 60 290 96',g===2)}${a('M180 124 C180 150 70 150 70 166',g===3)}${a('M180 124 C180 150 180 150 180 166',g===3)}${a('M180 124 C180 150 290 150 290 166',g===3)}
    ${node(180,22,'Mbah Karto',g===1)}${node(70,110,'Mbah Sumi',g<=2)}${node(180,110,'Budi',true)}${node(290,110,'Rina',g<=2)}${node(70,176,'Dewi',g===3)}${node(180,176,'Andi',g===3)}${node(290,176,'Sari',g===3)}</svg>`;
}

// =================== contoh terisi ===================
function isiContoh(){
  const A=D.sk==='A', tujuan=D.tujuan||'kasus'; D=awal(D.sk, tujuan); D.jkDipilih=true; D.pintu=A?'lama':'baru';
  if (tujuan==='belajar'){ D.bel.hitung={p:A?{istri:1,anakL:1,anakP:1}:{ibu:1,sdrL:1,sdrP:1}}; if(A){ D.bel.wafat=['p.istri.1','p.anakL.1']; D.bel.hitung['p.istri.1']={anakL:1,anakP:1}; D.bel.hitung['p.anakL.1']={istri:1,anakL:1,anakP:1}; } return; }
  const isi=(gid,milik,daftar)=>{D.anggota[gid]=daftar.map(([id,nama,jk,kel,peran,status,waktu,tahun])=>{D.orang[id]={nama,jk,kel,peran,status,waktu:waktu||null,tahun:tahun||'',relatif:milik};return id;}); D.dikunjungi[gid]=true;};
  if (A){
    D.grupJawab={'pas:p':{punya:true},'anak:p':{punya:true},'bersama:sumi':{punya:true},'pas:budi':{punya:true},'anak:budi':{punya:true}}; D.dikunjungi['bersama:sumi']=true;
    isi('pas:p','p',[['sumi','Mbah Sumi','P','pasangan','Istri 1','wafat','sesudah','']]);
    isi('anak:p','p',[['slamet','Slamet','L','keturunan','Anak laki-laki 1','wafat','sebelum','±1970'],['budi','Budi','L','keturunan','Anak laki-laki 2','wafat','sesudah','1998'],['rina','Rina','P','keturunan','Anak perempuan 1','hidup']]);
    isi('ot:p','p',[['ayah:p','','L','leluhur','Ayah Mbah Karto','wafat','sebelum'],['ibu:p','','P','leluhur','Ibu Mbah Karto','tahu']]);
    isi('kn:p','p',[['kakek:p','','L','leluhur','Kakek (ayah dari ayah)','wafat','sebelum']]);
    isi('ot:sumi','sumi',[['ayah:sumi','','L','leluhur','Ayah Mbah Sumi','wafat','sebelum'],['ibu:sumi','','P','leluhur','Ibu Mbah Sumi','wafat','sebelum']]);
    isi('pas:budi','budi',[['dewi','Dewi','P','pasangan','Istri 1','hidup']]);
    isi('anak:budi','budi',[['andi','Andi','L','keturunan','Anak laki-laki 1','hidup'],['sari','Sari','P','keturunan','Anak perempuan 1','hidup']]);
  } else {
    D.grupJawab={'pas:p':{punya:false},'anak:p':{punya:false},'sdr:p':{punya:true}}; D.dikunjungi['pas:p']=D.dikunjungi['anak:p']=true;
    isi('ot:p','p',[['ayah:p','Ayah','L','leluhur','Ayah Budi','wafat','sebelum','2010'],['ibu:p','Ibu','P','leluhur','Ibu Budi','hidup']]);
    isi('kn:p','p',[['kakek:p','','L','leluhur','Kakek (ayah dari ayah)','wafat','sebelum']]);
    isi('sdr:p','p',[['andi','Andi','L','saudara','Saudara laki-laki 1','hidup'],['rina','Rina','P','saudara','Saudara perempuan 1','hidup']]);
  }
}

// =================== gambar ===================
function gambar(){
  gambarHero(); const l=document.getElementById('lembar'), bel=D.tujuan==='belajar';
  if (layar===0){ l.innerHTML=layarPintu(); pasangPintu(); }
  if (layar===1){ l.innerHTML=layarAlmarhum(); pasangAlmarhum(); }
  if (layar===2){ l.innerHTML=`<div class="kartu" style="max-width:640px"><p>Langkah Harta tidak berubah di konsep ini (tumpukan harta = Tahap 6).</p></div>${barBawah(`${tombolKembali()}<span class="status"></span><button class="pil" id="lanjut2">Lanjut: ${bel?'Ahli waris':'Keluarga'}</button>`)}`; document.getElementById('lanjut2').onclick=()=>ke(3); }
  if (layar===3){ if(bel){ l.innerHTML=layarKeluargaBelajar(); pasangKeluargaBelajar(); } else { l.innerHTML=layarKeluargaKasus(); pasangKeluargaKasus(); } }
  if (layar===4){ if(bel){ l.innerHTML=layarPeriksaBelajar(); document.getElementById('lanjutPeriksa').onclick=()=>ke(5); } else { l.innerHTML=layarPeriksaKasus(); pasangPeriksaKasus(); } }
  if (layar===5){ l.innerHTML=(bel?layarHasilBelajar():layarHasil())+barBawah(`${tombolKembali()}<span class="status"></span><button class="pil">Simpan</button>`); document.querySelectorAll('#tabTahap button').forEach(b=>b.onclick=()=>{tahap=+b.dataset.t;gambar();}); }
  const kb=document.getElementById('kembali'); if(kb) kb.onclick=()=>{ D.dariPeriksa=false; ke(layar-1); };
}
const tandaiSaklar=(sel,b)=>document.querySelectorAll(sel+' button').forEach(x=>x.setAttribute('aria-pressed',x===b));
document.querySelectorAll('#pilihContoh button').forEach(b=>b.onclick=()=>{ D=awal(b.dataset.sk); layar=0; tahap=1; tandaiSaklar('#pilihContoh',b); tandaiSaklar('#pilihIsi',document.querySelector('#pilihIsi button')); gambar(); });
document.querySelectorAll('#pilihIsi button').forEach(b=>b.onclick=()=>{ if(b.dataset.isi==='contoh'){ if(!D.tujuan) D.tujuan='kasus'; isiContoh(); layar=3; } else { D=awal(D.sk); layar=0; } tandaiSaklar('#pilihIsi',b); gambar(); });
document.querySelectorAll('#pilihLebar button').forEach(b=>b.onclick=()=>{ document.body.classList.toggle('hp',b.dataset.lebar==='hp'); tandaiSaklar('#pilihLebar',b); });
gambar();
</script>
