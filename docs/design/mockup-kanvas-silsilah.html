<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanvas Silsilah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&family=Parkinsans:wght@500;600&display=swap">
<style>
/* MOCKUP v3 kanvas silsilah (2026-10-14). Isian bergaya wawancara: satu kelompok aktif, yang selesai jadi ringkasan.
   Aturan dari audit: mulai kosong; jenis kelamin ditanya; aksi utama + status di bar bawah, tidak pernah nonaktif;
   garis bawah hanya untuk pindah; penjelasan = pola Details (▸); aksi per orang lewat menu ⋯; halaman isian hanya fakta.
   Token = apps/web/src/gaya/token.css (gaya Logivo). Angka di Hasil = contoh hitung tangan. */
:root{
  --surface:#eef3e8;--surface-sunken:#e4ece1;--outline:#c9d4c6;--divider:#dfe6dc;
  --ink:#14181a;--ink-muted:#525c57;--primary:#0e0f10;
  --pasangan:#c3d4f6;--keturunan:#b5ead0;--leluhur:#d9c9f2;--saudara:#fbd3ac;
  --aksen:#f2682a;--aksen-soft:#fde6d8;--aksen-tua:#8a3409;--krem:#f6f2e9;--halaman:#b9d4c0;
  --kartu:rgba(255,255,255,.72);--kartu-tepi:rgba(255,255,255,.95);
  --font-display:"Parkinsans",system-ui,sans-serif;--font-sans:"Host Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--halaman);color:var(--ink);font:400 15px/1.5 var(--font-sans)}
h1,h2,h3,p{margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--aksen);outline-offset:2px}
.ik{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.redup{color:var(--ink-muted)}
.kecil{font-size:13px}
.tumpuk{display:flex;flex-direction:column;gap:16px}
.deret{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* tiga peran, tiga tampilan */
.tautan{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font-size:inherit}
.aksi-teks{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 10px;margin:-6px -10px;border-radius:10px;font:600 14px var(--font-sans);cursor:pointer;color:var(--ink)}
.aksi-teks:hover{background:var(--surface)}
details.rinci>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font:500 13.5px var(--font-sans);color:var(--ink-muted);padding:4px 0}
details.rinci>summary::-webkit-details-marker{display:none}
details.rinci>summary .ik{width:14px;height:14px;transition:transform .2s}
details.rinci[open]>summary .ik{transform:rotate(90deg)}
details.rinci>div{margin-top:6px;font-size:13.5px;color:var(--ink-muted);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}

.meta{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.saklar{display:inline-flex;background:rgba(255,255,255,.6);border-radius:999px;padding:3px}
.saklar button{border:0;background:none;padding:6px 12px;border-radius:999px;font:600 13px var(--font-sans);cursor:pointer}
.saklar button[aria-pressed=true]{background:var(--primary);color:#fff}
.bingkai{max-width:1240px;margin:0 auto 40px;border-radius:30px;background:var(--krem);box-shadow:0 20px 50px rgba(20,40,30,.18);transition:max-width .35s;position:relative}
body.hp .bingkai{max-width:390px}

.hero{color:#fff;padding:18px 28px 62px;border-radius:30px 30px 0 0;background:radial-gradient(520px 300px at 80% 40%,rgba(255,150,40,.35),transparent 70%),radial-gradient(420px 260px at 8% 0%,rgba(60,210,170,.3),transparent 70%),linear-gradient(135deg,#0a2326 0%,#0f3a38 55%,#0b2a2b 100%)}
body.hp .hero{padding:16px 16px 56px}
.nav{display:flex;align-items:center;gap:10px;font:700 18px var(--font-sans)}
.nav i{width:24px;height:24px;border-radius:50%;background:var(--aksen)}
.stepper{display:flex;gap:30px;margin-top:26px;overflow-x:auto;scrollbar-width:none}
.stepper button{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:rgba(255,255,255,.85);font:600 14px var(--font-sans);cursor:pointer;padding:0;min-height:44px}
.stepper b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12)}
.stepper button[aria-current=step] b{background:#fff;color:var(--ink);box-shadow:0 0 0 3px #0b3433,0 0 0 5px #fff}
.stepper button.kelar b{background:#fff;color:var(--ink)}
body.hp .stepper span{display:none}
body.hp .stepper button[aria-current=step] span{display:inline}
.tanya-hero{font:500 clamp(28px,4vw,44px)/1.08 var(--font-display);letter-spacing:-.03em;margin-top:18px;max-width:24ch}
body.hp .tanya-hero{font-size:27px}
.sub-hero{margin-top:10px;color:rgba(255,255,255,.88);max-width:60ch}
.lembar{position:relative;margin-top:-30px;background:var(--krem);border-radius:36px 36px 30px 30px;padding:30px 28px 0;min-height:520px}
body.hp .lembar{padding:24px 16px 0}

.kartu{background:var(--kartu);border:1px solid var(--kartu-tepi);border-radius:24px;padding:20px}
.judul-kecil{font:600 17px var(--font-sans);letter-spacing:-.01em}
.pil{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--primary);color:#fff;font:600 15px var(--font-sans);cursor:pointer;text-align:center}
.pilihan{display:grid;gap:10px}
.pilihan.dua{grid-template-columns:repeat(2,minmax(0,1fr))}
body.hp .pilihan.dua{grid-template-columns:1fr}
.opsi{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:18px;border:1.5px solid var(--outline);background:#fff;cursor:pointer;font:500 15px var(--font-sans)}
.opsi small{display:block;color:var(--ink-muted);font-weight:400;font-size:13.5px;margin-top:2px}
.opsi .titik{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--outline);flex:none;margin-top:1px}
.opsi[aria-checked=true]{border-color:var(--primary)}
.opsi[aria-checked=true] .titik{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 4px #fff}
.isian{display:flex;flex-direction:column;gap:6px}
.isian>span{font-weight:600}
.isian input{font:500 16px var(--font-sans);padding:11px 14px;border-radius:14px;border:1.5px solid var(--outline);background:#fff;min-height:46px;width:100%}
.seg{display:inline-flex;align-self:flex-start;background:var(--surface);border-radius:999px;padding:2px;flex-wrap:nowrap;white-space:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font:500 13.5px var(--font-sans);cursor:pointer;color:var(--ink-muted);min-height:34px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:600}
.seg.besar button{padding:9px 18px;font-size:15px;min-height:42px}

/* kanvas */
.kanvas{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
body.hp .kanvas{grid-template-columns:1fr}
@media(max-width:860px){.kanvas{grid-template-columns:1fr}}
.kol-pohon{position:sticky;top:16px}
body.hp .kol-pohon{position:static;order:-1}
@media(max-width:860px){.kol-pohon{position:static;order:-1}}

.ringkas{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:18px;background:#fff;border:1px solid var(--divider)}
.ringkas .cek{width:26px;height:26px;border-radius:50%;background:var(--keturunan);display:grid;place-items:center;flex:none}
.ringkas .cek .ik{width:15px;height:15px}
.ringkas .isi{flex:1;min-width:0}
.ringkas .isi b{display:block;font-weight:600}
.ringkas .isi span{font-size:13.5px;color:var(--ink-muted)}
.grup{background:#fff;border:1.5px solid var(--primary);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
@media(prefers-reduced-motion:no-preference){.grup.masuk{animation:muncul .35s cubic-bezier(.2,.7,.2,1)}@keyframes muncul{from{opacity:0;transform:translateY(8px)}}}
.grup .label{font:600 12.5px var(--font-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.grup h2{font:500 21px/1.25 var(--font-display);letter-spacing:-.015em}
.pengantar{font-size:14px;background:var(--surface);border-radius:14px;padding:10px 12px}
.hitung-baris{display:flex;gap:12px 22px;flex-wrap:wrap}
.hitung-baris label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.hitung{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--outline);border-radius:999px;padding:2px;align-self:flex-start}
.hitung button{width:38px;height:38px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.hitung button:hover{background:var(--surface)}
.hitung b{min-width:28px;text-align:center;font-weight:700}

.orang{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:12px;background:var(--krem);border-radius:16px;border:1.5px solid transparent}
.orang.kurang{border-color:var(--aksen)}
body.hp .orang{grid-template-columns:minmax(0,1fr) auto;padding:10px}
body.hp .orang .ava{display:none}
body.hp .seg button{padding:6px 10px}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font-sans)}
.ava.wafat{background:transparent!important;border:1.5px solid #9aa79a;color:var(--ink-muted)}
.ava.kosong,.ava.tahu{background:transparent!important;border:1.5px dashed #8d9a8a;color:var(--ink-muted)}
.kol-orang{display:flex;flex-direction:column;gap:8px;min-width:0}
.nama-isi{font:600 15px var(--font-sans);border:0;border-bottom:1.5px dashed var(--outline);background:none;padding:2px 0;width:100%;max-width:260px}
.nama-isi::placeholder{color:#5c655f;font-weight:500}
.peran{font-size:13px;color:var(--ink-muted)}
.lencana-kamu{font:600 11px var(--font-sans);background:var(--aksen-soft);color:var(--aksen-tua);border-radius:999px;padding:2px 8px;margin-left:6px}
.salah{font-size:13px;color:var(--aksen-tua);font-weight:500}
.tahun{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.tahun input{width:76px;font:500 14px var(--font-sans);padding:6px 8px;border-radius:10px;border:1.5px solid var(--outline);background:#fff}
.tombol-menu{width:38px;height:38px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.tombol-menu:hover{background:var(--surface-sunken)}
.menu{position:absolute;z-index:5;background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;min-width:220px}
.menu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:10px;font:500 14px var(--font-sans);cursor:pointer}
.menu button:hover{background:var(--surface)}
.menu small{display:block;color:var(--ink-muted);font-size:12.5px}

/* bar bawah: status + aksi utama berdampingan, menempel */
.bar-bawah{position:sticky;bottom:0;margin:28px -28px 0;padding:14px 28px;background:rgba(246,242,233,.95);backdrop-filter:blur(8px);border-top:1px solid var(--divider);border-radius:0 0 30px 30px;display:flex;align-items:center;gap:14px;z-index:4}
body.hp .bar-bawah{margin:24px -16px 0;padding:12px 16px;flex-wrap:wrap}
.bar-bawah .status{flex:1;font-size:14px;color:var(--ink-muted);min-width:0}
.bar-bawah .status b{color:var(--ink)}
body.hp .bar-bawah .status{order:-1;flex-basis:100%}
body.hp .bar-bawah .pil{flex:1}

/* pohon */
.kartu-pohon{padding:14px}
.kartu-pohon svg{display:block;width:100%;height:auto}
.kaki-pohon{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-muted);padding:6px 6px 0;align-items:center}
.kaki-pohon i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.n text{font:600 12px var(--font-sans);fill:var(--ink)}
.n .sub{font:400 10.5px var(--font-sans);fill:var(--ink-muted)}
.n.wafat rect{fill:#fff;stroke:#9aa79a}
.n.kosong rect,.n.tahu rect{fill:#fff;stroke:#7f8c7c;stroke-dasharray:4 3}
.n.pemilik rect{stroke:var(--ink);stroke-width:2;stroke-dasharray:none}
.n.sorot rect{stroke:var(--aksen);stroke-width:2.5;stroke-dasharray:none}
.garis{stroke:#9fb19b;stroke-width:1.5;fill:none}
.pohon-kosong{font-size:14px;color:var(--ink-muted);text-align:center;padding:24px 10px 8px}
.pohon-penuh{display:none!important}
body.hp .kartu-pohon:not(.penuh) .bungkus-pohon{max-height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
body.hp .pohon-penuh{display:inline-flex!important}

/* dialog */
.latar{position:fixed;inset:0;background:rgba(10,30,28,.45);display:grid;place-items:end center;padding:16px;z-index:9}
@media(min-width:700px){.latar{place-items:center}}
@media(min-width:900px){body:not(.hp) .latar{place-items:center start;padding-left:max(24px,calc((100vw - 1240px)/2 + 28px));background:linear-gradient(90deg,rgba(10,30,28,.5) 55%,rgba(10,30,28,.08))}}
.dialog{width:min(520px,100%);background:var(--krem);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog h2{font:500 24px/1.18 var(--font-display);letter-spacing:-.02em}
.tutup{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-sunken);cursor:pointer;display:grid;place-items:center;align-self:flex-end;margin-bottom:-12px}

/* periksa */
.cerita{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:0}
.cerita>*{padding:12px 0;border-top:1px solid var(--divider)}
.cerita .th{font-weight:600;color:var(--ink-muted)}
.cerita .geser{display:flex;gap:4px}
.cerita .geser button{width:34px;height:34px;border-radius:50%;border:1px solid var(--outline);background:#fff;cursor:pointer;display:grid;place-items:center}
.cerita .geser button:disabled{opacity:.3;cursor:default}
.belum{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--divider);flex-wrap:wrap}
.wa{white-space:pre-wrap;font-size:14px;background:#fff;border:1px solid var(--divider);border-radius:16px 16px 16px 4px;padding:12px 14px;max-width:440px}

/* hasil */
.baris-hasil{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--divider)}
.baris-hasil .kiri{display:flex;gap:10px;align-items:center}
.baris-hasil i{width:12px;height:12px;border-radius:4px;flex:none}
.baris-hasil .kanan{text-align:right;white-space:nowrap}
.tab-tahap{display:flex;gap:6px;flex-wrap:wrap}
.tab-tahap button{border:1.5px solid var(--outline);background:#fff;border-radius:999px;padding:7px 14px;font:600 13.5px var(--font-sans);cursor:pointer;min-height:40px}
.tab-tahap button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.isi-tahap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
body.hp .isi-tahap{grid-template-columns:1fr}
@media(max-width:860px){.isi-tahap{grid-template-columns:1fr}}
.dibagi{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);font-weight:600}
.lanjut-tahap{font:500 12px var(--font-sans);color:var(--aksen-tua);background:var(--aksen-soft);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.alir{stroke:var(--aksen);stroke-width:2.5;fill:none;stroke-dasharray:6 6}
@media(prefers-reduced-motion:no-preference){.alir{animation:alir 1.2s linear infinite}@keyframes alir{to{stroke-dashoffset:-24}}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:10;max-width:90vw}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-kanan" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-atas" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-bawah" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-cek" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-pensil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></symbol>
  <symbol id="i-titik" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>

</svg>

<div class="meta">
  <b>Mockup v3 · kanvas silsilah</b>
  <div class="saklar" id="pilihContoh"><button aria-pressed="true" data-sk="A">Kakek · turun-temurun</button><button aria-pressed="false" data-sk="B">Kakak · baru wafat</button></div>
  <div class="saklar" id="pilihIsi"><button aria-pressed="true" data-isi="kosong">Mulai kosong</button><button aria-pressed="false" data-isi="contoh">Isi contoh</button></div>
  <div class="saklar" id="pilihLebar"><button aria-pressed="true" data-lebar="desktop">Desktop</button><button aria-pressed="false" data-lebar="hp">HP</button></div>
</div>

<div class="bingkai">
  <header class="hero">
    <div class="nav"><i></i>Arif Waris</div>
    <nav class="stepper" id="stepper" aria-label="Langkah"></nav>
    <h1 class="tanya-hero" id="tanyaHero"></h1>
    <p class="sub-hero" id="subHero"></p>
  </header>
  <main class="lembar" id="lembar"></main>
</div>
<div id="lapisan"></div>
<div id="wadahMenu"></div>

<script>
const WARNA={pasangan:'var(--pasangan)',keturunan:'var(--keturunan)',leluhur:'var(--leluhur)',saudara:'var(--saudara)'};
const NAMA = id => D.orang[id] ? (D.orang[id].nama || D.orang[id].peran || 'Almarhum') : '';

// ---------- data ----------
function awal(sk){
  return {
    sk, pemilik:'p', pintu:null, jkDipilih:false, buka:null, tandai:null, saya:null, tetapIsi:{}, jawab:{}, tunda:[], tampilPeriksa:'cerita', urutanManual:null,
    orang:{ p:{nama:sk==='A'?'Mbah Karto':'Budi', jk:'L', status:'wafat', tahun:sk==='A'?'±1975':'2023', kel:'pemilik', peran:''} },
    grupJawab:{}, anggota:{},
  };
}
let D=awal('A'), layar=1, dialog=null, tahap=1, grupTerakhir=null;  // grupTerakhir: animasi masuk hanya saat kelompok berganti

// ---------- kelompok (wawancara) ----------
// Urutan per orang: pasangan → anak → orang tua → (kakek/nenek bila orang tua wafat) → (saudara bila tak ada anak lk & ayah wafat).
// Mockup: syarat "perlu ditanya" ditulis tangan; di produk diputuskan engine lewat uji hipotetis.
function grupList(){
  const G=[], o=D.orang, P=D.pemilik;
  const untuk=(m, cabang)=>{
    if (!cabang || cabang==='anak') G.push({id:'pas:'+m, milik:m, jenis:'pasangan'});
    G.push(cabang==='pasangan' ? {id:'bersama:'+m, milik:m, jenis:'anakBersama'} : {id:'anak:'+m, milik:m, jenis:'anak'});
    if (!cabang || cabang==='pasangan') G.push({id:'ot:'+m, milik:m, jenis:'orangTua'});
    if (!cabang){
      const ayah=o['ayah:'+m], ibu=o['ibu:'+m];
      if (ayah?.status==='wafat' || ibu?.status==='wafat') G.push({id:'kn:'+m, milik:m, jenis:'kakekNenek'});
      const anakLk=(D.anggota['anak:'+m]||[]).some(id=>o[id].jk==='L' && (o[id].status==='hidup' || o[id].waktu==='sesudah'));
      const anakDijawab=D.grupJawab['anak:'+m]?.punya!=null;
      if ((anakDijawab && !anakLk && ayah?.status==='wafat') || D.tetapIsi[m]) G.push({id:'sdr:'+m, milik:m, jenis:'saudara'});
    }
  };
  untuk(P);
  // yang wafat sesudah pemilik dan sebelum harta dibagi → keluarganya ditanyakan (cabang)
  [...(D.anggota['pas:'+P]||[]).map(id=>[id,'pasangan']), ...(D.anggota['anak:'+P]||[]).map(id=>[id,'anak'])]
    .filter(([id])=>o[id]?.status==='wafat' && o[id].waktu==='sesudah').forEach(([id,c])=>untuk(id,c));
  return G;
}
const awalCabang = g => g.milik!==D.pemilik && grupList().find(x=>x.milik===g.milik)?.id===g.id;
function judulGrup(g){
  const m=NAMA(g.milik);
  return {pasangan:`${D.orang[g.milik].jk==='L'?'Istri':'Suami'} ${m}`, anak:`Anak ${m}`, orangTua:`Orang tua ${m}`, kakekNenek:`Kakek dan nenek ${m}`, saudara:`Saudara ${m}`, anakBersama:`Anak ${m}`}[g.jenis];
}
function barisTetap(g){
  // orang tua & kakek/nenek: barisnya tetap (tanpa hitung)
  const m=g.milik, n=NAMA(m);
  if (g.jenis==='orangTua') return [['ayah:'+m,'L',`Ayah ${n}`],['ibu:'+m,'P',`Ibu ${n}`]];
  if (g.jenis==='kakekNenek'){
    const r=[];
    if (D.orang['ayah:'+m]?.status==='wafat') r.push(['kakek:'+m,'L','Kakek (ayah dari ayah)']);
    if (D.orang['ibu:'+m]?.status==='wafat') r.push(['nenekI:'+m,'P','Nenek (ibu dari ibu)'],['nenekA:'+m,'P','Nenek (ibu dari ayah)']);
    return r;
  }
  return null;
}
function pastikanAnggota(g){
  const t=barisTetap(g); if(!t) return;
  D.anggota[g.id]=t.map(([id,jk,peran])=>{ if(!D.orang[id]) D.orang[id]={nama:'',jk,status:null,peran,kel:'leluhur',relatif:g.milik}; return id; });
}
let urutBaru=0;
function aturJumlah(g, jk, n){
  // + menambah baris kosong; − hanya membuang baris kosong. Orang yang sudah diisi dihapus lewat menu barisnya.
  const ids=D.anggota[g.id]||(D.anggota[g.id]=[]); const sama=ids.filter(id=>D.orang[id].jk===jk);
  if (n>sama.length){ for(let i=sama.length;i<n;i++){ const id=`${g.id}:${jk}${++urutBaru}`;
      D.orang[id]={nama:'',jk,status:null,peran:labelBaru(g,jk,i+1),kel:g.jenis==='pasangan'?'pasangan':g.jenis==='saudara'?'saudara':'keturunan',relatif:g.milik}; ids.push(id);} return true; }
  const kosong=[...sama].reverse().find(id=>!D.orang[id].nama && D.orang[id].status==null);
  if (!kosong){ toast('Orang yang sudah diisi dihapus lewat menu ⋯ di barisnya.'); return false; }
  D.anggota[g.id]=ids.filter(x=>x!==kosong); delete D.orang[kosong]; return true;
}
function labelBaru(g,jk,i){
  if (g.jenis==='pasangan') return D.orang[g.milik].jk==='L'?`Istri ${i}`:'Suami';
  return `${{anak:jk==='L'?'Anak laki-laki':'Anak perempuan', saudara:jk==='L'?'Saudara laki-laki':'Saudara perempuan'}[g.jenis]} ${i}`;
}
const tahunAngka = s => parseInt(String(s||'').replace(/\D/g,''),10) || null;
const barisLengkap = id => { const o=D.orang[id]; return !!o.status && (o.status!=='wafat' || !!o.waktu); };
function grupLengkap(g){
  const j=D.grupJawab[g.id]||{}, ids=D.anggota[g.id]||[];
  if (g.jenis==='anakBersama') return j.punya!=null;
  if (barisTetap(g)) return ids.length>0 && ids.every(barisLengkap);
  if (j.punya==null) return false;
  return j.punya===false || (ids.length>0 && ids.every(barisLengkap));
}
const kurangDi = g => (D.anggota[g.id]||[]).filter(id=>!barisLengkap(id)).length;

// antrean urutan: dua almarhum sesudah pemilik yang tidak bisa diurutkan dari tahunnya
function antrean(){
  const o=D.orang, P=D.pemilik;
  const sesudah=Object.keys(o).filter(id=>id!==P && o[id].relatif===P && o[id].status==='wafat' && o[id].waktu==='sesudah');
  const tanpaTahun=sesudah.filter(id=>!tahunAngka(o[id].tahun));
  if (sesudah.length<2 || !tanpaTahun.length || 'urut' in D.jawab || D.tunda.includes('urut')) return [];
  const a=tanpaTahun[0], b=sesudah.find(x=>x!==a);
  return [{id:'urut', orang:a, judul:`${NAMA(a)} wafat sebelum atau sesudah ${NAMA(b)}${o[b].tahun?' ('+o[b].tahun+')':''}?`,
    kenapa:`Menentukan apakah ${NAMA(b)} ikut menerima bagian dari ${NAMA(a)}. Kalau tahun wafat ${NAMA(a)} diisi, pertanyaan ini tidak perlu.`,
    opsi:[['sebelum',`Sebelum ${NAMA(b)}`],['sesudah',`Sesudah ${NAMA(b)}`],['sama','Bersamaan, atau tidak tahu']]}];
}

function ringkasan(g){
  const ids=D.anggota[g.id]||[], j=D.grupJawab[g.id]||{};
  const isi = g.jenis==='anakBersama' ? (j.punya?'Sama dengan anak-anak '+NAMA(D.pemilik):'Tidak semua')
    : (!barisTetap(g) && j.punya===false) ? 'Tidak ada'
    : ids.map(id=>{const o=D.orang[id], n=o.nama||o.peran; return o.status==='wafat'?`${n} (wafat${o.tahun?' '+o.tahun:''})`:o.status==='tahu'?`${n} (belum tahu)`:n;}).join(', ');
  return `<div class="ringkas"><span class="cek"><svg class="ik"><use href="#i-cek"/></svg></span>
    <div class="isi"><b>${judulGrup(g)}</b><span>${isi}</span></div>
    <button class="aksi-teks" data-ubah="${g.id}" aria-label="Ubah ${judulGrup(g)}"><svg class="ik" style="width:15px;height:15px"><use href="#i-pensil"/></svg>Ubah</button></div>`;
}
function grupAktif(g){
  pastikanAnggota(g);
  const m=NAMA(g.milik), j=D.grupJawab[g.id]||(D.grupJawab[g.id]={}), ids=D.anggota[g.id]||[], mjk=D.orang[g.milik].jk;
  let tanya='', isi='', pengantar='', rinci='';
  if (awalCabang(g)) pengantar=`<p class="pengantar">${m} wafat sesudah ${NAMA(D.pemilik)}, sebelum hartanya dibagi. Jadi bagian ${m} nanti dibagi lagi ke keluarganya.</p>`;
  const yaTidak=(ya,tidak)=>`<div class="seg besar" data-punya="${g.id}" role="radiogroup"><button aria-pressed="${j.punya===true}" data-v="1">${ya}</button><button aria-pressed="${j.punya===false}" data-v="0">${tidak}</button></div>`;
  const hit=(jk,label)=>{const n=ids.filter(id=>D.orang[id].jk===jk).length; return `<label>${label}<span class="hitung"><button aria-label="kurangi ${label}" data-hitung="${g.id}|${jk}|-1"><svg class="ik"><use href="#i-min"/></svg></button><b aria-live="polite">${n}</b><button aria-label="tambah ${label}" data-hitung="${g.id}|${jk}|1"><svg class="ik"><use href="#i-plus"/></svg></button></span></label>`;};
  if (g.jenis==='pasangan'){
    tanya=`Waktu ${m} wafat, apakah beliau masih punya ${mjk==='L'?'istri':'suami'}?`;
    isi=yaTidak('Ya','Tidak') + (j.punya&&mjk==='L'?`<div class="hitung-baris">${hit('P','Berapa istri?')}</div>`:'');
    rinci=`<details class="rinci"><summary><svg class="ik"><use href="#i-kanan"/></svg>Sudah bercerai sebelum ${m} wafat?</summary><div>Tetap pilih "Ya", lalu buka ⋯ di baris pasangannya › Keadaan lain › Bercerai. Masa iddah ditanyakan di sana.</div></details>`;
  }
  if (g.jenis==='anak'||g.jenis==='saudara'){
    tanya=`${m} punya ${g.jenis}? Hitung juga yang sudah wafat.`;
    isi=yaTidak('Ya','Tidak') + (j.punya?`<div class="hitung-baris">${hit('L','Laki-laki')}${hit('P','Perempuan')}</div>`:'');
  }
  if (g.jenis==='orangTua') tanya=`Waktu ${m} wafat, apakah orang tuanya masih hidup?`;
  if (g.jenis==='kakekNenek') tanya=`Karena ${D.orang['ayah:'+g.milik]?.status==='wafat'?'ayah':'ibu'} ${m} sudah wafat, kakek atau neneknya juga perlu ditanyakan. Waktu ${m} wafat, apakah mereka masih hidup?`;
  if (g.jenis==='anakBersama'){
    const anakP=(D.anggota['anak:'+D.pemilik]||[]).map(NAMA);
    tanya=`Apakah ${anakP.join(', ')} juga anak ${m}?`;
    isi=yaTidak('Ya, semuanya','Tidak semua')+(j.punya===false?`<p class="pengantar">Di produk: centang siapa saja anak ${m}, lalu tanya apakah ${m} punya anak dari pernikahan lain.</p>`:'');
  }
  // kelompok yang disaring engine: alasan di balik Details, dengan jalan pintas tetap mengisi
  if (g.jenis==='anak' && g.milik===D.pemilik && j.punya && ids.some(id=>D.orang[id].jk==='L') && !D.tetapIsi[g.milik])
    rinci+=`<details class="rinci"><summary><svg class="ik"><use href="#i-kanan"/></svg>Kenapa saudara ${m} tidak ditanyakan?</summary><div>Saudara, keponakan, paman, dan sepupu tidak mendapat bagian selama ada anak laki-laki.<button class="aksi-teks" data-tetap="${g.milik}"><svg class="ik"><use href="#i-plus"/></svg>Tetap isi kerabat lain</button></div></details>`;
  if (g.jenis==='anak') ids.filter(id=>D.orang[id].status==='wafat'&&D.orang[id].waktu==='sebelum').forEach(id=>{
    rinci+=`<details class="rinci"><summary><svg class="ik"><use href="#i-kanan"/></svg>Kenapa anak-anak ${NAMA(id)} tidak ditanyakan?</summary><div>${NAMA(id)} wafat sebelum ${m}. Anak-anaknya (cucu ${m}) tidak mendapat bagian selama ada anak laki-laki ${m} yang masih hidup saat itu.<button class="aksi-teks"><svg class="ik"><use href="#i-plus"/></svg>Tetap isi anak-anak ${NAMA(id)}</button></div></details>`; });
  const masuk=g.id!==grupTerakhir; grupTerakhir=g.id;
  return `<section class="grup ${masuk?'masuk':''}" id="grup-aktif" aria-labelledby="judul-grup"><span class="label">${judulGrup(g)}</span>${pengantar}<h2 id="judul-grup">${tanya}</h2>${isi}${ids.map(barisOrang).join('')}${rinci}</section>`;
}
// kelompok terbuka dipegang D.buka: menjawab tidak memindahkan pengguna; pindah hanya lewat tombol utama atau "Ubah"
function grupTerbuka(){ const G=grupList(); const g=G.find(x=>x.id===D.buka) || G.find(x=>!grupLengkap(x)); if (g) D.buka=g.id; return g; }
function langkahBerikut(){
  const G=grupList(), buka=grupTerbuka();
  if (buka && !grupLengkap(buka)){

    return {label:`Lengkapi: ${judulGrup(buka)}`, status: belumJawab?'Jawab pertanyaan di atas dulu.':`<b>${kurangDi(buka)} baris</b> belum lengkap.`,

  }
  const nxt=G.find(g=>!grupLengkap(g));
  if (nxt) return {label:`Lanjut: ${judulGrup(nxt)}`, status:`${judulGrup(buka)} <b>sudah lengkap</b>.`, aksi:()=>{D.buka=nxt.id;D.tandai=null;gambar();document.getElementById('grup-aktif')?.scrollIntoView({behavior:'smooth',block:'center'});}};
  const q=antrean();
  if (q.length) return {label:'Jawab 1 pertanyaan urutan', status:'Semua keluarga sudah diisi. Tinggal urutan wafat.', aksi:()=>{dialog={q:q[0]};gambar();}};

}
function layarKeluarga(){
  const G=grupList(), buka=grupTerbuka(), L=langkahBerikut();
  const bagian=G.map(g=> g.id===buka?.id ? grupAktif(g) : grupLengkap(g) ? ringkasan(g) : '').join('');
  return `<div class="kanvas">
    <div class="tumpuk">
      ${!Object.keys(D.grupJawab).length?'<p class="redup">Wajar kalau tidak hafal semuanya. Pilih "Belum tahu" untuk yang ragu; nanti bisa ditanyakan ke keluarga.</p>':''}
      ${bagian}
    </div>

      <button class="aksi-teks pohon-penuh" onclick="this.closest('.kartu-pohon').classList.toggle('penuh')"><svg class="ik"><use href="#i-pohon"/></svg>Pohon lengkap</button></div></div>
      <p class="kecil redup" style="margin:10px 4px 0">Kamu salah satu dari keluarga ini? Buka ⋯ di barismu › Ini saya, supaya sebutan memakai sudut pandangmu.</p></aside>
  </div>
  ${barBawah(L.label,'lanjutKeluarga',L.status)}`;
}
function pasangKeluarga(){
  document.getElementById('lanjutKeluarga').onclick=langkahBerikut().aksi;
  document.querySelectorAll('[data-punya]').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const gid=s.dataset.punya, g=grupList().find(x=>x.id===gid), ya=b.dataset.v==='1';

    if (!ya){ (D.anggota[gid]||[]).forEach(id=>delete D.orang[id]); D.anggota[gid]=[]; }

// ---------- pohon ----------
function simpul(id,x,y){
  const o=D.orang[id]; if(!o) return ''; const st=o.status||'kosong', sorot=dialog&&dialog.q.orang===id;
  const nm=(o.nama||o.peran).replace('Anak laki-laki','Anak lk').replace('Anak perempuan','Anak pr').replace('Saudara laki-laki','Sdr lk').replace('Saudara perempuan','Sdr pr');
  const sub= st==='wafat'?(o.tahun||(o.waktu?`${o.waktu} ${NAMA(o.relatif).split(' ').pop()}`:'wafat')):st==='tahu'?'belum tahu':st==='kosong'?'belum diisi':(D.saya===id?'kamu':'hidup');
  return `<g class="n ${st} ${id===D.pemilik?'pemilik':''} ${sorot?'sorot':''}" transform="translate(${x-46},${y-20})">
    <rect width="92" height="40" rx="12" fill="${st==='hidup'?(WARNA[o.kel]||'#fff'):'#fff'}" stroke="${st==='hidup'?'rgba(0,0,0,.08)':''}"/>
    <text x="46" y="17" text-anchor="middle">${nm.length>13?nm.slice(0,12)+'…':nm}</text><text class="sub" x="46" y="31" text-anchor="middle">${sub.length>15?sub.slice(0,14)+'…':sub}</text></g>`;
}
const siku=(x1,y1,x2,y2)=>`<path class="garis" d="M${x1} ${y1} V${(y1+y2)/2} H${x2} V${y2}"/>`;
function pohon(){
  const P=D.pemilik, anak=D.anggota['anak:'+P]||[], pas=D.anggota['pas:'+P]||[], sdr=D.anggota['sdr:'+P]||[], ayah='ayah:'+P, ibu='ibu:'+P;
  if (!anak.length && !pas.length && !sdr.length && !D.orang[ayah])
    return `<div class="pohon-kosong">Pohon tumbuh di sini saat kamu mengisi.<svg viewBox="0 0 200 60" style="max-width:200px;margin:12px auto 0">${simpul(P,100,30)}</svg></div>`;
  const SLOT=108, yOT=30, yP=110, yA=210, yC=300;
  const lebarAnak=id=>Math.max(1+((D.anggota['pas:'+id]||[]).length?1:0),(D.anggota['anak:'+id]||[]).length);
  const totalAnak=anak.reduce((j,id)=>j+lebarAnak(id),0), barisP=[...sdr.slice(0,Math.ceil(sdr.length/2)),P,...sdr.slice(Math.ceil(sdr.length/2)),...pas];
  const lebar=Math.max(420,totalAnak*SLOT+20,barisP.length*SLOT+20);
  const tinggi=anak.some(id=>(D.anggota['anak:'+id]||[]).length)?340:anak.length?250:150;
  let s=`<svg viewBox="0 0 ${lebar} ${tinggi}" role="img" aria-label="Pohon keluarga ${NAMA(P)}">`;
  const x0=(lebar-barisP.length*SLOT)/2+SLOT/2, xP={}; barisP.forEach((id,i)=>xP[id]=x0+i*SLOT);
  if (D.orang[ayah]){ const sekandung=[P,...sdr], xt=sekandung.reduce((j,id)=>j+xP[id],0)/sekandung.length;
    s+=`<line class="garis" x1="${xt-56}" y1="${yOT}" x2="${xt+56}" y2="${yOT}"/>`; sekandung.forEach(id=>s+=siku(xt,yOT,xP[id],yP-20)); s+=simpul(ayah,xt-56,yOT)+simpul(ibu,xt+56,yOT); }
  pas.forEach(id=>s+=`<line class="garis" x1="${xP[P]+46}" y1="${yP}" x2="${xP[id]-46}" y2="${yP}"/>`);
  barisP.forEach(id=>s+=simpul(id,xP[id],yP));
  let kursor=(lebar-totalAnak*SLOT)/2; const xA=pas.length?(xP[P]+xP[pas[0]])/2:xP[P];
  anak.forEach(id=>{ const x=kursor+SLOT/2, ps=D.anggota['pas:'+id]||[], cu=D.anggota['anak:'+id]||[];
    s+=siku(xA,yP+20,x,yA-20)+simpul(id,x,yA);
    if (ps.length) s+=`<line class="garis" x1="${x+46}" y1="${yA}" x2="${x+SLOT-46}" y2="${yA}"/>`+simpul(ps[0],x+SLOT,yA);
    const xc0=ps.length?x+SLOT/2:x; cu.forEach((c,i)=>{const xc=kursor+SLOT/2+i*SLOT; s+=siku(xc0,yA+20,xc,yC-20)+simpul(c,xc,yC);});
    kursor+=lebarAnak(id)*SLOT; });
  return s+'</svg>';
}

// ---------- 4. Periksa: cerita atau linimasa, hanya fakta ----------
function peristiwa(){
  const o=D.orang, P=D.pemilik;
  const wafat=Object.keys(o).filter(id=>id!==P && o[id].status==='wafat' && o[id].relatif===P && (D.anggota['pas:'+P]||[]).concat(D.anggota['anak:'+P]||[],D.anggota['sdr:'+P]||[]).includes(id));
  const sebelum=wafat.filter(id=>o[id].waktu==='sebelum');
  let sesudah=wafat.filter(id=>o[id].waktu==='sesudah').sort((a,b)=>(tahunAngka(o[a].tahun)||9999)-(tahunAngka(o[b].tahun)||9999));
  if (D.jawab.urut==='sebelum'){ const a=antreanAwal(); if(a) sesudah=[a,...sesudah.filter(x=>x!==a)]; }
  if (D.urutanManual) sesudah.sort((a,b)=>D.urutanManual.indexOf(a)-D.urutanManual.indexOf(b));
  const tinggal=id=>{const ps=(D.anggota['pas:'+id]||[]).map(NAMA), an=(D.anggota['anak:'+id]||[]).filter(x=>o[x].waktu!=='sebelum').map(NAMA);  // yang wafat lebih dulu tidak "ditinggalkan"
    return [ps.length?`${o[id].jk==='L'?'istri':'suami'} ${ps.join(', ')}`:'', an.length?`anak ${an.join(', ')}`:''].filter(Boolean).join(' dan ');};
  const ev=sebelum.map(id=>({th:o[id].tahun||'?',teks:`${NAMA(id)} wafat, sebelum ${NAMA(P)}.`,id}));
  ev.push({th:o[P].tahun||'?',teks:`${NAMA(P)} wafat${tinggal(P)?', meninggalkan '+tinggal(P):''}.`,id:P,tetap:true});
  sesudah.forEach(id=>ev.push({th:o[id].tahun||'?',teks:`${NAMA(id)} wafat${tinggal(id)?', meninggalkan '+tinggal(id):''}.${D.tunda.includes('urut')&&!o[id].tahun?' <em>Urutannya belum dipastikan.</em>':''}`,id,geser:true}));
  return ev;
}
const antreanAwal=()=>{const o=D.orang; return Object.keys(o).find(id=>o[id].relatif===D.pemilik&&o[id].waktu==='sesudah'&&!tahunAngka(o[id].tahun));};
function layarPeriksa(){
  const o=D.orang, ev=peristiwa();
  const belum=[...Object.keys(o).filter(id=>o[id].status==='tahu').map(id=>`Waktu ${NAMA(o[id].relatif)} wafat, apakah ${o[id].nama||o[id].peran} masih hidup?`),
    ...(D.tunda.includes('urut')?[`${NAMA(antreanAwal())} wafat sebelum atau sesudah ${NAMA(ev.filter(e=>e.geser).map(e=>e.id).find(x=>x!==antreanAwal()))}?`]:[])];
  const hidup=Object.keys(o).filter(id=>o[id].status==='hidup').map(NAMA);
  const pesan=`Assalamu'alaikum. Aku sedang menghitung warisan ${NAMA(D.pemilik)}. Ada yang belum aku tahu:\n`+belum.map((b,i)=>`${i+1}. ${b}`).join('\n')+'\nTerima kasih.';
  const linimasa=D.tampilPeriksa==='linimasa';
  const daftar=`<div class="cerita">${ev.map((e,i)=>`<div class="th">${e.th}</div><div>${e.teks}</div><div class="geser">${linimasa&&e.geser?`<button aria-label="${NAMA(e.id)} lebih dulu" data-geser="${e.id}|-1" ${ev[i-1]?.tetap?'disabled':''}><svg class="ik"><use href="#i-atas"/></svg></button><button aria-label="${NAMA(e.id)} lebih akhir" data-geser="${e.id}|1" ${i===ev.length-1?'disabled':''}><svg class="ik"><use href="#i-bawah"/></svg></button>`:''}</div>`).join('')}
    ${linimasa?'':`<div class="th">Kini</div><div><b>Masih hidup sekarang:</b> ${hidup.join(', ')}.</div><div></div>`}</div>`;
  return `<div class="tumpuk" style="max-width:780px">
    ${belum.length?`<section class="kartu tumpuk"><h2 class="judul-kecil">Belum dipastikan (${belum.length})</h2>
      <p class="kecil redup">Hasil ditampilkan sebagai beberapa kemungkinan sampai ini jelas.</p>
      <div>${belum.map(b=>`<div class="belum"><span>${b}</span><button class="aksi-teks" onclick="ke(3)"><svg class="ik" style="width:15px;height:15px"><use href="#i-pensil"/></svg>Isi</button></div>`).join('')}</div>
      <button class="aksi-teks" style="align-self:flex-start" id="salinWA"><svg class="ik"><use href="#i-pesan"/></svg>Salin pertanyaan untuk keluarga</button><div class="wa" id="pratinjauWA" hidden>${pesan}</div></section>`:''}
    <section class="kartu tumpuk">
      <div class="deret" style="justify-content:space-between"><h2 class="judul-kecil">Ceritanya</h2>
        <div class="seg" id="tampilPeriksa" role="radiogroup" aria-label="Tampilan"><button aria-pressed="${!linimasa}" data-v="cerita">Cerita</button><button aria-pressed="${linimasa}" data-v="linimasa">Linimasa</button></div></div>
      ${linimasa?'<p class="kecil redup">Atur urutan wafat dengan panah, atau tambahkan peristiwa di antara kematian.</p>':''}
      ${daftar}
      ${linimasa?'<button class="aksi-teks" style="align-self:flex-start" id="tambahPeristiwa"><svg class="ik"><use href="#i-plus"/></svg>Tambah peristiwa: lahir, menikah, atau bercerai</button>':''}
    </section>
    <p class="kecil redup">Yang dibagi di sini harta ${NAMA(D.pemilik)}. Harta milik orang lain di cerita ini (kalau ada) dihitung terpisah.</p>
    ${barBawah(belum.length?'Hitung dengan kemungkinan':'Ya, benar. Hitung','lanjutPeriksa', belum.length?`<b>${belum.length} hal</b> belum dipastikan.`:'Semua sudah dipastikan.')}
  </div>`;
}
function pasangPeriksa(){
  document.getElementById('lanjutPeriksa').onclick=()=>ke(5);
  document.querySelectorAll('#tampilPeriksa button').forEach(b=>b.onclick=()=>{D.tampilPeriksa=b.dataset.v;gambar();});
  const s=document.getElementById('salinWA'); if(s) s.onclick=()=>{const p=document.getElementById('pratinjauWA');p.hidden=false;navigator.clipboard?.writeText(p.textContent).catch(()=>{});toast('Pertanyaan disalin. Tempel di WhatsApp keluarga.');};
  const t=document.getElementById('tambahPeristiwa'); if(t) t.onclick=()=>toast('Pilih lahir · menikah · bercerai, lalu letakkan di antara dua kematian.');

}

function aliranSvg(){
  const g=tahap, node=(x,y,t,a)=>`<g transform="translate(${x-38},${y-14})"><rect width="76" height="28" rx="9" fill="${a?'#fff':'#f1f4ee'}" stroke="${a?'var(--ink)':'#c9d4c6'}"/><text x="38" y="18" text-anchor="middle" style="font:600 11px var(--font-sans);fill:${a?'var(--ink)':'#5f6963'}">${t}</text></g>`, a=(d,on)=>`<path class="${on?'alir':'garis'}" d="${d}"/>`;
  return `<svg viewBox="0 0 360 196" role="img" aria-label="Aliran bagian tahap ${g}">${a('M180 34 C180 70 70 70 70 96',g===1)}${a('M180 34 C180 70 180 70 180 96',g===1)}${a('M180 34 C180 70 290 70 290 96',g===1)}${a('M108 110 L142 110',g===2)}${a('M70 96 C70 60 290 60 290 96',g===2)}${a('M180 124 C180 150 70 150 70 166',g===3)}${a('M180 124 C180 150 180 150 180 166',g===3)}${a('M180 124 C180 150 290 150 290 166',g===3)}
    ${node(180,22,'Mbah Karto',g===1)}${node(70,110,'Mbah Sumi',g<=2)}${node(180,110,'Budi',true)}${node(290,110,'Rina',g<=2)}${node(70,176,'Dewi',g===3)}${node(180,176,'Andi',g===3)}${node(290,176,'Sari',g===3)}</svg>`;
}

// ---------- contoh terisi ----------
function isiContoh(){
  const A=D.sk==='A'; D=awal(D.sk); D.jkDipilih=true; D.pintu=A?'lama':'baru';
  const isi=(gid,milik,daftar)=>{D.anggota[gid]=daftar.map(([id,nama,jk,kel,peran,status,waktu,tahun])=>{D.orang[id]={nama,jk,kel,peran,status,waktu:waktu||null,tahun:tahun||'',relatif:milik};return id;});};
  if (A){
    D.grupJawab={'pas:p':{punya:true},'anak:p':{punya:true},'bersama:sumi':{punya:true},'pas:budi':{punya:true},'anak:budi':{punya:true}};
    isi('pas:p','p',[['sumi','Mbah Sumi','P','pasangan','Istri 1','wafat','sesudah','']]);
    isi('anak:p','p',[['slamet','Slamet','L','keturunan','Anak laki-laki 1','wafat','sebelum','±1970'],['budi','Budi','L','keturunan','Anak laki-laki 2','wafat','sesudah','1998'],['rina','Rina','P','keturunan','Anak perempuan 1','hidup']]);
    isi('ot:p','p',[['ayah:p','','L','leluhur','Ayah Mbah Karto','wafat','sebelum'],['ibu:p','','P','leluhur','Ibu Mbah Karto','tahu']]);
    isi('kn:p','p',[['kakek:p','','L','leluhur','Kakek (ayah dari ayah)','wafat','sebelum']]);
    isi('ot:sumi','sumi',[['ayah:sumi','','L','leluhur','Ayah Mbah Sumi','wafat','sebelum'],['ibu:sumi','','P','leluhur','Ibu Mbah Sumi','wafat','sebelum']]);
    isi('pas:budi','budi',[['dewi','Dewi','P','pasangan','Istri 1','hidup']]);
    isi('anak:budi','budi',[['andi','Andi','L','keturunan','Anak laki-laki 1','hidup'],['sari','Sari','P','keturunan','Anak perempuan 1','hidup']]);
  } else {
    D.grupJawab={'pas:p':{punya:false},'anak:p':{punya:false},'sdr:p':{punya:true}};
    isi('ot:p','p',[['ayah:p','','L','leluhur','Ayah Budi','wafat','sebelum','2010'],['ibu:p','','P','leluhur','Ibu Budi','hidup']]);
    isi('kn:p','p',[['kakek:p','','L','leluhur','Kakek (ayah dari ayah)','wafat','sebelum']]);
    isi('sdr:p','p',[['andi','Andi','L','saudara','Saudara laki-laki 1','hidup'],['rina','Rina','P','saudara','Saudara perempuan 1','hidup']]);
  }
}

// ---------- umum ----------
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=t; document.body.append(el); setTimeout(()=>el.remove(),3200); }
function gambar(){
  gambarHero(); const l=document.getElementById('lembar');
  if (layar===1){ l.innerHTML=layarAlmarhum(); pasangAlmarhum(); }
  if (layar===2){ l.innerHTML=`<div class="kartu" style="max-width:640px"><p>Langkah Harta tidak berubah di konsep ini (tumpukan harta = Tahap 6).</p></div>${barBawah('Lanjut: Keluarga','lanjut2','')}`; document.getElementById('lanjut2').onclick=()=>ke(3); }
  if (layar===3){ l.innerHTML=layarKeluarga(); pasangKeluarga(); }
  if (layar===4){ l.innerHTML=layarPeriksa(); pasangPeriksa(); }
  if (layar===5){ l.innerHTML=layarHasil()+barBawah('Simpan','simpan',''); document.querySelectorAll('#tabTahap button').forEach(b=>b.onclick=()=>{tahap=+b.dataset.t;gambar();}); }
  const kb=document.getElementById('kembali'); if(kb) kb.onclick=()=>ke(Math.max(1,layar-1));
  gambarDialog();
}
const tandaiSaklar=(sel,b)=>document.querySelectorAll(sel+' button').forEach(x=>x.setAttribute('aria-pressed',x===b));
document.querySelectorAll('#pilihContoh button').forEach(b=>b.onclick=()=>{ D=awal(b.dataset.sk); layar=1; tahap=1; dialog=null; tandaiSaklar('#pilihContoh',b); tandaiSaklar('#pilihIsi',document.querySelector('#pilihIsi button')); gambar(); });
document.querySelectorAll('#pilihIsi button').forEach(b=>b.onclick=()=>{ if(b.dataset.isi==='contoh'){isiContoh(); layar=3;} else { D=awal(D.sk); layar=1; } tandaiSaklar('#pilihIsi',b); gambar(); });
document.querySelectorAll('#pilihLebar button').forEach(b=>b.onclick=()=>{ document.body.classList.toggle('hp',b.dataset.lebar==='hp'); tandaiSaklar('#pilihLebar',b); });
gambar();
</script>
