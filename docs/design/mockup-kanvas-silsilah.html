<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanvas Silsilah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&family=Parkinsans:wght@500;600&display=swap">
<style>
/* MOCKUP konsep "kanvas silsilah" untuk input munasakhat (brainstorm 2026-10-14).
   Token = apps/web/src/gaya/token.css + beranda.css (gaya Logivo). Angka di Hasil = contoh, dihitung tangan untuk jawaban bawaan. */
:root{
  --surface:#eef3e8;--surface-sunken:#e4ece1;--outline:#c9d4c6;--divider:#dfe6dc;
  --ink:#14181a;--ink-muted:#525c57;--primary:#0e0f10;--on-primary:#fff;--primary-soft:#dce8d8;
  --pasangan:#c3d4f6;--keturunan:#b5ead0;--leluhur:#d9c9f2;--saudara:#fbd3ac;
  --aksen:#f2682a;--aksen-soft:#fde6d8;--krem:#f6f2e9;--halaman:#b9d4c0;
  --kartu:rgba(255,255,255,.72);--kartu-tepi:rgba(255,255,255,.95);
  --font-display:"Parkinsans",system-ui,sans-serif;--font-sans:"Host Grotesk",system-ui,sans-serif;
  --shadow-pop:0 8px 24px rgba(20,40,30,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--halaman);color:var(--ink);font:400 15px/1.5 var(--font-sans)}
h1,h2,h3,p{margin:0}
button{font-family:inherit;color:inherit}
a,.tautan{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font-size:inherit}
:focus-visible{outline:3px solid var(--aksen);outline-offset:2px}
.ik{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.redup{color:var(--ink-muted)}
.kecil{font-size:13px}

/* bilah meta mockup (di luar aplikasi) */
.meta{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.meta b{font-weight:600}
.saklar{display:inline-flex;background:rgba(255,255,255,.6);border-radius:999px;padding:3px}
.saklar button{border:0;background:none;padding:6px 12px;border-radius:999px;font:600 13px var(--font-sans);cursor:pointer}
.saklar button[aria-pressed=true]{background:var(--primary);color:#fff}

.bingkai{max-width:1240px;margin:0 auto 40px;border-radius:30px;overflow:hidden;background:var(--krem);box-shadow:0 20px 50px rgba(20,40,30,.18);transition:max-width .35s}
body.hp .bingkai{max-width:390px}

/* hero */
.hero{color:#fff;padding:18px 28px 62px;background:radial-gradient(520px 300px at 80% 40%,rgba(255,150,40,.35),transparent 70%),radial-gradient(420px 260px at 8% 0%,rgba(60,210,170,.3),transparent 70%),linear-gradient(135deg,#0a2326 0%,#0f3a38 55%,#0b2a2b 100%)}
body.hp .hero{padding:16px 16px 56px}
.nav{display:flex;align-items:center;gap:10px;font:700 18px var(--font-sans)}
.nav i{width:24px;height:24px;border-radius:50%;background:var(--aksen);box-shadow:inset -6px -4px 0 rgba(0,0,0,.15)}
.stepper{display:flex;gap:30px;margin-top:26px;overflow-x:auto;scrollbar-width:none}
.stepper button{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:rgba(255,255,255,.8);font:600 14px var(--font-sans);cursor:pointer;padding:0;min-height:44px}
.stepper b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12)}
.stepper button[aria-current=step] b{background:#fff;color:var(--ink);box-shadow:0 0 0 3px #0b3433,0 0 0 5px #fff}
.stepper button.kelar b{background:#fff;color:var(--ink)}
body.hp .stepper span{display:none}
body.hp .stepper button[aria-current=step] span{display:inline}
.tanya-hero{font:500 clamp(28px,4vw,44px)/1.08 var(--font-display);letter-spacing:-.03em;margin-top:18px;max-width:22ch}
body.hp .tanya-hero{font-size:27px}
.sub-hero{margin-top:10px;color:rgba(255,255,255,.86);max-width:58ch}

.lembar{position:relative;margin-top:-30px;background:var(--krem);border-radius:36px 36px 0 0;padding:30px 28px 36px;min-height:520px}
body.hp .lembar{padding:24px 16px 28px}

/* kartu umum */
.kartu{background:var(--kartu);border:1px solid var(--kartu-tepi);border-radius:24px;padding:20px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.judul-kecil{font:600 17px var(--font-sans);letter-spacing:-.01em}
.tumpuk{display:flex;flex-direction:column;gap:16px}
.pil{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:0;background:var(--primary);color:#fff;font:600 15px var(--font-sans);cursor:pointer}
.pil:disabled{opacity:.35;cursor:not-allowed}
.bar-bawah{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}

/* pilihan kartu (radio) */
.pilihan{display:grid;gap:10px}
.pilihan.dua{grid-template-columns:repeat(2,minmax(0,1fr))}
body.hp .pilihan.dua{grid-template-columns:1fr}
.opsi{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:18px;border:1.5px solid var(--outline);background:#fff;cursor:pointer;font:500 15px var(--font-sans);transition:border-color .15s,background .15s}
.opsi:hover{border-color:#9fb19b}
.opsi small{display:block;color:var(--ink-muted);font-weight:400;font-size:13.5px;margin-top:2px}
.opsi .titik{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--outline);flex:none;margin-top:1px;display:grid;place-items:center}
.opsi[aria-checked=true]{border-color:var(--primary);background:#fff}
.opsi[aria-checked=true] .titik{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 4px #fff}
.cip{display:flex;flex-wrap:wrap;gap:8px}
.cip button{border:1.5px solid var(--outline);background:#fff;border-radius:999px;padding:8px 14px;font:500 14px var(--font-sans);cursor:pointer;min-height:40px}
.cip button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}

.isian{display:flex;flex-direction:column;gap:6px}
.isian>span{font-weight:600}
.isian input{font:500 16px var(--font-sans);padding:11px 14px;border-radius:14px;border:1.5px solid var(--outline);background:#fff;min-height:46px;width:100%}
.deret{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jangkar{border-left:0;background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

/* layar keluarga: kanvas */
.kanvas{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
body.hp .kanvas{grid-template-columns:1fr}
@media(max-width:860px){.kanvas{grid-template-columns:1fr}}
.kol-pohon{position:sticky;top:16px}
body.hp .kol-pohon{position:static;order:-1}
@media(max-width:860px){.kol-pohon{position:static;order:-1}}

.penunjuk{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--primary);color:#fff}
.penunjuk .angka{font:600 26px/1 var(--font-display);min-width:28px;text-align:center}
.penunjuk .teks{flex:1;font-weight:500}
.penunjuk .teks small{display:block;color:rgba(255,255,255,.75);font-weight:400}
.penunjuk .tautan{color:#fff;white-space:nowrap}
.penunjuk.beres{background:#dfeedd;color:var(--ink)}
.penunjuk.beres .tautan{color:var(--ink)}
.penenang{font-size:14px;color:var(--ink-muted);padding:0 4px}

.kelompok{display:flex;flex-direction:column;gap:8px}
.kepala-kel{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kepala-kel h3{font:600 14px var(--font-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.hitung{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--outline);border-radius:999px;padding:2px}
.hitung button{width:34px;height:34px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.hitung button:hover{background:var(--surface)}
.hitung b{min-width:26px;text-align:center;font-weight:700}
.tanya-hitung{font-size:14px;color:var(--ink)}

.orang{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 14px;background:#fff;border-radius:18px;border:1px solid var(--divider);transition:box-shadow .2s,border-color .2s}
.orang.sorot{border-color:var(--aksen);box-shadow:0 0 0 3px var(--aksen-soft)}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--font-sans);grid-row:span 2}
.ava.wafat{background:transparent!important;border:1.5px solid #9aa79a;color:var(--ink-muted)}
.ava.tahu{background:transparent!important;border:1.5px dashed #8d9a8a;color:var(--ink-muted)}
.nama-baris{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nama-baris b{font-weight:600}
.nama-baris .rel{font-size:13px;color:var(--ink-muted)}
.lencana-kamu{font:600 11px var(--font-sans);background:var(--aksen-soft);color:#9a3b0c;border-radius:999px;padding:2px 8px}
.status{display:flex;gap:6px;align-items:center;flex-wrap:wrap;grid-column:2}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 11px;font:500 13px var(--font-sans);cursor:pointer;color:var(--ink-muted);min-height:32px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.tahun{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.tahun input{width:74px;font:500 14px var(--font-sans);padding:5px 8px;border-radius:10px;border:1.5px solid var(--outline);background:#fff}
.catatan-orang{grid-column:2;font-size:13px;color:var(--ink-muted)}
.cabang{grid-column:1/-1;margin-top:4px}
.cabang>.tautan{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;padding:6px 0}
.cabang>.tautan .ik{transition:transform .2s}
.cabang>.tautan[aria-expanded=true] .ik{transform:rotate(90deg)}
.lencana-cabang{font:500 12px var(--font-sans);border:1px dashed #8d9a8a;border-radius:999px;padding:1px 8px;color:var(--ink-muted)}
.isi-cabang{margin:6px 0 2px 18px;padding-left:16px;border-left:2px solid var(--divider);display:flex;flex-direction:column;gap:14px}
.dilewati{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-muted);padding:10px 14px;border-radius:14px;background:var(--surface)}

/* pohon */
.kartu-pohon{padding:14px}
.kartu-pohon svg{display:block;width:100%;height:auto}
.pohon-penuh{display:none}
/* HP: pita ringkas di atas daftar (generasi yang sedang diisi), pohon lengkap lewat tautan */
body.hp .kartu-pohon:not(.penuh) .bungkus-pohon{max-height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
body.hp .kartu-pohon:not(.penuh) svg{width:150%;margin-left:-25%;margin-top:-60px}
body.hp .pohon-penuh{display:inline;font-size:13px}
.kaki-pohon{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-muted);padding:6px 6px 0}
.kaki-pohon i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.n rect{transition:fill .3s,stroke .3s}
.n text{font:600 12px var(--font-sans);fill:var(--ink)}
.n .sub{font:400 10.5px var(--font-sans);fill:var(--ink-muted)}
.n.wafat rect{fill:#fff;stroke:#9aa79a;stroke-width:1.2}
.n.wafat text{fill:var(--ink-muted)}
.n.tahu rect{fill:#fff;stroke:#7f8c7c;stroke-dasharray:4 3;stroke-width:1.3}
.n.lipat rect{fill:#fff;stroke:#7f8c7c;stroke-dasharray:4 3}
.n.sorot rect{stroke:var(--aksen);stroke-width:2.5;stroke-dasharray:none}
.n.pemilik rect{stroke:var(--ink);stroke-width:2}
.garis{stroke:#9fb19b;stroke-width:1.5;fill:none}
@media(prefers-reduced-motion:no-preference){
  .n.baru{animation:muncul .45s cubic-bezier(.2,.7,.2,1) both}
  @keyframes muncul{from{opacity:0;transform:translateY(-8px)}}
  .orang.baru{animation:muncul .4s cubic-bezier(.2,.7,.2,1) both}
  .n.sorot rect{animation:denyut 1.6s ease-in-out infinite}
  @keyframes denyut{50%{stroke-width:4}}
}

/* dialog antrean */
.latar{position:fixed;inset:0;background:rgba(10,30,28,.45);display:grid;place-items:end center;padding:16px;z-index:9}
@media(min-width:700px){.latar{place-items:center}}
/* desktop: dialog di kolom kiri supaya simpul yang ditanyakan tetap terlihat menyala di pohon */
@media(min-width:900px){body:not(.hp) .latar{place-items:center start;padding-left:max(24px,calc((100vw - 1240px)/2 + 28px));background:linear-gradient(90deg,rgba(10,30,28,.5) 55%,rgba(10,30,28,.08))}
  body:not(.hp) .dialog{width:min(520px,52vw)}}
.dialog{width:min(560px,100%);background:var(--krem);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
@media(prefers-reduced-motion:no-preference){.dialog{animation:naik .35s cubic-bezier(.2,.7,.2,1)}@keyframes naik{from{transform:translateY(24px);opacity:0}}}
.dialog .atas{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-muted)}
.titik-maju{display:flex;gap:5px}
.titik-maju i{width:22px;height:5px;border-radius:3px;background:var(--outline)}
.titik-maju i.isi{background:var(--primary)}
.dialog h2{font:500 24px/1.18 var(--font-display);letter-spacing:-.02em}
.alasan{display:flex;gap:8px;align-items:flex-start;font-size:14px;background:var(--aksen-soft);border-radius:14px;padding:10px 12px}
.tutup{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-sunken);cursor:pointer;display:grid;place-items:center}

/* periksa */
.cerita{display:grid;grid-template-columns:72px minmax(0,1fr);gap:0}
.cerita .th{font:600 14px var(--font-sans);color:var(--ink-muted);padding:12px 0;border-top:1px solid var(--divider)}
.cerita .ps{padding:12px 0;border-top:1px solid var(--divider)}
.cerita .ps .tautan{font-size:13px;margin-left:6px}
.cerita .th.kini,.cerita .ps.kini{font-weight:600;color:var(--ink)}
.belum{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--divider);flex-wrap:wrap}
.wa{white-space:pre-wrap;font-size:14px;background:#fff;border:1px solid var(--divider);border-radius:16px 16px 16px 4px;padding:12px 14px;max-width:440px}

/* hasil */
.pita{display:flex;height:18px;border-radius:999px;overflow:hidden;gap:2px}
.pita span{display:block}
.baris-hasil{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--divider)}
.baris-hasil .kiri{display:flex;gap:10px;align-items:center;min-width:0}
.baris-hasil i{width:12px;height:12px;border-radius:4px;flex:none}
.baris-hasil b{font-weight:600}
.baris-hasil .kanan{text-align:right;white-space:nowrap}
.dua-kol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
body.hp .dua-kol{grid-template-columns:1fr}
@media(max-width:860px){.dua-kol{grid-template-columns:1fr}}
.aliran .alir{stroke:var(--aksen);stroke-width:2.5;fill:none;stroke-dasharray:6 6}
@media(prefers-reduced-motion:no-preference){.aliran .alir{animation:alir 1.2s linear infinite}@keyframes alir{to{stroke-dashoffset:-24}}}
.gelombang{display:flex;gap:6px;flex-wrap:wrap}
.gelombang button{border:1.5px solid var(--outline);background:#fff;border-radius:999px;padding:6px 12px;font:600 13px var(--font-sans);cursor:pointer}
.gelombang button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:10}

/* revisi 2: jangkar diri, kenapa, kartu bertahap, mode lanjutan, tahap pembagian */
.spanduk{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:18px;background:#fff;border:1px solid var(--divider);font-size:14px}
.spanduk.aktif{border-color:var(--aksen);box-shadow:0 0 0 3px var(--aksen-soft)}
.ini-saya{grid-column:2;justify-self:start;border:1.5px solid var(--aksen);background:var(--aksen-soft);color:#7a2e08;border-radius:999px;padding:6px 14px;font:600 13px var(--font-sans);cursor:pointer;min-height:36px}
.kenapa{font-size:13.5px;color:var(--ink-muted);background:var(--surface);border-radius:12px;padding:8px 12px}
.bertahap{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:#fff;border:1.5px solid var(--outline)}
.bertahap .ikon-bulat{width:34px;height:34px;border-radius:50%;background:var(--keturunan);display:grid;place-items:center;flex:none}
.urutan-wafat{display:flex;flex-direction:column;gap:6px;counter-reset:u}
.urutan-wafat li{list-style:none;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--divider);border-radius:14px;padding:8px 10px}
.urutan-wafat li::before{counter-increment:u;content:counter(u);width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font:700 12px var(--font-sans);flex:none}
.urutan-wafat li span{flex:1}
.urutan-wafat button{width:34px;height:34px;border-radius:50%;border:1px solid var(--outline);background:#fff;cursor:pointer;display:grid;place-items:center}
.urutan-wafat button:disabled{opacity:.3;cursor:default}
.tanggal{font:500 13px var(--font-sans);padding:5px 8px;border-radius:10px;border:1.5px solid var(--outline);background:#fff}
.tab-tahap{display:flex;gap:6px;flex-wrap:wrap}
.tab-tahap button{border:1.5px solid var(--outline);background:#fff;border-radius:999px;padding:7px 14px;font:600 13.5px var(--font-sans);cursor:pointer;min-height:40px}
.tab-tahap button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}
.isi-tahap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
body.hp .isi-tahap{grid-template-columns:1fr}
@media(max-width:860px){.isi-tahap{grid-template-columns:1fr}}
.dibagi{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);font-weight:600}
.lanjut-tahap{font:500 12px var(--font-sans);color:#7a2e08;background:var(--aksen-soft);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap}
.istilah{font-size:13px;color:var(--ink-muted)}
.istilah b{font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-kanan" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-cek" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-pesan" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
  <symbol id="i-penting" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></symbol>
</svg>

<div class="meta">
  <b>Mockup kanvas silsilah</b>
  <span>Contoh:</span>
  <div class="saklar" id="pilihContoh">
    <button aria-pressed="true" data-sk="A">Kakek · turun-temurun</button>
    <button aria-pressed="false" data-sk="B">Kakak · baru wafat</button>
  </div>
  <div class="saklar" id="pilihLebar">
    <button aria-pressed="true" data-lebar="desktop">Desktop</button>
    <button aria-pressed="false" data-lebar="hp">HP</button>
  </div>
  <span class="redup">Semua bisa diklik. Angka di Hasil = contoh hitung tangan (ibu Mbah wafat lebih dulu; Mbah Sumi wafat di antara Mbah Karto dan Budi).</span>
</div>

</svg>

<script>
// MOCKUP revisi 2 (2026-10-14). Prinsip: halaman isian hanya memuat fakta yang diisi pengguna dan apa yang perlu diisi;
// siapa dapat / siapa terhalang baru di Hasil (alasan lewat tautan "Kenapa?"). Mode dasar vs lanjutan = kedalaman isian.
const WARNA = { pasangan:'var(--pasangan)', keturunan:'var(--keturunan)', leluhur:'var(--leluhur)', saudara:'var(--saudara)' };

function contohA(){
  return {
    pemilik:'karto', namaPemilik:'Mbah Karto', tahunPemilik:'1975', kira:true, pintu:null,
    orang:{
      ayahK:{nama:'Ayah Mbah Karto', kel:'leluhur', status:'wafat', tahun:'', lanjut:true},
      ibuK:{nama:'Ibu Mbah Karto', kel:'leluhur', status:'tahu'},
      karto:{nama:'Mbah Karto', kel:'pemilik', status:'wafat', tahun:'±1975'},
      sumi:{nama:'Mbah Sumi', kel:'pasangan', status:'wafat', tahun:''},
      slamet:{nama:'Slamet', kel:'keturunan', status:'wafat', tahun:'±1970'},
      budi:{nama:'Budi', kel:'keturunan', status:'wafat', tahun:'1998', cabang:true},
      rina:{nama:'Rina', kel:'keturunan', status:'hidup'},
      dewi:{nama:'Dewi', kel:'pasangan', status:'hidup'},
      andi:{nama:'Andi', kel:'keturunan', status:'hidup'},
      sari:{nama:'Sari', kel:'keturunan', status:'hidup'},
      joko:{nama:'Joko', kel:'keturunan', status:'hidup', lanjut:true},
    },
    rel:{ ayahK:'ayah Mbah Karto', ibuK:'ibu Mbah Karto', karto:'', sumi:'istri', slamet:'anak', budi:'anak', rina:'anak', dewi:'istri Budi', andi:'anak Budi', sari:'anak Budi', joko:'anak Slamet' },
    relSaya:{ andi:{ ayahK:'kakek buyutmu', ibuK:'nenek buyutmu', karto:'kakekmu', sumi:'nenekmu', slamet:'pamanmu', budi:'ayahmu', rina:'bibimu', dewi:'ibumu', andi:'kamu', sari:'saudarimu', joko:'sepupumu' } },
    anak:['slamet','budi','rina'], tambahan:0, cabangBuka:{}, urutan:['karto','sumi','budi'],
    antrean:[
      {id:'ibu', orang:'ibuK', judul:'Waktu Mbah Karto wafat (±1975), apakah ibunya masih hidup?',
       kenapa:'Ibu almarhum bisa mendapat bagian bila masih hidup saat itu.',
       opsi:[['hidup','Masih hidup'],['wafat','Sudah wafat lebih dulu']]},
      {id:'urut1', orang:'sumi', judul:'Mbah Sumi wafat sebelum atau sesudah Mbah Karto (±1975)?',
       kenapa:'Pasangan hanya mewarisi bila masih hidup saat almarhum wafat.',
       opsi:[['sebelum','Sebelum Mbah Karto'],['sesudah','Sesudah Mbah Karto'],['sama','Bersamaan, atau tidak tahu']]},
      {id:'urut2', orang:'sumi', judul:'Mbah Sumi wafat sebelum atau sesudah Budi (1998)?', syarat:'urut1',
       kenapa:'Menentukan apakah Budi ikut menerima dari Mbah Sumi.',
       opsi:[['sebelum','Sebelum Budi'],['sesudah','Sesudah Budi'],['sama','Bersamaan, atau tidak tahu']]},
    ],
    jawab:{}, tunda:[], saya:null, pilihSaya:false, mode:'dasar', bertahapTutup:false, kenapaBuka:{},
  };
}
function contohB(){
  return {
    pemilik:'budi', namaPemilik:'Budi', tahunPemilik:'2023', kira:false, pintu:null,
    orang:{
      ayah:{nama:'Ayah', kel:'leluhur', status:'wafat', tahun:'2010'},
      ibu:{nama:'Ibu', kel:'leluhur', status:'hidup'},
      budi:{nama:'Budi', kel:'pemilik', status:'wafat', tahun:'2023'},
      andi:{nama:'Andi', kel:'saudara', status:'hidup'},
      rina:{nama:'Rina', kel:'saudara', status:'hidup'},
    },
    rel:{ ayah:'ayah Budi', ibu:'ibu Budi', budi:'', andi:'saudara Budi', rina:'saudari Budi' },
    relSaya:{ andi:{ ayah:'ayahmu', ibu:'ibumu', budi:'kakakmu', andi:'kamu', rina:'saudarimu' } },
    menikah:false, anak:[], saudara:['andi','rina'], tambahan:0, cabangBuka:{}, urutan:['budi'],
    antrean:[], jawab:{}, tunda:[], saya:null, pilihSaya:false, mode:'dasar', kenapaBuka:{},
  };
}
let sk='A', D=contohA(), layar=1, dialog=null, tahap=1;

const rel = id => (D.saya && D.relSaya[D.saya]?.[id]) ?? D.rel[id] ?? '';
const nama = id => D.orang[id].nama;
const lanjutan = () => D.mode==='lanjutan';

// ---------- hero & stepper ----------
const LANGKAH = ['Almarhum','Harta','Keluarga','Periksa','Hasil'];
function gambarHero(){
  const st=document.getElementById('stepper');
  st.innerHTML=LANGKAH.map((n,i)=>`<button ${i+1===layar?'aria-current="step"':''} class="${i+1<layar?'kelar':''}" data-ke="${i+1}"><b>${i+1}</b><span>${n}</span></button>`).join('');
  st.querySelectorAll('button').forEach(b=>b.onclick=()=>ke(+b.dataset.ke));
  const sebut = D.saya && rel(D.pemilik) ? `${rel(D.pemilik)}, ${D.namaPemilik}` : D.namaPemilik;
  const H = {
    1:['Siapa yang wafat dan meninggalkan harta?','Mulai dari yang kamu ingat. Yang belum pasti boleh dikira-kira.'],
    2:['Harta apa yang ditinggalkan?','Langkah ini tidak berubah di konsep ini.'],
    3:[`Keluarga ${sebut} waktu beliau wafat`, lanjutan()?'Mode lanjutan: semua kelompok terbuka, tanggal dan urutan diatur sendiri.':'Isi yang kamu tahu. Sisanya kita tanyakan seperlunya.'],
    4:['Benar begini ceritanya?','Baca sekali. Kalau ada yang keliru, ketuk "ubah".'],
    5:[`Pembagian harta ${D.namaPemilik}`, sk==='A'?'Rumah peninggalan · Rp 1.200.000.000':'Tabungan · Rp 300.000.000'],
  }[layar];
  document.getElementById('tanyaHero').textContent=H[0];
  document.getElementById('subHero').textContent=H[1];
}
function ke(n){ layar=n; gambar(); window.scrollTo({top:0}); }

// ---------- 1. Almarhum ----------
function layarAlmarhum(){
  const pintu=[['baru','Belum, baru saja wafat','Biasanya beberapa bulan terakhir.'],['lama','Belum, sudah bertahun-tahun','Misalnya rumah yang masih ditempati keluarga.'],['sudah','Sudah pernah dibagi','Bagiannya sudah dihitung dan diserahkan ke masing-masing.'],['tahu','Tidak tahu','Kita tanyakan keadaan tiap orang, supaya aman.']];
  return `<div class="tumpuk" style="max-width:720px">
    <section class="kartu tumpuk">
      <label class="isian"><span>Nama almarhum</span><input id="namaPemilik" value="${D.namaPemilik}"></label>
      <div class="isian"><span>Kira-kira tahun berapa ${D.namaPemilik} wafat?</span>
        <div class="deret"><input style="max-width:120px" inputmode="numeric" value="${D.tahunPemilik}">
          <div class="seg" id="kira"><button aria-pressed="${!D.kira}">Pasti</button><button aria-pressed="${D.kira}">Kira-kira</button></div></div>
        <p class="kecil redup">Tidak ingat? Kosongkan saja. Yang penting nanti siapa wafat lebih dulu, bukan tanggalnya.</p></div>
    </section>
    <section class="kartu tumpuk">
      <h2 class="judul-kecil">Sejak ${D.namaPemilik} wafat, apakah hartanya sudah dibagi?</h2>
      <div class="pilihan dua" role="radiogroup" id="pintu">${pintu.map(([k,t,x])=>`<button class="opsi" role="radio" aria-checked="${D.pintu===k}" data-k="${k}"><span class="titik"></span><span>${t}<small>${x}</small></span></button>`).join('')}</div>
      ${D.pintu==='sudah'?`<p class="dilewati"><svg class="ik"><use href="#i-info"/></svg>Kalau sudah dibagi seluruhnya, yang perlu dihitung adalah harta orang yang wafat sesudahnya. Kalau baru sebagian, kami belum bisa menghitungnya otomatis; tanyakan ke ahli faraidh.</p>`:''}
    </section>
    <div class="bar-bawah"><a class="tautan">Kembali</a><button class="pil" id="lanjut1" ${D.pintu?'':'disabled'}>Lanjut</button></div>
    ${D.pintu?'':'<p class="kecil redup" style="text-align:right;margin-top:-16px">Jawab dulu pertanyaan "sudah dibagi". Tidak ada jawaban bawaan supaya tidak terlewat.</p>'}
  </div>`;
}
function pasangAlmarhum(){
  document.getElementById('namaPemilik').oninput=e=>{D.namaPemilik=e.target.value||'Almarhum';D.orang[D.pemilik].nama=D.namaPemilik;};
  document.querySelectorAll('#kira button').forEach((b,i)=>b.onclick=()=>{D.kira=i===1;gambar();});
  document.querySelectorAll('#pintu .opsi').forEach(b=>b.onclick=()=>{D.pintu=b.dataset.k;gambar();});
  document.getElementById('lanjut1').onclick=()=>ke(3);
}

// ---------- 3. Keluarga ----------
const berlaku = q => !q.syarat || D.jawab[q.syarat]==='sesudah' || !(q.syarat in D.jawab);
const sisaAntrean = () => lanjutan() && sk==='A' ? [] : D.antrean.filter(q=>berlaku(q) && !(q.id in D.jawab) && !D.tunda.includes(q.id));
const kenapa = (kunci, teks) => `<button class="tautan kecil" data-kenapa="${kunci}">Kenapa?</button>${D.kenapaBuka[kunci]?`<p class="kenapa">${teks}</p>`:''}`;

function barisOrang(id){
  const o=D.orang[id], st=o.status, inisial=o.nama.split(' ').map(x=>x[0]).join('').slice(0,2);
  const cabang = o.cabang && st==='wafat';
  const tglInput = lanjutan()
    ? `<label class="tahun">wafat <input class="tanggal" placeholder="hh/bb/tttt" value="${o.tahun||''}" data-tahun="${id}"></label>`
    : `<label class="tahun">tahun <input value="${o.tahun||''}" placeholder="±…" data-tahun="${id}"></label>`;
  return `<div class="orang" data-id="${id}">
    <span class="ava ${st}" style="background:${WARNA[o.kel]||'#fff'}">${inisial}</span>
    <div class="nama-baris"><b>${o.nama}</b><span class="rel">${rel(id)}</span>${D.saya===id?'<span class="lencana-kamu">kamu</span>':''}</div>
    <div class="status">
      <div class="seg" data-status="${id}">
        <button aria-pressed="${st==='hidup'}" data-v="hidup">Hidup</button><button aria-pressed="${st==='wafat'}" data-v="wafat">Wafat</button><button aria-pressed="${st==='tahu'}" data-v="tahu">Belum tahu</button>
      </div>
      ${st==='wafat'?tglInput:''}
      ${lanjutan()&&st==='hidup'?`<label class="tahun">lahir <input class="tanggal" placeholder="tahun" style="width:70px"></label>`:''}
      <button class="tautan kecil redup">Keadaan lain</button>
    </div>
    ${D.pilihSaya&&st==='hidup'?`<button class="ini-saya" data-saya="${id}">Ini saya</button>`:''}
    ${id==='slamet'&&!lanjutan()?`<p class="catatan-orang">Anak-anak Slamet tidak perlu diisi. ${kenapa('slamet','Slamet wafat sebelum Mbah Karto. Anak-anaknya (cucu Mbah) tidak mendapat bagian selama ada anak laki-laki Mbah yang masih hidup saat itu (Budi).')}</p>`:''}
    ${id==='slamet'&&lanjutan()?`<div class="cabang"><div class="isi-cabang"><div class="kelompok"><div class="kepala-kel"><h3>Anak Slamet</h3></div>${barisOrang('joko')}</div></div></div>`:''}
    ${cabang?`<div class="cabang">
      <button class="tautan" aria-expanded="${!!D.cabangBuka[id]}" data-cabang="${id}"><svg class="ik"><use href="#i-kanan"/></svg>Keluarga ${o.nama}: pasangan dan anak-anaknya <span class="lencana-cabang">3 orang</span></button>
      ${D.cabangBuka[id]?`<div class="isi-cabang">
        <div class="kelompok"><div class="kepala-kel"><h3>Pasangan</h3></div>${barisOrang('dewi')}</div>
        <div class="kelompok"><div class="kepala-kel"><h3>Anak</h3><span class="tanya-hitung">Berapa anak ${o.nama}, termasuk yang sudah wafat? ${hitung(2)}</span></div>${barisOrang('andi')}${barisOrang('sari')}</div>
      </div>`:''}
    </div>`:''}
  </div>`;
}
const hitung = (n, idT='', idK='') => `<span class="hitung"><button aria-label="kurangi" ${idK?`id="${idK}"`:''}><svg class="ik"><use href="#i-min"/></svg></button><b>${n}</b><button aria-label="tambah" ${idT?`id="${idT}"`:''}><svg class="ik"><use href="#i-plus"/></svg></button></span>`;

function penunjuk(){
  if (lanjutan()) return '';
  const sisa=sisaAntrean().length, tunda=D.tunda.length;
  if (!sisa) return `<div class="penunjuk beres"><svg class="ik"><use href="#i-cek"/></svg><span class="teks">Semua yang memengaruhi hasil sudah terjawab${tunda?`<small style="color:var(--ink-muted)">${tunda} menunggu jawaban keluarga, lihat di Periksa</small>`:''}</span></div>`;
  return `<div class="penunjuk"><span class="angka">${sisa}</span><span class="teks">hal lagi yang memengaruhi hasil${tunda?`<small>${tunda} menunggu jawaban keluarga</small>`:'<small>Yang tidak mengubah hasil tidak akan ditanyakan.</small>'}</span><button class="tautan" id="jawabSekarang">Jawab sekarang</button></div>`;
}
function spandukSaya(){
  if (D.saya==='lain') return '';
  if (D.saya) return `<div class="spanduk"><svg class="ik"><use href="#i-orang"/></svg><span>Kamu: <b>${nama(D.saya)}</b>. Sebutan di bawah memakai sudut pandangmu.</span><button class="tautan kecil" id="ubahSaya">Ubah</button></div>`;
  if (D.pilihSaya) return `<div class="spanduk aktif"><span>Ketuk <b>Ini saya</b> di barismu.</span><button class="tautan kecil" id="belumAda">Saya belum ada di sini</button><button class="tautan kecil" id="orangLain">Saya mengisi untuk orang lain</button><button class="tautan kecil redup" id="batalSaya">Batal</button></div>`;
  return `<div class="spanduk"><svg class="ik"><use href="#i-orang"/></svg><span>Kamu yang mana di sini? <span class="redup">Boleh dilewati.</span></span><button class="tautan kecil" id="pilihSaya">Tunjukkan</button></div>`;
}
function kartuBertahap(){
  if (sk!=='A' || D.bertahapTutup) return '';
  const lanjutWafat = ['budi'].concat(D.jawab.urut1==='sesudah'?['sumi']:[]).map(nama);
  return `<div class="bertahap"><span class="ikon-bulat"><svg class="ik"><use href="#i-tangga"/></svg></span><div class="tumpuk" style="gap:6px">
    <b>Pembagiannya nanti bertahap</b>
    <span class="kecil">${lanjutWafat.join(' dan ')} wafat sesudah ${D.namaPemilik}, sebelum hartanya dibagi. Jadi harta ${D.namaPemilik} dibagi dulu, lalu bagian ${lanjutWafat.length>1?'mereka':lanjutWafat[0]} dibagi lagi ke keluarganya. Karena itu kita juga perlu tahu keluarga ${lanjutWafat.join(' dan ')}.</span>
    <button class="tautan kecil" style="align-self:flex-start" id="tutupBertahap">Mengerti</button></div></div>`;
}
function panelUrutan(){
  if (!lanjutan() || sk!=='A') return '';
  const u=D.urutan;
  return `<section class="kartu tumpuk"><h2 class="judul-kecil">Urutan wafat</h2>
    <p class="kecil redup">Dari yang paling dulu. Terisi otomatis dari tanggal; atur sendiri bila tanggalnya tidak ada.</p>
    <ol class="urutan-wafat" style="margin:0;padding:0">${u.map((id,i)=>`<li><span><b>${nama(id)}</b> <span class="redup kecil">${D.orang[id].tahun||'tanggal kosong'}</span></span>
      <button aria-label="naikkan" data-naik="${i}" ${i<=1?'disabled':''}><svg class="ik"><use href="#i-atas"/></svg></button>
      <button aria-label="turunkan" data-turun="${i}" ${i===0||i===u.length-1?'disabled':''}><svg class="ik"><use href="#i-bawah"/></svg></button></li>`).join('')}</ol>
    <button class="tautan kecil" style="align-self:flex-start">Tandai dua orang wafat bersamaan</button></section>`;
}
function layarKeluarga(){
  const L=lanjutan();
  const kiri = sk==='A' ? `
    <div class="kelompok"><div class="kepala-kel"><h3>Orang tua Mbah Karto</h3></div>${L?barisOrang('ayahK'):''}${barisOrang('ibuK')}
      ${L?'':`<p class="kecil redup" style="padding-left:4px">Ayah, kakek, dan nenek Mbah Karto sudah wafat lebih dulu. <a>Ubah</a></p>`}</div>
    <div class="kelompok"><div class="kepala-kel"><h3>Pasangan</h3></div>${barisOrang('sumi')}</div>
    <div class="kelompok"><div class="kepala-kel"><h3>Anak</h3><span class="tanya-hitung">Berapa anak, termasuk yang sudah wafat? ${hitung(D.anak.length,'tambah','kurang')}</span></div>
      ${D.anak.map(barisOrang).join('')}</div>
    ${L?`<div class="kelompok"><div class="kepala-kel"><h3>Saudara Mbah Karto</h3><span class="tanya-hitung">Berapa saudara? ${hitung(0)}</span></div></div>
         <button class="tautan" style="align-self:flex-start">Tambah kerabat lain</button>`
       :`<p class="dilewati"><svg class="ik"><use href="#i-info"/></svg><span>Saudara, keponakan, paman, dan sepupu Mbah Karto tidak perlu diisi. ${kenapa('jauh','Mereka tidak mendapat bagian selama ada anak laki-laki Mbah (Budi). Mau tetap mengisi? Pakai mode lanjutan.')}</span></p>`}`
  : `
    <div class="kelompok"><div class="kepala-kel"><h3>Pasangan</h3></div>
      <div class="kartu tumpuk" style="padding:14px 16px;border-radius:18px;background:#fff"><span>Budi pernah menikah?</span>
      <div class="seg" id="menikah"><button aria-pressed="${D.menikah}">Ya</button><button aria-pressed="${!D.menikah}">Tidak</button></div></div></div>
    <div class="kelompok"><div class="kepala-kel"><h3>Anak</h3><span class="tanya-hitung">Berapa anak, termasuk yang sudah wafat? ${hitung(0)}</span></div></div>
    <div class="kelompok"><div class="kepala-kel"><h3>Orang tua</h3></div>${barisOrang('ayah')}${barisOrang('ibu')}
      <p class="kecil redup" style="padding-left:4px">Kakek Budi (ayah dari ayahnya) sudah wafat lebih dulu. <a>Ubah</a></p></div>
    <div class="kelompok"><div class="kepala-kel"><h3>Saudara</h3><span class="tanya-hitung">Berapa saudara Budi, termasuk yang sudah wafat? ${hitung(2)}</span></div>
      ${D.saudara.map(barisOrang).join('')}</div>
    ${L?`<button class="tautan" style="align-self:flex-start">Tambah kerabat lain</button>`
       :`<p class="dilewati"><svg class="ik"><use href="#i-info"/></svg><span>Paman, keponakan, dan sepupu Budi tidak perlu diisi. ${kenapa('jauhB','Mereka tidak mendapat bagian selama ada saudara laki-laki Budi (Andi).')}</span></p>`}`;
  const sisa=sisaAntrean().length;
  return `<div class="kanvas">
    <div class="tumpuk">
      <div class="deret" style="justify-content:space-between"><span class="kecil redup">${L?'Mode lanjutan':'Mode dasar'}</span><button class="tautan kecil" id="gantiMode">${L?'Kembali ke mode dasar':'Mode lanjutan'}</button></div>
      ${penunjuk()}
      ${L?'':'<p class="penenang">Wajar kalau tidak hafal semuanya. Isi yang kamu tahu; pilih "Belum tahu" untuk yang ragu.</p>'}
      ${spandukSaya()}
      ${kartuBertahap()}
      ${kiri}
      ${panelUrutan()}
      <div class="bar-bawah"><button class="tautan" onclick="ke(1)">Kembali</button><button class="pil" onclick="ke(4)" ${sisa?'disabled':''}>Lanjut ke Periksa</button></div>

function tahunKeUrutan(id, nilai){
  // tahun Mbah Sumi menjawab dua pertanyaan urutan sekaligus; yang tidak berpengaruh tidak ditanya
  if (id!=='sumi') return;
  const t=parseInt(String(nilai).replace(/\D/g,''),10); if(!t) return;
  if (t<1975) D.jawab.urut1='sebelum'; else { D.jawab.urut1='sesudah'; D.jawab.urut2 = t<1998?'sebelum':'sesudah'; }
}
// yang wafat sebelum pemilik tidak masuk urutan wafat (bukan ahli warisnya)
function sinkronUrutan(){
  if (sk!=='A') return;
  const ada=D.urutan.includes('sumi'), keluar=D.jawab.urut1==='sebelum';
  if (keluar&&ada) D.urutan=D.urutan.filter(x=>x!=='sumi');
  if (!keluar&&!ada) D.urutan.splice(D.jawab.urut2==='sesudah'?2:1,0,'sumi');
}

// ---------- pohon ----------
function simpul(id,x,y,ekstra=''){
  const o=D.orang[id], st=o.status, sorot=dialog && D.antrean[dialog.i]?.orang===id;
  const sub = st==='wafat' ? (o.tahun||'tahun ?') : st==='tahu' ? 'belum tahu' : (D.saya===id?'kamu':rel(id).split(' ·')[0]);
  return `<g class="n ${st} ${id===D.pemilik?'pemilik':''} ${sorot?'sorot':''} ${ekstra}" data-id="${id}" style="cursor:pointer" transform="translate(${x-46},${y-20})">
    <rect width="92" height="40" rx="12" fill="${st==='hidup'?(WARNA[o.kel]||'#fff'):'#fff'}" stroke="${st==='hidup'?'rgba(0,0,0,.08)':''}"/>
    <text x="46" y="17" text-anchor="middle">${o.nama.length>13?o.nama.slice(0,12)+'…':o.nama}</text>
    <text class="sub" x="46" y="31" text-anchor="middle">${sub.length>15?sub.slice(0,14)+'…':sub}</text></g>`;
}
const siku=(x1,y1,x2,y2)=>`<path class="garis" d="M${x1} ${y1} V${(y1+y2)/2} H${x2} V${y2}"/>`;
function pohon(){
  if (sk==='B') return `<svg viewBox="0 0 420 200" role="img" aria-label="Pohon keluarga Budi">
      <line class="garis" x1="152" y1="40" x2="268" y2="40"/>${siku(210,40,90,140)}${siku(210,40,210,140)}${siku(210,40,330,140)}
      ${simpul('ayah',106,40)}${simpul('ibu',314,40)}${simpul('budi',90,140)}${simpul('andi',210,140)}${simpul('rina',330,140)}</svg>`;
  // satu slot per anak, Budi dua slot (dirinya + Dewi) supaya pasangan tidak menimpa saudaranya
  const anak=D.anak, SLOT=108, slot=id=>id==='budi'?2:1, total=anak.reduce((j,id)=>j+slot(id),0);
  const lebar=Math.max(420,total*SLOT+20); let kursor=(lebar-total*SLOT)/2;
  const xs=anak.map(id=>{const x=kursor+SLOT/2; kursor+=slot(id)*SLOT; return x;});
  const xBudi=xs[anak.indexOf('budi')], xD=xBudi+SLOT, xK=lebar/2-60, xS=lebar/2+60, tengah=(xBudi+xD)/2;
  let s=`<svg viewBox="0 0 ${lebar} 330" role="img" aria-label="Pohon keluarga Mbah Karto">`;
  s+=`<line class="garis" x1="${xK}" y1="110" x2="${xS}" y2="110"/>${siku(xK,40,xK,90)}`;
  anak.forEach((id,i)=>s+=siku(lebar/2,110,xs[i],190));
  s+=`<line class="garis" x1="${xBudi+46}" y1="210" x2="${xD-46}" y2="210"/>`+siku(tengah,210,tengah-56,280)+siku(tengah,210,tengah+56,280);
  if (lanjutan()) { const xSl=xs[anak.indexOf('slamet')]; s+=siku(xSl,230,xSl,270)+simpul('joko',xSl,290); }
  s+=simpul('ibuK',xK,30)+simpul('karto',xK,110)+simpul('sumi',xS,110);
  anak.forEach((id,i)=>s+=simpul(id,xs[i],210,id.startsWith('baru')?'baru':''));
  return s+simpul('dewi',xD,210)+simpul('andi',tengah-56,290)+simpul('sari',tengah+56,290)+'</svg>';
}

function ceritaA(){
  const ibu=D.orang.ibuK.status, u1=D.jawab.urut1, u2=D.jawab.urut2;
  const r=[['±1970','Slamet wafat.']];
  if (u1==='sebelum') r.push(['?','Mbah Sumi wafat, sebelum Mbah Karto.']);
  r.push(['±1975',`Mbah Karto wafat, meninggalkan ${u1==='sebelum'?'':'istri Mbah Sumi dan '}anak Budi dan Rina${ibu==='hidup'?', juga ibunya':''}.${ibu==='tahu'?' <em>Ibunya masih hidup atau tidak: belum dipastikan.</em>':''}`]);
  if (u1==='sesudah' && u2!=='sesudah') r.push(['?','Mbah Sumi wafat, sesudah Mbah Karto dan sebelum Budi.']);
  if (!u1 || u1==='sama') r.push(['?','Mbah Sumi wafat. <em>Urutannya belum dipastikan.</em>']);
  r.push(['1998','Budi wafat, meninggalkan istri Dewi dan anak Andi dan Sari.']);
  if (u1==='sesudah' && u2==='sesudah') r.push(['?','Mbah Sumi wafat, sesudah Budi.']);

  r.push(['Kini',`Masih hidup sekarang: ${hidup.join(', ')}.`]);
  return r;
}
