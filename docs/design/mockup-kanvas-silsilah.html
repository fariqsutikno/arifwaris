<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanvas Silsilah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&family=Parkinsans:wght@500;600&display=swap">
<style>
/* MOCKUP konsep "kanvas silsilah" untuk input munasakhat (brainstorm 2026-10-14).
   Token = apps/web/src/gaya/token.css + beranda.css (gaya Logivo). Angka di Hasil = contoh, dihitung tangan untuk jawaban bawaan. */
:root{
  --surface:#eef3e8;--surface-sunken:#e4ece1;--outline:#c9d4c6;--divider:#dfe6dc;
  --ink:#14181a;--ink-muted:#525c57;--primary:#0e0f10;--on-primary:#fff;--primary-soft:#dce8d8;
  --pasangan:#c3d4f6;--keturunan:#b5ead0;--leluhur:#d9c9f2;--saudara:#fbd3ac;
  --aksen:#f2682a;--aksen-soft:#fde6d8;--krem:#f6f2e9;--halaman:#b9d4c0;
  --kartu:rgba(255,255,255,.72);--kartu-tepi:rgba(255,255,255,.95);
  --font-display:"Parkinsans",system-ui,sans-serif;--font-sans:"Host Grotesk",system-ui,sans-serif;
  --shadow-pop:0 8px 24px rgba(20,40,30,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--halaman);color:var(--ink);font:400 15px/1.5 var(--font-sans)}
h1,h2,h3,p{margin:0}
button{font-family:inherit;color:inherit}
a,.tautan{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font-size:inherit}
:focus-visible{outline:3px solid var(--aksen);outline-offset:2px}
.ik{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.redup{color:var(--ink-muted)}
.kecil{font-size:13px}

/* bilah meta mockup (di luar aplikasi) */
.meta{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.meta b{font-weight:600}
.saklar{display:inline-flex;background:rgba(255,255,255,.6);border-radius:999px;padding:3px}
.saklar button{border:0;background:none;padding:6px 12px;border-radius:999px;font:600 13px var(--font-sans);cursor:pointer}
.saklar button[aria-pressed=true]{background:var(--primary);color:#fff}

.bingkai{max-width:1240px;margin:0 auto 40px;border-radius:30px;overflow:hidden;background:var(--krem);box-shadow:0 20px 50px rgba(20,40,30,.18);transition:max-width .35s}
body.hp .bingkai{max-width:390px}

/* hero */
.hero{color:#fff;padding:18px 28px 62px;background:radial-gradient(520px 300px at 80% 40%,rgba(255,150,40,.35),transparent 70%),radial-gradient(420px 260px at 8% 0%,rgba(60,210,170,.3),transparent 70%),linear-gradient(135deg,#0a2326 0%,#0f3a38 55%,#0b2a2b 100%)}
body.hp .hero{padding:16px 16px 56px}
.nav{display:flex;align-items:center;gap:10px;font:700 18px var(--font-sans)}
.nav i{width:24px;height:24px;border-radius:50%;background:var(--aksen);box-shadow:inset -6px -4px 0 rgba(0,0,0,.15)}
.stepper{display:flex;gap:30px;margin-top:26px;overflow-x:auto;scrollbar-width:none}
.stepper button{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:rgba(255,255,255,.8);font:600 14px var(--font-sans);cursor:pointer;padding:0;min-height:44px}
.stepper b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12)}
.stepper button[aria-current=step] b{background:#fff;color:var(--ink);box-shadow:0 0 0 3px #0b3433,0 0 0 5px #fff}
.stepper button.kelar b{background:#fff;color:var(--ink)}
body.hp .stepper span{display:none}
body.hp .stepper button[aria-current=step] span{display:inline}
.tanya-hero{font:500 clamp(28px,4vw,44px)/1.08 var(--font-display);letter-spacing:-.03em;margin-top:18px;max-width:22ch}
body.hp .tanya-hero{font-size:27px}
.sub-hero{margin-top:10px;color:rgba(255,255,255,.86);max-width:58ch}

.lembar{position:relative;margin-top:-30px;background:var(--krem);border-radius:36px 36px 0 0;padding:30px 28px 36px;min-height:520px}
body.hp .lembar{padding:24px 16px 28px}

/* kartu umum */
.kartu{background:var(--kartu);border:1px solid var(--kartu-tepi);border-radius:24px;padding:20px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.judul-kecil{font:600 17px var(--font-sans);letter-spacing:-.01em}
.tumpuk{display:flex;flex-direction:column;gap:16px}
.pil{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:0;background:var(--primary);color:#fff;font:600 15px var(--font-sans);cursor:pointer}
.pil:disabled{opacity:.35;cursor:not-allowed}
.bar-bawah{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}

/* pilihan kartu (radio) */
.pilihan{display:grid;gap:10px}
.pilihan.dua{grid-template-columns:repeat(2,minmax(0,1fr))}
body.hp .pilihan.dua{grid-template-columns:1fr}
.opsi{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px 16px;border-radius:18px;border:1.5px solid var(--outline);background:#fff;cursor:pointer;font:500 15px var(--font-sans);transition:border-color .15s,background .15s}
.opsi:hover{border-color:#9fb19b}
.opsi small{display:block;color:var(--ink-muted);font-weight:400;font-size:13.5px;margin-top:2px}
.opsi .titik{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--outline);flex:none;margin-top:1px;display:grid;place-items:center}
.opsi[aria-checked=true]{border-color:var(--primary);background:#fff}
.opsi[aria-checked=true] .titik{border-color:var(--primary);background:var(--primary);box-shadow:inset 0 0 0 4px #fff}
.cip{display:flex;flex-wrap:wrap;gap:8px}
.cip button{border:1.5px solid var(--outline);background:#fff;border-radius:999px;padding:8px 14px;font:500 14px var(--font-sans);cursor:pointer;min-height:40px}
.cip button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff}

.isian{display:flex;flex-direction:column;gap:6px}
.isian>span{font-weight:600}
.isian input{font:500 16px var(--font-sans);padding:11px 14px;border-radius:14px;border:1.5px solid var(--outline);background:#fff;min-height:46px;width:100%}
.deret{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.jangkar{border-left:0;background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

/* layar keluarga: kanvas */
.kanvas{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;align-items:start}
body.hp .kanvas{grid-template-columns:1fr}
@media(max-width:860px){.kanvas{grid-template-columns:1fr}}
.kol-pohon{position:sticky;top:16px}
body.hp .kol-pohon{position:static;order:-1}
@media(max-width:860px){.kol-pohon{position:static;order:-1}}

.penunjuk{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--primary);color:#fff}
.penunjuk .angka{font:600 26px/1 var(--font-display);min-width:28px;text-align:center}
.penunjuk .teks{flex:1;font-weight:500}
.penunjuk .teks small{display:block;color:rgba(255,255,255,.75);font-weight:400}
.penunjuk .tautan{color:#fff;white-space:nowrap}
.penunjuk.beres{background:#dfeedd;color:var(--ink)}
.penunjuk.beres .tautan{color:var(--ink)}
.penenang{font-size:14px;color:var(--ink-muted);padding:0 4px}

.kelompok{display:flex;flex-direction:column;gap:8px}
.kepala-kel{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kepala-kel h3{font:600 14px var(--font-sans);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted)}
.hitung{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1.5px solid var(--outline);border-radius:999px;padding:2px}
.hitung button{width:34px;height:34px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.hitung button:hover{background:var(--surface)}
.hitung b{min-width:26px;text-align:center;font-weight:700}
.tanya-hitung{font-size:14px;color:var(--ink)}

.orang{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 14px;background:#fff;border-radius:18px;border:1px solid var(--divider);transition:box-shadow .2s,border-color .2s}
.orang.sorot{border-color:var(--aksen);box-shadow:0 0 0 3px var(--aksen-soft)}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--font-sans);grid-row:span 2}
.ava.wafat{background:transparent!important;border:1.5px solid #9aa79a;color:var(--ink-muted)}
.ava.tahu{background:transparent!important;border:1.5px dashed #8d9a8a;color:var(--ink-muted)}
.nama-baris{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nama-baris b{font-weight:600}
.nama-baris .rel{font-size:13px;color:var(--ink-muted)}
.lencana-kamu{font:600 11px var(--font-sans);background:var(--aksen-soft);color:#9a3b0c;border-radius:999px;padding:2px 8px}
.status{display:flex;gap:6px;align-items:center;flex-wrap:wrap;grid-column:2}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 11px;font:500 13px var(--font-sans);cursor:pointer;color:var(--ink-muted);min-height:32px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.tahun{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.tahun input{width:74px;font:500 14px var(--font-sans);padding:5px 8px;border-radius:10px;border:1.5px solid var(--outline);background:#fff}
.catatan-orang{grid-column:2;font-size:13px;color:var(--ink-muted)}
.cabang{grid-column:1/-1;margin-top:4px}
.cabang>.tautan{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;padding:6px 0}
.cabang>.tautan .ik{transition:transform .2s}
.cabang>.tautan[aria-expanded=true] .ik{transform:rotate(90deg)}
.lencana-cabang{font:500 12px var(--font-sans);border:1px dashed #8d9a8a;border-radius:999px;padding:1px 8px;color:var(--ink-muted)}
.isi-cabang{margin:6px 0 2px 18px;padding-left:16px;border-left:2px solid var(--divider);display:flex;flex-direction:column;gap:14px}
.dilewati{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-muted);padding:10px 14px;border-radius:14px;background:var(--surface)}

/* pohon */
.kartu-pohon{padding:14px}
.kartu-pohon svg{display:block;width:100%;height:auto}
.pohon-penuh{display:none}
/* HP: pita ringkas di atas daftar (generasi yang sedang diisi), pohon lengkap lewat tautan */
body.hp .kartu-pohon:not(.penuh) .bungkus-pohon{max-height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
body.hp .kartu-pohon:not(.penuh) svg{width:150%;margin-left:-25%;margin-top:-60px}
body.hp .pohon-penuh{display:inline;font-size:13px}
.kaki-pohon{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-muted);padding:6px 6px 0}
.kaki-pohon i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.n rect{transition:fill .3s,stroke .3s}
.n text{font:600 12px var(--font-sans);fill:var(--ink)}
.n .sub{font:400 10.5px var(--font-sans);fill:var(--ink-muted)}
.n.wafat rect{fill:#fff;stroke:#9aa79a;stroke-width:1.2}
.n.wafat text{fill:var(--ink-muted)}
.n.tahu rect{fill:#fff;stroke:#7f8c7c;stroke-dasharray:4 3;stroke-width:1.3}
.n.lipat rect{fill:#fff;stroke:#7f8c7c;stroke-dasharray:4 3}
.n.sorot rect{stroke:var(--aksen);stroke-width:2.5;stroke-dasharray:none}
.n.pemilik rect{stroke:var(--ink);stroke-width:2}
.garis{stroke:#9fb19b;stroke-width:1.5;fill:none}
@media(prefers-reduced-motion:no-preference){
  .n.baru{animation:muncul .45s cubic-bezier(.2,.7,.2,1) both}
  @keyframes muncul{from{opacity:0;transform:translateY(-8px)}}
  .orang.baru{animation:muncul .4s cubic-bezier(.2,.7,.2,1) both}
  .n.sorot rect{animation:denyut 1.6s ease-in-out infinite}
  @keyframes denyut{50%{stroke-width:4}}
}

/* dialog antrean */
.latar{position:fixed;inset:0;background:rgba(10,30,28,.45);display:grid;place-items:end center;padding:16px;z-index:9}
@media(min-width:700px){.latar{place-items:center}}
/* desktop: dialog di kolom kiri supaya simpul yang ditanyakan tetap terlihat menyala di pohon */
@media(min-width:900px){body:not(.hp) .latar{place-items:center start;padding-left:max(24px,calc((100vw - 1240px)/2 + 28px));background:linear-gradient(90deg,rgba(10,30,28,.5) 55%,rgba(10,30,28,.08))}
  body:not(.hp) .dialog{width:min(520px,52vw)}}
.dialog{width:min(560px,100%);background:var(--krem);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
@media(prefers-reduced-motion:no-preference){.dialog{animation:naik .35s cubic-bezier(.2,.7,.2,1)}@keyframes naik{from{transform:translateY(24px);opacity:0}}}
.dialog .atas{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-muted)}
.titik-maju{display:flex;gap:5px}
.titik-maju i{width:22px;height:5px;border-radius:3px;background:var(--outline)}
.titik-maju i.isi{background:var(--primary)}
.dialog h2{font:500 24px/1.18 var(--font-display);letter-spacing:-.02em}
.alasan{display:flex;gap:8px;align-items:flex-start;font-size:14px;background:var(--aksen-soft);border-radius:14px;padding:10px 12px}
.tutup{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-sunken);cursor:pointer;display:grid;place-items:center}

/* periksa */
.cerita{display:grid;grid-template-columns:72px minmax(0,1fr);gap:0}
.cerita .th{font:600 14px var(--font-sans);color:var(--ink-muted);padding:12px 0;border-top:1px solid var(--divider)}
.cerita .ps{padding:12px 0;border-top:1px solid var(--divider)}
.cerita .ps .tautan{font-size:13px;margin-left:6px}
.cerita .th.kini,.cerita .ps.kini{font-weight:600;color:var(--ink)}
.belum{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--divider);flex-wrap:wrap}
.wa{white-space:pre-wrap;font-size:14px;background:#fff;border:1px solid var(--divider);border-radius:16px 16px 16px 4px;padding:12px 14px;max-width:440px}

/* hasil */
.pita{display:flex;height:18px;border-radius:999px;overflow:hidden;gap:2px}
.pita span{display:block}
.baris-hasil{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--divider)}
.baris-hasil .kiri{display:flex;gap:10px;align-items:center;min-width:0}
.baris-hasil i{width:12px;height:12px;border-radius:4px;flex:none}
.baris-hasil b{font-weight:600}
.baris-hasil .kanan{text-align:right;white-space:nowrap}
.dua-kol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
body.hp .dua-kol{grid-template-columns:1fr}
@media(max-width:860px){.dua-kol{grid-template-columns:1fr}}
.aliran .alir{stroke:var(--aksen);stroke-width:2.5;fill:none;stroke-dasharray:6 6}
@media(prefers-reduced-motion:no-preference){.aliran .alir{animation:alir 1.2s linear infinite}@keyframes alir{to{stroke-dashoffset:-24}}}
.gelombang{display:flex;gap:6px;flex-wrap:wrap}
.gelombang button{border:1.5px solid var(--outline);background:#fff;border-radius:999px;padding:6px 12px;font:600 13px var(--font-sans);cursor:pointer}
.gelombang button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:10}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-kanan" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-cek" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-pesan" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></symbol>
  <symbol id="i-penting" viewBox="0 0 24 24"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/></symbol>
</svg>

<div class="meta">
  <b>Mockup kanvas silsilah</b>
  <span>Contoh:</span>
  <div class="saklar" id="pilihContoh">
    <button aria-pressed="true" data-sk="A">Kakek · turun-temurun</button>
    <button aria-pressed="false" data-sk="B">Kakak · baru wafat</button>
  </div>
  <div class="saklar" id="pilihLebar">
    <button aria-pressed="true" data-lebar="desktop">Desktop</button>
    <button aria-pressed="false" data-lebar="hp">HP</button>
  </div>
  <span class="redup">Semua bisa diklik. Angka di Hasil = contoh hitung tangan untuk jawaban bawaan.</span>
</div>

<div class="bingkai">
  <header class="hero">
    <div class="nav"><i></i>Arif Waris</div>
    <nav class="stepper" id="stepper" aria-label="Langkah"></nav>
    <h1 class="tanya-hero" id="tanyaHero"></h1>
    <p class="sub-hero" id="subHero"></p>
  </header>
  <main class="lembar" id="lembar"></main>
</div>
<div id="lapisan"></div>

<script>
// ---------- data contoh ----------
const WARNA = { pasangan:'var(--pasangan)', keturunan:'var(--keturunan)', leluhur:'var(--leluhur)', saudara:'var(--saudara)' };
function contohA(){
  return {
    pemilik:'karto', siapamu:'Kakek', namaPemilik:'Mbah Karto', tahunPemilik:'1975', kira:true, pintu:null,
    orang:{
      ibuK:{nama:'Ibu Mbah Karto', rel:'ibu Mbah Karto', kel:'leluhur', status:'tahu'},
      karto:{nama:'Mbah Karto', rel:'kakekmu', kel:'pemilik', status:'wafat', tahun:'±1975'},
      sumi:{nama:'Mbah Sumi', rel:'istri', kel:'pasangan', status:'wafat', tahun:''},
      slamet:{nama:'Slamet', rel:'anak', kel:'keturunan', status:'wafat', tahun:'±1970', sebelum:true},
      budi:{nama:'Budi', rel:'anak · ayahmu', kel:'keturunan', status:'wafat', tahun:'1998', cabang:['dewi','andi','sari']},
      rina:{nama:'Rina', rel:'anak', kel:'keturunan', status:'hidup'},
      dewi:{nama:'Dewi', rel:'istri Budi', kel:'pasangan', status:'hidup'},
      andi:{nama:'Andi', rel:'anak Budi', kel:'keturunan', status:'hidup', kamu:true},
      sari:{nama:'Sari', rel:'anak Budi', kel:'keturunan', status:'hidup'},
    },
    anak:['slamet','budi','rina'], tambahan:0, cabangBuka:{budi:false},
    antrean:[
      {id:'ibu', orang:'ibuK', judul:'Waktu Mbah Karto wafat (±1975), apakah ibunya masih hidup?',
       alasan:'Penting: bisa mengubah bagian semua anak Mbah Karto.',
       opsi:[['hidup','Masih hidup'],['wafat','Sudah wafat lebih dulu']]},
      {id:'urut', orang:'sumi', judul:'Siapa yang wafat lebih dulu: Mbah Sumi atau Budi?',
       alasan:'Penting: bisa mengubah bagian Dewi, Andi, dan Sari. Tahun wafat Mbah Sumi belum diisi.',
       opsi:[['sumi','Mbah Sumi lebih dulu'],['budi','Budi lebih dulu'],['sama','Bersamaan, atau tidak tahu']]},
      {id:'lahir', orang:'sari', judul:'Waktu Mbah Karto wafat (±1975), Sari sudah lahir?',
       alasan:'Penting: kalau sudah ada saat itu, Sari bisa ikut menerima langsung dari Mbah.',
       opsi:[['belum','Belum, lahir sesudahnya'],['sudah','Sudah lahir, atau sedang dikandung']]},
    ],
    jawab:{}, tunda:[],
  };
}
function contohB(){

// ---------- pohon (SVG, tata letak tangan per contoh) ----------
function simpul(id,x,y,ekstra=''){
  const o=D.orang[id]; const st=o.status; const sorot = dialog && D.antrean[dialog.i]?.orang===id;
  const sub = st==='wafat' ? (o.tahun||'tahun ?') : st==='tahu' ? 'belum tahu' : (o.kamu?'kamu':o.rel.split(' ·')[0]);
  const isi = st==='hidup' ? (WARNA[o.kel]||'#fff') : '#fff';
  return `<g class="n ${st} ${id===D.pemilik?'pemilik':''} ${sorot?'sorot':''} ${ekstra}" data-id="${id}" style="cursor:pointer" transform="translate(${x-46},${y-20})">
    <rect width="92" height="40" rx="12" fill="${isi}" stroke="${st==='hidup'?'rgba(0,0,0,.08)':''}"/>
    <text x="46" y="17" text-anchor="middle">${o.nama.length>13?o.nama.slice(0,12)+'…':o.nama}</text>
    <text class="sub" x="46" y="31" text-anchor="middle">${sub}</text></g>`;
}
const siku=(x1,y1,x2,y2)=>`<path class="garis" d="M${x1} ${y1} V${(y1+y2)/2} H${x2} V${y2}"/>`;
function pohon(){
  if (sk==='B'){
    return `<svg viewBox="0 0 420 200" role="img" aria-label="Pohon keluarga Budi">
      <line class="garis" x1="152" y1="40" x2="268" y2="40"/>${siku(210,40,90,140)}${siku(210,40,210,140)}${siku(210,40,330,140)}
      ${simpul('ayah',106,40)}${simpul('ibu',314,40)}${simpul('budi',90,140)}${simpul('andi',210,140)}${simpul('rina',330,140)}</svg>`;
  }
  // satu slot per anak, Budi dua slot (dirinya + Dewi) supaya pasangan tidak menimpa saudaranya
  const anak = D.anak, SLOT = 108, slot = id => id==='budi' ? 2 : 1;
  const lebar = Math.max(420, anak.reduce((j,id)=>j+slot(id),0)*SLOT + 20);
  let kursor = (lebar - anak.reduce((j,id)=>j+slot(id),0)*SLOT)/2;
  const xs = anak.map(id => { const x = kursor + SLOT/2; kursor += slot(id)*SLOT; return x; });
  const xBudi = xs[anak.indexOf('budi')];
  let s = `<svg viewBox="0 0 ${lebar} 330" role="img" aria-label="Pohon keluarga Mbah Karto">`;
  const xK = lebar/2-60, xS = lebar/2+60;
  s += `<line class="garis" x1="${xK}" y1="110" x2="${xS}" y2="110"/>${siku(xK,40,xK,90)}`;
  anak.forEach((id,i)=> s += siku(lebar/2,110,xs[i],190));
  const xD = xBudi+SLOT; s += `<line class="garis" x1="${xBudi+46}" y1="210" x2="${xD-46}" y2="210"/>`;
  const tengah = (xBudi+xD)/2; s += siku(tengah,210,tengah-56,280)+siku(tengah,210,tengah+56,280);
  s += simpul('ibuK',xK,30) + simpul('karto',xK,110) + simpul('sumi',xS,110);
  anak.forEach((id,i)=> s += simpul(id,xs[i],210,id.startsWith('baru')?'baru':''));
  s += simpul('dewi',xD,210) + simpul('andi',tengah-56,290) + simpul('sari',tengah+56,290);
  return s + '</svg>';
}

  });
  document.getElementById('tundaQ').onclick=()=>{ D.tunda.push(q.id); lanjutAntrean(); };
  document.getElementById('tutupQ').onclick=()=>{ dialog=null; gambar(); };
  document.getElementById('latar').onclick=e=>{ if(e.target.id==='latar'){dialog=null;gambar();} };
  wadah.querySelector('.opsi')?.focus();
}
function lanjutAntrean(){
  const sisa = sisaAntrean();
  dialog = sisa.length ? {i: D.antrean.indexOf(sisa[0])} : null;
  if (!sisa.length) toast('Semua yang memengaruhi hasil sudah jelas.');
  gambar();
}

// ---------- layar 4: periksa ----------
function ceritaA(){
  const ibu = D.orang.ibuK.status;
  const urut = D.jawab.urut || 'sumi';
  const r = [
    ['±1970', 'Slamet wafat, sebelum Mbah Karto.'],
    ['±1975', `Mbah Karto wafat. Meninggalkan Mbah Sumi, Budi, dan Rina${ibu==='hidup'?', juga ibunya':''}.${ibu==='tahu'?' <em>Ibunya: belum dipastikan.</em>':''}`],
  ];
  const sumi = ['?', 'Mbah Sumi wafat, sebelum harta dibagi. Bagiannya diteruskan ke Budi dan Rina.'];
  const budi = ['1998', 'Budi wafat. Bagiannya diteruskan ke Dewi, Andi, dan Sari.'];
  if (urut==='budi') { r.push(budi, ['?', 'Mbah Sumi wafat. Bagiannya diteruskan ke Rina, juga ke Andi dan Sari sebagai cucu.']); }
  else r.push(sumi, budi);
  r.push(['Kini', 'Yang menerima: Rina, Dewi, Andi, dan Sari.']);
  return r;
}
function layarPeriksa(){
  const tunda = D.tunda.map(id=>D.antrean.find(q=>q.id===id));
  const cerita = sk==='A' ? ceritaA() : [['2010','Ayah wafat, sebelum Budi.'],['2023','Budi wafat. Ia tidak menikah dan tidak punya anak. Meninggalkan Ibu, Andi, dan Rina.'],['Kini','Yang menerima: Ibu, Andi, dan Rina.']];
  const pesanWA = 'Assalamu\'alaikum. Aku lagi menghitung warisan ' + D.namaPemilik + '. Ada yang belum aku tahu:\n' + tunda.map((q,i)=>`${i+1}. ${q.judul}`).join('\n') + '\nTerima kasih.';
  return `<div class="tumpuk" style="max-width:760px">
    ${tunda.length?`<section class="kartu tumpuk">
      <h2 class="judul-kecil">Belum dipastikan (${tunda.length})</h2>
      <p class="kecil redup">Hasil ditampilkan sebagai beberapa kemungkinan sampai ini jelas.</p>
      <div>${tunda.map(q=>`<div class="belum"><span>${q.judul}</span><button class="tautan kecil" data-pastikan="${q.id}">Pastikan</button></div>`).join('')}</div>
      <div class="tumpuk" style="gap:8px"><button class="tautan" style="align-self:flex-start;display:inline-flex;gap:6px;align-items:center" id="salinWA"><svg class="ik"><use href="#i-pesan"/></svg>Salin pertanyaan untuk keluarga</button>
      <div class="wa" id="pratinjauWA" hidden>${pesanWA}</div></div>
    </section>`:''}
    <section class="kartu">
      <div class="cerita">${cerita.map(([th,ps])=>`<div class="th ${th==='Kini'?'kini':''}">${th}</div><div class="ps ${th==='Kini'?'kini':''}">${ps}${th!=='Kini'?' <button class="tautan" onclick="ke(3)">ubah</button>':''}</div>`).join('')}</div>
    </section>
    <p class="kecil redup">Yang dibagi di sini harta ${D.namaPemilik}. Harta milik Budi sendiri (kalau ada) dihitung terpisah.</p>
    <div class="bar-bawah"><button class="tautan" onclick="ke(3)">Ada yang keliru</button><button class="pil" onclick="ke(5)">${tunda.length?'Hitung dengan kemungkinan':'Ya, ceritanya benar, hitung'}</button></div>
  </div>`;
}
function pasangPeriksa(){
  const s = document.getElementById('salinWA');
  if (s) s.onclick=()=>{ const p=document.getElementById('pratinjauWA'); p.hidden=false; navigator.clipboard?.writeText(p.textContent).catch(()=>{}); toast('Pertanyaan disalin. Tempel di WhatsApp keluarga.'); };
  document.querySelectorAll('[data-pastikan]').forEach(b=>b.onclick=()=>{ D.tunda=D.tunda.filter(x=>x!==b.dataset.pastikan); dialog={i:D.antrean.findIndex(q=>q.id===b.dataset.pastikan)}; gambar(); });
}

// ---------- layar 5: hasil ----------
let gel = 3;
function layarHasil(){
  if (sk==='B') return `<div class="tumpuk" style="max-width:760px"><section class="kartu tumpuk">
      <h2 class="judul-kecil">Siapa mendapat berapa</h2>
      <div class="pita"><span style="flex:1;background:var(--leluhur)"></span><span style="flex:3.33;background:var(--saudara)"></span><span style="flex:1.67;background:#f7c9d6"></span></div>
      <div>${[['Andi (kamu)','adik','55,6 %','Rp 166.666.666','var(--saudara)'],['Rina','adik','27,8 %','Rp 83.333.333','#f7c9d6'],['Ibu','ibu Budi','16,7 %','Rp 50.000.000','var(--leluhur)']].map(baris).join('')}</div>
      <p class="kecil redup">Satu kematian, satu keluarga: tidak ada ringkasan per cabang dan tidak ada aliran bertahap. Hanya yang relevan yang tampil.</p>
    </section></div>`;
  const tahap = [
    {lbl:'±1975 Mbah Karto', ket:'Harta dibagi ke Mbah Sumi, Budi, dan Rina.'},
    {lbl:'Mbah Sumi', ket:'Bagian Mbah Sumi mengalir ke Budi dan Rina.'},
    {lbl:'1998 Budi', ket:'Bagian Budi mengalir ke Dewi, Andi, dan Sari.'},
  ];
  return `<div class="tumpuk">
    <div class="dua-kol">
      <section class="kartu tumpuk">
        <h2 class="judul-kecil">Per keluarga</h2>
        <div class="pita"><span style="flex:2;background:var(--keturunan)"></span><span style="flex:1;background:#f7c9d6"></span></div>
        <div>
          <div class="baris-hasil"><span class="kiri"><i style="background:var(--keturunan)"></i><span><b>Keluarga Budi</b><br><span class="kecil redup">Dewi, Andi, Sari</span></span></span><span class="kanan"><b>66,7 %</b><br><span class="kecil">Rp 800.000.000</span></span></div>
          <div class="baris-hasil"><span class="kiri"><i style="background:#f7c9d6"></i><b>Rina</b></span><span class="kanan"><b>33,3 %</b><br><span class="kecil">Rp 400.000.000</span></span></div>
        </div>
      </section>
      <section class="kartu tumpuk aliran">
        <div class="kepala-kel"><h2 class="judul-kecil">Bagaimana bagian berpindah</h2></div>
        <div class="gelombang" id="gel">${tahap.map((t,i)=>`<button aria-pressed="${gel===i+1}" data-g="${i+1}">${t.lbl}</button>`).join('')}</div>
        ${aliranSvg()}
        <p class="kecil">${tahap[gel-1].ket}</p>
      </section>
    </div>
    <section class="kartu tumpuk">
      <h2 class="judul-kecil">Siapa mendapat berapa</h2>
      <div>${[['Andi (kamu)','cucu, lewat Budi','38,9 %','Rp 466.666.666','var(--keturunan)'],['Rina','anak','33,3 %','Rp 400.000.000','#f7c9d6'],['Sari','cucu, lewat Budi','19,4 %','Rp 233.333.333','var(--keturunan)'],['Dewi','istri Budi','8,3 %','Rp 100.000.000','var(--pasangan)']].map(baris).join('')}</div>
      <p class="dilewati"><svg class="ik"><use href="#i-info"/></svg><span>Dewi menerima dari Budi sebagai istri, bukan dari Mbah Karto langsung. Bagian itu sah miliknya.</span></p>
      <p class="kecil redup">Tidak menerima: Slamet (wafat lebih dulu), ibu Mbah Karto (wafat lebih dulu). <a>Kenapa?</a> · Cara menghitung (tabel munasakhat) ada di bagian bawah halaman hasil.</p>
    </section>
  </div>`;
}
const baris = ([n,r,p,rp,w]) => `<div class="baris-hasil"><span class="kiri"><i style="background:${w}"></i><span><b>${n}</b><br><span class="kecil redup">${r}</span></span></span><span class="kanan"><b>${p}</b><br><span class="kecil">${rp}</span></span></div>`;
function aliranSvg(){
  const node=(x,y,t,aktif)=>`<g transform="translate(${x-38},${y-14})"><rect width="76" height="28" rx="9" fill="${aktif?'#fff':'#f1f4ee'}" stroke="${aktif?'var(--ink)':'#c9d4c6'}"/><text x="38" y="18" text-anchor="middle" style="font:600 11px var(--font-sans);fill:${aktif?'var(--ink)':'#8a948d'}">${t}</text></g>`;
  const a=(d,on)=>`<path class="${on?'alir':'garis'}" d="${d}"/>`;
  return `<svg viewBox="0 0 360 190" role="img" aria-label="Aliran bagian tahap ${gel}">
    ${a('M180 34 C180 70 70 70 70 96',gel===1)}${a('M180 34 C180 70 180 70 180 96',gel===1)}${a('M180 34 C180 70 290 70 290 96',gel===1)}
    ${a('M70 110 C120 110 140 110 166 110',gel===2)}${a('M70 110 C70 60 290 60 290 96',gel===2)}
    ${a('M180 124 C180 150 70 150 70 166',gel===3)}${a('M180 124 C180 150 180 150 180 166',gel===3)}${a('M180 124 C180 150 290 150 290 166',gel===3)}
    ${node(180,22,'Mbah Karto',gel===1)}${node(70,110,'Mbah Sumi',gel<=2)}${node(180,110,'Budi',gel!==2||true)}${node(290,110,'Rina',true)}
    ${node(70,176,'Dewi',gel===3)}${node(180,176,'Andi',gel===3)}${node(290,176,'Sari',gel===3)}</svg>`;
}
function pasangHasil(){ document.querySelectorAll('#gel button').forEach(b=>b.onclick=()=>{gel=+b.dataset.g;gambar();}); }

// ---------- umum ----------
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.append(el); setTimeout(()=>el.remove(),2600); }
function gambar(){
  gambarHero();
  const l = document.getElementById('lembar');
  if (layar===1){ l.innerHTML = layarAlmarhum(); pasangAlmarhum(); }
  if (layar===2){ l.innerHTML = `<div class="kartu" style="max-width:640px"><p>Langkah Harta tidak berubah di konsep ini (tumpukan harta = Tahap 6).</p><div class="bar-bawah"><button class="tautan" onclick="ke(1)">Kembali</button><button class="pil" onclick="ke(3)">Lanjut</button></div></div>`; }
  if (layar===3){ l.innerHTML = layarKeluarga(); pasangKeluarga(); }
  if (layar===4){ l.innerHTML = layarPeriksa(); pasangPeriksa(); }
  if (layar===5){ l.innerHTML = layarHasil(); pasangHasil(); }
  gambarDialog();
}
document.querySelectorAll('#pilihContoh button').forEach(b=>b.onclick=()=>{
  sk=b.dataset.sk; D = sk==='A'?contohA():contohB(); dialog=null; layar=1;
  document.querySelectorAll('#pilihContoh button').forEach(x=>x.setAttribute('aria-pressed',x===b)); gambar();
});
document.querySelectorAll('#pilihLebar button').forEach(b=>b.onclick=()=>{
  document.body.classList.toggle('hp', b.dataset.lebar==='hp');
  document.querySelectorAll('#pilihLebar button').forEach(x=>x.setAttribute('aria-pressed',x===b));
});
gambar();
</script>
</body>
