<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabel faraidh latihan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<!-- Acuan: docs/design/riset-ux-isian-jawaban-latihan-2026-11-19.md bagian 10. Opsi B (tabel kitab) + urutan dari opsi A.
     Angka kunci dari KB: 16.1 / 12.6 contoh 2 (munasakhat), 14.6 baris 1 (dzawil arham), 13b.6 F1 (mafqud), 13a.7 H1 baris [SYF] (haml), 13d.2 (gharqa).
     Kolom bagian per kemungkinan pada mafqud diturunkan dari bab 04 (ibu 1/6 bila ada dua saudara atau lebih) dan cocok dengan hasil F1. -->
<style>
:root{--page:#b9d4c0;--frame:#eef3e8;--ink:#14181a;--muted:#525c57;--card:#fff;--orange:#f2682a;--mint:#dcefe2;--kuning:#fbefc9;--kuning-ink:#6b4f00;--black:#0e0f10;--line:#d5ddd2;--hijau:#1f6f5c;--merah:#fdecea;--merah-ink:#7a2a17;
--font:"Onest",system-ui,sans-serif;--sh:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.5 var(--font);padding:18px 16px 90px}
h1,h2,h3,p{margin:0}
button,input,select{font-family:inherit}
.tautan{background:none;border:0;padding:0;font:600 14px var(--font);color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:32px}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.atas{max-width:1120px;margin:0 auto 12px}
.atas p{font-size:13px;color:#2c4136;margin:0 4px 8px}
nav.tab{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
nav.tab button{flex:none;border:0;background:rgba(255,255,255,.5);color:var(--ink);font:500 14px var(--font);padding:9px 14px;border-radius:999px;cursor:pointer}
nav.tab button[aria-selected=true]{background:var(--black);color:#fff}
.frame{max-width:1120px;margin:0 auto;background:var(--frame);border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(20,40,30,.18)}
.hero{color:#fff;padding:16px 24px 22px;background:radial-gradient(520px 300px at 82% 60%,rgba(255,150,40,.3),transparent 70%),radial-gradient(420px 260px at 6% 0%,rgba(60,210,170,.28),transparent 70%),linear-gradient(135deg,#0a2326 0%,#0f3a38 55%,#0b2a2b 100%)}
.bilah{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:rgba(255,255,255,.85)}
.hero h1{font-size:26px;line-height:1.15;font-weight:500;letter-spacing:-.02em;margin-top:14px}
.kalimat{font-size:15px;margin-top:6px;color:rgba(255,255,255,.93);max-width:70ch}
.tata{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;padding:20px 24px 28px}
.t{background:var(--card);border-radius:24px;padding:18px 20px;box-shadow:var(--sh);min-width:0}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s12{grid-column:span 12}
.t h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.t h3{font-size:15.5px;font-weight:600;margin-top:14px}
.sub{font-size:14px;color:var(--muted);margin-top:2px}
.atur{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:13.5px}
.segmen{display:inline-flex;background:#eef2ec;border-radius:999px;padding:3px}
.segmen button{border:0;background:none;font:500 13px var(--font);padding:7px 11px;border-radius:999px;cursor:pointer;color:var(--ink);min-height:34px}
.segmen button[aria-pressed=true]{background:#fff;box-shadow:var(--sh)}
.wadahTabel{overflow-x:auto;margin-top:14px;-webkit-overflow-scrolling:touch}
table.kitab{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.kitab th,.kitab td{border:1.5px solid var(--line);padding:7px 8px;text-align:center;vertical-align:middle;min-width:76px}
.kitab th{background:#f3f6f1;font-weight:600;font-size:13px}
.kitab th .judulKol{display:block;color:var(--muted);font-weight:500;font-size:12px}
.kitab td.nama,.kitab th.nama{text-align:left;font-weight:500;min-width:128px;position:sticky;left:0;background:#fff;z-index:1}
.kitab th.nama{background:#f3f6f1}
.kitab tr.tambahan td{background:#fafbf8;color:var(--muted)}
.kitab tr.tambahan td.nama{background:#fafbf8;font-style:italic}
.kitab .tetapSel{font-weight:600;color:var(--muted)}
.kitab td.kunciKol,.kitab th.kunciKol{background:#f6f7f4}
.kitab td.kunciKol select,.kitab td.kunciKol input,.kitab th.kunciKol select,.kitab th.kunciKol input{opacity:.45}
.kitab .aktifKol{box-shadow:inset 0 3px 0 var(--hijau)}
.kitab .keliru{background:var(--merah)!important}
.kitab .lolos{background:#eef7f1}
.kitab select{font:600 14px var(--font);border:1.5px solid var(--line);border-radius:9px;padding:5px 4px;background:#fff;color:var(--ink);max-width:150px}
.bulat{font:600 15px var(--font);border:1.5px solid var(--line);border-radius:9px;padding:5px 4px;text-align:center;width:58px;font-variant-numeric:tabular-nums}
.bulat::placeholder{color:#8b958f}
.nol{font-weight:600;color:var(--muted)}
.btn{border:0;background:var(--black);color:#fff;font:600 14px var(--font);border-radius:999px;padding:11px 18px;cursor:pointer;min-height:44px}
.aksi{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:16px}
.umpan{margin-top:12px;border-radius:14px;padding:11px 14px;font-size:14px}
.umpan.benar{background:var(--mint);color:#174d3c}.umpan.salah{background:var(--merah);color:var(--merah-ink)}.umpan.kurang{background:var(--kuning);color:var(--kuning-ink)}.umpan.sebagian{background:#e8eefc;color:#1f3a7a}
.petunjukBulat{font-size:13px;color:var(--kuning-ink);background:var(--kuning);border-radius:10px;padding:6px 10px;margin-top:10px;display:none}
.petunjukBulat.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip-s{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font:500 13.5px var(--font);cursor:pointer;min-height:36px;color:var(--ink)}
.chip-s[aria-pressed=true]{background:var(--hijau);border-color:var(--hijau);color:#fff}
ul.aturan{margin:8px 0 0;padding-left:18px;font-size:14px}ul.aturan li{margin-top:6px}
.contoh{display:inline-block;border:1.5px solid var(--line);border-radius:8px;padding:0 6px;font-weight:600;background:#fff}
.rujukan{font-size:12.5px;color:var(--muted);margin-top:8px}
@media(max-width:760px){
  body{padding:12px 8px 90px}
  .hero{padding:14px 16px 18px}.hero h1{font-size:22px}
  .tata{grid-template-columns:1fr;padding:16px}
  .s8,.s4,.s12{grid-column:auto}
  .kitab td.nama,.kitab th.nama{min-width:104px}
}
</style>
</head>
<body>
<div class="atas">
  <p>Opsi B (tabel seperti di kitab) dengan urutan langkah dari opsi A. Ini contoh, tidak ada yang disimpan.</p>
  <nav class="tab" role="tablist" id="tab"></nav>
</div>
<div class="frame">
  <header class="hero"><div class="bilah"><span>Latihan</span><span id="bab"></span></div><h1 id="judul"></h1><p class="kalimat" id="soal"></p></header>
  <div id="layar"></div>
</div>

<script>
// Daftar tertutup. Usul dari [R09-1]; bagian tetap dari bab 04; kelompok taqdir dari [R13-4].
const USUL = ['2', '3', '4', '6', '8', '12', '24'];
const BAGIAN = ['1/2', '1/4', '1/8', '2/3', '1/3', '1/6', 'Ashabah', '1/6 + Ashabah', 'Terhalang'];
const KELOMPOK = ['Tetap penuh', 'Terkecil', '0 dulu: gugur di sebagian kemungkinan', '0 dulu: berbagi sisa dengan janin'];
const DUDUK = ['Saudara kandung', 'Saudara seibu', 'Saudara sebapak', 'Ibu', 'Ayah'];

// Satu soal = kolom (urutan = urutan langkah) + baris. kunci[kolom] per baris; undefined = sel tidak dipakai ("–").
// Kolom berjenis 'pilih' (daftar tertutup) atau 'bulat' (hanya bilangan bulat). header = isian di kepala kolom (asal masalah).
const SOAL = {
  biasa: {
    tab: 'Soal biasa', bab: 'Bab ashabah', judul: 'Isi tabel pembagiannya',
    soal: 'Almarhum meninggalkan istri, satu anak laki-laki, dan satu anak perempuan.', rujukan: 'KB 16.1',
    kolom: [
      { id: 'bagian', judul: 'Bagian', jenis: 'pilih', pilihan: BAGIAN },
      { id: 'awal', judul: 'Asal masalah', jenis: 'bulat', header: { jenis: 'usul', kunci: '8' } },
      { id: 'akhir', judul: 'Asal masalah akhir', jenis: 'bulat', header: { jenis: 'bulat', kunci: '24' }, sebanding: true }
    ],
    baris: [
      { nama: 'Istri', kunci: { bagian: '1/8', awal: '1', akhir: '3' } },
      { nama: 'Anak laki-laki', kunci: { bagian: 'Ashabah', awal: '7', akhir: '14' }, gabung: { awal: 2 } },
      { nama: 'Anak perempuan', kunci: { bagian: 'Ashabah', akhir: '7' } }
    ],
    benar: 'Benar semua. Asal masalah 8; sisa 7 tidak habis dibagi 3 kepala, jadi ditashih menjadi 24.'
  },
  munasakhat: {
    tab: 'Munasakhat', bab: 'Bab munasakhat', judul: 'Lanjutkan tabelnya',
    soal: 'Sebelum harta dibagi, anak perempuan wafat. Ia meninggalkan ibunya (istri tadi) dan saudara laki-lakinya (anak laki-laki tadi).', rujukan: 'KB 12.6 contoh 2',
    kolom: [
      { id: 'b1', judul: 'Bagian · almarhum', jenis: 'pilih', pilihan: BAGIAN, tetap: true },
      { id: 'm1', judul: 'Mas\'alah 1', jenis: 'bulat', header: { jenis: 'tetap', kunci: '24' }, tetap: true },
      { id: 'b2', judul: 'Bagian · anak pr', jenis: 'pilih', pilihan: BAGIAN },
      { id: 'm2', judul: 'Mas\'alah 2', jenis: 'bulat', header: { jenis: 'usul', kunci: '3' } },
      { id: 'jamiah', judul: 'Jami\'ah', jenis: 'bulat', header: { jenis: 'bulat', kunci: '72' } }
    ],
    baris: [
      { nama: 'Istri / ibu', kunci: { b1: '1/8', m1: '3', b2: '1/3', m2: '1', jamiah: '16' } },
      { nama: 'Anak lk / saudara', kunci: { b1: 'Ashabah', m1: '14', b2: 'Ashabah', m2: '2', jamiah: '56' } },
      { nama: 'Anak pr (wafat)', kunci: { b1: 'Ashabah', m1: '7' } },
      { nama: 'Pengali', tambahan: true, cekDi: 'jamiah', kunci: { m1: '3', m2: '7' } }
    ],
    benar: 'Benar semua. Saham anak pr 7 dan mas\'alah 2 = 3 saling asing (tabayun), jadi jami\'ah 24 × 3 = 72.'
  },
  dzawil: {
    tab: 'Dzawil arham', bab: 'Bab dzawil arham', judul: 'Isi tabel tanzil',
    soal: 'Tidak ada ahli waris bagian tetap maupun ashabah. Yang ada: anak pr saudara lk kandung, anak pr saudara lk seibu, anak pr saudara lk sebapak.', rujukan: 'KB 14.5–14.6 baris 1 (tanzil, [SYF])',
    kolom: [
      { id: 'duduk', judul: 'Didudukkan sebagai', jenis: 'pilih', pilihan: DUDUK },
      { id: 'bagian', judul: 'Bagian perantara', jenis: 'pilih', pilihan: BAGIAN },
      { id: 'ashl', judul: 'Asal masalah', jenis: 'bulat', header: { jenis: 'usul', kunci: '6' } }
    ],
    baris: [
      { nama: 'Anak pr sdr lk kandung', kunci: { duduk: 'Saudara kandung', bagian: 'Ashabah', ashl: '5' } },
      { nama: 'Anak pr sdr lk seibu', kunci: { duduk: 'Saudara seibu', bagian: '1/6', ashl: '1' } },
      { nama: 'Anak pr sdr lk sebapak', kunci: { duduk: 'Saudara sebapak', bagian: 'Terhalang', ashl: '0' } }
    ],
    benar: 'Benar semua. Saudara sebapak terhalang oleh saudara kandung, jadi anak perempuannya ikut terhalang.'
  },
  mafqud: {
    tab: 'Mafqud', bab: 'Bab mafqud', judul: 'Isi tabel dua kemungkinan',
    soal: 'Almarhum meninggalkan ibu, saudara lk sebapak, dan saudara lk sebapak lain yang hilang tanpa kabar.', rujukan: 'KB 13b.6 F1',
    kolom: [
      { id: 'bh', judul: 'Bagian · ia hidup', jenis: 'pilih', pilihan: BAGIAN },
      { id: 'hidup', judul: 'Ia hidup', jenis: 'bulat', header: { jenis: 'bulat', kunci: '12' } },
      { id: 'bm', judul: 'Bagian · ia wafat', jenis: 'pilih', pilihan: BAGIAN },
      { id: 'mati', judul: 'Ia wafat', jenis: 'bulat', header: { jenis: 'usul', kunci: '3' } },
      { id: 'kini', judul: 'Diberikan sekarang', jenis: 'bulat', header: { jenis: 'bulat', kunci: '12', label: 'Jami\'ah' } }
    ],
    baris: [
      { nama: 'Ibu', kunci: { bh: '1/6', hidup: '2', bm: '1/3', mati: '1', kini: '2' } },
      { nama: 'Saudara hadir', kunci: { bh: 'Ashabah', hidup: '5', bm: 'Ashabah', mati: '2', kini: '5' } },
      { nama: 'Saudara hilang', kunci: { bh: 'Ashabah', hidup: '5' } },
      { nama: 'Pengali', tambahan: true, cekDi: 'kini', kunci: { hidup: '1', mati: '4' } },
      { nama: 'Ditahan', tambahan: true, kunci: { kini: '5' } }
    ],
    benar: 'Benar semua. Tiap orang diberi yang terkecil dari dua kemungkinan; sisanya 5 ditahan sampai kabarnya jelas.'
  },
  haml: {
    tab: 'Haml', bab: 'Bab haml · madzhab Syafi\'i', judul: 'Isi tabel bagian sekarang',
    soal: 'Almarhum meninggalkan ibu yang sedang hamil dari ayah almarhum, dan saudara laki-laki kandung.', rujukan: 'KB 13a.4, 13a.7 H1 baris [SYF]',
    kolom: [
      { id: 'kel', judul: 'Kelompok', jenis: 'pilih', pilihan: KELOMPOK },
      { id: 'kini', judul: 'Diberikan sekarang', jenis: 'bulat', header: { jenis: 'bulat', kunci: '72', label: 'Jami\'ah' } }
    ],
    baris: [
      { nama: 'Ibu', kunci: { kel: 'Terkecil', kini: '12' } },
      { nama: 'Saudara lk kandung', kunci: { kel: '0 dulu: berbagi sisa dengan janin', kini: '0' } },
      { nama: 'Ditahan', tambahan: true, kunci: { kini: '60' } }
    ],
    lengkap: true,
    benar: 'Benar semua. Menurut Syafi\'i jumlah janin tidak dibatasi, jadi saudara yang berbagi sisa dengan janin belum diberi apa pun.'
  },
  hamlLengkap: {
    tab: 'Haml · tabel lengkap', bab: 'Bab haml · tingkat sulit · laptop', judul: 'Isi tabel enam kemungkinan',
    soal: 'Soal yang sama, dengan seluruh kemungkinan janin. Angka di sel sudah dikali pengali (juz\'us sahm).', rujukan: 'KB 13a.7 H1',
    kolom: ['Wafat', '2 lk', '2 pr', '1 pr', '1 lk', 'lk + pr'].map((j, i) => ({ id: 't' + i, judul: j, jenis: 'bulat', header: { jenis: 'bulat', kunci: ['3', '18', '24', '18', '12', '6'][i], label: 'Mas\'alah' } }))
      .concat([{ id: 'kini', judul: 'Diberikan sekarang', jenis: 'bulat', header: { jenis: 'bulat', kunci: '72', label: 'Jami\'ah' } }]),
    baris: [
      { nama: 'Pengali', tambahan: true, kunci: { t0: '24', t1: '4', t2: '3', t3: '4', t4: '6', t5: '12' } },
      { nama: 'Ibu', kunci: { t0: '24', t1: '12', t2: '12', t3: '12', t4: '12', t5: '12', kini: '12' } },
      { nama: 'Saudara lk kandung', kunci: { t0: '48', t1: '20', t2: '30', t3: '40', t4: '30', t5: '24', kini: '0' } },
      { nama: 'Janin', kunci: { t1: '40', t2: '30', t3: '20', t4: '30', t5: '36' } },
      { nama: 'Ditahan', tambahan: true, kunci: { kini: '60' } }
    ],
    benar: 'Benar semua.'
  },
  gharqa: { tab: 'Gharqa', bab: 'Bab gharqa', judul: 'Putuskan dulu, lalu isi tabel tiap harta', soal: 'Suami dan istri wafat dalam satu kecelakaan. Tidak diketahui sama sekali siapa yang lebih dulu. Masing-masing punya ahli waris lain.', rujukan: 'KB 13d.2, [SYF]' },
  aturan: { tab: 'Aturan isian seragam', bab: '', judul: 'Bagaimana isian tetap seragam', soal: 'Ringkasan aturan yang dipakai semua tabel.' }
};

let aktif = 'biasa', bertahap = true, ketikUsul = false;
// Kolom pilihan terdekat di kiri kolom angka: penentu "Terhalang → 0".
const kolomBagianDari = (soalId, kol) => SOAL[soalId].kolom.slice(0, SOAL[soalId].kolom.indexOf(kol)).filter(c => c.jenis === 'pilih' && !c.tetap).pop();
const nilai = {}, lolos = {}, umpan = {}, salah = {};
let gharqaPilih = '';
const k = (soal, kol, i) => `${soal}|${kol}|${i}`;
const v = key => nilai[key] ?? '';

function sel(soalId, kol, i, kunci, terkunci) {
  const key = k(soalId, kol.id, i);
  if (kunci === undefined) return '–';
  if (kol.tetap && !SOAL[soalId].baris[i].cekDi) return `<span class="tetapSel">${kunci}</span>`;
  // Baris yang dipilih Terhalang: semua sel angkanya otomatis 0 (tidak diketik).
  const bagianKol = kolomBagianDari(soalId, kol);
  if (kol.jenis === 'bulat' && bagianKol && v(k(soalId, bagianKol.id, i)) === 'Terhalang') return '<span class="nol">0</span>';
  if (kol.jenis === 'pilih') return `<select data-k="${key}" ${terkunci ? 'disabled' : ''} aria-label="${kol.judul} ${SOAL[soalId].baris[i].nama}"><option value="">–</option>${kol.pilihan.map(p => `<option ${v(key) === p ? 'selected' : ''}>${p}</option>`).join('')}</select>`;
  return kotakBulat(key, `${kol.judul} ${SOAL[soalId].baris[i].nama}`, terkunci);
}
const kotakBulat = (key, label, terkunci) => `<input class="bulat" data-k="${key}" data-bulat inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${v(key)}" ${terkunci ? 'disabled' : ''} aria-label="${label}">`;
function kepala(soalId, kol, terkunci) {
  const h = kol.header; if (!h) return '';
  const key = k(soalId, kol.id, 'h'), label = h.label ?? 'Asal masalah';
  if (h.jenis === 'tetap') return `<br><span class="tetapSel">${h.kunci}</span>`;
  if (h.jenis === 'usul' && !ketikUsul) return `<br><select data-k="${key}" ${terkunci ? 'disabled' : ''} aria-label="${label} ${kol.judul}"><option value="">${label}</option>${USUL.map(u => `<option ${v(key) === u ? 'selected' : ''}>${u}</option>`).join('')}</select>`;
  return `<br>${kotakBulat(key, `${label} ${kol.judul}`, terkunci)}`;
}

function tabelHtml(soalId) {
  const s = SOAL[soalId], n = lolos[soalId] ?? 0;
  const kolomIsi = s.kolom.filter(c => !c.tetap);
  const terkunci = kol => bertahap && !kol.tetap && kolomIsi.indexOf(kol) > n;
  const kelas = (kol, extra = '') => [terkunci(kol) ? 'kunciKol' : '', bertahap && kolomIsi.indexOf(kol) === n ? 'aktifKol' : '', bertahap && !kol.tetap && kolomIsi.indexOf(kol) < n ? 'lolos' : '', extra].filter(Boolean).join(' ');
  const lewat = {};
  return `<div class="wadahTabel"><table class="kitab"><thead><tr><th class="nama">Ahli waris</th>${s.kolom.map(kol => `<th class="${kelas(kol, (salah[soalId] ?? []).includes(k(soalId, kol.id, 'h')) ? 'keliru' : '')}" scope="col"><span class="judulKol">${kol.judul}</span>${kepala(soalId, kol, terkunci(kol))}</th>`).join('')}</tr></thead>
    <tbody>${s.baris.map((b, i) => `<tr class="${b.tambahan ? 'tambahan' : ''}"><td class="nama">${b.nama}</td>${s.kolom.map(kol => {
      if (lewat[kol.id + i]) return '';
      const rentang = b.gabung?.[kol.id] ?? 1;
      for (let j = 1; j < rentang; j++) lewat[kol.id + (i + j)] = true;
      const keliru = (salah[soalId] ?? []).includes(k(soalId, kol.id, i)) ? 'keliru' : '';
      // Baris pengali diisi pada langkah jami'ah, jadi kunci/bukanya mengikuti kolom itu.
      const kolAcuan = b.cekDi ? s.kolom.find(c => c.id === b.cekDi) : kol;
      return `<td class="${kelas(kolAcuan, keliru)}" ${rentang > 1 ? `rowspan="${rentang}"` : ''}>${sel(soalId, kol, i, b.kunci[kol.id], terkunci(kolAcuan))}${rentang > 1 ? '<br><span class="sub" style="font-size:11.5px">bersama</span>' : ''}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function periksa(soalId) {
  const s = SOAL[soalId], kolomIsi = s.kolom.filter(c => !c.tetap);
  salah[soalId] = [];
  const batas = bertahap ? Math.min((lolos[soalId] ?? 0) + 1, kolomIsi.length) : kolomIsi.length;
  for (let x = 0; x < batas; x++) {
    const kol = kolomIsi[x];
    const isiKol = s.baris.map((b, i) => [i, b.kunci[kol.id], kol.id]).filter(([i, kunci]) => kunci !== undefined && !s.baris[i].cekDi);
    s.baris.forEach((b, i) => { if (b.cekDi === kol.id) Object.entries(b.kunci).forEach(([kolId, kunci]) => isiKol.push([i, kunci, kolId])); });
    const terhalang = i => { const bk = kolomBagianDari(soalId, kol); return bk && v(k(soalId, bk.id, i)) === 'Terhalang'; };
    const nilaiSel = (i, kolId = kol.id) => kolId === kol.id && terhalang(i) ? '0' : v(k(soalId, kolId, i));
    const kosong = isiKol.filter(([i, , kolId]) => nilaiSel(i, kolId) === '').map(([i, , kolId]) => k(soalId, kolId, i));
    if (kol.header && kol.header.jenis !== 'tetap' && v(k(soalId, kol.id, 'h')) === '') kosong.push(k(soalId, kol.id, 'h'));
    if (kosong.length) { salah[soalId] = kosong; return ['kurang', `Kolom "${kol.judul}" belum lengkap.`]; }
    const H = kol.header?.kunci, h = v(k(soalId, kol.id, 'h'));
    const keliru = isiKol.filter(([i, kunci, kolId]) => nilaiSel(i, kolId) !== kunci).map(([i, , kolId]) => k(soalId, kolId, i));
    const headerSalah = kol.header && kol.header.jenis !== 'tetap' && h !== H;
    if (kol.sebanding && headerSalah && isiKol.every(([i, kunci, kolId]) => +nilaiSel(i, kolId) * +H === +kunci * +h)) {
      salah[soalId] = [k(soalId, kol.id, 'h')]; return ['sebagian', `Kolom "${kol.judul}": perbandingannya benar, tapi ${h} belum yang terkecil.`];
    }
    if (headerSalah) keliru.push(k(soalId, kol.id, 'h'));
    if (keliru.length) { salah[soalId] = keliru; return ['salah', `Mulai salah di kolom "${kol.judul}".${bertahap ? '' : ' Kolom sesudahnya belum diperiksa.'}`]; }
    if (bertahap) lolos[soalId] = x + 1;
  }
  if (bertahap && (lolos[soalId] ?? 0) < kolomIsi.length) return ['benar', `Kolom "${kolomIsi[lolos[soalId] - 1].judul}" benar. Lanjut ke kolom berikutnya.`];
  lolos[soalId] = kolomIsi.length;
  return ['benar', s.benar];
}

function layarSoal(id) {
  const s = SOAL[id];
  return `<div class="tata"><section class="t s8"><h2>Tabelmu</h2>
      <div class="atur"><span class="segmen" role="group" aria-label="Cara mengisi">${[[true, 'Kolom demi kolom'], [false, 'Semua terbuka']].map(([b, l]) => `<button aria-pressed="${bertahap === b}" data-bertahap="${b}">${l}</button>`).join('')}</span>
        <span class="segmen" role="group" aria-label="Asal masalah">${[[false, 'Asal masalah: pilih'], [true, 'Asal masalah: ketik']].map(([b, l]) => `<button aria-pressed="${ketikUsul === b}" data-usul="${b}">${l}</button>`).join('')}</span></div>
      ${tabelHtml(id)}
      <p class="petunjukBulat" id="petunjukBulat" role="status">Kotak angka hanya menerima bilangan bulat. Pecahan dipilih di kolom Bagian.</p>
      <div class="aksi"><button class="btn" data-periksa="${id}">Periksa</button><button class="tautan" data-ulang="${id}">Kosongkan</button></div>
      ${umpan[id] ? `<div class="umpan ${umpan[id][0]}" role="status">${umpan[id][1]}</div>` : ''}
      <p class="rujukan">Angka kunci: ${s.rujukan}</p></section>
    <section class="t s4"><h2>Catatan</h2>${catatan(id)}</section></div>`;
}
function catatan(id) {
  const umum = '<ul class="aturan"><li>Kolom kiri ke kanan = urutan hitung. Mode "Kolom demi kolom" membuka kolom berikutnya setelah kolom sebelumnya benar.</li><li>Sel abu-abu "–" memang tidak diisi.</li></ul>';
  const khusus = {
    biasa: '<li>Sisa ashabah anak lk dan anak pr diisi bersama di satu sel, seperti di kitab.</li><li>Asal masalah akhir boleh sama dengan asal masalah bila tidak ada tashih.</li>',
    munasakhat: '<li>Mas\'alah 1 sudah dikerjakan di soal sebelumnya, ditampilkan terkunci.</li><li>Baris "Pengali" ada di bawah tiap mas\'alah, seperti di kitab.</li><li>Latihan dibatasi sampai 3 mayit.</li>',
    dzawil: '<li>Pilih Terhalang: sel angka di baris itu otomatis 0.</li><li>Madzhab Hanafi memakai metode qarabah dengan kolom yang berbeda.</li>',
    mafqud: '<li>Satu orang hilang = dua kemungkinan, muat di HP.</li><li>"Diberikan sekarang" = yang terkecil dari dua kemungkinan; selisihnya ditahan.</li><li>Khuntsa memakai tabel yang sama: "ia laki-laki" dan "ia perempuan".</li>',
    haml: '<li>Versi ringkas untuk HP: menguji kelompok tiap orang, tanpa enam kolom kemungkinan.</li><li>Tingkat sulit di laptop: tab "Haml · tabel lengkap".</li><li>"0 dulu" berbeda dari Terhalang: bagiannya bisa datang setelah bayi lahir.</li>',
    hamlLengkap: '<li>Enam kolom kemungkinan + kolom akhir. Di HP tabel digeser ke samping; kolom nama tetap terlihat.</li><li>Disarankan hanya untuk tingkat sulit.</li>'
  };
  return umum.replace('</ul>', (khusus[id] ?? '') + '</ul>');
}
function layarGharqa() {
  const benar = gharqaPilih === 'Tidak saling mewarisi';
  return `<div class="tata"><section class="t s8"><h2>Langkah pertama</h2><p class="sub">Apakah suami dan istri saling mewarisi?</p>
    <div class="chips">${['Yang terakhir mewarisi', 'Tidak saling mewarisi', 'Ditahan sampai jelas'].map(p => `<button class="chip-s" aria-pressed="${gharqaPilih === p}" data-gharqa="${p}">${p}</button>`).join('')}</div>
    ${gharqaPilih ? `<div class="umpan ${benar ? 'benar' : 'salah'}" role="status">${benar ? 'Benar. Urutannya tidak diketahui sama sekali, jadi tidak saling mewarisi. Sekarang isi dua tabel biasa: harta suami dan harta istri, masing-masing tanpa pasangannya.' : 'Belum tepat. "Ditahan" hanya bila urutannya pernah diketahui lalu terlupakan; "yang terakhir mewarisi" hanya bila urutannya pasti.'}</div>` : ''}
    ${benar ? '<h3>Harta suami</h3><p class="sub">Tabel biasa seperti tab "Soal biasa", tanpa istri.</p><h3>Harta istri</h3><p class="sub">Tabel biasa, tanpa suami.</p>' : ''}
    <p class="rujukan">KB 13d.2, [SYF]</p></section>
    <section class="t s4"><h2>Catatan</h2><ul class="aturan"><li>Gharqa bukan tabel baru: satu keputusan, lalu satu atau dua tabel biasa.</li><li>Bila jawabannya "Ditahan", tidak ada angka yang diminta.</li></ul></section></div>`;
}
function layarAturan() {
  return `<div class="tata"><section class="t s12"><h2>Aturan supaya isian seragam</h2>
    <ul class="aturan">
      <li><b>Tiap sel punya satu jenis isian.</b> Kolom Bagian dan Kelompok = <b>daftar pilihan</b> (1/2 … 1/6, Ashabah, 1/6 + Ashabah, Terhalang). Kolom saham dan asal masalah = <b>kotak bilangan bulat</b>. Pecahan tidak pernah diketik.</li>
      <li><b>Kotak bilangan bulat menolak selain angka saat diketik.</b> Mengetik <span class="contoh">/</span>, <span class="contoh">,</span>, atau <span class="contoh">½</span> tidak mengubah isi kotak (tidak diam-diam jadi angka lain), dan muncul keterangan "Kotak angka hanya menerima bilangan bulat. Pecahan dipilih di kolom Bagian." Angka Arab <span class="contoh">٢٤</span> diubah jadi <span class="contoh">24</span>. Papan angka HP cukup, tidak butuh garis miring.</li>
      <li><b>Asal masalah awal dipilih dari tujuh usul</b> (2, 3, 4, 6, 8, 12, 24; R09-1), karena memang hanya itu kemungkinannya. Bisa diganti "ketik" bila pengajar ingin menguji hafalan.</li>
      <li><b>Asal masalah akhir, jami'ah, dan mas'alah tiap kemungkinan diketik</b> sebagai bilangan bulat ('aul 7, 13, 27; tashih dan jami'ah bebas).</li>
      <li><b>Saham selalu terhadap asal masalah di kepala kolomnya</b>, bukan pecahan dari harta. Jadi tidak ada pertanyaan "disederhanakan atau tidak".</li>
      <li><b>Terhalang mengisi 0 sendiri</b> di sel angka barisnya. "0 dulu" (haml/mafqud) adalah kelompok tersendiri, bukan Terhalang.</li>
      <li><b>Kelipatan asal masalah akhir</b> (48 untuk 24) dengan perbandingan benar dinilai "perbandingan benar, belum yang terkecil".</li>
      <li><b>Ashabah bersama</b> (anak lk + anak pr, saudara lk + saudari) diisi di satu sel gabungan sebelum tashih, seperti di kitab.</li>
    </ul></section></div>`;
}

const tab = document.getElementById('tab'), layar = document.getElementById('layar');
function gambar() {
  const s = SOAL[aktif];
  tab.innerHTML = Object.entries(SOAL).map(([id, x]) => `<button role="tab" aria-selected="${id === aktif}" data-tab="${id}">${x.tab}</button>`).join('');
  document.getElementById('bab').textContent = s.bab; document.getElementById('judul').textContent = s.judul; document.getElementById('soal').textContent = s.soal;
  layar.innerHTML = aktif === 'gharqa' ? layarGharqa() : aktif === 'aturan' ? layarAturan() : layarSoal(aktif);
}
const simpan = () => document.querySelectorAll('[data-k]').forEach(e => nilai[e.dataset.k] = e.value);
document.addEventListener('click', e => {
  const el = e.target.closest('button'); if (!el) return;
  simpan();
  if (el.dataset.tab) aktif = el.dataset.tab;
  else if (el.dataset.bertahap) { bertahap = el.dataset.bertahap === 'true'; umpan[aktif] = null; salah[aktif] = []; }
  else if (el.dataset.usul) ketikUsul = el.dataset.usul === 'true';
  else if (el.dataset.periksa) umpan[el.dataset.periksa] = periksa(el.dataset.periksa);
  else if (el.dataset.ulang) { Object.keys(nilai).filter(x => x.startsWith(el.dataset.ulang + '|')).forEach(x => delete nilai[x]); lolos[el.dataset.ulang] = 0; umpan[el.dataset.ulang] = null; salah[el.dataset.ulang] = []; }
  else if (el.dataset.gharqa) gharqaPilih = el.dataset.gharqa;
  else return;
  gambar();
});
document.addEventListener('input', e => {
  if (e.target.dataset.bulat === undefined) return;
  // Angka Arab diterima (diubah ke Latin); selain angka ditolak utuh supaya "1/8" tidak berubah diam-diam jadi "18".
  const latin = e.target.value.replace(/[٠-٩۰-۹]/g, c => String(c.charCodeAt(0) % 16));
  if (/^\d{0,6}$/.test(latin)) { e.target.value = latin; nilai[e.target.dataset.k] = latin; return; }
  e.target.value = nilai[e.target.dataset.k] ?? '';
  document.getElementById('petunjukBulat')?.classList.add('on');
});
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT') { simpan(); if (e.target.value === 'Terhalang' || nilai[e.target.dataset.k] !== undefined) gambar(); } });
gambar();
</script>
</body>
</html>
