<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tangga bantuan soal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<!-- Mockup tangga bantuan, revisi 2 (2026-11-23). Acuan: docs/design/spec-tangga-bantuan-soal.md.
     Kasus: KB 16.1 (istri, anak lk, anak pr). Kunci: istri 1/8 → 3, anak lk Ashabah → 14, anak pr Ashabah → 7; asal masalah 8, akhir 24.
     Singgungan "bagian istri berkurang" = HAJB_NUQSHAN (penyebab: anak), bab 04. Teks petunjuk konsep = draf, dicek ke KB/glosarium sebelum masuk diksi.
     Judul soal buta sampai selesai (judulSoalTampil): hero dan daftar menampilkan "Soal H-03". -->
<style>
:root{--page:#b9d4c0;--frame:#eef3e8;--ink:#14181a;--muted:#525c57;--card:#fff;--orange:#f2682a;--aksen:#f2682a;--aksen-soft:#fdeee5;--mint:#dcefe2;--kuning:#fbefc9;--kuning-ink:#6b4f00;--black:#0e0f10;--line:#d5ddd2;--hijau:#1f6f5c;--sorot-fardh:#1f6f5c;--merah:#fdecea;--merah-ink:#7a2a17;--surface:#f3f6f1;
--font:"Onest",system-ui,sans-serif;--sh:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.5 var(--font);padding:18px 16px 90px}
h1,h2,h3,p{margin:0}
button,input,select{font-family:inherit}
.ik{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.tautan{background:none;border:0;padding:0;font:600 14px var(--font);color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:36px;display:inline-flex;gap:6px;align-items:center;text-align:left}
.tautan.bahaya{color:#9a3a22}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.atas{max-width:1120px;margin:0 auto 12px}
.atas p{font-size:13px;color:#2c4136;margin:0 4px 8px}
nav.tab{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
nav.tab button{flex:none;border:0;background:rgba(255,255,255,.5);color:var(--ink);font:500 14px var(--font);padding:9px 14px;border-radius:999px;cursor:pointer}
nav.tab button[aria-selected=true]{background:var(--black);color:#fff}
.frame{max-width:1120px;margin:0 auto;background:var(--frame);border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(20,40,30,.18)}
.hero{color:#fff;background-color:#0f3a38;padding:16px 24px 22px;background-image:radial-gradient(520px 300px at 82% 60%,rgba(255,150,40,.3),transparent 70%),radial-gradient(420px 260px at 6% 0%,rgba(60,210,170,.28),transparent 70%),linear-gradient(135deg,#0a2326 0%,#0f3a38 55%,#0b2a2b 100%)}
.bilah{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:rgba(255,255,255,.85)}
.hero h1{font-size:26px;line-height:1.15;font-weight:500;letter-spacing:-.02em;margin-top:14px}
.kalimat{font-size:15.5px;margin-top:6px;color:rgba(255,255,255,.95);max-width:72ch}
.tata{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;padding:20px 24px 28px}
.t{background:var(--card);border-radius:24px;padding:18px 20px;box-shadow:var(--sh);min-width:0}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s12{grid-column:span 12}
.t h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.kepalaT{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
/* XP: dasar + bonus mandiri (bingkai untung, bukan potongan) */
.xp{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.xp b{color:var(--ink)}
.bonus{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:2px 9px;background:var(--kuning);color:var(--kuning-ink);font-weight:600}
.bonus.lepas{background:#eef0ec;color:var(--muted);text-decoration:line-through}
.sub{font-size:14px;color:var(--muted);margin-top:2px}
.wadahTabel{overflow-x:auto;margin-top:14px}
table.kitab{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.kitab th,.kitab td{border:1.5px solid var(--line);padding:7px 8px;text-align:center;vertical-align:middle;min-width:76px}
.kitab th{background:#f3f6f1;font-weight:600;font-size:13px}
.kitab th .judulKol{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-bottom:4px}
.kitab td.nama,.kitab th.nama{text-align:left;font-weight:500;min-width:128px}
.kitab .keliru{background:var(--merah)}
.kitab .kunci{font-weight:700;color:var(--hijau)}
.kitab .kunci s{color:var(--merah-ink);font-weight:500;margin-right:6px}
.kitab select{font:600 14px var(--font);border:1.5px solid var(--line);border-radius:9px;padding:5px 4px;background:#fff;color:var(--ink)}
.bulat{font:600 15px var(--font);border:1.5px solid var(--line);border-radius:9px;padding:5px 4px;text-align:center;width:60px;background:#fff}
.btn{border:0;background:var(--black);color:#fff;font:600 14px var(--font);border-radius:999px;padding:11px 20px;cursor:pointer;min-height:44px}
.btn.lemah{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);padding:8px 16px;min-height:38px}
.aksi{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:16px}
.umpan{margin-top:12px;border-radius:14px;padding:11px 14px;font-size:14px}
.umpan.benar{background:var(--mint);color:#174d3c}.umpan.salah{background:var(--merah);color:var(--merah-ink)}.umpan.netral{background:#eef0ec;color:#2c3a33}
.umpan .tautan{color:inherit;min-height:28px;margin-top:4px}
/* Petunjuk: satu kartu, isi bertambah ke bawah, satu aksi berikutnya */
.petunjuk{border-radius:18px;background:#fff8e6;border:1.5px solid #f1dfae;padding:14px 16px;margin-top:12px;animation:muncul .4s ease-out}
@keyframes muncul{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.petunjuk{animation:none}}
.petunjuk h3{font-size:14px;font-weight:700;color:var(--kuning-ink);display:flex;gap:8px;align-items:center}
.butir{margin-top:8px;font-size:15px;line-height:1.55}
.butir + .butir{border-top:1.5px dashed #f1dfae;padding-top:8px}
.butir a{color:var(--kuning-ink);font-weight:600}
.kakiPetunjuk{display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1.5px solid #f1dfae}
.petunjuk .materi{color:var(--muted);font-weight:500}
.petunjuk .lanjut{color:var(--kuning-ink)}
/* Layar selesai */
.hasilAtas{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hasilAtas h2{font-size:24px}
.dapatXp{font-size:15px;font-weight:700;background:var(--mint);color:#174d3c;border-radius:999px;padding:4px 12px}
.blokHasil{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.blok{border-radius:16px;padding:14px 16px;background:var(--surface)}
.blok h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:flex;gap:6px;align-items:center}
.blok p{margin-top:6px;font-size:15px}
.blok.ulang{background:#fff8e6}
@media(max-width:760px){.blokHasil{grid-template-columns:1fr}}
.petunjuk .lanjut.bahaya{color:#9a3a22}
/* Dialog */
.latarDialog{position:fixed;inset:0;background:rgba(10,20,15,.45);display:grid;place-items:center;padding:16px;z-index:5}
.dialog{background:#fff;border-radius:24px;max-width:420px;width:100%;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.dialog h2{font-size:20px}
.dialog p{font-size:14.5px;color:var(--muted);margin-top:8px}
.dialog label{display:block;font-size:14px;margin-top:16px}
.dialog input{width:100%;margin-top:6px;font:600 16px var(--font);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.dialog .galat{font-size:13px;color:var(--merah-ink);margin-top:6px}
.dialog .aksi{justify-content:flex-end}
/* Selesai */
.predikat{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:14px}
.ringkas{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14.5px}
.ringkas li{display:flex;gap:8px;align-items:flex-start}
.catatan{font-size:13px;color:var(--muted);margin-top:14px;border-top:1.5px dashed var(--line);padding-top:10px}
/* Daftar Latihan: gaya asli DaftarSoalHitung */
.daftar-soal{list-style:none;margin:10px 0 0;padding:0}
.baris-soal{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:16px}
.baris-soal.disarankan{background:var(--aksen-soft)}
.status-soal{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px dashed #aab8a7;color:#fff}
.baris-soal.selesai .status-soal{border:0;background:var(--sorot-fardh)}
.baris-soal.selesai .status-dibantu{background:#6f9a8c}
.baris-soal.selesai .status-dibuka{border:1.5px solid #c9d4c6;background:#e9ede6;color:#4a5853}
.baris-soal.disarankan .status-soal{border:2px solid var(--aksen)}
.isi-soal{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.isi-soal b{font:600 16px/1.4 var(--font)}
.baris-soal.selesai .isi-soal b{font-weight:500;color:var(--muted)}
.keterangan{font-size:13.5px;color:var(--muted)}
.tingkat{font-weight:800}
.penanda{font-weight:700;color:#a83a08}
.ulangi{color:var(--kuning-ink);font-weight:600}
.kepala-bab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:760px){
  body{padding:12px 8px 90px}
  .hero{padding:14px 16px 18px}.hero h1{font-size:22px}
  .tata{grid-template-columns:1fr;padding:16px}
  .s8,.s4,.s12{grid-column:auto}
  .baris-soal{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:start;gap:6px 12px;padding:12px 8px}
  .baris-soal .isi-soal{grid-column:2}
  .baris-soal .btn{grid-column:2;justify-self:start;margin-top:4px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-lampu" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-mata" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-cek" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-ulang" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></symbol>
  <symbol id="i-buku" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></symbol>
  <symbol id="i-bintang" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></symbol>
</svg>
<div class="atas">
  <p>Mockup tangga bantuan (revisi 2). Pilih keadaan, atau klik aksi di dalam layar. Ini contoh, tidak ada yang disimpan.</p>
  <nav class="tab" role="tablist" id="tab"></nav>
</div>
<div class="frame">
  <header class="hero"><div class="bilah"><span>Latihan · soal 3 dari 12</span><span>Bab ashabah</span></div>
    <h1 id="judulSoal">Soal H-03</h1>
    <p class="kalimat">Almarhum meninggalkan istri, satu anak laki-laki, dan satu anak perempuan. Isi tabelnya.</p></header>
  <div id="layar"></div>
</div>
<div id="wadahDialog"></div>
<script>
// XP = dasar + bonus mandiri (spec bagian 5, revisi 2). Bonus lepas kalau memakai petunjuk atau Periksa salah lebih dari 3 kali.
const XP_DASAR = 12, XP_BONUS = 8;
const BAGIAN = ['1/2', '1/4', '1/8', '2/3', '1/3', '1/6', 'Ashabah', 'Terhalang'];
const BARIS = [
  { nama: 'Istri', kunci: { bagian: '1/8', awal: '1', akhir: '3' } },
  { nama: 'Anak laki-laki', kunci: { bagian: 'Ashabah', awal: '7', akhir: '14' } },
  { nama: 'Anak perempuan', kunci: { bagian: 'Ashabah', awal: '7', akhir: '7' } },
];
const KEADAAN = [
  { id: 'awal', tab: '1 · Awal' },
  { id: 'salah1', tab: '2 · Salah sekali' },
  { id: 'tawar', tab: '3 · Petunjuk ditawarkan' },
  { id: 'p1', tab: '4 · Petunjuk 1' },
  { id: 'p2', tab: '5 · Petunjuk 2' },
  { id: 'dialog', tab: '6 · Ketik "hangus"' },
  { id: 'dibuka', tab: '7 · Kolom dibuka' },
  { id: 'selesai', tab: '8 · Selesai' },
  { id: 'daftar', tab: '9 · Daftar Latihan' },
];
const isianSalah = { 0: '1/4', 1: 'Ashabah', 2: 'Ashabah' };
let aktif = 'awal';
const ik = (id, ukuran = 18) => `<svg class="ik" width="${ukuran}" height="${ukuran}"><use href="#i-${id}"/></svg>`;

function render() {
  document.getElementById('tab').innerHTML = KEADAAN.map(k => `<button role="tab" aria-selected="${k.id === aktif}" data-k="${k.id}">${k.tab}</button>`).join('');
  document.getElementById('judulSoal').textContent = aktif === 'selesai' ? 'Istri, anak laki-laki, dan anak perempuan' : 'Soal H-03';
  document.getElementById('layar').innerHTML = aktif === 'daftar' ? layarDaftar() : aktif === 'selesai' ? layarSelesai() : layarSoal();
  document.getElementById('wadahDialog').innerHTML = aktif === 'dialog' ? dialogHangus() : '';
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { aktif = b.dataset.k; render(); });
  document.getElementById('ketik')?.focus();
}

function teksXp() {
  if (aktif === 'dibuka') return `<span class="xp">Kolom dibuka, soal ini tanpa XP</span>`;
  const lepas = ['p1', 'p2', 'dialog'].includes(aktif);
  return lepas ? `<span class="xp"><b>${XP_DASAR} XP</b> · bonus hilang karena pakai petunjuk</span>`
    : `<span class="xp"><b>${XP_DASAR} XP</b><span class="bonus">${ik('bintang', 14)}+${XP_BONUS} kalau tanpa petunjuk</span></span>`;
}

function layarSoal() {
  const dibuka = aktif === 'dibuka', salah = aktif !== 'awal';
  const sel = (b, i) => {
    if (dibuka) return `<td><span class="kunci">${i === 0 ? '<s>1/4</s>' : ''}${b.kunci.bagian}</span></td>`;
    const nilai = salah ? isianSalah[i] : '';
    return `<td class="${salah && i === 0 ? 'keliru' : ''}"><select aria-label="Bagian ${b.nama}"><option value="">Pilih</option>${BAGIAN.map(p => `<option ${p === nilai ? 'selected' : ''}>${p}</option>`).join('')}</select></td>`;
  };
  const angka = (b, kol) => `<td><input class="bulat" inputmode="numeric" aria-label="${kol} ${b.nama}" value="${salah && kol === 'awal' ? (b.nama === 'Istri' ? '1' : '3') : ''}"></td>`;
  return `<div class="tata">
    <section class="t s8" aria-labelledby="jt">
      <div class="kepalaT"><h2 id="jt">Tabel faraidh</h2>${teksXp()}</div>
      <p class="sub">Isi dari kiri ke kanan, lalu Periksa.</p>
      <div class="wadahTabel"><table class="kitab">
        <thead><tr><th class="nama">Ahli waris</th><th><span class="judulKol">Bagian</span></th>
          <th><span class="judulKol">Asal masalah</span><input class="bulat" value="${salah ? '4' : ''}" aria-label="Asal masalah"></th>
          <th><span class="judulKol">Asal masalah akhir</span><input class="bulat" aria-label="Asal masalah akhir"></th></tr></thead>
        <tbody>${BARIS.map((b, i) => `<tr><td class="nama">${b.nama}</td>${sel(b, i)}${angka(b, 'awal')}${angka(b, 'akhir')}</tr>`).join('')}</tbody>
      </table></div>
      ${umpan()}
      ${kartuPetunjuk()}
      <div class="aksi">
        <button class="btn" data-k="${{ awal: 'salah1', salah1: 'tawar', dibuka: 'selesai' }[aktif] ?? aktif}">Periksa</button>
        <button class="tautan" data-k="awal">Kosongkan</button>
        ${dibuka ? `<button class="tautan bahaya" data-k="selesai">${ik('mata')}Buka semua kolom</button>` : ''}
      </div>
    </section>
    <aside class="t s4" aria-labelledby="jc">
      <h2 id="jc">Cara mengisi</h2>
      <ol class="sub" style="padding-left:20px;margin-top:8px">
        <li><b>Bagian</b> dipilih dari daftar.</li>
        <li>Saham = bilangan bulat terhadap asal masalah di kepala kolom.</li>
        <li>Salah tidak mengurangi XP. Perbaiki saja yang merah.</li>
        <li>Salah 2 kali? Petunjuk boleh dibuka. Bonusnya saja yang hilang.</li>
      </ol>
    </aside>
  </div>`;
}

function umpan() {
  if (aktif === 'awal') return '';
  if (aktif === 'dibuka') return `<div class="umpan netral">Jawaban kolom <b>Bagian</b> sudah ditampilkan. Sekarang isi kolom <b>Asal masalah</b>.</div>`;
  const tawar = aktif === 'tawar';
  return `<div class="umpan salah" role="status">
      ${aktif === 'salah1' ? 'Bagian <b>istri</b> belum tepat. Ganti pilihannya, lalu Periksa lagi.' : 'Bagian <b>istri</b> masih belum tepat.'}
      ${tawar ? `<br><button class="tautan" data-k="p1">${ik('lampu')}Butuh petunjuk?</button>` : ''}
    </div>`;
}

function kartuPetunjuk() {
  if (!['p1', 'p2', 'dialog'].includes(aktif)) return '';
  const kedua = aktif !== 'p1';
  return `<section class="petunjuk" aria-labelledby="jp">
    <h3 id="jp">${ik('lampu', 16)}Petunjuk ${kedua ? '2 dari 2' : '1 dari 2'}</h3>
    <p class="butir">Bagian istri bisa <b>1/4</b> atau <b>1/8</b>. Yang menentukan: almarhum punya anak (atau cucu dari anak laki-laki) atau tidak.</p>
    ${kedua ? `<p class="butir">Cek lagi soalnya: almarhum punya anak?</p>` : ''}
    <div class="kakiPetunjuk">
      ${kedua ? `<button class="tautan lanjut bahaya" data-k="dialog">${ik('mata')}Tunjukkan jawabannya</button>`
              : `<button class="tautan lanjut" data-k="p2">Masih bingung? Petunjuk 2</button>`}
      <a class="tautan materi" href="#">${ik('buku', 16)}Baca materi bagian istri</a>
    </div>
  </section>`;
}

function dialogHangus() {
  return `<div class="latarDialog"><div class="dialog" role="alertdialog" aria-labelledby="jd" aria-describedby="dd">
    <h2 id="jd">Lihat jawaban kolom Bagian?</h2>
    <p id="dd">Soal ini jadi tidak dapat XP, termasuk kalau nanti diulang. Kolom lain tetap kamu isi sendiri.</p>
    <label for="ketik">Ketik <b>hangus</b> kalau yakin</label>
    <input id="ketik" autocomplete="off" spellcheck="false">
    <p class="galat" id="galat" hidden>Ketik kata hangus, persis seperti itu.</p>
    <div class="aksi"><button class="tautan" data-k="p2">Coba lagi dulu</button>
      <button class="btn" id="bukaKolom">Tunjukkan</button></div>
  </div></div>`;
}
document.addEventListener('click', e => {
  if (e.target.id !== 'bukaKolom') return;
  if (document.getElementById('ketik').value.trim().toLowerCase() === 'hangus') { aktif = 'dibuka'; render(); }
  else document.getElementById('galat').hidden = false;
});

function layarSelesai() {
  return `<div class="tata"><section class="t s12" aria-labelledby="js">
    <div class="hasilAtas">
      <div><h2 id="js">Selesai!</h2><p class="sub">2 dari 3 kolom kamu kerjakan sendiri.</p></div>
      <span class="dapatXp">Tanpa XP</span>
    </div>
    <div class="blokHasil">
      <div class="blok"><h3>${ik('cek', 16)}Sudah bisa</h3><p>Asal masalah dan asal masalah akhir.</p></div>
      <div class="blok ulang"><h3>${ik('buku', 16)}Perlu dipelajari lagi</h3><p>Bagian istri. <a href="#">Baca materinya</a></p></div>
    </div>
    <p class="sub" style="margin-top:14px">${ik('ulang', 16)} Soal ini kami tandai <b>layak diulang</b>. Coba lagi besok tanpa petunjuk.</p>
    <div class="aksi"><button class="btn" data-k="daftar">Soal berikutnya</button>
      <button class="tautan" data-k="awal">Kerjakan ulang sekarang</button></div>
    <p class="catatan">Keadaan lain di layar yang sama. Tanpa petunjuk: "Selesai! Semua kolom kamu kerjakan sendiri." dengan pil "+${XP_DASAR + XP_BONUS} XP", tanpa blok "Perlu dipelajari lagi". Pakai petunjuk: pil "+${XP_DASAR} XP" dan blok "Perlu dipelajari lagi" untuk kolom yang dibantu.</p>
  </section></div>`;
}

function layarDaftar() {
  const soal = [
    { kode: 'H-01', judul: 'Suami dan dua anak perempuan', tingkat: 'Dasar', status: 'benar', ket: 'Sudah benar · mandiri' },
    { kode: 'H-02', judul: 'Ibu, ayah, dan istri', tingkat: 'Dasar', status: 'dibantu', ket: 'Benar dengan petunjuk', ulangi: true },
    { kode: 'H-03', judul: 'Istri, anak laki-laki, dan anak perempuan', tingkat: 'Dasar', status: 'dibuka', ket: 'Satu kolom dibuka', ulangi: true },
    { kode: 'H-04', tingkat: 'Menengah', status: 'belum', disarankan: true },
    { kode: 'H-05', tingkat: 'Menengah', status: 'belum' },
  ];
  return `<div class="tata"><section class="t s12" aria-labelledby="jl">
    <div class="kepala-bab"><h2 id="jl">Bab ashabah</h2><span class="keterangan">3 dari 5 selesai</span></div>
    <ul class="daftar-soal">${soal.map(s => {
      const selesai = s.status !== 'belum';
      return `<li class="baris-soal ${selesai ? 'selesai' : ''} ${s.disarankan ? 'disarankan' : ''}">
        <span class="status-soal status-${s.status}" role="img" aria-label="${s.ket ?? 'Belum dikerjakan'}">${s.status === 'benar' || s.status === 'dibantu' ? ik('cek', 16) : s.status === 'dibuka' ? ik('mata', 16) : ''}</span>
        <div class="isi-soal"><b>${selesai ? s.judul : `Soal ${s.kode}`}</b>
          <span class="keterangan"><span class="tingkat">${s.tingkat}</span>${s.ket ? ` · ${s.ket}` : ''}${s.ulangi ? ` · <span class="ulangi">layak diulang</span>` : ''}${s.disarankan ? ` · <span class="penanda">Soal berikutnya untukmu</span>` : ''}</span></div>
        <button class="btn ${s.disarankan ? '' : 'lemah'}" data-k="awal">${s.ulangi ? 'Ulangi' : selesai ? 'Pembahasan' : 'Kerjakan'}</button>
      </li>`;
    }).join('')}</ul>
    <p class="catatan">Gaya baris sama dengan daftar Latihan sekarang. Yang baru hanya keterangan (mandiri / dengan petunjuk / kolom dibuka) dan penanda "layak diulang". Judul tetap buta sampai soal selesai.</p>
  </section></div>`;
}
render();
</script>
