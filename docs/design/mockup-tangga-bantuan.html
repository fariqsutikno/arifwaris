<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tangga bantuan soal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<!-- Mockup tangga bantuan. Acuan: docs/design/spec-tangga-bantuan-soal.md. Kasus: KB 16.1 (istri, anak lk, anak pr).
     Kunci: istri 1/8 → 3, anak lk Ashabah → 14, anak pr Ashabah → 7; asal masalah 8, akhir 24.
     Singgungan "bagian istri berkurang" = HAJB_NUQSHAN (penyebab: anak), bab 04. Teks petunjuk konsep = draf, perlu dicek ke KB/glosarium sebelum masuk diksi. -->
<style>
:root{--page:#b9d4c0;--frame:#eef3e8;--ink:#14181a;--muted:#525c57;--card:#fff;--orange:#f2682a;--mint:#dcefe2;--kuning:#fbefc9;--kuning-ink:#6b4f00;--black:#0e0f10;--line:#d5ddd2;--hijau:#1f6f5c;--merah:#fdecea;--merah-ink:#7a2a17;--biru:#eaf0fb;--biru-ink:#23406e;
--font:"Onest",system-ui,sans-serif;--sh:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.5 var(--font);padding:18px 16px 90px}
h1,h2,h3,p{margin:0}
button,input,select{font-family:inherit}
.ik{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.tautan{background:none;border:0;padding:0;font:600 14px var(--font);color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:36px;display:inline-flex;gap:6px;align-items:center}
.tautan.bahaya{color:#9a3a22}
.tautan .harga{font-weight:500;color:var(--muted);text-decoration:none}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.atas{max-width:1120px;margin:0 auto 12px}
.atas p{font-size:13px;color:#2c4136;margin:0 4px 8px}
nav.tab{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
nav.tab button{flex:none;border:0;background:rgba(255,255,255,.5);color:var(--ink);font:500 14px var(--font);padding:9px 14px;border-radius:999px;cursor:pointer}
nav.tab button[aria-selected=true]{background:var(--black);color:#fff}
.frame{max-width:1120px;margin:0 auto;background:var(--frame);border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(20,40,30,.18)}
.hero{color:#fff;background-color:#0f3a38;padding:16px 24px 22px;background-image:radial-gradient(520px 300px at 82% 60%,rgba(255,150,40,.3),transparent 70%),radial-gradient(420px 260px at 6% 0%,rgba(60,210,170,.28),transparent 70%),linear-gradient(135deg,#0a2326 0%,#0f3a38 55%,#0b2a2b 100%)}
.bilah{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:rgba(255,255,255,.85)}
.hero h1{font-size:26px;line-height:1.15;font-weight:500;letter-spacing:-.02em;margin-top:14px}
.kalimat{font-size:15.5px;margin-top:6px;color:rgba(255,255,255,.95);max-width:72ch}
.tata{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;padding:20px 24px 28px}
.t{background:var(--card);border-radius:24px;padding:18px 20px;box-shadow:var(--sh);min-width:0}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s12{grid-column:span 12}
.t h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.kepalaT{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.xp{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;align-items:center}
.xp b{color:var(--ink)}
.xp s{color:var(--muted)}
.xp.hangus b{color:var(--merah-ink)}
.sub{font-size:14px;color:var(--muted);margin-top:2px}
.wadahTabel{overflow-x:auto;margin-top:14px}
table.kitab{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.kitab th,.kitab td{border:1.5px solid var(--line);padding:7px 8px;text-align:center;vertical-align:middle;min-width:76px}
.kitab th{background:#f3f6f1;font-weight:600;font-size:13px}
.kitab th .judulKol{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-bottom:4px}
.kitab td.nama,.kitab th.nama{text-align:left;font-weight:500;min-width:128px}
.kitab th.sorot,.kitab td.sorot{box-shadow:inset 0 0 0 2px var(--orange)}
.kitab .keliru{background:var(--merah)}
.kitab .kunci{font-weight:700;color:var(--hijau)}
.kitab .kunci s{color:var(--merah-ink);font-weight:500;margin-right:6px}
.kitab select{font:600 14px var(--font);border:1.5px solid var(--line);border-radius:9px;padding:5px 4px;background:#fff;color:var(--ink)}
.bulat{font:600 15px var(--font);border:1.5px solid var(--line);border-radius:9px;padding:5px 4px;text-align:center;width:60px;background:#fff}
.btn{border:0;background:var(--black);color:#fff;font:600 14px var(--font);border-radius:999px;padding:11px 20px;cursor:pointer;min-height:44px}
.btn.lemah{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.aksi{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:16px}
.umpan{margin-top:12px;border-radius:14px;padding:11px 14px;font-size:14px}
.umpan.benar{background:var(--mint);color:#174d3c}.umpan.salah{background:var(--merah);color:var(--merah-ink)}
.datang{font-size:13px;color:var(--muted);margin-top:10px;display:flex;gap:8px;align-items:center}
.titik{display:inline-flex;gap:4px}.titik i{width:8px;height:8px;border-radius:50%;background:var(--line)}.titik i.on{background:var(--hijau)}
/* Kartu bantuan */
.bantuan{border-radius:18px;background:var(--biru);color:var(--biru-ink);padding:14px 16px;margin-top:14px;animation:muncul .45s ease-out}
@keyframes muncul{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bantuan{animation:none}}
.bantuan h3{font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center}
.tangga{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.tangga li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.anak{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--font);background:#fff;color:var(--biru-ink);box-shadow:inset 0 0 0 1.5px #c3d1ea}
.anak.diambil{background:var(--biru-ink);color:#fff;box-shadow:none}
.tangga .isi{font-size:14px;color:var(--ink)}
.tangga .isi .label{font-weight:600;color:var(--biru-ink);display:block}
.tangga .isi a{color:var(--biru-ink)}
.tangga li.terkunci .isi{color:var(--muted)}
.ajak{font-size:13.5px;color:var(--biru-ink);margin-top:6px}
/* Dialog */
.latarDialog{position:fixed;inset:0;background:rgba(10,20,15,.45);display:grid;place-items:center;padding:16px;z-index:5}
.dialog{background:#fff;border-radius:24px;max-width:440px;width:100%;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.dialog h2{font-size:20px}
.dialog ul{margin:10px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.dialog label{display:block;font-size:14px;margin-top:14px;font-weight:600}
.dialog input{width:100%;margin-top:6px;font:600 16px var(--font);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.dialog .galat{font-size:13px;color:var(--merah-ink);margin-top:6px}
.dialog .aksi{justify-content:flex-end}
/* Selesai */
.predikat{display:flex;gap:14px;align-items:center;margin-top:4px}
.predikat .kata{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ringkas{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.ringkas li{display:flex;gap:8px;align-items:center}
/* Daftar latihan */
.daftar{list-style:none;margin:12px 0 0;padding:0}
.daftar li{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 0;border-top:1.5px solid var(--line)}
.daftar .jd{font-weight:600}.daftar .jd small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.label-p{font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px}
.p-mandiri{background:var(--mint);color:#174d3c}.p-dibantu{background:var(--biru);color:var(--biru-ink)}.p-dibuka{background:#eef0f4;color:#2c3445}
.catatan{font-size:13px;color:var(--muted);margin-top:14px;border-top:1.5px dashed var(--line);padding-top:10px}
@media(max-width:760px){
  body{padding:12px 8px 90px}
  .hero{padding:14px 16px 18px}.hero h1{font-size:22px}
  .tata{grid-template-columns:1fr;padding:16px}
  .s8,.s4,.s12{grid-column:auto}
  .daftar li{grid-template-columns:1fr auto}
  .daftar li .tautan{grid-column:1/-1;justify-self:start}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-bantu" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-lampu" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-mata" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-cek" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-ulang" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></symbol>
  <symbol id="i-buku" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></symbol>
</svg>
<div class="atas">
  <p>Mockup tangga bantuan soal hitung. Pilih keadaan di bawah, atau klik aksi di dalam layar. Ini contoh, tidak ada yang disimpan.</p>
  <nav class="tab" role="tablist" id="tab"></nav>
</div>
<div class="frame">
  <header class="hero"><div class="bilah"><span>Latihan · soal 3 dari 12</span><span>Bab ashabah</span></div>
    <h1>Istri, anak laki-laki, dan anak perempuan</h1>
    <p class="kalimat">Almarhum meninggalkan istri, satu anak laki-laki, dan satu anak perempuan. Isi tabelnya.</p></header>
  <div id="layar"></div>
</div>
<div id="wadahDialog"></div>
<script>
const BOBOT = 20, POTONG = 3, LANTAI = 8; // 15% dari 20 = 3; lantai 40% = 8 (spec bagian 5)
const BAGIAN = ['1/2', '1/4', '1/8', '2/3', '1/3', '1/6', 'Ashabah', 'Terhalang'];
const BARIS = [
  { nama: 'Istri', kunci: { bagian: '1/8', awal: '1', akhir: '3' } },
  { nama: 'Anak laki-laki', kunci: { bagian: 'Ashabah', awal: '7', akhir: '14' } },
  { nama: 'Anak perempuan', kunci: { bagian: 'Ashabah', awal: '7', akhir: '7' } },
];
const KEADAAN = [
  { id: 'awal', tab: '1 · Awal' },
  { id: 'salah1', tab: '2 · Salah sekali' },
  { id: 'muncul', tab: '3 · Bantuan datang' },
  { id: 'konsep', tab: '4 · Petunjuk konsep' },
  { id: 'singgung', tab: '5 · Singgungan kasus' },
  { id: 'dialog', tab: '6 · Ketik "hangus"' },
  { id: 'dibuka', tab: '7 · Kolom dibuka' },
  { id: 'selesai', tab: '8 · Selesai' },
  { id: 'daftar', tab: '9 · Daftar Latihan' },
];
// Isian pelajar per keadaan: istri dijawab 1/4 (salah) sampai kolom Bagian dibuka.
const isianSalah = { 0: '1/4', 1: 'Ashabah', 2: 'Ashabah' };
let aktif = 'awal';

const ik = (id, ukuran = 18) => `<svg class="ik" width="${ukuran}" height="${ukuran}"><use href="#i-${id}"/></svg>`;
const xpDi = { awal: BOBOT, salah1: BOBOT - POTONG, muncul: BOBOT - 2 * POTONG, konsep: BOBOT - 3 * POTONG, singgung: BOBOT - 4 * POTONG, dialog: BOBOT - 4 * POTONG, dibuka: 0, selesai: 0 };

function render() {
  document.getElementById('tab').innerHTML = KEADAAN.map(k => `<button role="tab" aria-selected="${k.id === aktif}" data-k="${k.id}">${k.tab}</button>`).join('');
  document.getElementById('layar').innerHTML = aktif === 'daftar' ? layarDaftar() : aktif === 'selesai' ? layarSelesai() : layarSoal();
  document.getElementById('wadahDialog').innerHTML = aktif === 'dialog' ? dialogHangus() : '';
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { aktif = b.dataset.k; render(); });
  const masuk = document.getElementById('ketik'); if (masuk) masuk.focus();
}

function teksXp() {
  const xp = xpDi[aktif];
  if (aktif === 'dibuka') return `<span class="xp hangus">XP soal ini: <b>hangus</b></span>`;
  return `<span class="xp">XP soal ini: ${xp < BOBOT ? `<s>${BOBOT}</s> ` : ''}<b>${xp}</b></span>`;
}

function layarSoal() {
  const dibuka = aktif === 'dibuka';
  const sorot = ['muncul', 'konsep', 'singgung', 'dialog'].includes(aktif);
  const salah = aktif !== 'awal';
  const sel = (b, i) => {
    if (dibuka) return `<td class="sorot"><span class="kunci">${i === 0 ? '<s>1/4</s>' : ''}${b.kunci.bagian}</span></td>`;
    const nilai = aktif === 'awal' ? '' : isianSalah[i];
    return `<td class="${sorot ? 'sorot' : ''} ${salah && i === 0 ? 'keliru' : ''}"><select aria-label="Bagian ${b.nama}"><option value="">Pilih</option>${BAGIAN.map(p => `<option ${p === nilai ? 'selected' : ''}>${p}</option>`).join('')}</select></td>`;
  };
  const angka = (b, kol) => `<td><input class="bulat" inputmode="numeric" aria-label="${kol} ${b.nama}" value="${aktif === 'awal' ? '' : ({ awal: b.nama === 'Istri' ? '2' : '3', akhir: '' })[kol] ?? ''}"></td>`;
  return `<div class="tata">
    <section class="t s8" aria-labelledby="jt">
      <div class="kepalaT"><h2 id="jt">Tabel faraidh</h2>${teksXp()}</div>
      <p class="sub">Isi dari kiri ke kanan, lalu Periksa.</p>
      <div class="wadahTabel"><table class="kitab">
        <thead><tr><th class="nama">Ahli waris</th><th class="${sorot || dibuka ? 'sorot' : ''}"><span class="judulKol">Bagian</span></th>
          <th><span class="judulKol">Asal masalah</span><input class="bulat" value="${aktif === 'awal' ? '' : '4'}" aria-label="Asal masalah"></th>
          <th><span class="judulKol">Asal masalah akhir</span><input class="bulat" aria-label="Asal masalah akhir"></th></tr></thead>
        <tbody>${BARIS.map((b, i) => `<tr><td class="nama">${b.nama}</td>${sel(b, i)}${angka(b, 'awal')}${angka(b, 'akhir')}</tr>`).join('')}</tbody>
      </table></div>
      ${umpan()}
      ${kartuBantuan()}
      <div class="aksi">
        <button class="btn" data-k="${aktif === 'awal' ? 'salah1' : aktif === 'salah1' ? 'muncul' : aktif === 'dibuka' ? 'selesai' : aktif}">Periksa</button>
        <button class="tautan" data-k="awal">Kosongkan</button>
        ${dibuka ? `<button class="tautan bahaya" data-k="selesai">${ik('mata')}Buka sisanya</button>` : ''}
      </div>
      ${dibuka ? `<p class="catatan">"Buka sisanya" baru muncul setelah XP hangus. Sebelum itu tidak ada jalan membuka semua sekaligus.</p>` : ''}
    </section>
    <aside class="t s4" aria-labelledby="jc">
      <h2 id="jc">Cara mengisi</h2>
      <ol class="sub" style="padding-left:20px;margin-top:8px">
        <li><b>Bagian</b> dipilih dari daftar.</li>
        <li>Saham = bilangan bulat terhadap asal masalah di kepala kolom.</li>
        <li>Buntu? Setelah dua kali mencoba, bantuan datang per kolom.</li>
      </ol>
      <p class="catatan">Harga tiap bantuan selalu disebut sebelum diambil. Periksa yang salah juga memotong ${POTONG} XP, minimal tersisa ${LANTAI}.</p>
    </aside>
  </div>`;
}

function umpan() {
  if (aktif === 'awal') return '';
  if (aktif === 'dibuka') return `<div class="umpan" style="background:#eef0f4;color:#2c3445">Kolom <b>Bagian</b> dibuka. Lanjutkan kolom <b>Asal masalah</b> sendiri.</div>`;
  const usaha = aktif === 'salah1' ? 1 : 2;
  return `<div class="umpan salah" role="status">Mulai salah di kolom <b>Bagian</b>.</div>
    ${usaha < 2 ? `<p class="datang"><span class="titik"><i class="on"></i><i></i></span>Coba sekali lagi. Kalau masih buntu, bantuan datang.</p>` : ''}`;
}

function kartuBantuan() {
  if (aktif === 'awal' || aktif === 'salah1' || aktif === 'dibuka') return '';
  const tingkat = { muncul: 0, konsep: 1, singgung: 2, dialog: 2 }[aktif];
  const isi = [
    { label: 'Petunjuk konsep', teks: `Bagian istri ditentukan oleh ada atau tidaknya <b>keturunan almarhum</b>. <a href="#">Baca materi Furudh ${ik('buku', 16)}</a>`, ke: 'konsep' },
    { label: 'Singgungan kasus', teks: 'Perhatikan: di kasus ini ada orang yang membuat <b>bagian istri berkurang</b>.', ke: 'singgung' },
    { label: 'Buka jawaban kolom Bagian', teks: '', ke: 'dialog' },
  ];
  const harga = ['−3 XP', '−3 XP', 'XP soal ini hangus'];
  return `<section class="bantuan" aria-labelledby="jb">
    <h3 id="jb">${ik('bantu')}${tingkat === 0 ? 'Butuh bantuan di kolom Bagian?' : 'Bantuan · kolom Bagian'}</h3>
    ${tingkat === 0 ? `<p class="ajak">Ambil bertahap. Mulai dari petunjuk kecil dulu, sering kali itu sudah cukup.</p>` : ''}
    <ol class="tangga">${isi.map((anak, i) => {
      const diambil = i < tingkat, berikut = i === tingkat;
      return `<li class="${!diambil && !berikut ? 'terkunci' : ''}"><span class="anak ${diambil ? 'diambil' : ''}">${diambil ? ik('cek', 14) : i + 1}</span>
        <div class="isi">${diambil ? `<span class="label">${anak.label}</span>${anak.teks}`
          : berikut ? `<button class="tautan ${i === 2 ? 'bahaya' : ''}" data-k="${anak.ke}">${i === 2 ? ik('mata') : ik('lampu')}${anak.label} <span class="harga">· ${harga[i]}</span></button>`
          : `${anak.label} <span class="harga" style="color:var(--muted)">· terbuka setelah langkah ${i}</span>`}</div></li>`;
    }).join('')}</ol>
  </section>`;
}

function dialogHangus() {
  return `<div class="latarDialog"><div class="dialog" role="alertdialog" aria-labelledby="jd" aria-describedby="dd">
    <h2 id="jd">Buka jawaban kolom Bagian?</h2>
    <ul id="dd">
      <li>XP soal ini hangus selamanya, walau nanti kamu kerjakan ulang sampai benar.</li>
      <li>Hanya kolom Bagian yang dibuka. Kolom lain tetap kamu kerjakan.</li>
    </ul>
    <label for="ketik">Ketik <b>hangus</b> untuk membuka</label>
    <input id="ketik" autocomplete="off" spellcheck="false">
    <p class="galat" id="galat" hidden>Ketik kata hangus persis seperti itu.</p>
    <div class="aksi"><button class="tautan" data-k="singgung">Coba lagi dulu</button>
      <button class="btn" id="bukaKolom">Buka kolom</button></div>
  </div></div>`;
}
document.addEventListener('click', e => {
  if (e.target.id !== 'bukaKolom') return;
  if (document.getElementById('ketik').value.trim().toLowerCase() === 'hangus') { aktif = 'dibuka'; render(); }
  else document.getElementById('galat').hidden = false;
});

function layarSelesai() {
  return `<div class="tata"><section class="t s12" aria-labelledby="js">
    <div class="umpan benar" role="status">Benar semua.</div>
    <div class="predikat" style="margin-top:16px"><span class="label-p p-dibuka">Dibuka</span><span class="kata">Selesai, dengan satu kolom dibuka</span></div>
    <ul class="ringkas">
      <li>${ik('cek')}Kolom Asal masalah dan Asal masalah akhir kamu kerjakan sendiri.</li>
      <li>${ik('lampu')}Kolom Bagian: 2 petunjuk, lalu dibuka.</li>
      <li>${ik('buku')}Yang perlu diulang: <a href="#">bagian istri saat ada keturunan</a>.</li>
    </ul>
    <div class="aksi"><button class="btn" data-k="daftar">Soal berikutnya</button>
      <button class="tautan" data-k="awal">${ik('ulang')}Kerjakan ulang sekarang</button></div>
    <p class="catatan">Contoh predikat lain. Mandiri: "Benar tanpa bantuan. Kolom Bagian kali ini lancar." Dibantu: "Benar dengan 1 petunjuk, XP 14 dari 20."</p>
  </section></div>`;
}

    { j: 'Suami dan dua anak perempuan', b: 'Bab furudh', p: 'mandiri', kata: 'Mandiri' },

    { j: 'Istri, anak laki-laki, dan anak perempuan', b: 'Bab ashabah', p: 'dibuka', kata: 'Dibuka', ulang: true },
    { j: 'Suami, ibu, dan dua saudara seibu', b: 'Bab \'aul', p: '', kata: '' },

  return `<div class="tata"><section class="t s12" aria-labelledby="jl">
    <div class="kepalaT"><h2 id="jl">Latihan</h2><button class="tautan">${ik('ulang')}Ulangi yang dibantu (2)</button></div>
    <ul class="daftar">${soal.map(s => `<li><span class="jd">${s.j}<small>${s.b}${s.ulang ? ' · ulangi nanti' : ''}</small></span>
      ${s.kata ? `<span class="label-p p-${s.p}">${s.kata}</span>` : '<span></span>'}
      <button class="btn lemah" data-k="awal">${s.kata ? 'Kerjakan ulang' : 'Kerjakan'}</button></li>`).join('')}</ul>
    <p class="catatan">Kerjakan ulang yang berhasil tanpa bantuan mengganti predikat jadi Mandiri. XP tetap dari benar pertama (aturan server).</p>
