<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup layar Hasil v4</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<!-- v4. Acuan: docs/design/riset-ux-hasil-2026-11-17.md (bagian 22). Angka: saham per lapis/kemungkinan/harta dari engine untuk keluarga contoh,
     rupiah dihitung di sini dengan BigInt. Teks "kapan dapat berapa" dan dalil diambil dari konten aplikasi (snapshot.json). -->
<style>
:root{--page:#b9d4c0;--frame:#eef3e8;--ink:#14181a;--muted:#525c57;--card:rgba(255,255,255,.82);--edge:rgba(255,255,255,.95);
--orange:#f2682a;--orange-soft:#fde6d8;--mint:#dcefe2;--kuning:#fbefc9;--kuning-ink:#6b4f00;--black:#0e0f10;--line:#dfe6dc;--hijau:#1f6f5c;
--font:"Onest",system-ui,sans-serif;--sh:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.5 var(--font);padding:18px 12px 90px}
h1,h2,h3,h4,p{margin:0}
button,input,select{font-family:inherit}
.ik{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.tautan{background:none;border:0;padding:0;font:600 14px var(--font);color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.atas-mockup{max-width:1160px;margin:0 auto 12px}
.atas-mockup p{font-size:13px;color:#2c4136;margin:0 4px 8px}
nav.tab{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
nav.tab button{flex:none;border:0;background:rgba(255,255,255,.5);color:var(--ink);font:500 14px var(--font);padding:9px 14px;border-radius:999px;cursor:pointer}
nav.tab button[aria-selected=true]{background:var(--black);color:#fff}
.frame{max-width:1160px;margin:0 auto;background:var(--frame);border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(20,40,30,.18)}
.tugas{display:none;background:var(--kuning);color:#4a3a00;padding:10px 20px;font-size:13.5px}.tugas.aktif{display:block}

/* istilah + popover */
.ist{border-bottom:1.5px dotted currentColor;cursor:help;position:relative;outline:none}
.ist .pop{position:absolute;left:0;top:calc(100% + 8px);width:min(280px,80vw);background:var(--black);color:#fff;font:400 13px/1.45 var(--font);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:15;opacity:0;visibility:hidden;transform:translateY(-4px);transition:.15s;text-align:start;white-space:normal}
.ist .pop b{display:block;font-weight:600;margin-bottom:2px}
.ist .pop .ar{font-size:15px;opacity:.85;margin-left:6px}
.ist:hover .pop,.ist:focus .pop,.ist.on .pop{opacity:1;visibility:visible;transform:none}

/* hero */
.hero{color:#fff;padding:16px 20px 20px;background:radial-gradient(520px 300px at 82% 60%,rgba(255,150,40,.33),transparent 70%),radial-gradient(420px 260px at 6% 0%,rgba(60,210,170,.3),transparent 70%),linear-gradient(135deg,#0a2326 0%,#0f3a38 55%,#0b2a2b 100%)}
.bilah{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:rgba(255,255,255,.85)}
.bilah .tautan{color:#fff;display:inline-flex;gap:4px;align-items:center}
.status{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;font-size:13px}
.status i{width:8px;height:8px;border-radius:50%;background:#7fe0b0}.status.tahan i{background:#f3cf5a}
.heroIsi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:end;margin-top:16px}
.namaKasus{display:flex;gap:8px;align-items:center;font-size:14px;color:rgba(255,255,255,.85)}
.namaKasus button{background:rgba(255,255,255,.14);border:0;color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.namaKasus input{font:500 14px var(--font);border:0;border-radius:10px;padding:6px 10px;width:min(320px,70vw)}
.hero h1{font-size:34px;line-height:1.1;font-weight:500;letter-spacing:-.02em;margin-top:8px;max-width:22ch}
.hero .kalimat{font-size:15.5px;margin-top:10px;color:rgba(255,255,255,.93);max-width:54ch}
.aksiHero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:16px}
.pil{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font:600 14px var(--font);background:#fff;color:var(--ink);border:0;cursor:pointer}
.aksiHero .tautan{color:#fff;display:inline-flex;gap:6px;align-items:center}
.ubinHero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.uh{border-radius:22px;padding:13px 15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);min-width:0}
.uh .lbl{font-size:12.5px;color:rgba(255,255,255,.82)}
.uh b{display:block;font-size:21px;font-weight:600;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.uh small{display:block;font-size:12.5px;color:rgba(255,255,255,.8);margin-top:3px}
.uh.kamu{grid-column:1/-1;background:rgba(255,255,255,.95);color:var(--ink);border-color:#fff;cursor:pointer;text-align:start;font:inherit}
.uh.kamu .lbl,.uh.kamu small{color:var(--muted)}
.uh.kamu b{font-size:32px}
.uh.tahan{background:rgba(251,239,201,.95);color:var(--kuning-ink);border-color:#fbefc9}
.uh.tahan .lbl,.uh.tahan small{color:var(--kuning-ink)}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;padding:12px}
.t{background:var(--card);border:1px solid var(--edge);border-radius:24px;padding:18px;min-width:0;box-shadow:var(--sh)}
.t h2{font-size:18.5px;font-weight:600;letter-spacing:-.01em}
.t .sub{font-size:13px;color:var(--muted);margin-top:2px}
.t.mint{background:var(--mint);border-color:var(--mint)}.t.oranye{background:var(--orange-soft);border-color:var(--orange-soft)}
.t.gelap{background:var(--black);color:#fff;border-color:var(--black)}.t.gelap .sub{color:rgba(255,255,255,.72)}
.t.kuning{background:var(--kuning);border-color:var(--kuning)}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}
.kolom{display:grid;gap:12px;align-content:start;min-width:0}
.kepala-t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}

/* daftar */
.ringkasAkhir{background:var(--mint);border-radius:16px;padding:10px 12px;font-size:13.5px;margin:6px 0 4px}
.cari{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;margin:8px 0}
.cari input{border:0;flex:1;font-size:14px;outline:none;background:none}
.grupJudul{display:flex;justify-content:space-between;font:600 12.5px var(--font);color:var(--muted);margin:14px 0 0;padding-bottom:4px;border-bottom:1px solid var(--line)}
.orang{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;font:inherit;color:inherit;cursor:pointer}
.orang:hover,.orang.sorot{background:linear-gradient(90deg,rgba(242,104,42,.06),transparent)}
.ava{flex:none;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font:600 15px var(--font);color:#fff;margin-top:2px}
.nama{flex:1;min-width:0}
.nama b{font-weight:600;font-size:15.5px}
.nama .peran{display:block;color:var(--muted);font-size:13px}
.nama .alasan{display:block;font-size:13.5px;color:#2c3530;margin-top:4px}
.rp{font:600 17px/1.2 var(--font);font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.rp small{display:block;font:400 12.5px var(--font);color:var(--muted);margin-top:2px}
.panahKanan{color:var(--muted);align-self:center}
.orang.redup .nama b,.orang.redup .rp{color:var(--muted)}
.orang.redup .ava{background:#dfe3dd!important;color:#3f4944}
.lab{display:inline-block;font:600 11.5px var(--font);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.lab.kamu{background:var(--mint);color:#1f5a40}.lab.tahan{background:var(--kuning);color:var(--kuning-ink)}.lab.meninggal{background:#e7eae5;color:#4b554f}
.lipatGen{display:block;width:100%;background:rgba(20,24,26,.04);border:0;border-radius:12px;padding:10px;margin:8px 0;font:600 13.5px var(--font);cursor:pointer;color:var(--ink)}
/* penjumlahan */
.jumlahan{margin-top:12px;background:rgba(20,24,26,.035);border-radius:16px;padding:12px 14px;font-variant-numeric:tabular-nums}
.jumlahan .b{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:3px 0}
.jumlahan .b span{color:var(--muted)}
.jumlahan .b.hasil{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:8px;font-weight:600}
.jumlahan .b.hasil span{color:var(--ink)}
.bulatPilih{margin-top:12px}
.bulatPilih p{font-size:13.5px;font-weight:600;margin-bottom:6px}
.opsiBulat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opsiBulat button{border:1.5px solid #7d8a82;background:#fff;border-radius:14px;padding:9px 10px;text-align:start;cursor:pointer;font:inherit;color:var(--ink)}
.opsiBulat button b{display:block;font-size:14px;font-weight:600}
.opsiBulat button small{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.opsiBulat button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.opsiBulat button[aria-pressed=true] small{color:rgba(255,255,255,.75)}

/* info & jenis */
.info dl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin:6px 0 0;font-size:14px}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:500}
.info dd small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.hitungan{display:grid;gap:8px;margin-top:6px}
.hitungan div{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:0 12px;align-items:baseline;padding:8px 10px;background:rgba(20,24,26,.035);border-radius:12px}
.hitungan .lbl{font-size:13px;color:var(--muted);grid-row:span 2}
.hitungan b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.hitungan small{font-size:12.5px;color:#2c3530}
dl.ringkas{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:6px 0 0;font-size:14px}
dl.ringkas dt{color:var(--muted)}dl.ringkas dd{margin:0;font-weight:600}
.opsiKuis{display:grid;gap:10px}
.opsiKuis button{display:flex;gap:14px;align-items:center;width:100%;text-align:start;border:2px solid var(--line);background:#fff;border-radius:18px;padding:14px 16px;cursor:pointer;font:inherit;color:var(--ink)}
.opsiKuis button i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #7d8a82}
.opsiKuis button b{display:block;font-size:15.5px;font-weight:600}
.opsiKuis button small{display:block;color:var(--muted);font-size:13px}
.opsiKuis button span.sisaO{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap;text-align:end}
.opsiKuis button[aria-pressed=true]{border-color:var(--ink);background:var(--frame)}
.opsiKuis button[aria-pressed=true] i{border-color:var(--ink);background:radial-gradient(var(--ink) 45%,transparent 50%)}
details.lipatM{border:1px solid var(--line);border-radius:14px;margin-top:10px}
details.lipatM summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:10px}
details.lipatM summary::-webkit-details-marker{display:none}
details.lipatM summary small{font-weight:400;color:var(--muted);font-size:12.5px}
details.lipatM summary::after{content:"+";font-weight:700}
details.lipatM[open] summary::after{content:"−"}
details.lipatM .isiL{padding:0 14px 12px}
.petunjukGeser{display:none;color:var(--orange);font-weight:600}
.adaGeser .petunjukGeser{display:inline}
.info h3{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 0;letter-spacing:.02em}
.jenis .kat{font-size:13px;color:var(--muted)}
.jenis b.besar{display:block;font-size:18px;font-weight:600;margin-top:2px}
.chipDeret{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.jenis ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.jenis li{margin:3px 0}
.ditahanBaris{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid rgba(107,79,0,.15);font-size:14px}
.ditahanBaris:first-of-type{border-top:0}
.ditahanBaris span{color:var(--kuning-ink);font-size:13px;grid-column:1/-1}

/* aliran */
.rute{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 12px}
.rute button{border:0;background:#fff;border-radius:999px;padding:6px 12px;font:600 13px var(--font);cursor:pointer;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rute button.aktif{background:var(--orange);color:#fff}
.rute .ke{color:var(--muted)}
.blok{position:relative;margin:0 0 0 18px;padding:12px 0 18px 22px;border-left:3px solid var(--line)}
.blok::before{content:attr(data-lapis);position:absolute;left:-15px;top:10px;width:27px;height:27px;border-radius:50%;background:#fff;border:3px solid #9aa79f;display:grid;place-items:center;font:600 12px var(--font)}
.blok.aktif{border-left-color:var(--orange)}
.blok.aktif::before{border-color:var(--orange);background:var(--orange);color:#fff}
.blok h3{font-size:15.5px;font-weight:600}
.blok .masuk{font-size:14px;color:var(--muted);margin:2px 0 8px}
.blok .masuk b{color:var(--ink);font-size:18px}
.blok table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;background:#fff;border-radius:14px;overflow:hidden}
.blok td,.blok th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start}
.blok th{font-size:12px;color:var(--muted);font-weight:600;background:rgba(20,24,26,.03)}
.blok td.rpk{text-align:end;white-space:nowrap;font-weight:600}
.blok .terus{color:var(--orange);font-weight:600;white-space:nowrap}
.blok .selesai{color:var(--hijau);white-space:nowrap}
.blok .putarIni{margin-top:8px;font-size:13px}

/* pohon + tabel */
.panelDua{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;margin-top:8px}
.panel{background:#fff;border-radius:18px;border:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.alat{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.alat .bulat{width:34px;height:34px;border-radius:50%;border:0;background:rgba(20,24,26,.06);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.alat .putar{display:inline-flex;gap:6px;align-items:center;border:0;background:var(--black);color:#fff;border-radius:999px;padding:7px 12px;font:600 13px var(--font);cursor:pointer;margin-left:auto}
.kanvas{overflow:auto;height:430px;position:relative;background:linear-gradient(#f6f8f3,#fff)}
.kanvas svg{display:block}
.penuh{position:fixed!important;inset:0;z-index:20;border-radius:0!important}.penuh .kanvas{height:calc(100vh - 52px)}
svg.pohon .kotak rect{fill:#fff;stroke:#c9d2c8;stroke-width:1.5}
svg.pohon .terima rect{fill:#eef7ea;stroke:#6aa587}
svg.pohon .redup rect{fill:#f3f4f1;stroke:#cfd6cd;stroke-dasharray:4 3}
svg.pohon .meninggal rect{fill:#eceee9;stroke:#8f9a93}
svg.pohon .almarhum rect{fill:#0f3a38;stroke:#0f3a38}
svg.pohon .almarhum text{fill:#fff}svg.pohon .almarhum text.k{fill:#cfe2dc}
svg.pohon .tahan rect{fill:#fff7e0;stroke:#d9b44a;stroke-dasharray:5 3}
svg.pohon .kotak{cursor:pointer}
svg.pohon .sorot rect{stroke:var(--orange);stroke-width:3}
svg.pohon text{font:600 12.5px var(--font);fill:var(--ink)}
svg.pohon text.k{font:400 11.5px var(--font);fill:var(--muted)}
svg.pohon text.r{font:600 12.5px var(--font);fill:var(--hijau)}
svg.pohon .g{stroke:#9aa79f;stroke-width:1.6;fill:none}
svg.pohon .g.nikah{stroke-dasharray:2 3}
svg.pohon .g.putus{stroke:#c0503a;stroke-dasharray:6 5;stroke-width:2}
svg.pohon .alir{stroke:var(--orange);stroke-width:4;fill:none;stroke-dasharray:1;stroke-dashoffset:1;stroke-linecap:round}
svg.pohon .alir.jalan{animation:jalan .9s ease forwards}
svg.pohon .alir.diam{stroke-dashoffset:0;opacity:.45}
@keyframes jalan{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){svg.pohon .alir.jalan{animation:none;stroke-dashoffset:0}}
.legPohon{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.legPohon i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid}
.tabelWadah{overflow:auto;flex:1}
table.faraidh{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.faraidh th,table.faraidh td{padding:7px 9px;border:1px solid #cfd8cc;text-align:center;white-space:nowrap}
table.faraidh th:first-child,table.faraidh td:first-child{text-align:start;position:sticky;left:0;background:#fff;z-index:1;white-space:normal;min-width:110px}
table.faraidh thead th{background:#f3f6ef;font-weight:600;font-size:12.5px}
table.faraidh thead .angka{font-size:16px;font-weight:700}
table.faraidh thead .pengali{color:var(--orange);font-weight:700;font-size:12.5px}
table.faraidh .mati{background:#eceee9;color:var(--muted)}
table.faraidh .mati::after{content:" ✕";font-size:11px}
table.faraidh tfoot td{font-weight:700;background:#f3f6ef}
table.faraidh .jami{background:#fff4ec}
table.faraidh tr[data-id]{cursor:pointer}
table.faraidh tr.sorot td{background:rgba(242,104,42,.12)}
table.faraidh .ket{font-size:11.5px;color:var(--muted);font-weight:400;display:block}
.tabelKaki{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.segmen{display:inline-flex;background:rgba(20,24,26,.06);border-radius:999px;padding:3px;gap:2px}
.segmen.segPanel{display:none}
.segmen button{border:0;background:none;border-radius:999px;padding:5px 12px;font:500 13px var(--font);cursor:pointer;color:var(--ink)}
.segmen button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pilih{margin:4px 0 8px}
.pilih p{font-size:13px;font-weight:600;margin-bottom:6px}
.pilDeret{display:flex;flex-wrap:wrap;gap:6px}
.pk{border:1.5px solid #7d8a82;background:#fff;border-radius:999px;padding:5px 11px;font:500 13px var(--font);cursor:pointer;color:var(--ink)}
.pk[aria-checked=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* aksi bawah */
ol.lanjut{margin:8px 0 0;padding:0;list-style:none;counter-reset:n;display:grid;gap:10px}
ol.lanjut li{counter-increment:n;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px}
ol.lanjut li::before{content:counter(n);width:28px;height:28px;border-radius:50%;background:rgba(20,24,26,.08);display:grid;place-items:center;font-weight:600;font-size:13px}
ol.lanjut li span{display:block;color:var(--muted);font-size:13px}
.aksiDaftar{display:grid;gap:8px;margin-top:10px}
.aksiDaftar button{display:flex;gap:12px;align-items:center;text-align:start;background:rgba(255,255,255,.7);border:0;border-radius:16px;padding:10px 12px;font:inherit;color:inherit;cursor:pointer}
.t.gelap .aksiDaftar button{background:rgba(255,255,255,.08)}
.aksiDaftar b{display:block;font-weight:600;font-size:14.5px}
.aksiDaftar small{display:block;color:var(--muted);font-size:12.5px}

<script>
// ═══ Pecahan & uang ═══
const fpb = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) [a, b] = [b, a % b]; return a; };
const pec = (n, d) => { const g = fpb(n, d) || 1n; return [n / g, d / g]; };
const tambah = (x, y) => pec(x[0] * y[1] + y[0] * x[1], x[1] * y[1]);
const kali = (x, y) => pec(x[0] * y[0], x[1] * y[1]);
const NOL = [0n, 1n];
let SATUAN = 1n;
const bulat = (harta, f) => (harta * f[0] / f[1]) / SATUAN * SATUAN;

const rpRingkas = n => { const x = Number(n); return x >= 1e6 ? `Rp ${(x / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 })} jt` : rupiah(n); };

const teksPec = f => (String(f[1]).length > 8 ? '—' : `${f[0]}/${f[1]}`);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

  tadakhul: ['Tadakhul', 'التداخل', 'Angka yang besar sudah habis dibagi angka yang kecil, misalnya 3 dan 6; cukup pakai yang besar.'],

  adilah: ["'Adilah", 'العادلة', 'Jumlah semua bagian pas sama dengan harta; tidak ada kelebihan atau sisa.'],
  radd: ['Radd', 'الرد', 'Sisa harta dikembalikan kepada ahli waris yang bagiannya pasti, sebanding dengan bagian mereka.'],
  haml: ['Haml', 'الحمل', 'Janin dalam kandungan. Ia mewarisi bila lahir hidup.'],
  mafqud: ['Mafqud', 'المفقود', 'Orang hilang yang tidak diketahui hidup atau sudah meninggal.'],
  gharqa: ['Gharqa', 'الغرقى', 'Orang-orang yang saling mewarisi tetapi waktu meninggalnya samar, misalnya dalam kecelakaan yang sama.'],
  mauquf: ['Mauquf', 'الموقوف', 'Bagian yang ditahan dulu sampai keadaannya jelas.'],

};
const ist = (kunci, teks) => { const [j, ar, def] = ISTILAH[kunci]; return `<span class="ist" tabindex="0">${teks ?? j}<span class="pop" role="tooltip"><b>${j}<span class="ar">${ar}</span></b>${def}</span></span>`; };

// ═══ Konten aplikasi: kapan dapat berapa (ahwal) + dalil (syahid) ═══
const AHWAL = {
  ISTRI: [['1/4', 'Almarhum tidak punya anak atau cucu dari anak laki-laki.'], ['1/8', 'Almarhum punya anak atau cucu dari anak laki-laki.']],
  IBU: [['1/6', 'Ada anak/cucu, atau ada dua saudara atau lebih.'], ['1/3', 'Tidak ada anak/cucu dan saudaranya kurang dari dua.'], ['1/3 sisa', 'Hanya bersama ayah dan suami/istri (umariyyatain).']],
  ANAK_LK: [['Sisa', 'Selalu mewarisi dan tidak pernah terhalang. Bersama anak perempuan: dapat dua kali bagiannya.']],
  ANAK_PR: [['1/2', 'Sendirian, tanpa anak laki-laki.'], ['2/3', 'Dua orang atau lebih, tanpa anak laki-laki.'], ['Sisa, 1 : 2', 'Bersama anak laki-laki.']],
  SAUDARA_KANDUNG: [['Sisa', 'Tidak ada anak laki-laki, cucu laki-laki, maupun ayah.'], ['Terhalang', 'Ada anak laki-laki, cucu laki-laki, atau ayah.']],
};

  istri18: ['فَإِن كَانَ لَكُمْ وَلَدٌ فَلَهُنَّ الثُّمُنُ', 'Istri mendapat 1/8 bila suami punya anak', 'An-Nisa ayat 12'],

const ORANG = {
  PEWARIS: ['Pak Ahmad', 'Almarhum', '#0f3a38'], Aminah: ['Aminah', 'Istri almarhum', '#b5653a', 'ISTRI', 'PASANGAN'], Fatimah: ['Fatimah', 'Ibu almarhum', '#7d3c98', 'IBU', 'LELUHUR'],
  Budi: ['Budi', 'Anak laki-laki', '#3f6b2a', 'ANAK_LK', 'KETURUNAN'], Siti: ['Siti', 'Anak perempuan', '#2b6f8a', 'ANAK_PR', 'KETURUNAN'], Hasan: ['Hasan', 'Kakak laki-laki almarhum', '#9aa59e', 'SAUDARA_KANDUNG', 'SAUDARA'],
  Rina: ['Rina', 'Istri Budi (menantu)', '#a0567a', null, 'KERABAT LAPIS 2'], Zahra: ['Zahra', 'Cucu perempuan, anak Budi', '#c0503a', null, 'KETURUNAN'], Bayi: ['Bayi dalam kandungan Aminah', 'Anak almarhum', '#f3dc94', null, 'KETURUNAN'],
};
for (let i = 1; i <= 13; i++) {
  ORANG['Istri' + i] = [`Istri gen. ${i}`, i === 1 ? 'Istri almarhum' : `Istri Putra gen. ${i - 1}`, '#b5653a'];
  ORANG['Putra' + i] = [`Putra gen. ${i}`, i === 1 ? 'Anak laki-laki' : `Anak Putra gen. ${i - 1}`, '#3f6b2a'];
  ORANG['Putri' + i] = [`Putri gen. ${i}`, i === 1 ? 'Anak perempuan' : `Anak Putra gen. ${i - 1}`, '#2b6f8a'];
}
const nama = id => ORANG[id]?.[0] ?? id;

// ═══ Rantai munasakhat (saham per lapis dari engine) ═══
function hitungRantai(lapis) {
  const masuk = { PEWARIS: [1n, 1n] }, dari = {}, total = {}, mayit = new Set(lapis.map(l => l[0]));
  for (const [m, per, tot] of lapis) for (const [id, s] of Object.entries(per)) {
    const f = kali(masuk[m] ?? NOL, pec(BigInt(s), BigInt(tot)));
    (dari[id] ??= {})[m] = f;
    if (mayit.has(id)) masuk[id] = tambah(masuk[id] ?? NOL, f); else total[id] = tambah(total[id] ?? NOL, f);
  }
  return { masuk, dari, total, lapisKe: id => lapis.findIndex(l => l[0] === id) + 1 };
}
// Tabel munasakhat ala kitab (KB 12.3): kolom masalah tiap mayit, pengali di atas kolom, kolom jami'ah sesudahnya.
function tabelMunasakhat(lapis, ket) {
  const kolom = []; let jam = null, sahamJam = {};
  for (const [i, [m, per, tot]] of lapis.entries()) {
    const T = BigInt(tot);
    if (i === 0) { jam = T; sahamJam = Object.fromEntries(Object.entries(per).map(([k, v]) => [k, BigInt(v)])); kolom.push({ jenis: 'masalah', mayit: m, total: T, per, ket: ket?.[i] }); continue; }
    const s = sahamJam[m]; const g = fpb(s, T);
    let pengaliLama, pengaliBaru, hub;
    if (s % T === 0n) { pengaliLama = 1n; pengaliBaru = s / T; hub = s === T ? 'tamatsul' : 'inqisam'; }
    else if (g > 1n) { pengaliLama = T / g; pengaliBaru = s / g; hub = 'tawafuq'; }
    else { pengaliLama = T; pengaliBaru = s; hub = 'tabayun'; }
    kolom.push({ jenis: 'masalah', mayit: m, total: T, per, saham: s, hub, fpb: g, pengaliLama, pengaliBaru, ket: ket?.[i] });
    const baru = {};
    for (const [k, v] of Object.entries(sahamJam)) if (k !== m) baru[k] = (baru[k] ?? 0n) + v * pengaliLama;
    for (const [k, v] of Object.entries(per)) baru[k] = (baru[k] ?? 0n) + BigInt(v) * pengaliBaru;
    jam = jam * pengaliLama; sahamJam = baru;
    kolom.push({ jenis: 'jamiah', total: jam, saham: { ...sahamJam }, akhir: i === lapis.length - 1 });
  }
  return { kolom, jam, sahamJam };
}

const LAPIS_RANTAI = [['PEWARIS', { Istri1: 3, Putra1: 14, Putri1: 7 }, 24], ...Array.from({ length: 12 }, (_, i) => [`Putra${i + 1}`, { [`Istri${i + 2}`]: 9, [`Istri${i + 1}`]: 12, [`Putra${i + 2}`]: 34, [`Putri${i + 2}`]: 17 }, 72])];

  Budi: { Rina: '1/8 sebagai istrinya, karena Budi punya anak', Aminah: '1/6 sebagai ibunya, karena Budi punya anak', Zahra: '1/2 sebagai putri satu-satunya', Siti: 'sisa, sebagai saudarinya bersama putri Budi' },
  Aminah: { Siti: '1/2 sebagai putrinya, lalu tambahan sisa (radd)', Zahra: '1/6 sebagai cucunya, lalu tambahan sisa (radd)' },
};

const DUNIA = [

    const terima = Object.keys(r.total).sort((a, b) => (bulat(HARTA, r.total[b]) > bulat(HARTA, r.total[a]) ? 1 : -1)).map(id => {
      const asal = Object.keys(r.dari[id]);
      return { id, f: r.total[id], dari: r.dari[id], alasan: asal.length > 1 ? `Dari ${asal.map(nama).join(', ')} (${asal.length} lapis).` : `Dari ${nama(asal[0])}: ${ALASAN_LAPIS[asal[0]]?.[id] ?? 'lihat aliran'}.` };
    });
    const terus = k.rantai.slice(1).map(([m]) => ({ id: m, f: NOL, redup: true, meninggal: true, dari: r.dari[m], tampil: rupiah(bulat(HARTA, r.masuk[m])), tampilKet: `diteruskan ke lapis ${r.lapisKe(m)}`, alasan: `Menerima dari ${Object.keys(r.dari[m]).map(nama).join(' dan ')}, lalu meninggal. Bagiannya dibagi di lapis ${r.lapisKe(m)}.` }));
    return { grup: [['Menerima', terima], ['Meneruskan bagiannya (sudah meninggal)', terus]], dibagi: terima.reduce((a, o) => a + bulat(HARTA, o.f), 0n), tahan: 0n };
  }
  const semua = k.daftar();
  const terima = semua.filter(o => o.f[0] && !o.tahan), tahan = semua.filter(o => o.tahan), tidak = semua.filter(o => o.redup);
  return { grup: [[k.id === 'tunggu' ? 'Sudah pasti' : 'Menerima', terima], [k.id === 'tunggu' ? 'Menunggu bayi lahir' : 'Ditahan', tahan], ['Tidak mendapat bagian', tidak]], dibagi: terima.reduce((a, o) => a + bulat(HARTA, o.f), 0n), tahan: k.tahan ?? 0n };
}

    ${isi}${jumlahan}</section>`;

function daftarGharqa(k) {

    ${['Aminah', 'Siti', 'Zahra', 'Rina'].map(id => `<tr data-id="${id}"><td>${nama(id)}${id === k.kamu ? ' <span class="lab kamu">kamu</span>' : ''}</td>${SKENARIO.map(s => `<td>${rupiah(s[1][id])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  const orang = ['Aminah', 'Siti', 'Zahra', 'Rina'].map(id => {
    const bagian = GHARQA_HARTA.filter(([, , per]) => per[id]).map(([m, h, per, al]) => [m, h * BigInt(per[id][0]) / BigInt(per[id][1]) / SATUAN * SATUAN, al[id]]);
    const tot = bagian.reduce((a, b) => a + b[1], 0n);
    return { id, f: [tot, HARTA], tampil: rupiah(tot), tampilKet: bagian.length > 1 ? 'dari dua harta' : 'dari harta Budi', dariHarta: bagian, alasan: bagian.map(([m, , al]) => `Dari ${nama(m)}: ${al}`).join(' · ') + '.', kenapa: bagian.map(([m, n, al]) => `Dari harta ${nama(m)}: ${al} (${rupiah(n)}).`) };
  });
  const jml = orang.reduce((a, o) => a + o.f[0], 0n);
  return `<section class="t s7"><h2>Siapa menerima berapa</h2><p class="sub">Total dari dua harta. Ketuk nama untuk penjelasan lengkap.</p>
    <p class="grupJudul"><span>Menerima</span><span>4 orang</span></p>${orang.map(o => barisOrang(o, k)).join('')}

}

function bukaPenjelasan(idOrang, k) {
  const o = NOMINAL[idOrang]; if (!o || !ORANG[idOrang]) return;
  const [n, peran, , kunci, kelompok] = ORANG[idOrang];
  const tahan = !!o.tahan, tidak = o.redup && !o.meninggal;
  const rp = o.tampil ?? (tahan ? 'Ditahan' : rupiah(bulat(HARTA, o.f)));
  const harta = HARTA;
  let cara = '';
  const asli = o.asli ?? o.f; if (o.f?.[0] && !tahan && !o.meninggal && !o.dariHarta) cara = `Harta dibagi menjadi ${asli[1]} bagian yang sama; ${n} mendapat ${asli[0]} bagian.<br>${asli[0]}/${asli[1]} × ${rupiah(harta)} = <b>${rupiah(bulat(harta, o.f))}</b>${SATUAN > 1n || (harta * o.f[0]) % o.f[1] ? ' <small>(dibulatkan ke bawah)</small>' : ''}`;
  if (o.dari) cara = Object.entries(o.dari).map(([m, f]) => `Dari ${nama(m)}${ALASAN_LAPIS[m]?.[idOrang] ? ` (${ALASAN_LAPIS[m][idOrang]})` : ''}: <b>${rupiah(bulat(harta, f))}</b>`).join('<br>') + (Object.keys(o.dari).length > 1 && !o.meninggal ? `<br>Jumlah: <b>${rupiah(bulat(harta, o.f))}</b>` : '');
  if (o.dariHarta) cara = o.dariHarta.map(([m, v, al]) => `Dari harta ${nama(m)} (${al}): <b>${rupiah(v)}</b>`).join('<br>') + `<br>Jumlah: <b>${o.tampil}</b>`;
  let kenapa = o.kenapa ?? [o.alasan];
  if (o.dari && k.rantai) {
    const r = hitungRantai(k.rantai);
    kenapa = Object.entries(o.dari).map(([m, f]) => `Di lapis ${r.lapisKe(m)} (${m === 'PEWARIS' ? 'harta Pak Ahmad' : `bagian ${nama(m)} yang diteruskan`}): ${ALASAN_LAPIS[m]?.[idOrang] ?? 'bagian dari lapis ini'}, yaitu ${rupiah(bulat(HARTA, f))}.`);
    if (o.meninggal) { const l = k.rantai.find(x => x[0] === idOrang); kenapa.push(`${nama(idOrang)} meninggal sebelum harta dibagi, jadi bagiannya dibagi lagi di lapis ${r.lapisKe(idOrang)} kepada: ${Object.keys(l[1]).map(nama).join(', ')}.`); }
    else if (Object.keys(o.dari).length > 1) kenapa.push(`Totalnya ${rupiah(bulat(HARTA, o.f))}, karena ${nama(idOrang)} menerima dari ${Object.keys(o.dari).length} lapis.`);
  }
  const ahwal = kunci && AHWAL[kunci] && !k.rantai && kasusAktif !== 'bersamaan' ? AHWAL[kunci] : null;
  const dalil = o.dalil ? DALIL[o.dalil] : null;
  $('#modalOrang').innerHTML = `
    <div class="modalKepala ${tahan ? 'tahan' : tidak || o.meninggal ? 'netral' : ''}"><div><p class="peranM">${tidak ? 'TIDAK MENDAPAT BAGIAN' : tahan ? 'DITAHAN' : o.meninggal ? 'SUDAH MENINGGAL, MENERUSKAN BAGIAN' : kelompok ?? ''}</p><h3 id="judulModal">${n}</h3><p class="sub">${peran}</p></div><button class="tutup" id="tutupModal" aria-label="Tutup">${ik('x')}</button></div>
    <div class="modalIsi">
      ${!tidak ? `<h4>BAGIANNYA DI KASUS INI</h4><div class="angkaM"><div><small>Pecahan</small><b>${o.f?.[0] ? teksPec(o.f) : '—'}</b></div><div><small>Persen</small><b>${o.f?.[0] ? persen(o.f) : '—'}</b></div><div><small>${o.meninggal ? 'Diterima lalu diteruskan' : 'Nominal'}</small><b>${rp}</b></div></div>` : ''}
      ${tahan && o.maks ? `<p class="sub" style="margin-top:6px">Bisa sampai ${rupiah(bulat(harta, o.maks))}, tergantung keadaan yang terjadi.</p>` : ''}
      <h4>${tidak ? 'KENAPA TIDAK DAPAT?' : 'KENAPA SEGITU?'}</h4><div class="kenapa"><ul>${kenapa.map(x => `<li>${x}</li>`).join('')}</ul></div>
      ${cara ? `<h4>CARA MENGHITUNGNYA</h4><p class="cara">${cara}</p>` : ''}
      ${o.terdampak ? `<details class="lipatM"><summary>Ahli waris lain yang terdampak <small>${o.terdampak.length} orang</small></summary><div class="isiL"><ul class="biasa">${o.terdampak.map(x => `<li>${x}</li>`).join('')}</ul></div></details>` : ''}
      ${ahwal ? `<details class="lipatM"><summary>Kapan dapat berapa? <small>semua kemungkinan bagian ${n.toLowerCase()}</small></summary><div class="isiL"><table class="ahwalT">${ahwal.map(([b, s], i) => `<tr class="${o.ahwal?.includes(i) ? 'kini' : ''}"><th>${b}</th><td>${s}${o.ahwal?.includes(i) ? '<span class="stiker">kasus ini</span>' : ''}</td></tr>`).join('')}</table></div></details>` : ''}
      ${dalil ? `<details class="lipatM"><summary>Dalilnya <small>QS ${dalil[2]}</small></summary><div class="isiL"><div class="dalil"><p class="arab">${dalil[0]}</p><p style="font-size:14px">${dalil[1]}.</p></div></div></details>` : ''}
    </div>
    <div class="modalKaki">${ORANG[idOrang][3] ? `<button class="tautan" data-toast="Membuka ubah jumlah ${n.toLowerCase()}">Ubah jumlah</button>` : '<span></span>'}<button class="btn" id="okeModal">Oke, paham</button></div>`;
  $('#latar').classList.add('on');
  $('#tutupModal').focus();
  $('#tutupModal').onclick = $('#okeModal').onclick = tutupModal;
}
function bukaBulat(id) {
  const k = KASUS[id], simpan = SATUAN;
  const sisaUntuk = v => { SATUAN = BigInt(v); let hasil; if (id === 'bersamaan') { hasil = 350000000n - ['Aminah', 'Siti', 'Zahra', 'Rina'].reduce((a, x) => a + GHARQA_HARTA.reduce((b, [, h, per]) => b + (per[x] ? h * BigInt(per[x][0]) / BigInt(per[x][1]) / SATUAN * SATUAN : 0n), 0n), 0n); } else { const d = dataDaftar(k); hasil = HARTA - d.dibagi - d.tahan; } SATUAN = simpan; return hasil; };
  $('#modalOrang').innerHTML = `<div class="modalKepala netral"><div><p class="peranM">PEMBULATAN</p><h3 id="judulModal">Bagian tiap orang dibulatkan ke…</h3><p class="sub">Dibulatkan ke bawah; sisanya tidak dibagi diam-diam.</p></div><button class="tutup" id="tutupModal" aria-label="Tutup">${ik('x')}</button></div>
    <div class="modalIsi" style="padding-top:16px"><div class="opsiKuis">${OPSI_BULAT.map(([v, l, ket]) => `<button aria-pressed="${String(SATUAN) === v}" data-pilih-bulat="${v}"><i></i><span><b>${l}</b><small>${ket}</small></span><span class="sisaO">sisa<br><b style="font-size:14px;color:var(--ink)">${rupiah(sisaUntuk(v))}</b></span></button>`).join('')}</div></div>`;
  $('#latar').classList.add('on'); $('#tutupModal').onclick = tutupModal;
  $$('[data-pilih-bulat]').forEach(b => b.onclick = () => { SATUAN = BigInt(b.dataset.pilihBulat); tutupModal(); renderKasus(id); toast(`dibulatkan ke Rp ${Number(SATUAN).toLocaleString('id-ID')}`); });
}
const tutupModal = () => $('#latar').classList.remove('on');
$('#latar').addEventListener('click', e => { if (e.target.id === 'latar') tutupModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') tutupModal(); });

// ═══ Interaksi ═══
let skala = 1;
function aturSkala(s) { const svg = $('#kanvas svg'); if (!svg) return; skala = Math.min(2.5, Math.max(0.3, s)); svg.setAttribute('width', svg.dataset.lebar * skala); svg.setAttribute('height', svg.dataset.tinggi * skala); }
const pasSkala = () => { const kv = $('#kanvas'), svg = $('#kanvas svg'); if (kv && svg && kv.clientWidth) aturSkala(Math.min(kv.clientWidth / svg.dataset.lebar, kv.clientHeight / svg.dataset.tinggi, 1.3)); };
function sorot(idOrang) {
  $$('.orang').forEach(b => b.classList.toggle('sorot', b.dataset.id === idOrang));
  $$('svg.pohon .kotak').forEach(g => g.classList.toggle('sorot', g.dataset.id === idOrang));
  $$('table.faraidh tr[data-id]').forEach(r => r.classList.toggle('sorot', r.dataset.id === idOrang));
}
let putaran = 0;
async function putarLapis(dari, sampai) {
  const nomor = ++putaran, kv = $('#kanvas');
  $$('svg.pohon .alir').forEach(p => p.classList.remove('jalan', 'diam'));
  for (let l = dari; l <= sampai; l++) {
    if (nomor !== putaran) return;
    $$('.blok').forEach(b => b.classList.toggle('aktif', b.dataset.lapis === String(l)));
    $$('.rute button').forEach(b => b.classList.toggle('aktif', b.dataset.keLapis === String(l)));
    const jalur = $$(`svg.pohon .alir[data-lapis="${l}"]`);
    if (jalur[0] && kv) { const bb = jalur[0].getBBox(); kv.scrollTo({ top: bb.y * skala - 60, left: bb.x * skala - 40, behavior: 'smooth' }); }
    jalur.forEach(p => p.classList.add('jalan'));
    await new Promise(r => setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 950));
    jalur.forEach(p => { p.classList.remove('jalan'); p.classList.add('diam'); });
  }
}
function pasang(k, id) {
  $$('.orang').forEach(b => b.addEventListener('click', () => { sorot(b.dataset.id); bukaPenjelasan(b.dataset.id, k); }));
  $$('[data-buka]').forEach(b => b.addEventListener('click', () => bukaPenjelasan(b.dataset.buka, k)));
  $$('svg.pohon .kotak[data-id]').forEach(g => g.addEventListener('click', () => { sorot(g.dataset.id); if (NOMINAL[g.dataset.id]) bukaPenjelasan(g.dataset.id, k); }));
  $$('table.faraidh tr[data-id], .blok tr[data-id]').forEach(r => r.addEventListener('click', () => { sorot(r.dataset.id); if (NOMINAL[r.dataset.id]) bukaPenjelasan(r.dataset.id, k); }));
  $$('[data-bulat]').forEach(b => b.onclick = () => bukaBulat(id));
  $$('.tabelWadah, .kanvas').forEach(w => { const p = w.closest('.panel'); if (p && w.scrollWidth > w.clientWidth + 4) p.classList.add('adaGeser'); });
  $$('[data-satuan]').forEach(b => b.onclick = () => { SATUAN = BigInt(b.dataset.satuan); renderKasus(id); });
  $$('[data-gharqa]').forEach(b => b.onclick = () => { keadaanGharqa = b.dataset.gharqa; renderKasus(id); });
  $$('[data-zoom]').forEach(b => b.onclick = () => (b.dataset.zoom === '0' ? pasSkala() : aturSkala(skala * (b.dataset.zoom === '1' ? 1.25 : 0.8))));
  $('#layarPenuh')?.addEventListener('click', () => { const p = $('#panelPohon'); if (document.fullscreenElement) document.exitFullscreen(); else if (p.requestFullscreen) p.requestFullscreen().then(() => setTimeout(pasSkala, 120)).catch(() => p.classList.toggle('penuh')); else p.classList.toggle('penuh'); });
  $('#putarAliran')?.addEventListener('click', () => putarLapis(1, Math.max(...$$('svg.pohon .alir').map(p => +p.dataset.lapis))));
  $$('[data-putar]').forEach(b => b.onclick = () => { $('#ubinPT').scrollIntoView({ behavior: 'smooth' }); putarLapis(+b.dataset.putar, +b.dataset.putar); });
  $$('[data-ke-lapis]').forEach(b => b.onclick = () => { const blk = $(`.blok[data-lapis="${b.dataset.keLapis}"]`); if (blk.hidden) { $$('.blok[hidden]').forEach(x => (x.hidden = false)); $('#bukaLapis')?.remove(); } blk.scrollIntoView({ behavior: 'smooth', block: 'center' }); putarLapis(+b.dataset.keLapis, +b.dataset.keLapis); });
  $('#bukaLapis')?.addEventListener('click', e => { $$('.blok[hidden]').forEach(b => (b.hidden = false)); e.target.remove(); });
  $('#bukaGen')?.addEventListener('click', e => { $$('.genGrup[hidden]').forEach(b => (b.hidden = false)); e.target.remove(); });
  $('#cariOrang')?.addEventListener('input', e => { const q = e.target.value.toLowerCase(); $$('.genGrup').forEach(g => (g.hidden = false)); $('#bukaGen')?.remove(); $$('.genGrup .orang').forEach(o => (o.hidden = !!q && !nama(o.dataset.id).toLowerCase().includes(q))); });
  $$('.segPanel button').forEach(b => b.onclick = () => { $$('.segPanel button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('.panelDua').dataset.lihat = b.dataset.lihat; if (b.dataset.lihat === 'pohon') pasSkala(); });
  $$('.ist').forEach(s => s.addEventListener('click', e => { e.stopPropagation(); $$('.ist.on').forEach(x => x !== s && x.classList.remove('on')); s.classList.toggle('on'); }));
  $('#ubahNama')?.addEventListener('click', () => { const w = $('#namaKasus'), lama = $('#teksNama').textContent; w.innerHTML = `<input id="isianNama" value="${lama}" aria-label="Nama kasus"><button class="tautan" id="simpanNama" style="color:#fff">Simpan</button>`; $('#isianNama').focus(); $('#simpanNama').onclick = () => { namaUbah[id] = $('#isianNama').value.trim() || lama; renderKasus(id); toast('nama kasus disimpan'); }; });
  $$('[data-kirim]').forEach(b => b.onclick = () => { $('#teksKirim').textContent = teksRingkasan(k, id); $('#lembarKirim').classList.add('on'); });
  if (k.taqdir) siapkanKemungkinan();
  setTimeout(pasSkala, 30);
}
document.addEventListener('click', e => { if (!e.target.closest('.ist')) $$('.ist.on').forEach(x => x.classList.remove('on')); });

const PILIHAN = { Siti: 'hidup', Bayi: 'mati' };
function siapkanKemungkinan() {
  const wadah = $('#pilihKemungkinan');
  const isi = () => {
    const d = DUNIA.find(([t]) => t.Siti === PILIHAN.Siti && t.Bayi === PILIHAN.Bayi)[1];
    wadah.innerHTML = `<div class="pilih"><p>Kalau Siti…</p><div class="pilDeret">${[['hidup', 'masih hidup'], ['mati', 'sudah meninggal']].map(([v, l]) => `<button class="pk" data-sumber="Siti" data-v="${v}" aria-checked="${PILIHAN.Siti === v}">${l}</button>`).join('')}</div></div>
      <div class="pilih"><p>Kalau bayi Aminah…</p><div class="pilDeret">${Object.entries(TEKS_BAYI).map(([v, l]) => `<button class="pk" data-sumber="Bayi" data-v="${v}" aria-checked="${PILIHAN.Bayi === v}">${l}</button>`).join('')}</div></div>
      <p style="font-size:13px"><b>Bila terjadi:</b> ${['Aminah', 'Fatimah', 'Budi', 'Siti', 'Bayi'].filter(i => d[i]).map(i => `${nama(i).replace(' dalam kandungan Aminah', '')} ${rpRingkas(bulat(HARTA, pec(BigInt(d[i]), JAMIAH_GAB)))}`).join(' · ')}</p>`;
    $$('.pk', wadah).forEach(p => p.onclick = () => { PILIHAN[p.dataset.sumber] = p.dataset.v; isi(); });
  };
  isi();
}

function teksRingkasan(k, id) {
  const judul = `${namaUbah[id] ?? k.namaKasus} (madzhab Syafi'i)`;
  if (id === 'bersamaan') return `${judul}\nPak Ahmad dan Budi meninggal ${keadaanGharqa === 'serentak' ? 'serentak, tidak saling mewarisi.\n• Aminah: Rp 45.833.333\n• Siti: Rp 207.291.666\n• Zahra: Rp 90.625.000\n• Rina: Rp 6.250.000' : 'bersamaan; urutan terlupakan, harta ditahan.'}\nRincian: [tautan PDF]`;
  if (k.rantai) { const r = hitungRantai(k.rantai); return `${judul}\nHarta Pak Ahmad Rp 300.000.000, dibagikan sekali:\n` + Object.keys(r.total).map(i => `• ${nama(i)}: ${rupiah(bulat(HARTA, r.total[i]))}`).join('\n') + '\nAliran dan tabel: [tautan PDF]'; }
  return `${judul}\n` + k.daftar().map(o => `• ${nama(o.id)}: ${o.tahan ? 'ditahan' : o.f[0] ? rupiah(bulat(HARTA, o.f)) : 'tidak mendapat'}`).join('\n') + '\nRincian dan alasan: [tautan PDF]';
}

  biasa: ['Tugas 1: Ketuk Aminah. Apakah penjelasan lengkapnya menjawab "kenapa 1/8"?', ['Ketuk Aminah.', 'Baca Kenapa segitu, Cara menghitungnya, Kapan dapat berapa, Dalilnya.', 'Pilih pembulatan Rp 1.000; lihat penjumlahannya berubah.'], 'Apakah penjelasan lengkap mudah dibuka dan menjawab pertanyaan?'],
  berlapis: ['Tugas 2: Cari apa yang harus dibagi sekarang. Lalu ikuti harta lewat Budi dan Aminah.', ['Baca kotak hijau "Yang dibagi sekarang".', 'Di "Bagaimana hartanya mengalir", ikuti tanda → ke lapis berikutnya.', 'Buka tabel munasakhat.'], 'Apakah tabelnya terasa seperti tabel munasakhat di kitab?'],
  rantai: ['Tugas 3: Cari "Istri gen. 1". Dari lapis mana saja bagiannya?', ['Ketik di kotak cari.', 'Ketuk namanya.', 'Ketuk rute di atas aliran untuk melompat ke lapis.'], 'Apakah rantai panjang tetap bisa dibaca?'],
  belumPasti: ['Tugas 4: Cari uang yang ditahan dan untuk siapa. Arahkan ke kata "haml" dan "mafqud".', ['Baca ubin Jenis masalah.', 'Pilih kemungkinan di atas tabel.', 'Ketuk Budi: kenapa belum dapat?'], 'Apakah jelas mana yang pasti dan mana yang ditahan?'],
  tunggu: ['Tugas 5: Cari apa yang sudah pasti, dan akibatnya kalau tetap dibagi sekarang.', ['Baca daftar.', 'Baca "Perlu dibagi sekarang?".'], 'Apakah kamu tahu harus membuka kasus ini dari mana nanti?'],
  bersamaan: ['Tugas 6: Cari bagianmu dari dua harta. Lalu ganti ke "Terlupakan".', ['Baca kalimat di atas.', 'Lihat garis merah putus-putus di pohon.', 'Ganti ke Terlupakan.'], 'Apakah jelas kenapa keduanya tidak saling mewarisi?'],
};
function renderCoba() {
  $('#layar').innerHTML = `<div class="coba"><h1>Cara mencoba</h1><div class="bento" style="padding:0">
    <section class="t s6"><h2>Ini contoh</h2><p style="font-size:14px;margin-top:6px">Tidak ada yang disimpan. Keluarga contoh: <b>Pak Ahmad</b> (almarhum), <b>Aminah</b> (istri), <b>Fatimah</b> (ibu), <b>Budi</b> dan <b>Siti</b> (anak), <b>Rina</b> (istri Budi), <b>Zahra</b> (anak Budi), <b>Hasan</b> (kakak almarhum). Kata bergaris titik bisa diarahkan atau diketuk untuk penjelasan.</p></section>
    <section class="t s6 mint"><h2>Arti warna</h2><p style="font-size:14px;margin-top:6px">Hijau: menerima. Kuning: ditahan. Abu: sudah meninggal atau tidak mendapat. Oranye: aliran harta dan pengali di tabel. Merah putus-putus: tidak saling mewarisi.</p></section>
    ${Object.entries(TUGAS).map(([id, [, langkah, cek]], i) => `<section class="t s6"><h2>Tugas ${i + 1}: ${KASUS[id].tab}</h2><ol>${langkah.map(l => `<li>${l}</li>`).join('')}</ol><p class="cek">Yang dicek: ${cek}</p><p style="margin-top:8px"><button class="tautan" data-mulai="${id}">Mulai tugas ini</button></p><textarea data-catatan="Tugas ${i + 1}: ${KASUS[id].tab}" placeholder="Catatanmu…"></textarea></section>`).join('')}
    <section class="t s12 oranye"><h2>Kirim catatan</h2><p style="font-size:14px;margin:6px 0 10px">Salin semua catatanmu lalu tempel di chat ke tim.</p><button class="btn" id="salinCatatan">Salin catatan</button></section></div></div>`;
  $$('[data-mulai]').forEach(b => b.onclick = () => { tugasAktif = b.dataset.mulai; buka(b.dataset.mulai); });
  $('#salinCatatan').onclick = () => { navigator.clipboard?.writeText($$('[data-catatan]').filter(t => t.value.trim()).map(t => `${t.dataset.catatan}\n${t.value.trim()}`).join('\n\n')).catch(() => {}); toast('catatan disalin'); };
}

// ═══ Tab, toast ═══
const TAB = [...Object.keys(KASUS), 'coba'];
$('#tab').innerHTML = TAB.map(id => `<button role="tab" data-ke="${id}">${id === 'coba' ? 'Cara mencoba' : KASUS[id].tab}</button>`).join('');
function buka(id) { $$('#tab button').forEach(b => b.setAttribute('aria-selected', b.dataset.ke === id)); tutupModal(); id === 'coba' ? renderCoba() : renderKasus(id); scrollTo(0, 0); }
$$('#tab button').forEach(b => b.onclick = () => buka(b.dataset.ke));
let jeda;
function toast(t) { $('#toastTeks').textContent = 'Mockup: ' + t; $('#toast').classList.add('on'); clearTimeout(jeda); jeda = setTimeout(() => $('#toast').classList.remove('on'), 3200); }
$('#toastUrung').onclick = () => $('#toast').classList.remove('on');
document.addEventListener('click', e => { const el = e.target.closest('[data-toast]'); if (el) { e.preventDefault(); e.stopPropagation(); toast(el.dataset.toast); } }, true);
$('#batalKirim').onclick = () => $('#lembarKirim').classList.remove('on');
$('#salinKirim').onclick = () => { navigator.clipboard?.writeText($('#teksKirim').textContent).catch(() => {}); $('#lembarKirim').classList.remove('on'); toast('teks disalin, WhatsApp dibuka'); };

// Cek konsistensi: total rantai 3 lapis = nominal engine; tabel munasakhat = saham engine (jami'ah 288).
const cekR = hitungRantai(LAPIS_BERLAPIS), cekT = tabelMunasakhat(LAPIS_BERLAPIS);
for (const [id, n] of Object.entries({ Siti: 173958333n, Rina: 21875000n, Zahra: 104166666n })) if (HARTA * cekR.total[id][0] / cekR.total[id][1] !== n) console.error('Tidak cocok dengan engine:', id);
if (cekT.jam !== 288n || cekT.sahamJam.Siti !== 167n || cekT.sahamJam.Zahra !== 100n || cekT.sahamJam.Rina !== 21n) console.error('Tabel munasakhat tidak cocok dengan engine', cekT);

buka('biasa');
