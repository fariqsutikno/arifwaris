<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup layar Hasil v3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<!-- v3. Acuan: docs/design/riset-ux-hasil-2026-11-17.md (HMW-1..18, prinsip 1..12, keputusan 19a).
     Semua angka dihitung dari data engine yang sama (pecahan saham per lapis / per kemungkinan), lalu dibulatkan di sini. -->
<style>
:root{--page:#b9d4c0;--frame:#eef3e8;--ink:#14181a;--muted:#525c57;--card:rgba(255,255,255,.8);--edge:rgba(255,255,255,.95);
--orange:#f2682a;--orange-soft:#fde6d8;--mint:#dcefe2;--kuning:#fbefc9;--kuning-ink:#6b4f00;--black:#0e0f10;--line:#dfe6dc;--hijau:#1f6f5c;
--font:"Onest",system-ui,sans-serif;--sh:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.5 var(--font);padding:18px 12px 90px}
h1,h2,h3,h4,p{margin:0}
button,input,select{font-family:inherit}
.ik{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.tautan{background:none;border:0;padding:0;font:600 14px var(--font);color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.atas-mockup{max-width:1160px;margin:0 auto 12px}
.atas-mockup p{font-size:13px;color:#2c4136;margin:0 4px 8px}
nav.tab{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
nav.tab button{flex:none;border:0;background:rgba(255,255,255,.5);color:var(--ink);font:500 14px var(--font);padding:9px 14px;border-radius:999px;cursor:pointer}
nav.tab button[aria-selected=true]{background:var(--black);color:#fff}
.frame{max-width:1160px;margin:0 auto;background:var(--frame);border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(20,40,30,.18)}
.tugas{display:none;background:var(--kuning);color:#4a3a00;padding:10px 20px;font-size:13.5px}.tugas.aktif{display:block}

/* hero */
.hero{color:#fff;padding:16px 20px 20px;background:radial-gradient(520px 300px at 82% 60%,rgba(255,150,40,.33),transparent 70%),radial-gradient(420px 260px at 6% 0%,rgba(60,210,170,.3),transparent 70%),linear-gradient(135deg,#0a2326 0%,#0f3a38 55%,#0b2a2b 100%)}
.bilah{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:rgba(255,255,255,.85)}
.bilah .tautan{color:#fff;display:inline-flex;gap:4px;align-items:center}
.status{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 10px;font-size:13px}
.status i{width:8px;height:8px;border-radius:50%;background:#7fe0b0}
.status.tahan i{background:#f3cf5a}
.heroIsi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:end;margin-top:16px}
.namaKasus{display:flex;gap:8px;align-items:center;font-size:14px;color:rgba(255,255,255,.85)}
.namaKasus button{background:rgba(255,255,255,.14);border:0;color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.namaKasus input{font:500 14px var(--font);border:0;border-radius:10px;padding:6px 10px;width:min(320px,70vw)}
.hero h1{font-size:36px;line-height:1.08;font-weight:500;letter-spacing:-.02em;margin-top:8px;max-width:20ch}
.hero .kalimat{font-size:15.5px;margin-top:10px;color:rgba(255,255,255,.93);max-width:52ch}
.labelMadzhab{display:inline-block;margin-top:10px;background:rgba(242,104,42,.9);color:#fff;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px}
.aksiHero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:16px}
.pil{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font:600 14px var(--font);background:#fff;color:var(--ink);border:0;cursor:pointer}
.aksiHero .tautan{color:#fff;display:inline-flex;gap:6px;align-items:center}
.ubinHero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.uh{border-radius:22px;padding:13px 15px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);min-width:0}
.uh .lbl{font-size:12.5px;color:rgba(255,255,255,.82)}
.uh b{display:block;font-size:21px;font-weight:600;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
.uh small{display:block;font-size:12.5px;color:rgba(255,255,255,.8);margin-top:3px}
.uh.kamu{grid-column:1/-1;background:rgba(255,255,255,.95);color:var(--ink);border-color:#fff}
.uh.kamu .lbl,.uh.kamu small{color:var(--muted)}
.uh.kamu b{font-size:32px}
.uh.kamu .rentang{font-size:14px;color:var(--kuning-ink);background:var(--kuning);display:inline-block;border-radius:999px;padding:2px 9px;margin-top:6px}
.uh.tahan{background:rgba(251,239,201,.95);color:var(--kuning-ink);border-color:#fbefc9}
.uh.tahan .lbl,.uh.tahan small{color:var(--kuning-ink)}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;padding:12px}
.t{background:var(--card);border:1px solid var(--edge);border-radius:24px;padding:18px;min-width:0;box-shadow:var(--sh)}
.t h2{font-size:18.5px;font-weight:600;letter-spacing:-.01em}
.t .sub{font-size:13px;color:var(--muted);margin-top:2px}
.t.mint{background:var(--mint);border-color:var(--mint)}.t.oranye{background:var(--orange-soft);border-color:var(--orange-soft)}
.t.gelap{background:var(--black);color:#fff;border-color:var(--black)}.t.gelap .sub{color:rgba(255,255,255,.72)}
.t.kuning{background:var(--kuning);border-color:var(--kuning)}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}.s6{grid-column:span 6}
.kolom{display:grid;gap:12px;align-content:start;min-width:0}
.kepala-t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}

/* daftar */
.cari{display:flex;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.cari input{border:0;flex:1;font-size:14px;outline:none;background:none}
.gen{font:600 12.5px var(--font);color:var(--muted);text-transform:none;margin:12px 0 2px;letter-spacing:.01em}
.orang{display:block;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;font:inherit;color:inherit;cursor:pointer;border-radius:0}
.orang.sorot{background:rgba(242,104,42,.07)}
.orang .baris{display:flex;gap:12px;align-items:center}
.ava{flex:none;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font:600 15px var(--font);color:#fff}
.nama{flex:1;min-width:0}
.nama b{font-weight:600;font-size:15.5px}
.nama .peran{display:block;color:var(--muted);font-size:13px}
.rp{font:600 17px/1.2 var(--font);font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.rp small{display:block;font:400 12.5px var(--font);color:var(--muted)}
.alasan{margin:5px 0 0 50px;font-size:13.5px;color:#2c3530}
.alasan .ref{font-size:12px;color:var(--muted);margin-left:4px;border-bottom:1px dotted var(--muted)}
.rinciBaris{display:none;margin:8px 0 0 50px;padding:10px 12px;background:rgba(20,24,26,.04);border-radius:14px;font-size:13.5px}
.orang[aria-expanded=true] .rinciBaris{display:block}
.rinci{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-variant-numeric:tabular-nums}
.rinci .t2{color:var(--muted)}
.rinciBaris .lembar-buka{margin-top:8px}
.orang.redup .nama b,.orang.redup .rp{color:var(--muted)}
.orang.redup .ava{background:#dfe3dd!important;color:#3f4944}
.lab{display:inline-block;font:600 11.5px var(--font);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.lab.kamu{background:var(--mint);color:#1f5a40}.lab.tahan{background:var(--kuning);color:var(--kuning-ink)}.lab.meninggal{background:#e7eae5;color:#4b554f}
.jumlah{display:flex;justify-content:space-between;gap:12px;border-top:1.5px solid var(--ink);margin-top:4px;padding-top:10px;font-weight:600;font-variant-numeric:tabular-nums}
.sisa{display:flex;justify-content:space-between;gap:12px;border-top:1px dashed var(--line);padding:9px 0 7px;font-size:13.5px;color:var(--muted)}
.sisa b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.lipatGen{display:block;width:100%;background:rgba(20,24,26,.04);border:0;border-radius:12px;padding:10px;margin:8px 0;font:600 13.5px var(--font);cursor:pointer;color:var(--ink)}

/* info kasus */
.info dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:6px 0 0;font-size:14px}
.info dt{color:var(--muted)}
.info dd{margin:0;font-weight:500}
.info dd small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.segmen{display:inline-flex;background:rgba(20,24,26,.06);border-radius:999px;padding:3px;gap:2px}
.segmen button{border:0;background:none;border-radius:999px;padding:5px 11px;font:500 13px var(--font);cursor:pointer;color:var(--ink)}
.segmen button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.jenisMasalah b{display:block;font-size:17px;font-weight:600;margin-top:4px}
.jenisMasalah p{font-size:13.5px;color:#2c3530;margin-top:4px}
.ditahanBaris{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid rgba(107,79,0,.15);font-size:14px}
.ditahanBaris:first-of-type{border-top:0}
.ditahanBaris span{color:var(--kuning-ink);font-size:13px;grid-column:1/-1}
.ditahanBaris b{font-variant-numeric:tabular-nums}

/* aliran estafet */
.estafet{position:relative;margin-top:6px}
.blok{position:relative;margin:0 0 0 18px;padding:12px 14px 12px 22px;border-left:3px solid var(--line);cursor:pointer}
.blok::before{content:"";position:absolute;left:-11px;top:14px;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid #9aa79f}
.blok.aktif{border-left-color:var(--orange)}
.blok.aktif::before{border-color:var(--orange);background:var(--orange)}
.blok h3{font-size:15.5px;font-weight:600}
.blok .masuk{font:600 20px var(--font);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.blok .rinci{font-size:13.5px}
.blok .terus{color:var(--orange);font-weight:600}
.blok.lewat{opacity:.7}
.blok.tipis{padding-top:6px;padding-bottom:6px}

/* pohon + tabel */
.panelDua{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;margin-top:8px}
.panel{background:#fff;border-radius:18px;border:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
.alat{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.alat .bulat{width:34px;height:34px;border-radius:50%;border:0;background:rgba(20,24,26,.06);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.alat .putar{display:inline-flex;gap:6px;align-items:center;border:0;background:var(--black);color:#fff;border-radius:999px;padding:7px 12px;font:600 13px var(--font);cursor:pointer;margin-left:auto}
.kanvas{overflow:auto;height:420px;position:relative;background:linear-gradient(#f6f8f3,#fff)}
.kanvas svg{display:block;transform-origin:0 0}
.penuh{position:fixed!important;inset:0;z-index:20;border-radius:0!important}
.penuh .kanvas{height:calc(100vh - 52px)}
svg.pohon .kotak rect{fill:#fff;stroke:#c9d2c8;stroke-width:1.5}
svg.pohon .terima rect{fill:#eef7ea;stroke:#6aa587}
svg.pohon .redup rect{fill:#f3f4f1;stroke:#cfd6cd;stroke-dasharray:4 3}
svg.pohon .meninggal rect{fill:#eceee9;stroke:#8f9a93}
svg.pohon .almarhum rect{fill:#0f3a38;stroke:#0f3a38}
svg.pohon .almarhum text{fill:#fff}svg.pohon .almarhum text.k{fill:#cfe2dc}
svg.pohon .tahan rect{fill:#fff7e0;stroke:#d9b44a;stroke-dasharray:5 3}
svg.pohon .sorot rect{stroke:var(--orange);stroke-width:3}
svg.pohon .tiba rect{animation:tiba .7s ease}
@keyframes tiba{0%{transform:scale(1)}40%{filter:drop-shadow(0 0 8px rgba(242,104,42,.8))}100%{filter:none}}
svg.pohon text{font:600 12.5px var(--font);fill:var(--ink)}
svg.pohon text.k{font:400 11.5px var(--font);fill:var(--muted)}
svg.pohon text.r{font:600 12.5px var(--font);fill:var(--hijau)}
svg.pohon .g{stroke:#9aa79f;stroke-width:1.6;fill:none}
svg.pohon .g.nikah{stroke-dasharray:2 3}
svg.pohon .g.putus{stroke:#c0503a;stroke-dasharray:6 5}
svg.pohon .alir{stroke:var(--orange);stroke-width:4;fill:none;stroke-dasharray:1;stroke-dashoffset:1;stroke-linecap:round}
svg.pohon .alir.jalan{animation:jalan .9s ease forwards}
svg.pohon .alir.diam{stroke-dashoffset:0}
@keyframes jalan{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){svg.pohon .alir.jalan{animation:none;stroke-dashoffset:0}svg.pohon .tiba rect{animation:none}}
.legPohon{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.legPohon i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid}
.tabelWadah{overflow:auto}
table.tabel{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.tabel th,table.tabel td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:end;white-space:nowrap}
table.tabel th:first-child,table.tabel td:first-child{text-align:start;white-space:normal}
table.tabel th{background:rgba(20,24,26,.04);font-weight:600;font-size:12.5px;position:sticky;top:0}
table.tabel tr[data-id]{cursor:pointer}
table.tabel tr.sorot td{background:rgba(242,104,42,.09)}
table.tabel .hit{display:none}
.hitung-on table.tabel .hit{display:table-cell}
.tabelKaki{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.segPanel{display:none}

/* kemungkinan */
.pilih{margin:8px 0 4px}
.pilih p{font-size:13.5px;font-weight:600;margin-bottom:6px}
.pilDeret{display:flex;flex-wrap:wrap;gap:8px}
.pk{border:1.5px solid #7d8a82;background:#fff;border-radius:999px;padding:6px 12px;font:500 13.5px var(--font);cursor:pointer;color:var(--ink)}
.pk[aria-checked=true]{background:var(--ink);border-color:var(--ink);color:#fff}

/* langkah, bagikan, pelajari */
ol.lanjut{margin:8px 0 0;padding:0;list-style:none;counter-reset:n;display:grid;gap:10px}
ol.lanjut li{counter-increment:n;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px}
ol.lanjut li::before{content:counter(n);width:28px;height:28px;border-radius:50%;background:rgba(20,24,26,.08);display:grid;place-items:center;font-weight:600;font-size:13px}
ol.lanjut li span{display:block;color:var(--muted);font-size:13px}
.aksiDaftar{display:grid;gap:8px;margin-top:10px}
.aksiDaftar button{display:flex;gap:12px;align-items:center;text-align:start;background:rgba(255,255,255,.7);border:0;border-radius:16px;padding:10px 12px;font:inherit;color:inherit;cursor:pointer}
.t.gelap .aksiDaftar button{background:rgba(255,255,255,.08)}
.aksiDaftar b{display:block;font-weight:600;font-size:14.5px}
.aksiDaftar small{display:block;color:var(--muted);font-size:12.5px}
.t.gelap .aksiDaftar small{color:rgba(255,255,255,.7)}
.ikBulat{flex:none;width:36px;height:36px;border-radius:12px;background:#fff;display:grid;place-items:center;color:var(--ink)}
.kaki{padding:4px 22px 22px;font-size:13px;color:var(--muted)}

/* lembar orang */
.latar{position:fixed;inset:0;background:rgba(20,24,26,.35);display:none;z-index:30}
.latar.on{display:block}
.lembarOrang{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:31;transform:translateX(105%);transition:transform .25s;overflow:auto;padding:18px}
.lembarOrang.on{transform:none}
.lembarOrang h3{font-size:22px;font-weight:600}
.lembarOrang h4{font-size:12.5px;font-weight:600;color:var(--muted);margin:16px 0 6px;letter-spacing:.02em}
.tiga{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.tiga div{background:var(--frame);border-radius:14px;padding:10px}
.tiga span{display:block;font-size:12px;color:var(--muted)}
.tiga b{font-size:16px;font-variant-numeric:tabular-nums}
.ahwal{width:100%;border-collapse:collapse;font-size:13.5px}
.ahwal td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.ahwal tr.ini td{font-weight:600;background:var(--mint)}
.tutup{float:right;border:0;background:rgba(20,24,26,.06);width:36px;height:36px;border-radius:50%;cursor:pointer}
.lembarKirim{position:fixed;inset:0;background:rgba(20,24,26,.38);display:none;align-items:flex-end;justify-content:center;z-index:32}
.lembarKirim.on{display:flex}
.lembarKirim .isi{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:560px;padding:18px 16px 22px}
.lembarKirim pre{white-space:pre-wrap;font:14px/1.5 var(--font);background:var(--frame);border-radius:16px;padding:12px;margin:10px 0 14px;max-height:50vh;overflow:auto}
.btn{border:0;background:var(--black);color:#fff;font:600 14px var(--font);border-radius:999px;padding:12px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.deret{display:flex;justify-content:flex-end;gap:16px;align-items:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(200%);visibility:hidden;background:var(--black);color:#fff;border-radius:999px;padding:11px 18px;display:flex;gap:14px;align-items:center;transition:transform .25s;max-width:calc(100% - 32px);font-size:14px;z-index:40}
.toast.on{transform:translateX(-50%) translateY(0);visibility:visible}
.toast .tautan{color:#fff}
.coba{padding:20px}.coba h1{font-size:28px;font-weight:500;margin-bottom:12px}
.coba textarea{width:100%;min-height:60px;border:1.5px solid var(--line);border-radius:14px;padding:10px;font:inherit;margin-top:8px;background:#fff}
.coba ol{padding-left:20px;margin:8px 0 0;font-size:14px}
.coba .cek{color:var(--muted);font-size:13.5px;margin-top:6px}

@media(max-width:960px){
  .heroIsi{grid-template-columns:1fr}
  .s8,.s7,.s5,.s4,.s6{grid-column:span 12}
  .panelDua{grid-template-columns:1fr}
  .segPanel{display:flex;margin-top:8px}
  .panelDua[data-lihat=pohon] .panel.tabelP{display:none}
  .panelDua[data-lihat=tabel] .panel.pohonP{display:none}
}
@media(max-width:600px){
  body{padding:12px 8px 90px}
  .hero{padding:14px 16px 18px}.hero h1{font-size:28px}
  .uh.kamu b{font-size:28px}.uh b{font-size:18px}
  .bento{padding:8px;gap:8px}.t{padding:15px;border-radius:22px}
  .kanvas{height:360px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-kembali" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-kirim" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></symbol>
  <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6"/><path d="M9 15l3 3 3-3"/></symbol>

const pec = (n, d) => { const g = fpb(n, d) || 1n; return [n / g, d / g]; };
const tambah = (x, y) => pec(x[0] * y[1] + y[0] * x[1], x[1] * y[1]);

// ═══ Hitung rantai munasakhat dari saham per lapis (data engine) ═══
function hitungRantai(lapis) {
  const masuk = { PEWARIS: [1n, 1n] }, dari = {}, total = {}, mayit = new Set(lapis.map(l => l[0]));
  for (const [m, per, tot] of lapis) {
    const asal = masuk[m] ?? NOL;
    for (const [id, s] of Object.entries(per)) {
      const f = kali(asal, pec(BigInt(s), BigInt(tot)));
      (dari[id] ??= {})[m] = f;
      if (mayit.has(id)) masuk[id] = tambah(masuk[id] ?? NOL, f); else total[id] = tambah(total[id] ?? NOL, f);
    }
  }
  return { masuk, dari, total };
}

function barisOrang(o, k) {
  const [n, peran, warna] = ORANG[o.id];
  const rp = o.tampil ?? (o.tahan ? 'Ditahan' : rupiah(bulat(HARTA, o.f)));
  const ket = o.tahan && o.maks ? `bisa sampai ${rpRingkas(bulat(HARTA, o.maks))}` : o.f[0] ? `${teksPec(o.f)} · ${persen(o.f)}` : o.ket ?? '';
  return `<button class="orang ${o.redup ? 'redup' : ''}" aria-expanded="false" data-id="${o.id}">
    <div class="baris"><span class="ava" style="background:${warna};${o.id === 'Bayi' ? 'color:#3d2e00' : ''}">${o.id === 'Bayi' ? '?' : n[0]}</span>
      <span class="nama"><b>${n}</b>${o.id === k.kamu ? '<span class="lab kamu">kamu</span>' : ''}${o.tahan ? `<span class="lab tahan">${o.tahan}</span>` : ''}${o.meninggal ? '<span class="lab meninggal">meninggal</span>' : ''}<span class="peran">${peran}</span></span>
      <span class="rp">${rp}${ket ? `<small>${ket}</small>` : ''}</span></div>
    <p class="alasan">${o.alasan}${o.ref ? `<span class="ref" title="Rujukan">${o.ref}</span>` : ''}</p>
    <div class="rinciBaris">${o.rinci ?? ''}<p class="lembar-buka"><span class="tautan" data-lembar="${o.id}">Penjelasan lengkap</span></p></div>
  </button>`;
}

function daftarRantai(k) {
  const r = hitungRantai(k.rantai), mayitUrut = k.rantai.map(l => l[0]);
  const penerima = Object.keys(r.total).sort((a, b) => (bulat(HARTA, r.total[b]) > bulat(HARTA, r.total[a]) ? 1 : -1));
  const baris = penerima.map(id => ({ id, f: r.total[id], alasan: Object.keys(r.dari[id]).length > 1 ? `Dari ${Object.keys(r.dari[id]).length} lapis. Ketuk untuk rincian.` : `Dari ${nama(Object.keys(r.dari[id])[0])}: ${ALASAN_LAPIS[Object.keys(r.dari[id])[0]]?.[id] ?? 'lihat aliran'}.`,
    rinci: `<div class="rinci">${Object.entries(r.dari[id]).map(([m, f]) => `<span class="t2">Dari ${nama(m)}${ALASAN_LAPIS[m]?.[id] ? ', ' + ALASAN_LAPIS[m][id] : ''}</span><span>${rupiah(bulat(HARTA, f))}</span>`).join('')}</div>` }));
  const diteruskan = mayitUrut.slice(1).map(id => ({ id, f: NOL, redup: true, meninggal: true, tampil: rupiah(bulat(HARTA, r.masuk[id])), ket: 'diteruskan', alasan: `Menerima dari ${Object.keys(r.dari[id]).map(nama).join(' dan ')}, lalu meninggal; bagiannya dibagi lagi.` }));
  const jumlahTotal = penerima.reduce((a, id) => a + bulat(HARTA, r.total[id]), 0n);
  return { baris: [...baris, ...diteruskan], sisa: HARTA - jumlahTotal, r };
}

function ubinDaftar(k) {
  let baris, sisa = 0n, tahanTotal = 0n;
  if (k.rantai) ({ baris, sisa } = daftarRantai(k));
  else { baris = k.daftar(); const dibagi = baris.reduce((a, o) => a + bulat(HARTA, o.f), 0n); if (k.taqdir) tahanTotal = 212500000n; else if (k.id !== 'tunggu') sisa = HARTA - dibagi; }
  const kelompok = k.cari;
  let isi;
  if (kelompok) {
    const gen = id => (id.match(/\d+/)?.[0] ?? '0');
    const grup = {}; for (const o of baris) (grup[o.meninggal ? 'm' : gen(o.id)] ??= []).push(o);
    const urut = Object.keys(grup).filter(g => g !== 'm').sort((a, b) => a - b);
    isi = urut.map((g, i) => `<div class="genGrup" data-gen="${g}" ${i >= 2 && i < urut.length - 1 ? 'hidden' : ''}><p class="gen">Generasi ${g}</p>${grup[g].map(o => barisOrang(o, k)).join('')}</div>`).join('')
      + `<button class="lipatGen" id="bukaGen">Tampilkan ${urut.length - 3} generasi di antaranya</button>`
      + `<details style="margin-top:6px"><summary style="cursor:pointer;font-size:13.5px;font-weight:600">${grup.m.length} orang yang meneruskan bagiannya</summary>${grup.m.map(o => barisOrang(o, k)).join('')}</details>`;
  } else isi = baris.map(o => barisOrang(o, k)).join('');
  return `<section class="t s7">
    <div class="kepala-t"><div><h2>${k.taqdir ? 'Siapa dapat berapa sekarang' : k.id === 'tunggu' ? 'Yang sudah pasti' : 'Siapa menerima berapa'}</h2><p class="sub">${k.rantai ? 'Total, sudah termasuk bagian dari orang yang meninggal kemudian. ' : ''}Ketuk nama untuk rincian.</p></div>
      <div class="segmen" title="Satuan pembulatan">${['1', '100', '1000'].map(s => `<button aria-pressed="${String(SATUAN) === s}" data-satuan="${s}">Rp ${Number(s).toLocaleString('id-ID')}</button>`).join('')}</div></div>
    ${kelompok ? `<label class="cari">${ik('cari')}<input id="cariOrang" placeholder="Cari nama, mis. Istri gen. 1"></label>` : ''}
    ${isi}
    ${sisa > 0n ? `<div class="sisa"><span>Sisa pembulatan, belum dibagi. Sepakati bersama.</span><b>${rupiah(sisa)}</b></div>` : ''}
    ${tahanTotal ? `<div class="sisa"><span>Ditahan sampai keadaannya jelas</span><b>${rupiah(tahanTotal)}</b></div>` : ''}
    ${k.id !== 'tunggu' ? `<div class="jumlah"><span>${tahanTotal ? 'Dibagi sekarang + ditahan' : 'Jumlah'}</span><span>${rupiah(HARTA)}</span></div>` : ''}
  </section>`;
}

function ubinAliran(k) {
  if (!k.rantai) return '';
  const r = hitungRantai(k.rantai), n = k.rantai.length, panjang = n > 5;
  const blok = k.rantai.map(([m, per, tot], i) => {

    const judul = i === 0 ? `${nama(m)} meninggal` : `${nama(m)} meninggal, bagiannya dibagi`;
    const masuk = i === 0 ? `Harta Rp ${asal.toLocaleString('id-ID')}` : `Bagian ${nama(m)} dari ${Object.keys(r.dari[m]).map(nama).join(' + ')}: ${rupiah(asal)}`;
    const rinci = Object.entries(per).map(([id, s]) => { const f = kali(r.masuk[m], pec(BigInt(s), BigInt(tot))); const terus = k.rantai.some(l => l[0] === id); return `<span>${nama(id)}${ALASAN_LAPIS[m]?.[id] ? ' · ' + ALASAN_LAPIS[m][id] : ` · ${s}/${tot}`}</span><b class="${terus ? 'terus' : ''}">${rupiah(bulat(HARTA, f))}${terus ? ' ↓' : ''}</b>`; }).join('');
    const sembunyi = panjang && i > 1 && i < n - 1;
    return `<div class="blok ${i === 0 ? 'aktif' : ''}" data-lapis="${i + 1}" ${sembunyi ? 'hidden' : ''} tabindex="0"><p class="sub">Lapis ${i + 1} dari ${n}</p><h3>${judul}</h3><p class="masuk">${masuk}</p><div class="rinci">${rinci}</div></div>`;

}

function svgPohon(p) {

  const g = p.garis.map(([d, kls, lapis]) => `<path class="${kls}" d="${d}" ${lapis ? `data-lapis="${lapis}" pathLength="1"` : ''}/>`).join('');
  return `<svg class="pohon" viewBox="0 0 ${p.lebar} ${p.tinggi}" width="${p.lebar}" height="${p.tinggi}" data-lebar="${p.lebar}" data-tinggi="${p.tinggi}">${g}${s}</svg>`;
}

  if (k.tabel?.taqdir) return `<div class="tabelWadah" style="padding:10px"><div id="pilihKemungkinan"></div><table class="tabel" id="tabelK"></table></div>`;
  if (k.rantai) {
    const r = hitungRantai(k.rantai);
    const pilihan = k.rantai.map(([m], i) => `<option value="${i}">Lapis ${i + 1}: ${nama(m)}</option>`).join('');
    return `<div style="padding:8px 10px;border-bottom:1px solid var(--line)"><select id="pilihLapis" style="font:500 13.5px var(--font);border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;max-width:100%">${pilihan}</select></div><div class="tabelWadah"><table class="tabel" id="tabelLapis"></table></div>`;
  }
  if (k.gharqa) return `<div class="tabelWadah">${GHARQA.serentak.harta.map(([m, h, per]) => `<table class="tabel"><tr><th>Harta ${nama(m)}</th><th>Bagian</th><th>Rupiah</th></tr>${Object.entries(per).map(([id, [a, b]]) => `<tr data-id="${id}"><td>${nama(id)}</td><td>${a}/${b}</td><td>${rupiah(h * BigInt(a) / BigInt(b))}</td></tr>`).join('')}</table>`).join('')}</div>`;
  if (!k.tabel) return '';
  const t = k.tabel;
  return `<div class="tabelWadah"><table class="tabel"><tr>${t.kolom.map(c => Array.isArray(c) ? `<th class="${c[1]}">${c[0]}</th>` : `<th>${c}</th>`).join('')}</tr>

}

}

  let kamu = '';

    if (keadaanGharqa === 'serentak') { const a = GHARQA.serentak.harta.reduce((s, [m, h, per]) => s + h * BigInt(per.Aminah[0]) / BigInt(per.Aminah[1]), 0n); kamu = `<div class="uh kamu"><span class="lbl">Bagianmu dari dua harta, sebagai istri Pak Ahmad dan ibu Budi</span><b>${rupiah(a)}</b><small>Rp 37.500.000 dari Pak Ahmad + Rp 8.333.333 dari Budi</small></div>`; }
    else kamu = `<div class="uh kamu"><span class="lbl">Bagianmu</span><b>Ditahan</b><small>Bisa Rp 47.135.416 atau Rp 74.999.999, tergantung urutan</small></div>`;
  } else if (k.rantai) {
    const r = hitungRantai(k.rantai); kamu = `<div class="uh kamu"><span class="lbl">Bagianmu, ${ORANG[k.kamu][1].toLowerCase()}</span><b>${rupiah(bulat(HARTA, r.total[k.kamu]))}</b><small>${Object.entries(r.dari[k.kamu]).map(([m, f]) => `${rpRingkas(bulat(HARTA, f))} dari ${nama(m)}`).join(' + ')}</small></div>`;
  } else {
    const o = k.daftar().find(x => x.id === k.kamu);
    kamu = `<div class="uh kamu"><span class="lbl">Bagianmu, sebagai ${ORANG[k.kamu][1].toLowerCase()}</span><b>${rupiah(bulat(HARTA, o.f))}</b><small>${o.alasan}</small></div>`;
  }
  const judul = g ? g.judul : k.judul, kalimat = g ? `${g.jawaban} ${g.alasan} <span style="opacity:.75;font-size:13px">[${g.ref}]</span>` : k.kalimat + (k.ref ? ` <span style="opacity:.75;font-size:13px">[${k.ref}]</span>` : '');
  return `<header class="hero">
    <div class="bilah"><button class="tautan" data-toast="Kembali ke Periksa">${ik('kembali')}Periksa</button><span class="status ${id === 'bersamaan' && keadaanGharqa === 'terlupakan' ? 'tahan' : k.status[1]}"><i></i>${id === 'bersamaan' && keadaanGharqa === 'terlupakan' ? 'Ditahan' : k.status[0]}</span></div>
    <div class="heroIsi"><div>
      <div class="namaKasus" id="namaKasus"><span id="teksNama">${namaUbah[id] ?? k.namaKasus}</span><button aria-label="Ubah nama kasus" id="ubahNama">${ik('ubah')}</button></div>
      <h1>${judul}</h1><p class="kalimat">${kalimat}</p>
      ${id === 'bersamaan' ? `<div class="segmen" style="margin-top:12px;background:rgba(255,255,255,.14)"><button aria-pressed="${keadaanGharqa === 'serentak'}" data-gharqa="serentak" style="color:${keadaanGharqa === 'serentak' ? 'var(--ink)' : '#fff'}">Serentak</button><button aria-pressed="${keadaanGharqa === 'terlupakan'}" data-gharqa="terlupakan" style="color:${keadaanGharqa === 'terlupakan' ? 'var(--ink)' : '#fff'}">Terlupakan</button></div><p style="font-size:12px;opacity:.7;margin-top:4px">Sakelar ini hanya untuk mockup; di aplikasi, keadaan diambil dari jawabanmu di Periksa.</p>` : ''}
      <div class="aksiHero"><button class="pil" data-kirim>${ik('kirim')}Kirim ringkasan</button><button class="tautan" data-toast="Kembali ke Periksa untuk mengubah data">${ik('ubah')}Ubah data</button></div>
    </div><div class="ubinHero">${kamu}${(id === 'bersamaan' && keadaanGharqa === 'terlupakan' ? [['Ditahan', 'Rp 350 jt', 'sampai ingat atau berdamai', 'tahan'], ['Kemungkinan', '2 urutan', 'untuk musyawarah']] : k.ubin).map(([l, v, s, c]) => `<div class="uh ${c ?? ''}"><span class="lbl">${l}</span><b>${v}</b>${s ? `<small>${s}</small>` : ''}</div>`).join('')}</div></div></header>`;
}

function daftarGharqa(k) {
  const g = GHARQA.serentak;
  if (keadaanGharqa === 'terlupakan') {
    return `<section class="t s7"><div class="kepala-t"><div><h2>Dua kemungkinan urutan</h2><p class="sub">Semua harta ditahan. Angka ini bahan musyawarah, belum dibagi.</p></div></div>
      <table class="tabel"><tr><th>Ahli waris</th>${GHARQA.terlupakan.skenario.map(s => `<th>${s[0]}</th>`).join('')}</tr>
      ${['Aminah', 'Siti', 'Zahra', 'Rina'].map(id => `<tr data-id="${id}"><td>${nama(id)}${id === k.kamu ? ' <span class="lab kamu">kamu</span>' : ''}</td>${GHARQA.terlupakan.skenario.map(s => `<td>${rupiah(s[1][id])}</td>`).join('')}</tr>`).join('')}</table></section>`;
  }
  const orang = ['Aminah', 'Siti', 'Zahra', 'Rina'].map(id => {
    const bagian = g.harta.filter(([, , per]) => per[id]).map(([m, h, per, al]) => [m, h * BigInt(per[id][0]) / BigInt(per[id][1]), al[id]]);
    const tot = bagian.reduce((a, b) => a + b[1], 0n);
    return { id, f: [tot, HARTA], tampil: rupiah(tot), ket: bagian.length > 1 ? 'dari dua harta' : 'dari satu harta', alasan: bagian.map(([m, , al]) => `Dari ${nama(m)}: ${al}`).join(' · ') + '.',
      rinci: `<div class="rinci">${bagian.map(([m, n, al]) => `<span class="t2">Dari harta ${nama(m)} (${al})</span><span>${rupiah(n)}</span>`).join('')}</div>` };
  });
  const jml = orang.reduce((a, o) => a + BigInt(o.tampil.replace(/\D/g, '')), 0n);
  return `<section class="t s7"><div class="kepala-t"><div><h2>Siapa menerima berapa</h2><p class="sub">Total dari dua harta. Ketuk untuk rincian per harta.</p></div></div>
    ${orang.map(o => barisOrang(o, k)).join('')}
    <div class="sisa"><span>Sisa pembulatan, belum dibagi</span><b>${rupiah(350000000n - jml)}</b></div>
    <div class="jumlah"><span>Jumlah dua harta</span><span>Rp 350.000.000</span></div></section>`;
}

function renderKasus(id) {
  kasusAktif = id; const k = KASUS[id]; k.id = id;
  const kiri = id === 'bersamaan' ? daftarGharqa(k) : ubinDaftar(k);
  const kanan = `<div class="kolom s5">${ubinDitahan(k)}${ubinJenis(id === 'bersamaan' ? { jenis: keadaanGharqa === 'serentak' ? ['Meninggal bersamaan', 'Dua harta dihitung terpisah; Budi bukan ahli waris Pak Ahmad, dan sebaliknya.'] : ['Meninggal bersamaan, urutan terlupakan', 'Ditahan sampai ingat atau berdamai (madzhab Syafi\'i).'] } : k)}${ubinCatatan(k)}${ubinInfo(k, id)}</div>`;
  $('#layar').innerHTML = `<p class="tugas ${tugasAktif === id ? 'aktif' : ''}">${TUGAS[id]?.[0] ?? ''}</p>${heroHtml(k, id)}
    <div class="bento">${kiri}${kanan}${ubinAliran(k)}${ubinPohonTabel(k)}${ubinBagikan()}${ubinLanjut(k)}${ubinPelajari()}</div>
    <p class="kaki">Untuk pembagian nyata, musyawarahkan dengan ahli faraidh atau ustadz setempat. Ada yang janggal? <button class="tautan" style="font-size:13px" data-toast="Membuka formulir laporan">Laporkan</button>.</p>`;
  pasang(k, id);
}

// ═══ Interaksi ═══
let skala = 1;
function aturSkala(s) {
  const svg = $('#kanvas svg'); if (!svg) return;
  skala = Math.min(2.5, Math.max(0.3, s));
  svg.setAttribute('width', svg.dataset.lebar * skala); svg.setAttribute('height', svg.dataset.tinggi * skala);
}
const pasSkala = () => { const kv = $('#kanvas'), svg = $('#kanvas svg'); if (kv && svg) aturSkala(Math.min(kv.clientWidth / svg.dataset.lebar, kv.clientHeight / svg.dataset.tinggi, 1.4)); };

function sorot(idOrang) {
  $$('.orang').forEach(b => b.classList.toggle('sorot', b.dataset.id === idOrang));
  $$('svg.pohon .kotak').forEach(g => g.classList.toggle('sorot', g.dataset.id === idOrang));
  $$('table.tabel tr[data-id]').forEach(r => r.classList.toggle('sorot', r.dataset.id === idOrang));
}

let putaran = 0;
async function putarLapis(dari, sampai) {
  const nomor = ++putaran, kv = $('#kanvas');
  $$('svg.pohon .alir').forEach(p => p.classList.remove('jalan', 'diam'));
  for (let l = dari; l <= sampai; l++) {
    if (nomor !== putaran) return;
    const jalur = $$(`svg.pohon .alir[data-lapis="${l}"]`);
    $$(`.blok`).forEach(b => b.classList.toggle('aktif', b.dataset.lapis === String(l)));
    if (jalur[0] && kv) { const bb = jalur[0].getBBox(); kv.scrollTo({ top: bb.y * skala - 60, left: bb.x * skala - 40, behavior: 'smooth' }); }
    jalur.forEach(p => p.classList.add('jalan'));
    await new Promise(r => setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 950));
    jalur.forEach(p => { p.classList.remove('jalan'); p.classList.add('diam'); });
  }
}

function pasang(k, id) {
  $$('.orang').forEach(b => b.addEventListener('click', e => {
    const lembar = e.target.closest('[data-lembar]'); if (lembar) { e.stopPropagation(); bukaLembar(lembar.dataset.lembar, k); return; }
    const buka = b.getAttribute('aria-expanded') !== 'true'; b.setAttribute('aria-expanded', buka); sorot(buka ? b.dataset.id : null);
  }));
  $$('svg.pohon .kotak[data-id]').forEach(g => g.addEventListener('click', () => { sorot(g.dataset.id); bukaLembar(g.dataset.id, k); }));
  $$('table.tabel').forEach(t => t.addEventListener('click', e => { const r = e.target.closest('tr[data-id]'); if (r) sorot(r.dataset.id); }));
  $$('[data-satuan]').forEach(b => b.onclick = () => { SATUAN = BigInt(b.dataset.satuan); renderKasus(id); });
  $$('[data-gharqa]').forEach(b => b.onclick = () => { keadaanGharqa = b.dataset.gharqa; renderKasus(id); });
  $$('[data-zoom]').forEach(b => b.onclick = () => (b.dataset.zoom === '0' ? pasSkala() : aturSkala(skala * (b.dataset.zoom === '1' ? 1.25 : 0.8))));
  $('#layarPenuh')?.addEventListener('click', () => { const p = $('#panelPohon'); if (p.requestFullscreen && !document.fullscreenElement) p.requestFullscreen().then(() => setTimeout(pasSkala, 100)).catch(() => p.classList.toggle('penuh')); else if (document.fullscreenElement) document.exitFullscreen(); else p.classList.toggle('penuh'); });
  $('#putarAliran')?.addEventListener('click', () => { const maks = Math.max(...$$('svg.pohon .alir').map(p => +p.dataset.lapis)); putarLapis(1, maks); });
  $$('.blok').forEach(b => b.addEventListener('click', () => { const l = +b.dataset.lapis; putarLapis(l, l); }));
  $('#bukaLapis')?.addEventListener('click', e => { $$('.blok[hidden]').forEach(b => (b.hidden = false)); e.target.remove(); });
  $('#bukaGen')?.addEventListener('click', e => { $$('.genGrup[hidden]').forEach(b => (b.hidden = false)); e.target.remove(); });
  $('#cariOrang')?.addEventListener('input', e => { const q = e.target.value.toLowerCase(); $$('.genGrup').forEach(g => { g.hidden = false; }); $('#bukaGen')?.remove(); $$('.orang').forEach(o => { o.hidden = q && !nama(o.dataset.id).toLowerCase().includes(q); }); });
  $$('.segPanel button').forEach(b => b.onclick = () => { $$('.segPanel button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('.panelDua').dataset.lihat = b.dataset.lihat; if (b.dataset.lihat === 'pohon') pasSkala(); });
  $('#tampilHitung')?.addEventListener('click', e => { const p = $('#panelTabel'); p.classList.toggle('hitung-on'); e.target.textContent = p.classList.contains('hitung-on') ? 'Sembunyikan hitungan' : 'Tampilkan hitungan'; });
  $('#ubahNama')?.addEventListener('click', () => { const w = $('#namaKasus'), lama = $('#teksNama').textContent; w.innerHTML = `<input id="isianNama" value="${lama}" aria-label="Nama kasus"><button class="tautan" id="simpanNama" style="color:#fff">Simpan</button>`; $('#isianNama').focus(); $('#simpanNama').onclick = () => { namaUbah[id] = $('#isianNama').value.trim() || lama; renderKasus(id); toast('nama kasus disimpan'); }; });
  $$('[data-kirim]').forEach(b => b.onclick = () => { $('#teksKirim').textContent = teksRingkasan(k, id); $('#lembarKirim').classList.add('on'); });
  if (k.tabel?.taqdir) siapkanKemungkinan();
  if (k.rantai) siapkanTabelLapis(k);
  setTimeout(pasSkala, 30);
}

const PILIHAN = { Siti: 'hidup', Bayi: 'mati' };
function siapkanKemungkinan() {
  $('#pilihKemungkinan').innerHTML = `<div class="pilih"><p>Kalau Siti…</p><div class="pilDeret">${[['hidup', 'ternyata masih hidup'], ['mati', 'dipastikan meninggal']].map(([v, l]) => `<button class="pk" data-sumber="Siti" data-v="${v}" aria-checked="${PILIHAN.Siti === v}">${l}</button>`).join('')}</div></div>

    const d = DUNIA_GABUNGAN.find(([t]) => t.Siti === PILIHAN.Siti && t.Bayi === PILIHAN.Bayi)[1];
    $('#tabelK').innerHTML = `<tr><th>Ahli waris</th><th>Sekarang</th><th>Kalau terjadi</th></tr>` + ['Aminah', 'Fatimah', 'Budi', 'Siti', 'Bayi'].map(id => { const sekarang = { Aminah: 37500000n, Fatimah: 50000000n }[id] ?? 0n; const nanti = d[id] ? bulat(HARTA, pec(BigInt(d[id]), 10080n)) : 0n; return `<tr data-id="${id}"><td>${nama(id)}</td><td>${rupiah(sekarang)}</td><td><b>${rupiah(nanti)}</b>${nanti > sekarang ? ` <small style="color:var(--hijau)">+${rpRingkas(nanti - sekarang)}</small>` : ''}</td></tr>`; }).join('');

  };
  $$('#pilihKemungkinan .pk').forEach(p => p.onclick = () => { PILIHAN[p.dataset.sumber] = p.dataset.v; isi(); });

function siapkanTabelLapis(k) {
  const r = hitungRantai(k.rantai);
  const isi = i => { const [m, per, tot] = k.rantai[i]; $('#tabelLapis').innerHTML = `<tr><th>${nama(m)}: ${rupiah(bulat(HARTA, r.masuk[m]))}</th><th>Bagian</th><th class="hit">Saham</th><th class="hit">Dari</th><th>Rupiah</th></tr>` + Object.entries(per).map(([id, s]) => `<tr data-id="${id}"><td>${nama(id)}</td><td>${ALASAN_LAPIS[m]?.[id]?.match(/\d+\/\d+|sisa/)?.[0] ?? `${s}/${tot}`}</td><td class="hit">${s}</td><td class="hit">${tot}</td><td>${rupiah(bulat(HARTA, kali(r.masuk[m], pec(BigInt(s), BigInt(tot)))))}</td></tr>`).join(''); };
  $('#pilihLapis').onchange = e => { isi(+e.target.value); putarLapis(+e.target.value + 1, +e.target.value + 1); };
  isi(0);
}

function bukaLembar(id, k) {
  if (!ORANG[id] || id === 'PEWARIS') return;
  const [n, peran] = ORANG[id];
  const AHWAL = { Aminah: [['Almarhum tidak punya anak atau cucu', '1/4'], ['Almarhum punya anak atau cucu', '1/8']], Fatimah: [['Tidak ada anak dan tidak ada 2+ saudara', '1/3'], ['Ada anak atau 2+ saudara', '1/6']], Budi: [['Selalu mendapat sisa harta', 'sisa']], Siti: [['Sendirian, tanpa saudara laki-laki', '1/2'], ['Bersama saudara laki-laki', 'sisa, 2:1']], Hasan: [['Tidak ada anak laki-laki, ayah, kakek', 'sisa'], ['Ada anak laki-laki', 'tidak mendapat']] };
  let bagian = '—', pecahan = '—', pers = '—', alasan = '', rinci = '';
  const baris = k.daftar ? k.daftar().find(o => o.id === id) : null;
  if (baris) { bagian = baris.tahan ? 'Ditahan' : rupiah(bulat(HARTA, baris.f)); pecahan = baris.f[0] ? teksPec(baris.f) : '—'; pers = baris.f[0] ? persen(baris.f) : '—'; alasan = baris.alasan; }
  if (k.rantai) { const r = hitungRantai(k.rantai); if (r.total[id]) { bagian = rupiah(bulat(HARTA, r.total[id])); pecahan = teksPec(r.total[id]).length > 14 ? 'angka panjang' : teksPec(r.total[id]); pers = persen(r.total[id]); } rinci = r.dari[id] ? Object.entries(r.dari[id]).map(([m, f]) => `<tr><td>Dari ${nama(m)}${ALASAN_LAPIS[m]?.[id] ? ', ' + ALASAN_LAPIS[m][id] : ''}</td><td style="text-align:end">${rupiah(bulat(HARTA, f))}</td></tr>`).join('') : ''; }
  const ahwal = AHWAL[id];
  $('#lembarOrang').innerHTML = `<button class="tutup" id="tutupLembar" aria-label="Tutup">✕</button><p class="sub">${peran}</p><h3>${n}</h3>
    <h4>BAGIANNYA</h4><div class="tiga"><div><span>Rupiah</span><b>${bagian}</b></div><div><span>Pecahan</span><b>${pecahan}</b></div><div><span>Persen</span><b>${pers}</b></div></div>
    ${alasan ? `<h4>KENAPA SEGITU</h4><p style="font-size:14px">${alasan}</p>` : ''}
    ${rinci ? `<h4>DARI MANA SAJA</h4><table class="ahwal">${rinci}</table>` : ''}
    ${ahwal ? `<h4>KAPAN DAPAT BERAPA</h4><table class="ahwal">${ahwal.map(([a, b], i) => `<tr class="${(id === 'Aminah' || id === 'Fatimah' || id === 'Hasan') && i === 1 || (id === 'Siti' && i === 1) || id === 'Budi' ? 'ini' : ''}"><td>${a}</td><td style="text-align:end">${b}</td></tr>`).join('')}</table>` : ''}
    <h4>DALIL</h4><p style="font-size:14px">QS An-Nisa ayat 11–12. <span class="tautan" data-toast="Membuka teks dalil">Baca</span></p>
    <p style="margin-top:16px"><button class="tautan" data-toast="Membuka ubah jumlah ahli waris">Ubah jumlah</button></p>`;
  $('#lembarOrang').classList.add('on'); $('#latar').classList.add('on');
  $('#tutupLembar').onclick = tutupLembar;
}
const tutupLembar = () => { $('#lembarOrang').classList.remove('on'); $('#latar').classList.remove('on'); };
$('#latar').onclick = tutupLembar;

function teksRingkasan(k, id) {
  const judul = `${namaUbah[id] ?? k.namaKasus} (madzhab Syafi'i)`;
  if (id === 'bersamaan') return `${judul}\nPak Ahmad dan Budi meninggal ${keadaanGharqa === 'serentak' ? 'serentak, tidak saling mewarisi.' : 'bersamaan; urutan terlupakan, harta ditahan.'}\nRincian: [tautan PDF]`;
  if (k.rantai) { const r = hitungRantai(k.rantai); return `${judul}\nHarta Rp 300.000.000, total per orang:\n` + Object.keys(r.total).map(i => `• ${nama(i)}: ${rupiah(bulat(HARTA, r.total[i]))}`).join('\n') + '\nAliran lengkap: [tautan PDF]'; }
  return `${judul}\n` + k.daftar().map(o => `• ${nama(o.id)}: ${o.tahan ? 'ditahan' : o.f[0] ? rupiah(bulat(HARTA, o.f)) : 'tidak mendapat'}`).join('\n') + '\nRincian dan alasan: [tautan PDF]';
}

function renderCoba() {
  $('#layar').innerHTML = `<div class="coba"><h1>Cara mencoba</h1><div class="bento" style="padding:0">
    <section class="t s6"><h2>Ini contoh</h2><p style="font-size:14px;margin-top:6px">Tidak ada yang disimpan. Angka dihitung dari hasil engine untuk keluarga contoh: <b>Pak Ahmad</b> (almarhum), <b>Aminah</b> (istri), <b>Fatimah</b> (ibu), <b>Budi</b> dan <b>Siti</b> (anak), <b>Rina</b> (istri Budi), <b>Zahra</b> (anak Budi), <b>Hasan</b> (kakak almarhum).</p></section>
    <section class="t s6 mint"><h2>Arti warna</h2><p style="font-size:14px;margin-top:6px">Hijau: menerima. Kuning: ditahan. Abu: sudah meninggal atau tidak mendapat. Oranye: aliran harta. Merah putus-putus: tidak saling mewarisi.</p></section>
    ${Object.entries(TUGAS).map(([id, [, langkah, cek]], i) => `<section class="t s6"><h2>Tugas ${i + 1}: ${KASUS[id].tab}</h2><ol>${langkah.map(l => `<li>${l}</li>`).join('')}</ol><p class="cek">Yang dicek: ${cek}</p><p style="margin-top:8px"><button class="tautan" data-mulai="${id}">Mulai tugas ini</button></p><textarea data-catatan="Tugas ${i + 1}: ${KASUS[id].tab}" placeholder="Catatanmu…"></textarea></section>`).join('')}
    <section class="t s12 oranye"><h2>Kirim catatan</h2><p style="font-size:14px;margin:6px 0 10px">Salin semua catatanmu lalu tempel di chat ke tim.</p><button class="btn" id="salinCatatan">Salin catatan</button></section></div></div>`;
  $$('[data-mulai]').forEach(b => b.onclick = () => { tugasAktif = b.dataset.mulai; buka(b.dataset.mulai); });
  $('#salinCatatan').onclick = () => { navigator.clipboard?.writeText($$('[data-catatan]').filter(t => t.value.trim()).map(t => `${t.dataset.catatan}\n${t.value.trim()}`).join('\n\n')).catch(() => {}); toast('catatan disalin'); };
}

// ═══ Tab, toast ═══
const TAB = [...Object.keys(KASUS), 'coba'];
$('#tab').innerHTML = TAB.map(id => `<button role="tab" data-ke="${id}">${id === 'coba' ? 'Cara mencoba' : KASUS[id].tab}</button>`).join('');
function buka(id) { $$('#tab button').forEach(b => b.setAttribute('aria-selected', b.dataset.ke === id)); tutupLembar(); id === 'coba' ? renderCoba() : renderKasus(id); scrollTo(0, 0); }
$$('#tab button').forEach(b => b.onclick = () => buka(b.dataset.ke));
let jeda;
function toast(t) { $('#toastTeks').textContent = 'Mockup: ' + t; $('#toast').classList.add('on'); clearTimeout(jeda); jeda = setTimeout(() => $('#toast').classList.remove('on'), 3200); }
$('#toastUrung').onclick = () => $('#toast').classList.remove('on');
document.addEventListener('click', e => { const el = e.target.closest('[data-toast]'); if (el) { e.preventDefault(); e.stopPropagation(); toast(el.dataset.toast); } }, true);
$('#batalKirim').onclick = () => $('#lembarKirim').classList.remove('on');
$('#salinKirim').onclick = () => { navigator.clipboard?.writeText($('#teksKirim').textContent).catch(() => {}); $('#lembarKirim').classList.remove('on'); toast('teks disalin, WhatsApp dibuka'); };

// Cek konsistensi dengan nominal engine (M13): total per orang hasil rantai harus sama dengan nominal engine.
const NOMINAL_ENGINE_BERLAPIS = { Siti: 173958333n, Rina: 21875000n, Zahra: 104166666n };
const cekR = hitungRantai(LAPIS_BERLAPIS);
for (const [id, n] of Object.entries(NOMINAL_ENGINE_BERLAPIS)) if (HARTA * cekR.total[id][0] / cekR.total[id][1] !== n) console.error('Tidak cocok dengan engine:', id);

buka('biasa');
</script>
