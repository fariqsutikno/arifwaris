<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup layar Hasil per kasus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<!-- Acuan: docs/design/riset-ux-hasil-2026-11-17.md (HMW-1..9, prinsip bagian 10). Gaya Logivo: bingkai krem, hero hijau gelap,
     ubin bento pastel. Semua layar dirender dari objek KASUS (satu sumber angka). -->
<style>
:root{--page:#b9d4c0;--frame:#eef3e8;--ink:#14181a;--muted:#525c57;--card:rgba(255,255,255,.78);--edge:rgba(255,255,255,.95);
--orange:#f2682a;--orange-soft:#fde6d8;--mint:#dcefe2;--kuning:#fbefc9;--kuning-ink:#6b4f00;--black:#0e0f10;--line:#dfe6dc;
--font:"Onest",system-ui,sans-serif;--sh:0 1px 2px rgba(20,40,30,.06),0 6px 18px rgba(20,40,30,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.5 var(--font);padding:18px 12px 90px}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}
.ik{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.tautan{background:none;border:0;padding:0;font:600 14px var(--font);color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.atas-mockup{max-width:1120px;margin:0 auto 12px}
.atas-mockup p{font-size:13px;color:#2c4136;margin:0 4px 8px}
nav.tab{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
nav.tab button{flex:none;border:0;background:rgba(255,255,255,.5);color:var(--ink);font:500 14px var(--font);padding:9px 14px;border-radius:999px;cursor:pointer}
nav.tab button[aria-selected=true]{background:var(--black);color:#fff}
.frame{max-width:1120px;margin:0 auto;background:var(--frame);border-radius:30px;overflow:hidden;box-shadow:0 20px 50px rgba(20,40,30,.18)}
.tugas{display:none;background:var(--kuning);color:#4a3a00;padding:10px 20px;font-size:13.5px}
.tugas.aktif{display:block}
.hero{color:#fff;padding:18px 20px 22px;
  background:radial-gradient(520px 300px at 80% 60%,rgba(255,150,40,.35),transparent 70%),
             radial-gradient(420px 260px at 6% 0%,rgba(60,210,170,.32),transparent 70%),
             linear-gradient(135deg,#0a2326 0%,#0f3a38 55%,#0b2a2b 100%)}
.hero .bilah{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:rgba(255,255,255,.88)}
.hero .bilah .tautan{display:inline-flex;gap:4px;align-items:center;color:#fff}
.heroIsi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:end;margin-top:18px}
.lok{font-size:14px;color:rgba(255,255,255,.85)}
.hero h1{font-size:40px;line-height:1.05;font-weight:500;letter-spacing:-.02em;margin-top:6px}
.hero .kalimat{font-size:16px;margin-top:10px;color:rgba(255,255,255,.95);max-width:46ch}
.hero .meta{font-size:13px;margin-top:8px;color:rgba(255,255,255,.78)}
.aksiHero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:18px}
.pil{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font:600 14px var(--font);background:#fff;color:var(--ink);border:0;cursor:pointer}
.aksiHero .tautan{color:#fff;display:inline-flex;gap:6px;align-items:center}
.ubinHero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.uh{border-radius:22px;padding:14px 16px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(8px);min-width:0}
.uh .lbl{font-size:12.5px;color:rgba(255,255,255,.82)}
.uh b{display:block;font-size:22px;font-weight:600;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.uh small{display:block;font-size:12.5px;color:rgba(255,255,255,.8);margin-top:4px}
.uh.kamu{grid-column:1/-1;background:rgba(255,255,255,.94);color:var(--ink);border-color:#fff}
.uh.kamu .lbl,.uh.kamu small{color:var(--muted)}
.uh.kamu b{font-size:34px;letter-spacing:-.01em}
.uh.tahan{background:rgba(251,239,201,.95);color:var(--kuning-ink);border-color:#fbefc9}
.uh.tahan .lbl,.uh.tahan small{color:var(--kuning-ink)}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;padding:12px}
.t{background:var(--card);border:1px solid var(--edge);border-radius:24px;padding:18px;min-width:0;box-shadow:var(--sh)}
.t h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.t .sub{font-size:13px;color:var(--muted);margin-top:2px}
.t.mint{background:var(--mint);border-color:var(--mint)}
.t.oranye{background:var(--orange-soft);border-color:var(--orange-soft)}
.t.gelap{background:var(--black);color:#fff;border-color:var(--black)}
.t.gelap .sub{color:rgba(255,255,255,.72)}
.s12{grid-column:span 12}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}.s6{grid-column:span 6}
.r2{grid-row:span 2}
.kepala-t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.panah{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.orang{display:block;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;font:inherit;color:inherit;cursor:pointer}
.orang:first-of-type{border-top:0}
.orang .baris{display:flex;gap:12px;align-items:center}
.ava{flex:none;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font:600 15px var(--font);color:#fff}
.nama{flex:1;min-width:0}
.nama b{font-weight:600;font-size:15.5px}
.nama .peran{display:block;color:var(--muted);font-size:13px}
.rp{font:600 17px/1.2 var(--font);font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.rp small{display:block;font:400 12px var(--font);color:var(--muted)}
.alasan{margin:6px 0 0 50px;font-size:13.5px;color:#2c3530}
.lebih{display:none;margin:10px 0 0 50px;padding:10px 12px;background:rgba(20,24,26,.04);border-radius:14px;font-size:13.5px}
.orang[aria-expanded=true] .lebih{display:block}
.lebih p+p{margin-top:6px}
.rinci{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-variant-numeric:tabular-nums}
.rinci .t2{color:var(--muted)}
.orang.redup .nama b,.orang.redup .rp{color:var(--muted)}
.orang.redup .ava{background:#dfe3dd!important;color:#3f4944}
.lab{display:inline-block;font:600 11.5px var(--font);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.lab.kamu{background:var(--mint);color:#1f5a40}
.lab.tahan{background:var(--kuning);color:var(--kuning-ink)}
.lab.meninggal{background:#e7eae5;color:#4b554f}
.jumlah{display:flex;justify-content:space-between;gap:12px;border-top:1.5px solid var(--ink);margin-top:4px;padding-top:10px;font-weight:600;font-variant-numeric:tabular-nums}
.sisa{display:flex;justify-content:space-between;gap:12px;border-top:1px dashed var(--line);padding:10px 0 8px;font-size:13.5px;color:var(--muted)}
.sisa b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.pita{display:flex;height:46px;border-radius:14px;overflow:hidden;gap:3px;margin-top:6px}
.pita span{display:block;min-width:4px}
.pita span.tahan{background:repeating-linear-gradient(45deg,#f3dc94 0 8px,#fbefc9 8px 16px)!important}
.leg{display:grid;gap:8px;margin-top:14px}
.leg div{display:flex;align-items:center;gap:10px;font-size:14px}
.leg i{flex:none;width:12px;height:12px;border-radius:4px}
.leg span{flex:1}
.leg b{font-weight:600;font-variant-numeric:tabular-nums}
.pohonWadah{overflow-x:auto;margin:0 -6px}
svg.pohon{display:block;width:100%;min-width:440px;max-width:720px;margin:0 auto;height:auto}
svg.pohon .kotak rect{fill:#fff;stroke:#c9d2c8;stroke-width:1.5}
svg.pohon .terima rect{fill:#eef7ea;stroke:#6aa587}
svg.pohon .redup rect{fill:#f3f4f1;stroke:#cfd6cd;stroke-dasharray:4 3}
svg.pohon .meninggal rect{fill:#eceee9;stroke:#8f9a93}
svg.pohon .almarhum rect{fill:#0f3a38;stroke:#0f3a38}
svg.pohon .almarhum text{fill:#fff}
svg.pohon .tahan rect{fill:#fff7e0;stroke:#d9b44a;stroke-dasharray:5 3}
svg.pohon .sorot rect{stroke:var(--ink);stroke-width:3}
svg.pohon text{font:600 12.5px var(--font);fill:var(--ink)}
svg.pohon text.k{font:400 11.5px var(--font);fill:var(--muted)}
svg.pohon text.r{font:600 12.5px var(--font);fill:#1f6f5c}
svg.pohon .g{stroke:#9aa79f;stroke-width:1.6;fill:none}
svg.pohon .g.nikah{stroke-dasharray:2 3}
svg.pohon .alir{stroke:var(--orange);stroke-width:3.5;fill:none;opacity:0;transition:opacity .3s}
svg.pohon .alir.on{opacity:1}
.legPohon{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legPohon i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid}
.alir-t{cursor:pointer;border:2px solid transparent}
.alir-t.aktif{border-color:var(--orange)}
.alir-t .no{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--black);color:#fff;font:600 13px var(--font);margin-right:8px;flex:none}
.alir-t h2{display:flex;align-items:center}
.alir-t .rinci{margin-top:10px;font-size:14px}
.alir-t .rinci b{font-weight:600}
.pilDeret{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.pk{border:1.5px solid #7d8a82;background:#fff;border-radius:999px;padding:7px 13px;font:500 13.5px var(--font);cursor:pointer;color:var(--ink)}
.pk[aria-checked=true]{background:var(--ink);border-color:var(--ink);color:#fff}
ol.lanjut{margin:8px 0 0;padding:0;list-style:none;counter-reset:n;display:grid;gap:10px}
ol.lanjut li{counter-increment:n;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px}
ol.lanjut li::before{content:counter(n);width:28px;height:28px;border-radius:50%;background:rgba(20,24,26,.08);display:grid;place-items:center;font-weight:600;font-size:13px}
ol.lanjut li span{display:block;color:var(--muted);font-size:13px}
.aksiBagi{display:grid;gap:10px;margin-top:10px}
.aksiBagi button{display:flex;gap:12px;align-items:center;text-align:start;background:rgba(255,255,255,.7);border:0;border-radius:18px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.aksiBagi button b{display:block;font-weight:600;font-size:14.5px}
.aksiBagi button span span{display:block;color:var(--muted);font-size:12.5px}
.aksiBagi .ikBulat{flex:none;width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center}
.periksaIsi{display:none}
.periksaIsi.on{display:block}
.periksaIsi ol{padding-left:20px;margin:10px 0 14px;font-size:14px}
.periksaIsi li{margin:0 0 8px}
.istilah{border-bottom:1.5px dotted var(--muted)}
.tabelWadah{overflow-x:auto}
table.tabel{border-collapse:collapse;width:100%;min-width:460px;font-size:13.5px;font-variant-numeric:tabular-nums}
table.tabel th,table.tabel td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:end}
table.tabel th:first-child,table.tabel td:first-child{text-align:start}
table.tabel th{background:rgba(20,24,26,.05);font-weight:600;font-size:12.5px}
.kaki{padding:4px 22px 22px;font-size:13px;color:var(--muted)}
.lembar{position:fixed;inset:0;background:rgba(20,24,26,.38);display:none;align-items:flex-end;justify-content:center;z-index:8}
.lembar.on{display:flex}
.lembar .isi{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:560px;padding:18px 16px 22px}
.lembar h4{font-size:18px;font-weight:600;margin-bottom:10px}
.lembar pre{white-space:pre-wrap;font:14px/1.5 var(--font);background:var(--frame);border-radius:16px;padding:12px;margin:0 0 14px;max-height:50vh;overflow:auto}
.lembar .deret{display:flex;justify-content:flex-end;gap:16px;align-items:center}
.btn{border:0;background:var(--black);color:#fff;font:600 14px var(--font);border-radius:999px;padding:12px 18px;cursor:pointer;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(200%);visibility:hidden;background:var(--black);color:#fff;border-radius:999px;padding:11px 18px;display:flex;gap:14px;align-items:center;transition:transform .25s;max-width:calc(100% - 32px);font-size:14px;z-index:9}
.toast.on{transform:translateX(-50%) translateY(0);visibility:visible}
.toast .tautan{color:#fff}
.coba{padding:20px}
.coba h1{font-size:28px;font-weight:500;margin-bottom:12px}
.coba textarea{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:14px;padding:10px;font:inherit;margin-top:8px;background:#fff}
.coba .cek{color:var(--muted);font-size:13.5px;margin-top:6px}
.coba ol{padding-left:20px;margin:8px 0 0;font-size:14px}
.asumsi{margin-top:12px}
.asumsi p{font-size:14px}
@media(max-width:900px){
  .heroIsi{grid-template-columns:1fr}
  .s7,.s5,.s4,.s6{grid-column:span 12}
  .r2{grid-row:auto}
}
@media(max-width:600px){
  body{padding:12px 8px 90px}
  .hero{padding:16px 16px 18px}
  .hero h1{font-size:30px}
  .uh.kamu b{font-size:30px}
  .uh b{font-size:19px}
  .bento{padding:8px;gap:8px}
  .t{padding:16px;border-radius:22px}
  svg.pohon{width:600px;max-width:none}
}
</style>
</head>

// ─── Render ───
const rupiah = n => 'Rp ' + n.toLocaleString('id-ID');
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const ik = (id, gaya = '') => `<svg class="ik" style="${gaya}"><use href="#i-${id}"/></svg>`;
let tugasAktif = null;

const barisOrang = o => `
  <button class="orang ${o.varian ?? ''}" aria-expanded="false" data-orang="${o.id}">
    <div class="baris"><span class="ava" style="background:${WARNA[o.id]};${o.id === 'bayi' ? 'color:#3d2e00' : ''}">${o.inisial ?? o.nama[0]}</span>
      <span class="nama"><b>${o.nama}</b>${o.lab ? `<span class="lab ${o.lab}">${o.labTeks ?? o.lab}</span>` : ''}<span class="peran">${o.peran}</span></span>
      <span class="rp">${o.tampil ?? rupiah(o.n)}${o.tampilKet ? `<small>${o.tampilKet}</small>` : ''}</span></div>
    <p class="alasan">${o.alasan}</p><div class="lebih">${o.lebih}</div>
  </button>`;

const ubinDaftar = (d, kasus) => `
  <section class="t ${kasus.daftar.length > 1 ? 's6' : 's7 r2'}">
    <div class="kepala-t"><div><h2>${d.judul}</h2><p class="sub">${d.sub}</p></div></div>
    ${d.orang.map(barisOrang).join('')}
    ${d.sisa ? `<div class="sisa"><span>Sisa pembulatan, belum dibagi · <button class="tautan" style="font-size:13px" data-toast="Membuka pilihan pembulatan: Rp 1 / Rp 100 / Rp 1.000">ubah</button></span><b>${rupiah(d.sisa)}</b></div>` : ''}
    ${d.tahan ? `<div class="sisa"><span>Ditahan sampai keadaannya jelas</span><b>${rupiah(d.tahan)}</b></div>` : ''}
    ${d.jumlah ? `<div class="jumlah"><span>${d.jumlah[0]}</span><span>${rupiah(d.jumlah[1])}</span></div>` : ''}
  </section>`;

function ubinPorsi(kasus) {
  const d = kasus.daftar[0];
  const bagian = d.orang.filter(o => o.n > 0).map(o => [o.nama, o.n, WARNA[o.id]]);
  if (d.tahan) bagian.push(['Ditahan', d.tahan, 'tahan']);
  const total = bagian.reduce((a, [, n]) => a + n, 0);
  return `<section class="t s5">
    <div class="kepala-t"><div><h2>Porsi harta</h2><p class="sub">Panjang tiap warna sesuai rupiahnya</p></div></div>
    <div class="pita">${bagian.map(([nama, n, w]) => `<span title="${nama}" class="${w === 'tahan' ? 'tahan' : ''}" style="flex:${n};background:${w}"></span>`).join('')}</div>
    <div class="leg">${bagian.map(([nama, n, w]) => `<div><i style="background:${w === 'tahan' ? '#f3dc94' : w}"></i><span>${nama}</span><b>${Math.round(n / total * 100)}%</b></div>`).join('')}</div>
  </section>`;
}

const ubinPohon = kasus => `<section class="t ${kasus.alir ? 's12' : 's5'}">
  <div class="kepala-t"><div><h2>Pohon keluarga</h2><p class="sub">${kasus.alir ? 'Ketuk tahap di atas untuk melihat jalur hartanya' : 'Ketuk nama di daftar untuk menyorot'}</p></div></div>
  <div class="pohonWadah">${$('#' + kasus.pohon).innerHTML}</div>
  <div class="legPohon"><span><i style="background:#eef7ea;border-color:#6aa587"></i>mendapat</span>${kasus.alir ? '<span><i style="background:#f2682a;border-color:#f2682a"></i>jalur harta</span>' : ''}<span><i style="background:#fff7e0;border-color:#d9b44a;border-style:dashed"></i>ditahan</span><span><i style="background:#eceee9;border-color:#8f9a93"></i>sudah meninggal</span></div>
</section>`;

const ubinAlir = kasus => kasus.alir.map((a, i) => `
  <section class="t s6 alir-t ${i === 0 ? 'aktif' : ''}" data-alir="${i + 1}" role="button" tabindex="0">
    <h2><span class="no">${i + 1}</span>${a.judul}</h2><p class="sub" style="margin-top:6px">${a.ket}</p>
    <p style="font:600 24px var(--font);margin-top:8px">${a.rp}</p>
    <div class="rinci">${a.rinci.map(([t, v]) => `<span>${t}</span><b>${v}</b>`).join('')}</div>
  </section>`).join('');

const ubinKemungkinan = () => `<section class="t s7">
  <div class="kepala-t"><div><h2>Kalau bayinya…</h2><p class="sub">Perkiraan; dihitung ulang setelah bayi lahir</p></div></div>
  <div class="pilDeret" role="radiogroup">${KEMUNGKINAN_BAYI.map(([l], i) => `<button class="pk" role="radio" aria-checked="${i === 0}" data-k="${i}">${l}</button>`).join('')}</div>
  <div id="hasil-k"></div></section>`;

const ubinBagikan = () => `<section class="t s4 oranye">

  </div></section>`;

const ubinLanjut = kasus => `<section class="t s4 mint">
  <div class="kepala-t"><div><h2>Langkah selanjutnya</h2></div></div>
  <ol class="lanjut">${kasus.lanjut.map(([t, s]) => `<li><div>${t}${s ? `<span>${s}</span>` : ''}</div></li>`).join('')}</ol></section>`;

const ubinCatatan = kasus => `<section class="t ${kasus.kemungkinan ? 's5' : 's5'}">
  <div class="kepala-t"><div><h2>${kasus.catatan[0]}</h2></div></div>
  <p style="font-size:14px">${kasus.catatan[1]}</p>
  ${kasus.catatan[2] ? `<p style="margin-top:10px"><button class="tautan" data-toast="${kasus.catatan[2]}">${kasus.catatan[2]}</button></p>` : ''}</section>`;

const ubinPeriksa = kasus => `<section class="t s4 gelap" id="ubin-periksa" role="button" tabindex="0" style="cursor:pointer">
  <div class="kepala-t"><div><h2>Cara menghitung</h2><p class="sub">Langkah, istilah, dan tabel untuk dicocokkan dengan ustadz</p></div><span class="panah">${ik('bawah')}</span></div></section>
  <section class="t s12 periksaIsi" id="isi-periksa"><h2>Cara menghitung</h2>${kasus.periksa}</section>`;

function renderKasus(id) {
  const k = KASUS[id];
  const adaPorsi = k.daftar.length === 1 && id !== 'tunggu';
  const urutan = [
    ...k.daftar.map(d => ubinDaftar(d, k)),
    adaPorsi ? ubinPorsi(k) : '',
    k.catatan ? ubinCatatan(k) : '',
    k.alir ? ubinAlir(k) : '',
    k.kemungkinan ? ubinKemungkinan() : '',
    ubinPohon(k),
    ubinBagikan(),
    ubinLanjut(k),
    k.periksa ? ubinPeriksa(k) : '',
  ];
  $('#layar').innerHTML = `
    <p class="tugas ${tugasAktif === id ? 'aktif' : ''}">${k.tugas}</p>
    <header class="hero">
      <div class="bilah"><button class="tautan" data-toast="Kembali ke Periksa">${ik('kembali')}Periksa</button><span>${MADZHAB} · <button class="tautan" style="font-size:14px" data-toast="Membuka pilihan madzhab">ganti</button></span></div>
      <div class="heroIsi">
        <div>
          <p class="lok">${k.judulKecil}</p><h1>${k.judul}</h1>
          <p class="kalimat">${k.kalimat}</p><p class="meta">${k.meta}</p>
          <div class="aksiHero">
            <button class="pil" data-kirim>${ik('kirim')}Kirim ringkasan</button>
            <button class="tautan" data-toast="Kembali ke Periksa untuk mengubah data">${ik('ubah')}Ubah data</button>
          </div>
        </div>
        <div class="ubinHero">
          <div class="uh kamu"><span class="lbl">${k.kamu[0]}</span><b>${k.kamu[1]}</b><small>${k.kamu[2]}</small></div>
          ${k.ubin.map(([l, v, s, varian]) => `<div class="uh ${varian ?? ''}"><span class="lbl">${l}</span><b>${v}</b>${s ? `<small>${s}</small>` : ''}</div>`).join('')}
        </div>
      </div>
    </header>
    <div class="bento">${urutan.join('')}</div>
    <p class="kaki">Untuk pembagian nyata, musyawarahkan dengan ahli faraidh atau ustadz setempat. Ada yang janggal? <button class="tautan" style="font-size:13px" data-toast="Membuka formulir laporan">Laporkan</button>.</p>`;
  pasangInteraksi(k);
}

function pasangInteraksi(k) {
  $$('.orang').forEach(b => b.addEventListener('click', e => {
    if (e.target.closest('.tautan')) return;
    const buka = b.getAttribute('aria-expanded') !== 'true';
    b.setAttribute('aria-expanded', buka);
    $$('svg.pohon .kotak').forEach(g => g.classList.toggle('sorot', buka && g.dataset.id === b.dataset.orang));
  }));
  const pilihAlir = t => { $$('.alir-t').forEach(a => a.classList.toggle('aktif', a.dataset.alir === t)); $$('svg.pohon .alir').forEach(p => p.classList.toggle('on', p.dataset.tahap === t)); };
  $$('.alir-t').forEach(a => a.onclick = () => pilihAlir(a.dataset.alir));
  if (k.alir) pilihAlir('1');
  const tampilK = i => {
    $$('.pk').forEach(p => p.setAttribute('aria-checked', p.dataset.k === String(i)));
    $('#hasil-k').innerHTML = KEMUNGKINAN_BAYI[i][1].map(([n, v]) => `<div class="sisa" style="color:var(--ink)"><span>${n}</span><b>${rupiah(v)}</b></div>`).join('');
  };
  $$('.pk').forEach(p => p.onclick = () => tampilK(p.dataset.k));
  if (k.kemungkinan) tampilK(0);
  $('#ubin-periksa')?.addEventListener('click', () => { $('#isi-periksa').classList.toggle('on'); $('#isi-periksa').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  $$('[data-kirim]').forEach(b => b.onclick = () => { $('#teks-lembar').textContent = k.kirim; $('#lembar').classList.add('on'); });
}

function renderCoba() {
  $('#layar').innerHTML = `<div class="coba">
    <h1>Cara mencoba</h1>
    <div class="bento" style="padding:0">
      <section class="t s6"><h2>Ini contoh</h2><p style="font-size:14px;margin-top:6px">Bukan aplikasi sungguhan, tidak ada yang disimpan. Tombol hanya menampilkan pesan. Keluarga yang dipakai: <b>Pak Ahmad</b> (almarhum), <b>Aminah</b> (istri, dianggap "kamu"), <b>Fatimah</b> (ibu), <b>Budi</b> dan <b>Siti</b> (anak), <b>Zahra</b> (anak Budi), <b>Hasan</b> (kakak almarhum).</p></section>
      <section class="t s6 mint"><h2>Arti warna</h2><div class="leg">
        <div><i style="background:#fff"></i><span>Ubin putih di bagian atas: bagianmu</span></div>
        <div><i style="background:#f3dc94"></i><span>Kuning: uang yang ditahan</span></div>
        <div><i style="background:#f2682a"></i><span>Oranye: jalur harta di pohon</span></div>
        <div><i style="background:#8f9a93"></i><span>Abu: sudah meninggal atau tidak mendapat</span></div></div></section>
      ${Object.entries(TUGAS_LANGKAH).map(([id, [langkah, cek]], i) => `<section class="t s6"><h2>Tugas ${i + 1}: ${KASUS[id].tab}</h2>
        <ol>${langkah.map(l => `<li>${l}</li>`).join('')}</ol><p class="cek">Yang dicek: ${cek}</p>
        <p style="margin-top:8px"><button class="tautan" data-mulai="${id}">Mulai tugas ini</button></p>
        <textarea data-catatan="Tugas ${i + 1}: ${KASUS[id].tab}" placeholder="Catatanmu…"></textarea></section>`).join('')}
      <section class="t s12 oranye"><h2>Apakah ini sesuai?</h2>${ASUMSI.map(a => `<div class="asumsi" data-asumsi="${a}"><p>${a}</p>
        <div class="pilDeret" style="margin:6px 0 0">${['Sesuai', 'Tidak sesuai', 'Tidak yakin'].map(p => `<button class="pk" aria-checked="false">${p}</button>`).join('')}</div></div>`).join('')}
        <p style="margin-top:14px"><button class="btn" id="salin-catatan">${ik('salin', 'margin-right:6px')}Salin catatan</button></p></section>
    </div></div>`;
  $$('[data-mulai]').forEach(b => b.onclick = () => { tugasAktif = b.dataset.mulai; buka(b.dataset.mulai); });
  $$('.asumsi .pk').forEach(p => p.onclick = () => $$('.pk', p.parentElement).forEach(x => x.setAttribute('aria-checked', x === p)));
  $('#salin-catatan').onclick = () => {
    const catatan = $$('[data-catatan]').filter(t => t.value.trim()).map(t => `${t.dataset.catatan}\n${t.value.trim()}`);
    const asumsi = $$('.asumsi').map(a => `${a.dataset.asumsi}: ${$('.pk[aria-checked=true]', a)?.textContent ?? '-'}`);
    navigator.clipboard?.writeText([...catatan, 'Apakah sesuai:', ...asumsi].join('\n\n')).catch(() => {});
    toast('catatan disalin');
  };
}

const TAB = [...Object.keys(KASUS), 'coba'];
$('#tab').innerHTML = TAB.map(id => `<button role="tab" data-ke="${id}">${id === 'coba' ? 'Cara mencoba' : KASUS[id].tab}</button>`).join('');
function buka(id) {
  $$('#tab button').forEach(b => b.setAttribute('aria-selected', b.dataset.ke === id));
  id === 'coba' ? renderCoba() : renderKasus(id);
  scrollTo(0, 0);
}
$$('#tab button').forEach(b => b.onclick = () => buka(b.dataset.ke));

let jeda;
function toast(teks) { $('#toast-teks').textContent = 'Mockup: ' + teks; $('#toast').classList.add('on'); clearTimeout(jeda); jeda = setTimeout(() => $('#toast').classList.remove('on'), 3200); }
$('#toast-urung').onclick = () => $('#toast').classList.remove('on');
document.addEventListener('click', e => { const el = e.target.closest('[data-toast]'); if (el) { e.preventDefault(); e.stopPropagation(); toast(el.dataset.toast); } }, true);
$('#batal-lembar').onclick = () => $('#lembar').classList.remove('on');
$('#salin-lembar').onclick = () => { navigator.clipboard?.writeText($('#teks-lembar').textContent).catch(() => {}); $('#lembar').classList.remove('on'); toast('teks disalin, WhatsApp dibuka'); };

buka('biasa');
</script>
